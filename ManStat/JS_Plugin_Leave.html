    let foundSvg = '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>';
    LEAVE_TYPE_SVG_OPTIONS.forEach(g => {
      g.items.forEach(it => {
        if (it.value === val) foundSvg = it.svg;
      });
    });
    return foundSvg;
  }

      const st = document.createElement('style');
      st.id = 'customSvgDropdownStyles';
      st.innerHTML = `
        .c-svg-dd-wrap { position: relative; width: 100%; margin-bottom: 12px; user-select: none; }
        .c-svg-dd-btn { width: 100%; background: #101822; border: 1px solid #2a475e; color: #fff; padding: 9px 12px; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-family: 'Sarabun', sans-serif; font-size: 13.5px; box-sizing: border-box; transition: 0.2s; }
        .c-svg-dd-btn:hover, .c-svg-dd-btn.open { border-color: var(--steam-cyan); box-shadow: 0 0 10px rgba(102,192,244,0.28); }
        .c-svg-dd-menu { display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #171a21; border: 1px solid var(--steam-cyan); border-radius: 6px; max-height: 320px; overflow-y: auto; z-index: 2200; box-shadow: 0 12px 30px rgba(0,0,0,0.92); padding: 6px 0; }
        .c-svg-dd-menu.show { display: block; }
        .c-svg-dd-group { padding: 6px 12px 4px 12px; font-size: 11px; font-weight: bold; color: var(--steam-cyan); text-transform: uppercase; letter-spacing: 0.3px; background: rgba(102,192,244,0.06); }
        .c-svg-dd-divider { height: 1px; background: #2a475e; margin: 6px 10px; border: none; }
        .c-svg-dd-item { padding: 8px 14px; display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: #e6edf3; cursor: pointer; transition: 0.15s; }
        .c-svg-dd-item:hover { background: rgba(102,192,244,0.16); color: #fff; }
        .c-svg-dd-item.active { background: rgba(102,192,244,0.22); color: var(--steam-cyan); font-weight: bold; border-left: 3px solid var(--steam-cyan); }
        .c-svg-dd-item.locked-opt { color: var(--orange); opacity: 0.85; }
        .c-svg-dd-item.locked-opt:hover { background: rgba(210,153,34,0.15); }
      `;
      document.head.appendChild(st);
    }

    const nativeSel = document.getElementById('leaveType');
    if (nativeSel && !document.getElementById('customLeaveTypeDropdownWrap')) {
      nativeSel.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.id = 'customLeaveTypeDropdownWrap';
      wrap.className = 'c-svg-dd-wrap';

      let menuHtml = '';
      LEAVE_TYPE_SVG_OPTIONS.forEach(grp => {
        if (grp.divider) menuHtml += `<hr class="c-svg-dd-divider">`;
        menuHtml += `<div class="c-svg-dd-group">${escapeHtml(grp.group)}</div>`;

      nativeSel.parentNode.insertBefore(wrap, nativeSel.nextSibling);

  function getActualLatestLeaveForUser(empId) {
    const userLogs = g_LeaveLogs.filter(l => l.EmpID === empId);
    if (userLogs.length === 0) return null;

    const sorted = userLogs.slice().sort((a, b) => {
      const dA = _dateStrToComparableNum(a.StartDate);
      const dB = _dateStrToComparableNum(b.StartDate);
      if (dB !== dA) return dB - dA;
      return String(b.LeaveID || '').localeCompare(String(a.LeaveID || ''));
    });
    return sorted[0];
  }

  function evaluateLeavePolicyNotice() {
    const banner = document.getElementById('leavePolicyAlertBanner');
    if (!banner) return;

    const selEl = document.getElementById('leaveType');
    const type = selEl ? selEl.value : 'ลาป่วย';
    const startEl = document.getElementById('leaveStartDate');
    const endEl = document.getElementById('leaveEndDate');
    const startStr = startEl ? startEl.value : '';
    const endStr = (endEl && endEl.value) ? endEl.value : startStr;

    const regInfo = LEAVE_REGULATIONS_DETAIL[type] || {
      title: `ระเบียบการลา (${type})`,
      quota: 'ตามหลักเกณฑ์ที่ทางราชการกำหนด',
      rule: 'กรุณาระบุช่วงวันที่ลา สาเหตุ และสถานที่ติดต่อระหว่างลาให้ครบถ้วน',
      color: 'var(--steam-cyan)'
    };

    const typeIconSvg = _getLeaveTypeSvgByVal(type);
    const icoWarn = `<svg class="ui-ico-sm" style="color:var(--red);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>`;

    let extraWarningHtml = '';
    let borderColor = regInfo.color || 'var(--steam-cyan)';
    let bgColor = 'rgba(102, 192, 244, 0.1)';
    if (type === 'ขออนุญาต (ไม่เกิน 3 ชม.)') {
      bgColor = 'rgba(164, 208, 7, 0.1)';
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (type === 'ลากิจ' && startStr) {
      const p = startStr.split('-');
      if (p.length === 3) {
        const startDate = new Date(normalizeYearToCEClient(p[0]), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        const diffDays = Math.ceil((startDate - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 3) {
          borderColor = 'var(--red)';
          bgColor = 'rgba(248, 81, 73, 0.14)';
          extraWarningHtml = `
            <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(248,81,73,0.45); color:#ff7b72; font-size:12px; display:flex; align-items:center; gap:6px;">
              ${icoWarn}&nbsp;<span><b>แจ้งเตือนการลากิจกะทันหัน:</b> ท่านยื่นลากิจล่วงหน้าเพียง <b>${Math.max(0, diffDays)} วัน</b> (น้อยกว่าเกณฑ์ 3 วันทำการ) กรุณาระบุเหตุผลความจำเป็นเร่งด่วน</span>
            </div>
          `;
        }
      }
    } else if (type === 'ลาป่วย' && endStr) {
      const p = endStr.split('-');
      if (p.length === 3) {
        const endDate = new Date(normalizeYearToCEClient(p[0]), parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        const daysAfterReturn = Math.floor((today - endDate) / (1000 * 60 * 60 * 24));
        if (daysAfterReturn > 3) {
          borderColor = 'var(--orange)';
          bgColor = 'rgba(210, 153, 34, 0.14)';
          extraWarningHtml = `
            <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(210,153,34,0.45); color:var(--orange); font-size:12px; display:flex; align-items:center; gap:6px;">
              ${icoWarn}&nbsp;<span><b>แจ้งเตือนการส่งใบลาป่วยย้อนหลัง:</b> วันสิ้นสุดการลาผ่านมาแล้ว <b>${daysAfterReturn} วัน</b> (ควรส่งภายใน 3 วันทำการหลังกลับมาทำงาน)</span>
            </div>
          `;
        }
      }
    }

    banner.style.display = 'block';
    banner.style.background = bgColor;
    banner.style.borderColor = borderColor;
    banner.style.borderLeft = `4px solid ${borderColor}`;
    banner.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; border-bottom:1px dashed rgba(255,255,255,0.14); padding-bottom:6px; margin-bottom:6px;">
        <div style="display:flex; align-items:center; gap:6px; font-weight:bold; font-size:13.5px; color:#fff;">
          ${typeIconSvg}&nbsp;<span>${escapeHtml(regInfo.title)}</span>
        </div>
        <span style="background:rgba(0,0,0,0.35); border:1px solid #2a475e; padding:2px 10px; border-radius:12px; font-size:11.5px; color:var(--steam-green); font-weight:bold; display:inline-flex; align-items:center; gap:5px;">
          ${UI_SVG.check}&nbsp;<span>สิทธิ์การลา: ${escapeHtml(regInfo.quota)}</span>
        </span>
      </div>
      <div style="font-size:12.5px; color:#d0d7de; line-height:1.6;">
        • <b>หลักเกณฑ์การปฏิบัติ:</b> ${regInfo.rule}
      </div>
      ${extraWarningHtml}
    `;
  }

  function calcPermitHoursPreview() {
    const st = document.getElementById('leaveStartTime').value;
    const et = document.getElementById('leaveEndTime').value;
    const box = document.getElementById('permitHoursPreviewText');
    if (!st || !et || !box) return;
    const sParts = st.split(':');
    const eParts = et.split(':');
    const mins = (parseInt(eParts[0], 10) * 60 + parseInt(eParts[1], 10)) - (parseInt(sParts[0], 10) * 60 + parseInt(sParts[1], 10));
    const hrs = Number((mins / 60).toFixed(2));
    if (hrs <= 0) {
      box.style.color = 'var(--red)';
      box.innerText = 'เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น';
    } else if (hrs > 3) {
      box.style.color = 'var(--red)';
      box.innerText = `รวมเวลา ${hrs} ชั่วโมง (เกินเกณฑ์ 3 ชั่วโมง)`;
    } else {
      box.style.color = 'var(--steam-green)';
      box.innerHTML = `${UI_SVG.check}&nbsp;<span>รวมเวลาขออนุญาต: ${hrs} ชั่วโมง</span>`;
    }
  }

      <optgroup label="รายชื่อบุคลากรในโรงเรียน">

    g_UsersSummary.forEach(u => {
      if (u.EmpID === myId || u.status === 'ย้าย/เกษียณ' || String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') !== -1) return;
      const isBusy = onLeaveIds.has(u.EmpID);
      const busyTag = isBusy ? ' (ติดลาวันนี้)' : '';
      fullSubOpts += `<option value="มอบหมายให้ ${escapeHtml(u.FullName)} สอนแทน">${escapeHtml(u.FullName)}${busyTag}</option>`;
      teacherOptsOnly += `<option value="${escapeHtml(u.FullName)}">${escapeHtml(u.FullName)}${busyTag}</option>`;
    });
    fullSubOpts += `</optgroup>`;

    const sel11 = document.getElementById('leaveSubTeacherSelect');

      const cur = sel11.value;
      sel11.innerHTML = fullSubOpts;
      if (cur) sel11.value = cur;
    }

    renderCustomSubTeacherSvgDropdown(onLeaveIds);

    let clsOpts = `<option value="">-- เลือกชั้น --</option>` + g_ActiveClasses.map(c => `<option value="${escapeHtml(shortClass(c))}">${escapeHtml(shortClass(c))}</option>`).join('');
    [1, 2, 3].forEach(i => {
      let cEl = document.getElementById('pw_cls_' + i);
      if (cEl && !cEl.innerHTML) cEl.innerHTML = clsOpts;
      let sEl = document.getElementById('pw_sub_' + i);

        let curS = sEl.value;
        sEl.innerHTML = teacherOptsOnly;
        if (curS) sEl.value = curS;
      }

  function populateDashboardDeptFilterOptions() {
    const deptSel = document.getElementById('filterStaffDept');
    if (!deptSel) return;
    const prevVal = deptSel.value || 'ALL';

    const deptSet = new Set();
    const divSet = new Set();

    g_UsersSummary.forEach(u => {
      const d = String(u.Department || '').trim();
      if (d && d !== '-') deptSet.add(d);
      const dv = String(u.Division || '').trim();
      if (dv && dv !== '-') {
        dv.split(',').forEach(part => {
          let cl = part.trim();
          if (cl) divSet.add(cl);
        });
      }
    });

    let html = `<option value="ALL">กลุ่มสาระ / งาน: ทั้งหมด</option>`;
    if (deptSet.size > 0) {
      html += `<optgroup label="กลุ่มสาระการเรียนรู้">`;
      Array.from(deptSet).forEach(d => {
        html += `<option value="DEPT:${escapeHtml(d)}">${escapeHtml(d)}</option>`;
      });
      html += `</optgroup>`;
    }
    if (divSet.size > 0) {
      html += `<optgroup label="ฝ่ายงาน / หน้าที่รับผิดชอบ">`;
      Array.from(divSet).forEach(dv => {
        html += `<option value="DIV:${escapeHtml(dv)}">${escapeHtml(dv)}</option>`;
      });
      html += `</optgroup>`;
    }

    deptSel.innerHTML = html;
    if (Array.from(deptSel.options).some(o => o.value === prevVal)) {
      deptSel.value = prevVal;
    }
  }

  function renderMainDashboard() {
    // Auto-Recovery: หากพบว่า g_UsersSummary ว่าง (0 คน) ให้สั่งดึงข้อมูลและซ่อมแซมฐานข้อมูลอัตโนมัติทันที
    if ((!g_UsersSummary || g_UsersSummary.length === 0) && !_autoRecoveryAttempted) {
      _autoRecoveryAttempted = true;
      google.script.run
        .withSuccessHandler(resBundle => {
          _autoRecoveryAttempted = false;
          if (resBundle && resBundle.status === 'success' && Array.isArray(resBundle.usersSummary) && resBundle.usersSummary.length > 0) {
            _applyBundleToStateAndRender(resBundle);
          }
        })
        .withFailureHandler(err => {
          console.error('Auto recovery failed:', err);
          _autoRecoveryAttempted = false;
        })
        .forceRepairAndLoadStaff();
    } else if (g_UsersSummary && g_UsersSummary.length > 0) {
      _autoRecoveryAttempted = false;
    }

    let elSch = document.getElementById('lblHeaderSchoolName');
    if (elSch) elSch.innerText = g_SchoolInfo.schoolName || 'โรงเรียนชุมชนบ้านตะขบ';
    let elAff = document.getElementById('lblHeaderSchoolAff');
    if (elAff) elAff.innerText = g_SchoolInfo.affiliation || 'สำนักงานเขตพื้นที่การศึกษาประถมศึกษานครราชสีมา เขต 3';
    let elAcad = document.getElementById('lblAcadYear');
    if (elAcad) elAcad.innerText = g_SchoolInfo.academicYear || '2569';

    let dirName = g_SchoolInfo.directorName || '-';
    if (dirName === '-' && g_UsersSummary.length > 0) {
      const foundDir = g_UsersSummary.find(u => String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') !== -1);
      if (foundDir) dirName = foundDir.FullName;
    }
    let elDir = document.getElementById('lblDirectorHeader');
    if (elDir) elDir.innerText = dirName;

    applyDelegationBanner();

    const pendingCount = g_LeaveLogs.filter(l => l.Status !== 'อนุมัติ' && l.Status !== 'อนุมัติเรียบร้อย' && l.Status !== 'ไม่อนุมัติ').length;
    const approvedCount = g_LeaveLogs.filter(l => l.Status === 'อนุมัติ' || l.Status === 'อนุมัติเรียบร้อย').length;

    let elTot = document.getElementById('cardTotalUsers'); if (elTot) elTot.innerText = g_UsersSummary.length;
    let elPend = document.getElementById('cardPendingLeaves'); if (elPend) elPend.innerText = pendingCount;
    let elApp = document.getElementById('cardApprovedLeaves'); if (elApp) elApp.innerText = approvedCount;

    ['badgePendingCount', 'badgeTrackingCount'].forEach(id => {
      const b = document.getElementById(id);
      if (b) {
        b.style.display = pendingCount > 0 ? 'inline-block' : 'none';
        b.innerText = pendingCount;
      }
    });

    _ensureDashboardRibbonContainerExists();
    populateDashboardDeptFilterOptions();
    renderEmployeeRibbonList();
    renderRequestsListOnlyTable();
    renderTrackingStepByStepTable();
  }

  function buildEmployeeExpandedDetailHtml(u) {
    const empId = u.EmpID || u.id;
    const isSchoolDirector = (String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') !== -1);
    const userLogsAll = g_LeaveLogs.filter(l => l.EmpID === empId);

    const sortedLogs = userLogsAll.slice().sort((a, b) => {
      const dA = _dateStrToComparableNum(a.StartDate);
      const dB = _dateStrToComparableNum(b.StartDate);
      if (dB !== dA) return dB - dA;
      return String(b.LeaveID || '').localeCompare(String(a.LeaveID || ''));
    });

    const approvedByType = {};
    let pendingItemsCount = 0;
    let rejectedItemsCount = 0;

    sortedLogs.forEach(l => {
      const isApp = (l.Status === 'อนุมัติ' || l.Status === 'อนุมัติเรียบร้อย');
      const isRej = (l.Status === 'ไม่อนุมัติ');
      if (isApp) {
        const tName = l.LeaveType || 'ไม่ระบุประเภท';
        if (!approvedByType[tName]) {
          approvedByType[tName] = { count: 0, days: 0, hours: 0, isPermit: tName.includes('3 ชม.') };
        }
        approvedByType[tName].count++;
        approvedByType[tName].days += (parseFloat(l.TotalDays) || 0);
        approvedByType[tName].hours = Number((approvedByType[tName].hours + (parseFloat(l.TotalHours) || 0)).toFixed(2));
      } else if (isRej) {
        rejectedItemsCount++;
      } else {
        pendingItemsCount++;
      }
    });

    const typeKeys = Object.keys(approvedByType);
    let breakdownHtml = '';
    if (typeKeys.length === 0) {
      breakdownHtml = `<span style="color:var(--text-muted); font-size:12px;">ยังไม่มีรายการลาที่ได้รับอนุมัติในปีงบประมาณนี้</span>`;
    } else {
      breakdownHtml = typeKeys.map(k => {
        const obj = approvedByType[k];
        const unitTxt = obj.isPermit ? `${obj.hours} ชั่วโมง` : `${obj.days} วัน`;
        return `<span class="emp-type-chip"><b style="color:var(--steam-cyan);">${escapeHtml(k)}:</b> ${obj.count} ครั้ง (${unitTxt})</span>`;
      }).join('');
    }

    const posNoTxt = u.PositionNo || (u.IsPositionUnverified ? `รอตรวจสอบ (${u.RawPositionNo})` : '—');
    const memberIdTxt = u.MemberID || '—';
    const divFullTxt = u.Division || u.division || '—';
    const deptFullTxt = u.Department || u.department || '—';
    const clsFullTxt = u.classLevel || '—';

    let quotaOrPolicyHtml = '';
    if (isSchoolDirector) {
      quotaOrPolicyHtml = `<div style="margin-top:6px; color:var(--steam-cyan); font-size:12px;">
        <b>แนวทางการยื่นลา:</b> ผู้อำนวยการสถานศึกษายื่นใบลาต่อผู้อำนวยการสำนักงานเขตพื้นที่การศึกษา (สพป.) ตามระเบียบ
      </div>`;
    } else {
      const sickQuotaTxt = (u.SickMax !== undefined && u.SickMax !== null) ? `${u.SickDays || 0} / ${u.SickMax} วัน` : `${u.SickDays || 0} วัน`;
      const persQuotaTxt = (u.PersonalMax !== undefined && u.PersonalMax !== null) ? `${u.PersonalDays || 0} / ${u.PersonalMax} วัน` : `${u.PersonalDays || 0} วัน`;
      quotaOrPolicyHtml = `
        <div style="margin-top:6px; font-size:12px; color:var(--text-muted);">
          ยอดใช้สิทธิ์สะสม (อนุมัติแล้ว): 
          <span style="color:#e6edf3;">ลาป่วย <b>${escapeHtml(sickQuotaTxt)}</b></span> · 
          <span style="color:#e6edf3;">ลากิจส่วนตัว <b>${escapeHtml(persQuotaTxt)}</b></span>
        </div>
      `;
    }

    const showAll = !!g_ShowAllLogsEmpIds[empId];
    const logsToRender = showAll ? sortedLogs : sortedLogs.slice(0, 5);

    let historyListHtml = '';
    if (sortedLogs.length === 0) {
      historyListHtml = `<div style="color:var(--text-muted); font-size:12.5px; padding:6px 0;">ยังไม่มีประวัติการยื่นคำร้องในระบบ</div>`;
    } else {
      historyListHtml = logsToRender.map(l => {
        const isPermit = (l.LeaveType && l.LeaveType.includes('3 ชม.'));
        const periodTxt = formatThaiRangeDisplay(l.StartDate, l.EndDate, isPermit, l.StartTime, l.EndTime);
        const amountTxt = isPermit ? `${escapeHtml(l.TotalHours)} ชั่วโมง` : `${escapeHtml(l.TotalDays)} วัน`;
        const submitDateTxt = l.Timestamp ? formatSlashDateBE(l.Timestamp) : '—';

        const isApp = (l.Status === 'อนุมัติ' || l.Status === 'อนุมัติเรียบร้อย');
        const isRej = (l.Status === 'ไม่อนุมัติ');
        let stClass = 'emp-status-pending';
        let stLabel = l.Status || 'รออนุมัติ';
        if (isApp) { stClass = 'emp-status-approved'; stLabel = 'อนุมัติแล้ว'; }
        else if (isRej) { stClass = 'emp-status-rejected'; stLabel = 'ไม่อนุมัติ'; }

        return `
          <div class="emp-hist-row">
            <div style="font-weight:700; color:#fff;">${escapeHtml(l.LeaveType)}</div>
            <div style="color:var(--steam-cyan); font-weight:600;">${periodTxt}</div>
            <div style="color:var(--orange); font-weight:700;">${amountTxt}</div>
            <div style="font-size:11.5px; color:var(--text-muted);">
              ยื่น: ${escapeHtml(submitDateTxt)} · แทน: ${escapeHtml(shortSubInfo(l.SubstituteInfo))}
            </div>
            <div style="display:flex; align-items:center; justify-content:flex-end; gap:8px;">
              <span class="emp-status-pill ${stClass}" style="margin:0;">${escapeHtml(stLabel)}</span>
              <button type="button" class="btn-save-sm" style="font-size:11px; padding:2px 8px;" onclick="event.stopPropagation(); switchView('tracking');">ติดตามคำร้อง</button>
            </div>
          </div>
        `;
      }).join('');

      if (sortedLogs.length > 5 && !showAll) {
        historyListHtml += `
          <div style="text-align:center; margin-top:8px;">
            <button type="button" class="btn-save-sm" style="display:inline-flex; align-items:center; gap:5px;" onclick="showAllRibbonLogs('${escapeHtml(empId)}', event)">
              ${UI_SVG.chevDown}&nbsp;<span>แสดงประวัติการลาทั้งหมด (${sortedLogs.length} รายการ)</span>
            </button>
          </div>
        `;
      }
    }

    return `
      <div class="emp-detail-summary-bar">
        <div>
          <div class="emp-detail-sec-head">
            <span>ข้อมูลทะเบียนและงานที่รับผิดชอบ</span>
            <span style="color:var(--text-muted); font-weight:normal;">เลขที่ตำแหน่ง: <b style="color:#fff;">${escapeHtml(posNoTxt)}</b></span>
          </div>
          <div><span style="color:var(--text-muted);">สมาชิกประเภทสามัญ เลขที่:</span> <b style="color:var(--steam-cyan); font-family:monospace;">${escapeHtml(memberIdTxt)}</b></div>
          <div><span style="color:var(--text-muted);">ตำแหน่ง:</span> <b style="color:#fff;">${escapeHtml(u.Position || '—')}</b> ${u.HighestStanding && u.HighestStanding !== u.Position ? `(${escapeHtml(u.HighestStanding)})` : ''}</div>
          <div><span style="color:var(--text-muted);">กลุ่มสาระ:</span> ${escapeHtml(deptFullTxt)} · <span style="color:var(--text-muted);">ชั้นที่ปรึกษา:</span> ${escapeHtml(clsFullTxt)}</div>
          <div><span style="color:var(--text-muted);">ฝ่ายงาน/หน้าที่พิเศษ:</span> ${escapeHtml(divFullTxt)}</div>
        </div>

        <div>
          <div class="emp-detail-sec-head">
            <span>สรุปสถิติแยกตามประเภทการลา (ปีงบประมาณ ${escapeHtml(g_SchoolInfo.fiscalYear || '2570')})</span>
            <span style="color:var(--text-muted); font-weight:normal;">รออนุมัติ ${pendingItemsCount} · ไม่อนุมัติ ${rejectedItemsCount}</span>
          </div>
          <div>${breakdownHtml}</div>
          ${quotaOrPolicyHtml}
        </div>
      </div>

      <div>
        <div class="emp-detail-sec-head">
          <span>ประวัติการลาของ ${escapeHtml(u.FullName)} (${sortedLogs.length} รายการ)</span>
        </div>
        ${historyListHtml}
      </div>
    `;
  }

  function renderEmployeeRibbonList() {
    const container = _ensureDashboardRibbonContainerExists();
    if (!container) return;

    const q = (document.getElementById('searchStaffInput') ? document.getElementById('searchStaffInput').value : '').trim().toLowerCase();
    const catFilter = document.getElementById('filterStaffCategory') ? document.getElementById('filterStaffCategory').value : 'ALL';
    const deptFilter = document.getElementById('filterStaffDept') ? document.getElementById('filterStaffDept').value : 'ALL';
    const statusFilter = document.getElementById('filterLeaveStatus') ? document.getElementById('filterLeaveStatus').value : 'ALL';

    const filteredUsers = g_UsersSummary.filter(u => {
      const empId = String(u.EmpID || u.id || '');
      const userLogs = g_LeaveLogs.filter(l => l.EmpID === empId);
      const hasPending = userLogs.some(l => l.Status && l.Status !== 'อนุมัติ' && l.Status !== 'อนุมัติเรียบร้อย' && l.Status !== 'ไม่อนุมัติ');
      const hasAnyLeave = userLogs.length > 0 || (u.SickCount || 0) > 0 || (u.PersonalCount || 0) > 0 || (u.PermitCount || 0) > 0;

      if (q) {
        const hay = `${u.FullName || ''} ${empId} ${u.PositionNo || ''} ${u.MemberID || ''} ${u.Position || ''} ${u.HighestStanding || ''} ${u.Department || ''} ${u.Division || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (catFilter !== 'ALL' && getStaffCategoryCode(u) !== catFilter) return false;
      if (deptFilter !== 'ALL') {
        if (deptFilter.indexOf('DEPT:') === 0 && String(u.Department || '').trim() !== deptFilter.substring(5)) return false;
        if (deptFilter.indexOf('DIV:') === 0) {
          const userDivs = String(u.Division || '').split(',').map(s => s.trim());
          if (!userDivs.includes(deptFilter.substring(4))) return false;
        }
      }
      if (statusFilter === 'HAS_LEAVE' && !hasAnyLeave) return false;
      if (statusFilter === 'PENDING' && !hasPending) return false;
      if (statusFilter === 'NEVER' && hasAnyLeave) return false;

      return true;
    });

    if (!g_UsersSummary || g_UsersSummary.length === 0) {
      container.innerHTML = `
        <div class="emp-empty-state" style="background:rgba(0,0,0,0.25); border:1px dashed #66c0f4; border-radius:6px; padding:32px 20px; text-align:center;">

              <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>&nbsp;<span>เชื่อมโยงชีตฐานข้อมูล</span>

  async function handleLeaveSubmit(e) {
    e.preventDefault();
    try {
      const fileInput = document.getElementById('leaveAttachFile');
      let fileData = null, fileName = null;
      if (fileInput.files.length > 0) {
        fileName = fileInput.files[0].name;
        fileData = await fileToBase64(fileInput.files[0]);
      }

      const leaveType = document.getElementById('leaveType').value;
      const isPermit = (leaveType === 'ขออนุญาต (ไม่เกิน 3 ชม.)');

      let combinedSubInfo = '';
      let formMetaObj = {};

      if (isPermit) {
        const place = document.getElementById('permitPlace').value.trim();
        const wlRadio = document.querySelector('input[name="permitWorkloadRadio"]:checked');
        const hasWorkload = wlRadio ? wlRadio.value : 'ไม่มี';
        const workloads = [];
        let subNamesSummary = [];

        if (hasWorkload === 'มี') {
          [1, 2, 3].forEach(i => {
            const cls = document.getElementById('pw_cls_' + i).value;
            const period = document.getElementById('pw_per_' + i).value.trim();
            const task = document.getElementById('pw_task_' + i).value.trim();
            const sub = document.getElementById('pw_sub_' + i).value;
            workloads.push({ cls, period, task, sub });
            if (sub) subNamesSummary.push(`${sub} (${cls || '-'})`);
          });
        }
        combinedSubInfo = hasWorkload === 'มี' && subNamesSummary.length > 0 ? `${subNamesSummary.join(', ')}` : `ไม่มีภาระงาน (ไป: ${place || '-'})`;
        formMetaObj = { place, hasWorkload, workloads };
      } else {
        const subTeacher = document.getElementById('leaveSubTeacherSelect').value || 'ไม่มีคาบสอนในวันที่ลา';
        const subNote = document.getElementById('leaveSubNote').value.trim();
        const contactAddress = document.getElementById('leaveContactAddr').value.trim();
        combinedSubInfo = subNote ? `${subTeacher} (${subNote})` : subTeacher;
        formMetaObj = { contactAddress };
      }

      const form = {
        empId: g_CurrentUser.EmpID || g_CurrentUser.id,
        fullName: g_CurrentUser.name,
        leaveType: leaveType,
        startDate: document.getElementById('leaveStartDate').value,
        endDate: document.getElementById('leaveEndDate').value || document.getElementById('leaveStartDate').value,
        startTime: document.getElementById('leaveStartTime').value,
        endTime: document.getElementById('leaveEndTime').value,
        reason: document.getElementById('leaveReason').value.trim(),
        substituteInfo: combinedSubInfo,
        signerName: getActiveSignerName(),
        formMetaJson: JSON.stringify(formMetaObj),
        fileData: fileData,
        fileName: fileName
      };

      startLoadingBar('กำลังบันทึกคำร้อง...');
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert(res.message);
            if (res.status === 'success') {
              document.getElementById('leaveForm').reset();
              setCustomLeaveTypeValue('ลาป่วย');
              toggleLeaveTimeFields();
              refreshAllData();
              switchView('tracking');
            }
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('ยื่นคำร้องไม่สำเร็จ: ' + (err.message || err))))
        .submitLeaveRequest(form);
    } catch (err) {
      steamAlert(err.message);
    }
  }

  function renderRetirementForecastTable() {
    const tbody = document.getElementById('retirementForecastBody');
    if (!tbody) return;

    const activeUsers = g_UsersSummary.filter(u => u.status !== 'ย้าย/เกษียณ');
    if (activeUsers.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="padding:18px; color:var(--text-muted);">ยังไม่มีข้อมูลบุคลากร</td></tr>`;
      return;
    }

    const sorted = activeUsers.slice().sort((a, b) => {
      const rA = (a.RetirementInfo && a.RetirementInfo.hasBirthDate) ? parseInt(a.RetirementInfo.retireYearBE, 10) : 9999;
      const rB = (b.RetirementInfo && b.RetirementInfo.hasBirthDate) ? parseInt(b.RetirementInfo.retireYearBE, 10) : 9999;
      return rA - rB;
    });

    tbody.innerHTML = sorted.map(u => {
      const ret = u.RetirementInfo || {};
      const birthTxt = ret.hasBirthDate ? escapeHtml(ret.birthDateFormatted) : `<span style="color:var(--text-muted);">ยังไม่ระบุ</span>`;
      const ageTxt = ret.hasBirthDate ? escapeHtml(ret.ageText) : '-';
      const retDateTxt = ret.hasBirthDate ? `<b style="color:var(--orange);">${escapeHtml(ret.retireDateFormatted)}</b>` : '-';
      const remainTxt = ret.hasBirthDate ? `<b style="color:var(--steam-green);">${escapeHtml(ret.remainingToRetireText)}</b>` : '-';

      return `
        <tr>
          <td style="font-family:monospace; color:var(--steam-cyan); font-weight:bold;">${escapeHtml(u.EmpID)}</td>
          <td style="text-align:left; padding-left:10px; font-weight:bold;">${escapeHtml(u.FullName)}</td>
          <td>${escapeHtml(shortRole(u.Position))}</td>
          <td>${birthTxt}</td>
          <td>${ageTxt}</td>
          <td>${retDateTxt}</td>
          <td>${remainTxt}</td>
        </tr>
      `;
    }).join('');
  }

  function exportFullSystemToExcel5Sheets() {
    if (typeof XLSX === 'undefined') {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
      s.onload = () => exportFullSystemToExcel5Sheets();
      document.head.appendChild(s);
      return;
    }

    const personnelRows = [];
    const eduRows = [];
    const standingRows = [];
    const scoutRows = [];
    const licenseRows = [];

    g_UsersSummary.forEach(u => {
      personnelRows.push({
        "EmpID": u.EmpID || u.id,
        "PositionNo": u.PositionNo || '',
        "สมาชิกประเภทสามัญ เลขที่": u.MemberID || '',
        "Name": u.FullName,
        "BirthDate": u.RawBirthDate || '',
        "Role": u.Position || '',
        "Division": u.Division || '',
        "Department": u.Department || '',
        "Class_Level": u.classLevel || '',
        "StartDate": u.RawStartDate || '',
        "Email": u.email || '',
        "Phone": u.phone || '',
        "Access_Level": normalizeRolePermission(u.accessLevel),
        "Status": u.status || 'ปกติ'
      });

      (u.EducationsHistory || []).forEach(e => {
        eduRows.push({
          "RecordID": e.RecordID || '',
          "EmpID": u.EmpID,
          "DegreeLevel": e.DegreeLevel || '',
          "DegreeShort": e.DegreeShort || '',
          "Major": e.Major || '',
          "Institute": e.Institute || '',
          "GradYear": e.GradYear || ''
        });
      });

      (u.StandingsHistory || []).forEach(st => {
        standingRows.push({
          "RecordID": st.RecordID || '',
          "EmpID": u.EmpID,
          "StandingLevel": st.StandingLevel || '',
          "EffectiveDate": st.RawEffectiveDate || st.EffectiveDate || '',
          "OrderNumber": st.OrderNumber || ''
        });
      });

      (u.ScoutsHistory || []).forEach(sc => {
        scoutRows.push({
          "RecordID": sc.RecordID || '',
          "EmpID": u.EmpID,
          "ScoutQualification": sc.ScoutQualification || '',
          "ScoutType": sc.ScoutType || '',
          "CertNumber": sc.CertNumber || '',
          "ApprovedDate": sc.RawApprovedDate || sc.ApprovedDate || ''
        });
      });

      (u.ActiveLicenses || []).forEach(lc => {
        licenseRows.push({
          "RecordID": lc.recordId || '',
          "EmpID": u.EmpID,
          "LicenseType": lc.type || '',
          "LicenseNumber": lc.number || '',
          "IssueDate": lc.rawIssueDate || '',
          "ExpiryDate": lc.rawExpiryDate || ''
        });
      });
    });

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(personnelRows), "Personnel");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eduRows), "Education");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(standingRows), "Standing");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(scoutRows), "Scout");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(licenseRows), "License");

    XLSX.writeFile(wb, "ManStat_Database_Export_5Sheets.xlsx");
  }

  function renderAnalyticsCharts() {
    renderRetirementForecastTable();

    if (typeof Chart === 'undefined') {
      if (!document.getElementById('chartJsAutoLoader')) {
        const scriptEl = document.createElement('script');
        scriptEl.id = 'chartJsAutoLoader';
        scriptEl.src = 'https://cdn.jsdelivr.net/npm/chart.js';
        scriptEl.onload = () => renderAnalyticsCharts();
        document.head.appendChild(scriptEl);
      }
      return;
    }

    try {
      Chart.defaults.color = '#8f98a0';
      Chart.defaults.font.family = "'Sarabun', sans-serif";

      const pieCanvas = document.getElementById('leavePieChart');
      const barCanvas = document.getElementById('leaveBarChart');
      if (!pieCanvas || !barCanvas) return;

      const sickCount = g_LeaveLogs.filter(l => l.LeaveType && l.LeaveType.indexOf('ลาป่วย') !== -1).length;
      const personalCount = g_LeaveLogs.filter(l => l.LeaveType && l.LeaveType.indexOf('ลากิจ') !== -1).length;
      const permitCount = g_LeaveLogs.filter(l => l.LeaveType && (l.LeaveType.indexOf('3 ชม.') !== -1 || l.LeaveType.indexOf('ขออนุญาต') !== -1)).length;
      const otherCount = g_LeaveLogs.filter(l => {
        const lt = l.LeaveType || '';
        return lt.indexOf('ลาป่วย') === -1 && lt.indexOf('ลากิจ') === -1 && lt.indexOf('3 ชม.') === -1 && lt.indexOf('ขออนุญาต') === -1;
      }).length;

      const totalPie = sickCount + personalCount + permitCount + otherCount;
      const pieData = totalPie > 0 ? [sickCount, personalCount, permitCount, otherCount] : [1, 0, 0, 0];
      const pieLabels = totalPie > 0 ? ['ลาป่วย', 'ลากิจส่วนตัว', 'ขออนุญาต (3 ชม.)', 'ลาอื่นๆ'] : ['ยังไม่มีรายการลา', 'ลากิจส่วนตัว', 'ขออนุญาต', 'อื่นๆ'];
      const pieColors = totalPie > 0 ? ['#f85149', '#66c0f4', '#a4d007', '#d29922'] : ['#2a475e', '#66c0f4', '#a4d007', '#d29922'];

      if (g_PieChart) g_PieChart.destroy();
      g_PieChart = new Chart(pieCanvas.getContext('2d'), {
        type: 'doughnut',
        data: {
          labels: pieLabels,
          datasets: [{ data: pieData, backgroundColor: pieColors, borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
      });

      const sortedUsers = [...g_UsersSummary]
        .filter(u => String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') === -1)
        .sort((a, b) => ((b.SickDays || 0) + (b.PersonalDays || 0)) - ((a.SickDays || 0) + (a.PersonalDays || 0)))
        .slice(0, 10);

      if (g_BarChart) g_BarChart.destroy();
      g_BarChart = new Chart(barCanvas.getContext('2d'), {
        type: 'bar',
        data: {
          labels: sortedUsers.map(u => u.FullName),
          datasets: [
            { label: 'ลาป่วย (วัน)', data: sortedUsers.map(u => u.SickDays || 0), backgroundColor: '#d29922' },
            { label: 'ลากิจ (วัน)', data: sortedUsers.map(u => u.PersonalDays || 0), backgroundColor: '#66c0f4' }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
      });
    } catch (chartErr) {
      console.error('Chart Render Error:', chartErr);
    }
  }

  function renderFeedbackSection() {
    const pendingFbCount = g_Feedbacks.filter(f => f.Status === 'รอดำเนินการ').length;
    const badgeFb = document.getElementById('badgeFeedbackCount');
    if (badgeFb) {
      badgeFb.style.display = pendingFbCount > 0 ? 'inline-block' : 'none';
      badgeFb.innerText = pendingFbCount;
    }

    const tbody = document.getElementById('feedbackTableBody');
    if (!tbody) return;
    if (g_Feedbacks.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="padding:20px; color:var(--text-muted);">ยังไม่มีรายการคำขอปรับปรุงระบบ</td></tr>`;
      return;
    }

    const isAdmin = isSuperuserOrAdmin(g_CurrentUser);
    tbody.innerHTML = g_Feedbacks.map(f => {
      let stBadge = `<span style="color:var(--orange); font-weight:bold; display:inline-flex; align-items:center; gap:4px;">${UI_SVG.clock}&nbsp;<span>รอดำเนินการ</span></span>`;
      if (f.Status === 'แก้ไขแล้ว') stBadge = `<span class="exp-days-badge exp-days-ok">${UI_SVG.check}&nbsp;<span>แก้ไขแล้ว</span></span>`;
      else if (f.Status === 'เพิ่มฟีเจอร์แล้ว') stBadge = `<span class="exp-days-badge exp-days-ok" style="border-color:var(--steam-cyan); color:var(--steam-cyan);">${UI_SVG.check}&nbsp;<span>เพิ่มฟีเจอร์แล้ว</span></span>`;

      let actionZone = `<div style="font-size:12px; color:var(--steam-green);">${escapeHtml(f.AdminReply || '-')}</div>`;
      if (isAdmin && f.Status === 'รอดำเนินการ') {
        actionZone = `
          <div style="display:flex; gap:5px; justify-content:center; flex-wrap:wrap;">
            <button type="button" class="btn-save-sm" style="background:var(--steam-green); color:#000; border:none;" onclick="markFeedbackResolved('${escapeHtml(f.FeedbackID)}', 'แก้ไขแล้ว')">แก้ไขแล้ว</button>
            <button type="button" class="btn-save-sm" style="background:var(--steam-cyan); color:#000; border:none;" onclick="markFeedbackResolved('${escapeHtml(f.FeedbackID)}', 'เพิ่มฟีเจอร์แล้ว')">เพิ่มฟีเจอร์แล้ว</button>
          </div>
        `;
      } else if (f.UpdatedBy && f.UpdatedBy !== '-') {
        actionZone += `<div style="font-size:11px; color:var(--text-muted);">โดย: ${escapeHtml(f.UpdatedBy)}</div>`;
      }

      return `
        <tr>
          <td style="font-size:11.5px; color:var(--text-muted);">${escapeHtml(f.Timestamp)}</td>
          <td style="text-align:left; padding-left:10px; font-weight:bold;">${escapeHtml(f.FullName)}</td>
          <td><span style="color:var(--steam-cyan); font-size:12.5px;">${escapeHtml(f.Category)}</span></td>
          <td style="text-align:left; padding-left:10px;">
            <div style="font-weight:bold; color:#fff;">${escapeHtml(f.Topic)}</div>
            <div style="font-size:12px; color:var(--text-muted);">${escapeHtml(f.Detail)}</div>
          </td>
          <td>${stBadge}</td>
          <td>${actionZone}</td>
        </tr>
      `;
    }).join('');
  }

  function handleFeedbackSubmit(e) {
    e.preventDefault();
    const payload = {
      empId: g_CurrentUser ? (g_CurrentUser.EmpID || g_CurrentUser.id) : '-',
      fullName: g_CurrentUser ? g_CurrentUser.name : 'ผู้ใช้งานทั่วไป',
      category: document.getElementById('fb_category').value,
      topic: document.getElementById('fb_topic').value.trim(),
      detail: document.getElementById('fb_detail').value.trim()
    };

    startLoadingBar('กำลังบันทึกคำขอปรับปรุงระบบ...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          steamAlert(res.message);
          document.getElementById('feedbackForm').reset();
          refreshAllData();
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('ส่งข้อมูลไม่สำเร็จ: ' + (err.message || err))))
      .submitSystemFeedback(payload);
  }

  function markFeedbackResolved(fbId, statusLabel) {
    steamPrompt(`ระบุข้อความแจ้งผลการดำเนินการ (${statusLabel}) ให้ผู้ใช้งานทราบ:`, replyMsg => {
      if (replyMsg === null) return;
      startLoadingBar('กำลังอัปเดตสถานะและแจ้งผู้ใช้งาน...');
      const adminName = g_CurrentUser ? g_CurrentUser.name : 'Superuser';
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert(res.message);
            refreshAllData();
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('อัปเดตไม่สำเร็จ: ' + (err.message || err))))
        .resolveSystemFeedback(fbId, statusLabel, replyMsg, adminName);
    }, `ยืนยันสถานะ: ${statusLabel}`);
  }
</script>
