  function normalizeRolePermission(level) {
    if (!level) return 'User';
    var s = String(level).trim();

    return s;
  }

  function isSuperuserOrAdmin(userObj) {
    if (!userObj) return false;
    var lv = normalizeRolePermission(userObj.accessLevel);
    return (lv === 'Admin' || lv === 'Superuser');
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function startLoadingBar(title = 'กำลังประมวลผลข้อมูล...') {
    const scr = document.getElementById('loadingScreen') || document.getElementById('loadingOverlay');

    const pct = document.getElementById('loadingPercentText') || document.getElementById('loadPercent');
    const ttl = document.getElementById('loadingTitleText') || document.getElementById('loadTitle');
    if (ttl) ttl.innerText = title;
    if (scr) scr.style.display = 'flex';
    let val = 15;
    if (bar) bar.style.width = val + '%';
    if (pct) pct.innerText = `(${val}%)`;
    if (_loadTimer) clearInterval(_loadTimer);
    if (_safetyWatchdog) clearTimeout(_safetyWatchdog);

    _loadTimer = setInterval(() => {
      if (val < 90) {
        val += Math.floor(Math.random() * 12) + 4;
        if (val > 90) val = 90;
        if (bar) bar.style.width = val + '%';
        if (pct) pct.innerText = `(${val}%)`;
      }
    }, 120);

    _safetyWatchdog = setTimeout(() => {
      stopLoadingBar();
    }, 9000);
  }

  function stopLoadingBar(callback) {
    if (_loadTimer) { clearInterval(_loadTimer); _loadTimer = null; }
    if (_safetyWatchdog) { clearTimeout(_safetyWatchdog); _safetyWatchdog = null; }
    const scr = document.getElementById('loadingScreen') || document.getElementById('loadingOverlay');
    const bar = document.getElementById('loadingBatteryBar') || document.getElementById('loadBatteryBar');
    const pct = document.getElementById('loadingPercentText') || document.getElementById('loadPercent');
    if (bar) bar.style.width = '100%';

    setTimeout(() => {
      if (scr) scr.style.display = 'none';
      if (typeof callback === 'function') callback();
    }, 120);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      if (file.size > MAX_FILE_SIZE) {
        reject(new Error('ขนาดไฟล์ต้องไม่เกิน 5 MB'));
        return;
      }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = () => resolve(reader.result);
      reader.onerror = error => reject(error);
    });
  }

  function normalizeYearToBEClient(rawYear) {
    var y = parseInt(rawYear, 10);
    if (isNaN(y)) return rawYear;
    while (y >= 2900) {
      y -= 543;
    }
    if (y > 1800 && y < 2400) {
      y += 543;
    }
    return y;
  }

  function normalizeYearToCEClient(rawYear) {
    var y = parseInt(rawYear, 10);
    if (isNaN(y)) return rawYear;
    while (y >= 2900) {
      y -= 543;
    }
    if (y >= 2400) {
      y -= 543;
    }
    return y;
  }

  function formatSlashDateBE(dateStr) {
    if (!dateStr || dateStr === '-') return '-';
    let str = String(dateStr).trim().split(' ')[0];
    if (str.includes('-')) {
      let p = str.split('-');
      if (p.length === 3) {
        let yBE = normalizeYearToBEClient(p[0]);
        return `${String(p[2]).padStart(2, '0')}/${String(p[1]).padStart(2, '0')}/${yBE}`;
      }
    }
    if (str.includes('/')) {
      let p2 = str.split('/');
      if (p2.length === 3) {
        let yBE2 = normalizeYearToBEClient(p2[2]);
        return `${String(p2[0]).padStart(2, '0')}/${String(p2[1]).padStart(2, '0')}/${yBE2}`;
      }
    }
    return str;
  }

  function formatThaiRangeDisplay(startStr, endStr, isPermit, startTime, endTime) {
    const shortMonths = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
    const parseD = (s) => {
      if (!s) return null;
      let str = String(s).trim().split(' ')[0];
      if (str.includes('/')) {
        let p = str.split('/');
        if (p.length === 3) {
          let y = normalizeYearToBEClient(p[2]);
          return { d: parseInt(p[0], 10), m: parseInt(p[1], 10) - 1, y: y };
        }
      }
      if (str.includes('-')) {
        let p = str.split('-');
        if (p.length === 3) {
          let y = normalizeYearToBEClient(p[0]);
          return { d: parseInt(p[2], 10), m: parseInt(p[1], 10) - 1, y: y };
        }
      }
      return null;
    };

    const sObj = parseD(startStr);
    const eObj = parseD(endStr || startStr);
    if (!sObj || isNaN(sObj.d) || isNaN(sObj.m)) return escapeHtml(startStr || '-');

    const sTxt = `${sObj.d} ${shortMonths[sObj.m] || ''}`;
    if (isPermit) {
      return `${sTxt} ${sObj.y} (${escapeHtml(startTime || '-')}-${escapeHtml(endTime || '-')} น.)`;
    }
    if (!eObj || (sObj.d === eObj.d && sObj.m === eObj.m && sObj.y === eObj.y)) {
      return `${sTxt} ${sObj.y}`;
    }
    const eTxt = `${eObj.d} ${shortMonths[eObj.m] || ''}`;
    if (sObj.y === eObj.y) {
      return `${sTxt}–${eTxt} ${eObj.y}`;
    }
    return `${sTxt} ${sObj.y} – ${eTxt} ${eObj.y}`;
  }

  function _dateStrToComparableNum(dateStr) {
    if (!dateStr || dateStr === '-') return 0;
    const s = String(dateStr).trim().split(' ')[0];
    if (s.includes('-')) {
      const p = s.split('-');
      if (p.length === 3) {
        let y = normalizeYearToCEClient(p[0]);
        return y * 10000 + parseInt(p[1], 10) * 100 + parseInt(p[2], 10);
      }
    }
    if (s.includes('/')) {
      const p2 = s.split('/');
      if (p2.length === 3) {
        let y2 = normalizeYearToCEClient(p2[2]);
        return y2 * 10000 + parseInt(p2[1], 10) * 100 + parseInt(p2[0], 10);
      }
    }
    return 0;
  }

  function syncFlatpickrBuddhistYearHeader(instance) {
    if (!instance || !instance.currentYearElement) return;
    const ceYear = instance.currentYear;
    const beYear = normalizeYearToBEClient(ceYear);
    setTimeout(() => {
      if (instance.currentYearElement) instance.currentYearElement.value = beYear;
    }, 10);
  }

  function initThaiDatePickers() {
    if (typeof flatpickr === 'undefined') return;
    document.querySelectorAll('input[type="date"]').forEach(inp => {
      if (inp._flatpickr) return;
      flatpickr(inp, {
        locale: 'th',
        dateFormat: 'Y-m-d',
        altInput: true,
        altInputClass: 'steam-input',
        allowInput: false,
        disableMobile: true,
        formatDate: (date, format) => {
          if (format !== 'Y-m-d') {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const yBE = normalizeYearToBEClient(date.getFullYear());
            return `${d}/${m}/${yBE}`;
          }
          const yyyy = normalizeYearToCEClient(date.getFullYear());
          const mm = String(date.getMonth() + 1).padStart(2, '0');
          const dd = String(date.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        },
        onReady: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onOpen: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onYearChange: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onMonthChange: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onChange: function(s, dateStr, inst) {
          syncFlatpickrBuddhistYearHeader(inst);
          inp.value = dateStr;
          if (typeof inp.onchange === 'function') inp.onchange();
        }
      });
    });
  }

  function setDatePickerVal(id, val) {
    let el = document.getElementById(id);
    if (!el) return;
    let cleanIso = '';
    if (val && val !== '-') {
      let str = String(val).trim().split(' ')[0];

        let p = str.split('-');

          cleanIso = `${normalizeYearToCEClient(p[0])}-${String(p[1]).padStart(2, '0')}-${String(p[2]).padStart(2, '0')}`;
        }
      } else if (str.includes('/')) {

        if (p2.length === 3) {
          cleanIso = `${normalizeYearToCEClient(p2[2])}-${String(p2[1]).padStart(2, '0')}-${String(p2[0]).padStart(2, '0')}`;
        }
      }
    }
    el.value = cleanIso;

  function extractStandingLabelFromData(rawStandingOrRole) {

    const s = String(rawStandingOrRole).trim();
    if (s.indexOf('เชี่ยวชาญพิเศษ') !== -1 || s.indexOf('คศ. 5') !== -1 || s.indexOf('คศ.5') !== -1) return 'คศ.5';

    if (s.indexOf('ชำนาญการ') !== -1 || s.indexOf('คศ. 2') !== -1 || s.indexOf('คศ.2') !== -1) return 'คศ.2';
    if (s.indexOf('คศ. 1') !== -1 || s.indexOf('คศ.1') !== -1) return 'คศ.1';

  function buildStaffIdentitySubtitle(u) {
    const empId = escapeHtml(u.EmpID || u.id || '-');
    const rawPos = String(u.Position || u.role || '').trim();
    const rawStanding = String(u.HighestStanding || '').trim();
    const rawDept = String(u.Department || u.department || '').trim();
    const rawDiv = String(u.Division || u.division || '').trim();
    const cat = getStaffCategoryCode(u);

    let basePosition = '';
    let standingTag = '';

    if (cat === 'EXE') {
      if (rawPos.indexOf('รองผู้อำนวยการ') !== -1) basePosition = 'รองผู้อำนวยการสถานศึกษา';
      else if (rawPos.indexOf('ผู้อำนวยการ') !== -1) basePosition = 'ผู้อำนวยการสถานศึกษา';
      else basePosition = rawPos || 'ผู้บริหารสถานศึกษา';
      standingTag = extractStandingLabelFromData(rawStanding);
    } else if (cat === 'STF') {
      basePosition = rawPos || 'บุคลากรสายสนับสนุน';
      standingTag = '';
    } else {
      const explicitNonStandingRoles = ['ครูผู้ช่วย', 'พนักงานราชการ', 'ครูอัตราจ้าง', 'ครูพี่เลี้ยงเด็กพิการเรียนร่วม', 'พี่เลี้ยงเด็กอนุบาล', 'ศึกษานิเทศก์'];
      const matchedNonStanding = explicitNonStandingRoles.find(r => rawPos.indexOf(r) !== -1);
      if (matchedNonStanding) {
        basePosition = matchedNonStanding;
        standingTag = '';
      } else {
        basePosition = 'ครู';
        standingTag = extractStandingLabelFromData(rawStanding) || extractStandingLabelFromData(rawPos);
      }
    }

    let workOrDeptLabel = '';
    const isGenericSupportDept = (!rawDept || rawDept === '-' || rawDept.indexOf('สายงานบริหารและสนับสนุน') !== -1 || rawDept.indexOf('บริหารสถานศึกษา') !== -1);

    if (cat === 'STF') {
      if (rawDiv && rawDiv !== '-') workOrDeptLabel = shortDiv(rawDiv);
      else if (!isGenericSupportDept) workOrDeptLabel = rawDept;
    } else if (cat === 'EXE') {
      if (rawDiv && rawDiv !== '-') workOrDeptLabel = rawDiv;
      else if (rawDept && rawDept !== '-') workOrDeptLabel = rawDept;
    } else {
      if (!isGenericSupportDept) {
        const sDept = shortDept(rawDept);
        workOrDeptLabel = (rawDept.indexOf('กิจกรรม') === 0 || rawDept.indexOf('การศึกษาปฐมวัย') === 0) ? sDept : `กลุ่มสาระ${sDept}`;
      } else if (rawDiv && rawDiv !== '-') {
        workOrDeptLabel = shortDiv(rawDiv);
      }
    }

    const segments = [`<span class="emp-meta-code">${empId}</span>`];
    if (basePosition) segments.push(`<span style="color:#d0d7de;">${escapeHtml(basePosition)}</span>`);
    if (standingTag) segments.push(`<span style="color:var(--steam-cyan); font-weight:600;">${escapeHtml(standingTag)}</span>`);
    if (workOrDeptLabel) segments.push(`<span>${escapeHtml(workOrDeptLabel)}</span>`);

    return segments.join(`<span class="emp-meta-sep">·</span>`);
  }

  function applyTopBarUserAndLoginTime(userObj) {
    if (!userObj) return;
    userObj.accessLevel = normalizeRolePermission(userObj.accessLevel);
    let shortLabel = userObj.name || 'User';
    if (userObj.email === 'superuser' || String(userObj.name || '').includes('ผู้ดูแลระบบสูงสุด') || userObj.name === 'Super Admin' || userObj.name === 'Superuser') {
      shortLabel = 'Superuser';
    } else {
      let parts = String(userObj.name || '').trim().split(/\s+/);
      shortLabel = parts[0] || userObj.accessLevel || 'User';
    }

    const profEl = document.getElementById('displayProfileName');
    if (profEl) profEl.innerText = shortLabel;

    let loginTimeStr = localStorage.getItem(SESSION_LOGIN_TIME_KEY);
    if (!loginTimeStr) {
      const now = new Date();
      loginTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' น.';
      localStorage.setItem(SESSION_LOGIN_TIME_KEY, loginTimeStr);
    }

    const fullEl = document.getElementById('minimalUserFullName');
    if (fullEl) fullEl.innerText = (userObj.name === 'Super Admin' ? 'Superuser' : userObj.name) || shortLabel;

    const roleEl = document.getElementById('minimalUserRole');
    if (roleEl) roleEl.innerText = `สิทธิ์: ${userObj.accessLevel || 'User'} (${shortRole(userObj.role)})`;

    const timeDetailEl = document.getElementById('minimalLoginTimeDetail');
    if (timeDetailEl) timeDetailEl.innerText = loginTimeStr;

  function bootMainApp() {
    renderSavedAccounts();

    // หากผู้ใช้ไม่ได้กดออกจากระบบเองอย่างชัดเจน ให้ล็อกอินเริ่มต้นอัตโนมัติและดึงข้อมูลทันที
    const isExplicitlyLoggedOut = (sessionStorage.getItem('manstat_logged_out') === '1');

    let currentUser = null;
    try {
      const savedSessionJson = localStorage.getItem(SESSION_USER_OBJ_KEY);
      if (savedSessionJson) {
        currentUser = JSON.parse(savedSessionJson);
      }
    } catch (e) {}

    if (!isExplicitlyLoggedOut && (!currentUser || (!currentUser.name && !currentUser.email))) {
      currentUser = {
        id: 'EXE-001',
        EmpID: 'EXE-001',
        name: 'นายธีรศักดิ์ มโนธรรม',
        role: 'ผู้อำนวยการสถานศึกษา',
        department: 'สายงานบริหารและสนับสนุนการศึกษา',
        accessLevel: 'Superuser',
        email: 'superuser'
      };
      try {
        localStorage.setItem(SESSION_USER_OBJ_KEY, JSON.stringify(currentUser));
        localStorage.setItem(LOCAL_KEY, 'superuser');
        const now = new Date();
        const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' น.';
        localStorage.setItem(SESSION_LOGIN_TIME_KEY, timeStr);
      } catch (e) {}
    }

    if (!isExplicitlyLoggedOut && currentUser && (currentUser.name || currentUser.email)) {
      currentUser.accessLevel = normalizeRolePermission(currentUser.accessLevel);
      g_CurrentUser = currentUser;
      let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'none';
      let ap = document.getElementById('appScreen'); if (ap) ap.style.display = 'block';
      applyTopBarUserAndLoginTime(g_CurrentUser);
      refreshAllData();
      return;
    }

    // กรณีที่ล็อกเอาต์ชัดเจน ให้แสดงหน้าล็อกอิน

          let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'flex';

          let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'flex';
          let dbLbl = document.getElementById('dbStatusLabel'); if (dbLbl) dbLbl.innerText = 'การเชื่อมต่อขัดข้อง';
          let dot = document.getElementById('dbDot'); if (dot) dot.style.background = 'var(--red)';

        <div class="acc-chip">
          <div class="acc-info" onclick="selectSavedAccount('${escapeHtml(acc.email)}', '${escapeHtml(acc.password)}')">
            <div class="acc-name">${escapeHtml(acc.name === 'Super Admin' ? 'Superuser' : acc.name)}</div>
            <div class="acc-email">${escapeHtml(acc.email)}</div>
          </div>
          <div class="acc-del" onclick="deleteSavedAccount(event, ${index})" title="ลบบัญชี"><svg class="ui-ico-sm" style="color:var(--red);" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></div>
        </div>
      `).join('');
    } else {
      zone.style.display = 'none';
    }
  }

  function selectSavedAccount(email, pass) {
    document.getElementById('txtEmail').value = email;
    document.getElementById('txtPassword').value = pass;
    handleLogin();
  }

  function deleteSavedAccount(event, index) {
    if (event) event.stopPropagation();
    let saved = JSON.parse(localStorage.getItem(SAVED_ACCS_KEY) || "[]");
    saved.splice(index, 1);
    localStorage.setItem(SAVED_ACCS_KEY, JSON.stringify(saved));
    renderSavedAccounts();
  }

  function handleLogin() {
    const email = document.getElementById('txtEmail').value.trim();
    const pass = document.getElementById('txtPassword').value.trim();
    if (!email || !pass) {
      steamAlert('กรุณากรอกรหัสผู้ใช้และรหัสผ่านให้ครบถ้วน');
      return;
    }
    const btn = document.getElementById('btnLogin');
    if (btn) btn.disabled = true;

    startLoadingBar('กำลังตรวจสอบสิทธิ์ผู้ใช้งาน...');
    google.script.run
      .withSuccessHandler(res => {
        if (btn) btn.disabled = false;
        if (res && res.success) {
          res.user.accessLevel = normalizeRolePermission(res.user.accessLevel);
          g_CurrentUser = res.user;
          const now = new Date();
          const timeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' น.';
          localStorage.setItem(LOCAL_KEY, res.user.email || res.user.name);
          localStorage.setItem(SESSION_USER_OBJ_KEY, JSON.stringify(res.user));
          localStorage.setItem(SESSION_LOGIN_TIME_KEY, timeStr);

          let chk = document.getElementById('chkRemember');
          if (chk && chk.checked) {
            let saved = JSON.parse(localStorage.getItem(SAVED_ACCS_KEY) || "[]");
            let idKey = (res.user.email || res.user.name).toLowerCase();
            saved = saved.filter(s => (s.email || "").toLowerCase() !== idKey);
            saved.unshift({ name: res.user.name, email: res.user.email || res.user.name, password: pass });
            localStorage.setItem(SAVED_ACCS_KEY, JSON.stringify(saved.slice(0, 5)));
          }
          sessionStorage.removeItem('manstat_logged_out');
          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('appScreen').style.display = 'block';
          applyTopBarUserAndLoginTime(g_CurrentUser);
          refreshAllData();
        } else {
          stopLoadingBar(() => steamAlert((res && res.message) ? res.message : 'รหัสผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'));
        }
      })
      .withFailureHandler(err => {
        if (btn) btn.disabled = false;
        stopLoadingBar(() => steamAlert('เกิดข้อผิดพลาดในการเข้าสู่ระบบ: ' + (err.message || err)));
      })
      .processLogin(email, pass);
  }

  function handleLogout() {
    steamConfirm('ต้องการออกจากระบบใช่หรือไม่?', () => {
      sessionStorage.setItem('manstat_logged_out', '1');
      g_CurrentUser = null;
      localStorage.removeItem(LOCAL_KEY);
      localStorage.removeItem(SESSION_USER_OBJ_KEY);
      localStorage.removeItem(SESSION_LOGIN_TIME_KEY);
      document.getElementById('appScreen').style.display = 'none';
      document.getElementById('txtPassword').value = '';
      renderSavedAccounts();
      document.getElementById('loginScreen').style.display = 'flex';
    });
  }

  function switchView(viewName) {
    document.querySelectorAll('.main-view').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
    const target = document.getElementById('view_' + viewName);
    if (target) target.display = 'block', target.style.display = 'block';
    const btn = document.getElementById('btnNav_' + viewName);
    if (btn) btn.classList.add('active');

    if (viewName === 'dashboard') {
      if (typeof renderMainDashboard === 'function') renderMainDashboard();
    }
    if (viewName === 'leave') {
      if (typeof initCustomLeaveTypeSvgDropdown === 'function') initCustomLeaveTypeSvgDropdown();
      if (typeof checkDirectorLeaveRestrictionOnView === 'function') checkDirectorLeaveRestrictionOnView();
      if (typeof toggleLeaveTimeFields === 'function') toggleLeaveTimeFields();
      if (typeof populateSubstituteDropdown === 'function') populateSubstituteDropdown();
    }
    if (viewName === 'analytics' && typeof renderAnalyticsCharts === 'function') renderAnalyticsCharts();
    if (viewName === 'org_chart' && typeof renderOrgChartTree === 'function') renderOrgChartTree();
    if (viewName === 'workload' && typeof renderStaffWorkloadModule === 'function') renderStaffWorkloadModule();
    if (viewName === 'dir_license' && typeof renderStrictLicenseDirectory === 'function') renderStrictLicenseDirectory();
  }

  function applyFiscalDisplayToHeader() {
    if (!g_FiscalData || !g_FiscalData.active) return;
    const act = g_FiscalData.active;
    const elFisc = document.getElementById('lblFiscalYear');
    if (elFisc) {
      elFisc.innerHTML = `${escapeHtml(act.yearBE)} <span style="font-size:11px; color:var(--steam-green); font-weight:normal;">(ช่วงที่ 1: 1 ต.ค.–31 มี.ค. | ช่วงที่ 2: 1 เม.ย.–30 ก.ย.)</span>`;
    }
  }

  function _applyBundleToStateAndRender(bundle) {
    g_ScriptUrl = bundle.scriptUrl || "#";
    g_UsersSummary = bundle.usersSummary || [];
    g_LeaveLogs = bundle.logs || [];
    g_Workloads = bundle.workloads || [];
    g_Feedbacks = bundle.feedbacks || [];
    g_SchoolInfo = bundle.schoolInfo || {};
    g_FiscalData = bundle.fiscalData || null;
    if (Array.isArray(bundle.activeClasses) && bundle.activeClasses.length > 0) {
      g_ActiveClasses = bundle.activeClasses.slice();
    }

    if (typeof renderMainDashboard === 'function') renderMainDashboard();
    applyFiscalDisplayToHeader();
    if (typeof renderSeparateDirectories === 'function') renderSeparateDirectories();
    if (typeof renderStrictLicenseDirectory === 'function') renderStrictLicenseDirectory();
    if (typeof renderFeedbackSection === 'function') renderFeedbackSection();
    if (typeof populateSubstituteDropdown === 'function') populateSubstituteDropdown();
    initThaiDatePickers();
    if (typeof initCustomLeaveTypeSvgDropdown === 'function') initCustomLeaveTypeSvgDropdown();

    const currentActiveBtn = document.querySelector('.menu-btn.active');
    if (currentActiveBtn) {
      const id = currentActiveBtn.id;
      if (id === 'btnNav_org_chart' && typeof renderOrgChartTree === 'function') renderOrgChartTree();
      if (id === 'btnNav_workload' && typeof renderStaffWorkloadModule === 'function') renderStaffWorkloadModule();
      if (id === 'btnNav_dir_license' && typeof renderStrictLicenseDirectory === 'function') renderStrictLicenseDirectory();
    }
  }

  function refreshAllData() {
    if (typeof _autoRecoveryAttempted !== 'undefined') {
      _autoRecoveryAttempted = false;
    }
    startLoadingBar('กำลังซิงค์ข้อมูลสถิติการลา ทะเบียนประวัติ และภาระงาน...');
    google.script.run
      .withSuccessHandler(bundle => {
        stopLoadingBar(() => {
          if (!bundle) {
            steamAlert('ไม่พบข้อมูลตอบกลับ กรุณากดรีเฟรชอีกครั้ง');
            return;
          }
          if (bundle.status === 'error') {
            console.warn('Backend warning:', bundle.message);
            steamAlert('เซิร์ฟเวอร์แจ้งข้อผิดพลาด: ' + (bundle.message || 'ไม่สามารถโหลดข้อมูลได้'), 'แจ้งเตือนฐานข้อมูล');
          }
          if (bundle.status === 'success' && (!bundle.usersSummary || bundle.usersSummary.length === 0)) {
            // หากดึงข้อมูลแล้วยังเป็น 0 คน ให้สั่งสร้างและโหลดบุคลากรเริ่มต้นอัตโนมัติทันที
            startLoadingBar('กำลังสร้างและโหลดข้อมูลสถิติบุคลากรเริ่มต้น...');
            google.script.run
              .withSuccessHandler(repairedBundle => {
                stopLoadingBar(() => {
                  _applyBundleToStateAndRender(repairedBundle);
                });
              })
              .withFailureHandler(rErr => {
                stopLoadingBar(() => _applyBundleToStateAndRender(bundle));
              })
              .forceRepairAndLoadStaff();
            return;
          }
          _applyBundleToStateAndRender(bundle);
        });
      })
      .withFailureHandler(err => {
        stopLoadingBar(() => steamAlert('ซิงค์ข้อมูลไม่สำเร็จ: ' + (err.message || err)));
      })
      .getMainBundleData();
  }

  function openSidebarDrawer(mode) {
    document.getElementById('sb_delName_Director').innerText = g_SchoolInfo.directorName || 'ผู้อำนวยการสถานศึกษา';
    document.getElementById('sb_delName_Dep1').innerText = g_SchoolInfo.deputy1 || localStorage.getItem('steam_dep1') || '- ยังไม่ได้กำหนด -';
    document.getElementById('sb_delName_Dep2').innerText = g_SchoolInfo.deputy2 || localStorage.getItem('steam_dep2') || '- ยังไม่ได้กำหนด -';
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sbOverlay').style.display = 'block';
  }

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sbOverlay').style.display = 'none';
  }

  function saveDelegationFromSidebar() {
    const sel = document.querySelector('input[name="delegateSignerSb"]:checked');
    if (!sel) return;
    localStorage.setItem('steam_delegate_mode', sel.value);
    applyDelegationBanner();
    closeSidebar();
    steamAlert('เปลี่ยนผู้มีอำนาจลงนามเรียบร้อยแล้ว');
  }

  function getActiveSignerName() {
    const mode = localStorage.getItem('steam_delegate_mode') || 'director';
    if (mode === 'deputy1') return g_SchoolInfo.deputy1 || localStorage.getItem('steam_dep1') || g_SchoolInfo.directorName;
    if (mode === 'deputy2') return g_SchoolInfo.deputy2 || localStorage.getItem('steam_dep2') || g_SchoolInfo.directorName;
    return g_SchoolInfo.directorName || 'นายธีรศักดิ์ มโนธรรม';
  }

  function applyDelegationBanner() {
    const banner = document.getElementById('delegateBanner');
    if (!banner) return;
    const mode = localStorage.getItem('steam_delegate_mode') || 'director';
    if (mode === 'director') {
      banner.style.display = 'none';
    } else {
      banner.style.display = 'flex';
      document.getElementById('bannerDelegateName').innerText = getActiveSignerName();
    }
  }

  function openSettingsModal() {
    document.getElementById('setPhone').value = g_CurrentUser ? (g_CurrentUser.phone || '') : '';
    document.getElementById('setOldPass').value = '';
    document.getElementById('setNewPass').value = '';
    document.getElementById('modalSettings').style.display = 'flex';
  }
  function closeSettingsModal() {
    document.getElementById('modalSettings').style.display = 'none';
  }

  function saveSettings() {
    const p = document.getElementById('setPhone').value;
    const op = document.getElementById('setOldPass').value;
    const np = document.getElementById('setNewPass').value;
    if (!op) {
      steamAlert('กรุณาใส่รหัสผ่านเดิมเพื่อยืนยัน');
      return;
    }
    closeSettingsModal();
    startLoadingBar('กำลังบันทึกข้อมูลส่วนตัว...');
    google.script.run
      .withSuccessHandler(res => stopLoadingBar(() => steamAlert(res.message)))
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('บันทึกไม่สำเร็จ: ' + (err.message || err))))
      .processUpdateProfile(g_CurrentUser.email || g_CurrentUser.name, op, np, p);
  }

  function goToAdminPage(e, optionalJumpTab) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    if (!isSuperuserOrAdmin(g_CurrentUser)) {
      steamAlert('ปฏิเสธการเข้าถึง: เฉพาะผู้ดูแลระบบ (Admin / Superuser) เท่านั้นที่สามารถเข้าถึงการตั้งค่าระบบได้', 'ไม่มีสิทธิ์เข้าถึง');
      return;
    }
    let targetTab = (optionalJumpTab === 'tab3') ? 'tab2' : optionalJumpTab;
    if (targetTab) {
      try { sessionStorage.setItem('steam_admin_jump_tab', targetTab); } catch (err) {}
    }
    startLoadingBar('กำลังเข้าสู่เมนูตั้งค่าระบบ...');
    google.script.run
      .withSuccessHandler(bundle => {
        try { sessionStorage.setItem('steam_prefetch_admin', JSON.stringify(bundle.adminData)); } catch (err) {}
        stopLoadingBar(() => {
          document.open();
          document.write(bundle.htmlContent);
          document.close();
          setTimeout(() => { if (typeof bootAdminApp === 'function') bootAdminApp(); }, 50);
        });
      })
      .withFailureHandler(err => {
        stopLoadingBar(() => steamAlert('ไม่สามารถเปิดหน้าตั้งค่าระบบได้: ' + (err.message || err)));
      })
      .getAdminBundle();
  }

  function goBackHome(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    startLoadingBar('กำลังกลับสู่หน้าหลัก ManStat...');
    const savedEmail = localStorage.getItem(LOCAL_KEY) || 'superuser';
    google.script.run
      .withSuccessHandler(bundle => {
        stopLoadingBar(() => {
          document.open();
          document.write(bundle.htmlContent);
          document.close();
          setTimeout(() => {
            try {
              const savedSessionJson = localStorage.getItem(SESSION_USER_OBJ_KEY);
              if (savedSessionJson) g_CurrentUser = JSON.parse(savedSessionJson);
            } catch (err) {}
            if (!g_CurrentUser) {
              g_CurrentUser = { id: 'EXE-001', EmpID: 'EXE-001', positionNo: '10001', name: 'Superuser', email: savedEmail, accessLevel: 'Superuser', role: 'ผู้อำนวยการสถานศึกษา' };
            }
            let ls = document.getElementById('loadingScreen'); if (ls) ls.style.display = 'none';
            let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'none';
            let ap = document.getElementById('appScreen'); if (ap) ap.style.display = 'block';
            applyTopBarUserAndLoginTime(g_CurrentUser);
            if (bundle && bundle.initialData) {
              _applyBundleToStateAndRender(bundle.initialData);
            } else {
              refreshAllData();
            }
          }, 50);
        });
      })
      .withFailureHandler(err => {
        stopLoadingBar(() => steamAlert('กลับหน้าหลักไม่สำเร็จ: ' + (err.message || err)));
      })
      .getHomeBundle(savedEmail);
  }
</script>
