  // =========================================================
  // คำนวณอายุ (ปี-เดือน-วัน) และวันเกษียณอายุราชการฝั่ง Client
  // =========================================================
  function _clientDiffYMD(startDate, endDate) {
    if (!startDate || !endDate || isNaN(startDate.getTime()) || isNaN(endDate.getTime()) || endDate < startDate) {
      return { years: 0, months: 0, days: 0, text: '0 ปี 0 เดือน 0 วัน' };
    }
    var years = endDate.getFullYear() - startDate.getFullYear();
    var months = endDate.getMonth() - startDate.getMonth();
    var days = endDate.getDate() - startDate.getDate();

    if (days < 0) {
      months--;
      var prevMonthLastDay = new Date(endDate.getFullYear(), endDate.getMonth(), 0).getDate();
      days += prevMonthLastDay;
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    return {
      years: years,
      months: months,
      days: days,
      text: years + ' ปี ' + months + ' เดือน ' + days + ' วัน'
    };
  }

  function calculateRetirementClient(birthDateStr) {
    if (!birthDateStr) return null;
    var p = String(birthDateStr).trim().split('-');
    if (p.length !== 3) return null;
    var y = normalizeYearToCEClient(p[0]);
    var m = parseInt(p[1], 10);
    var d = parseInt(p[2], 10);
    var bDate = new Date(y, m - 1, d, 0, 0, 0);
    if (isNaN(bDate.getTime())) return null;

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var curAge = _clientDiffYMD(bDate, today);

    var isOctToDec = (m >= 10 && m <= 12);
    var retireYearCE = y + 60 + (isOctToDec ? 1 : 0);
    var retireYearBE = retireYearCE + 543;
    var retireDateObj = new Date(retireYearCE, 8, 30, 0, 0, 0);

    var ageAtRetire = _clientDiffYMD(bDate, retireDateObj);
    var isRetired = (today > retireDateObj);
    var remainObj = isRetired
      ? { text: 'เกษียณอายุราชการแล้ว' }
      : _clientDiffYMD(today, retireDateObj);

    return {
      ageText: curAge.text,
      retireDateFormatted: '30 กันยายน ' + retireYearBE + ' (30/09/' + retireYearBE + ')',
      ageAtRetirementText: ageAtRetire.text,
      remainingToRetireText: remainObj.text,
      isOctToDec: isOctToDec,
      isRetired: isRetired
    };
  }

  function onBirthDateChangeCalc(prefix) {
    var inp = document.getElementById(prefix + '_birthDate');
    var box = document.getElementById(prefix + '_retirementPreviewBox');
    if (!inp || !box) return;

    var calc = calculateRetirementClient(inp.value);
    if (!calc) {
      box.innerHTML = `<span style="color:var(--text-muted);">กรุณาเลือกวันเดือนปีเกิดเพื่อคำนวณอายุ (ปี-เดือน-วัน) และวันเกษียณอายุราชการอัตโนมัติ</span>`;
      return;
    }

    var octNote = calc.isOctToDec
      ? `<span style="background:rgba(164,208,7,0.16); border:1px solid var(--steam-green); color:var(--steam-green); padding:1px 7px; border-radius:10px; font-size:11px; font-weight:bold; margin-left:6px;">เกิด 1 ต.ค.–31 ธ.ค. เลื่อนเกษียณ +1 ปี</span>`
      : '';

    box.innerHTML = `

        <div>• <b>อายุปัจจุบัน:</b> <span style="color:var(--steam-cyan); font-weight:bold;">${escapeHtml(calc.ageText)}</span></div>

        <div>• <b>เวลาคงเหลือ:</b> <span style="color:${calc.isRetired ? 'var(--red)' : 'var(--steam-green)'}; font-weight:bold;">${escapeHtml(calc.remainingToRetireText)}</span></div>
      </div>
    `;
  }

  function bootAdminApp() {
    if (typeof initThaiDatePickers === 'function') initThaiDatePickers();

    var currentAuthUser = null;
    try {
      var savedSess = localStorage.getItem(SESSION_USER_OBJ_KEY);
      if (savedSess) currentAuthUser = JSON.parse(savedSess);
    } catch (e) {}

    if (!currentAuthUser || !isSuperuserOrAdmin(currentAuthUser)) {
      steamAlert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้ กรุณาเข้าสู่ระบบด้วยบัญชีผู้ดูแลระบบ (Admin / Superuser)', 'ปฏิเสธการเข้าถึง');
      setTimeout(function() {
        if (typeof goBackHome === 'function') {
          goBackHome();
        } else {
          window.location.href = '?page=index';
        }
      }, 1500);
      return;
    }

    try {
      const prefetched = sessionStorage.getItem('steam_prefetch_admin');
      if (prefetched) {
        sessionStorage.removeItem('steam_prefetch_admin');
        initAdminData(JSON.parse(prefetched));
        const jumpTab = sessionStorage.getItem('steam_admin_jump_tab');
        if (jumpTab) {
          sessionStorage.removeItem('steam_admin_jump_tab');
          let tabEl = document.querySelector(`.ribbon-tab[data-tab="${jumpTab}"]`);
          if (tabEl) switchAdminRibbonTab(jumpTab, tabEl);
        }
        return;
      }
    } catch (e) {}

    startLoadingBar('กำลังโหลดข้อมูลตั้งค่าระบบ...');
    google.script.run
      .withSuccessHandler(data => stopLoadingBar(() => initAdminData(data)))
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('โหลดข้อมูลไม่สำเร็จ: ' + (err.message || err))))
      .getAdminData();
  }

  function switchAdminRibbonTab(tabId, el) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.ribbon-tab').forEach(tab => tab.classList.remove('active'));
    let target = document.getElementById(tabId);
    if (target) target.classList.add('active');
    if (el) el.classList.add('active');
  }

  function initEditDivisionTags(rawDivisionStr) {
    g_SelectedEditDivisions = [];

        if (clean && !g_SelectedEditDivisions.includes(clean)) {

    if (g_SelectedEditDivisions.length === 0) {
      g_SelectedEditDivisions.push('เจ้าหน้าที่ฝ่ายบริหารวิชาการ');
    }
    const picker = document.getElementById('edit_division_picker');
    if (picker) picker.value = '';
    const customWrap = document.getElementById('edit_division_custom_wrap');
    if (customWrap) customWrap.style.display = 'none';
    const customInp = document.getElementById('edit_division_custom_input');
    if (customInp) customInp.value = '';
    renderEditDivisionTags();
  }

    const val = picker.value;
    if (!val) return;

    if (val === '__CUSTOM__') {
      if (customWrap) customWrap.style.display = 'flex';
      if (customInp) customInp.focus();
      return;
    }

    if (customWrap) customWrap.style.display = 'none';
    if (!g_SelectedEditDivisions.includes(val)) {
      g_SelectedEditDivisions.push(val);
      renderEditDivisionTags();
    }
    picker.value = '';
  }

  function addCustomEditDivision() {
    const customInp = document.getElementById('edit_division_custom_input');
    const picker = document.getElementById('edit_division_picker');
    const customWrap = document.getElementById('edit_division_custom_wrap');
    if (!customInp) return;

    const val = customInp.value.trim();
    if (!val) {
      steamAlert('กรุณาพิมพ์ชื่อฝ่ายงาน หรือหน้าที่พิเศษที่ต้องการเพิ่ม');
      return;
    }

    val.split(',').forEach(part => {
      let clean = part.trim();
      if (clean && !g_SelectedEditDivisions.includes(clean)) {
        g_SelectedEditDivisions.push(clean);
      }
    });

    customInp.value = '';
    if (picker) picker.value = '';
    if (customWrap) customWrap.style.display = 'none';
    renderEditDivisionTags();
  }

  function toggleClassConfigPanel() {
    let body = document.getElementById('activeClassConfigBody');
    let btn = document.getElementById('btnToggleClassConfigBox');
    if (!body) return;
    if (body.style.display === 'none') {
      body.style.display = 'block';

      renderActiveClassPills();
    } else {
      body.style.display = 'none';
      if (btn) btn.innerHTML = `${ADM_SVG.chevDown}&nbsp;<span>เลือกเปิด-ปิดชั้นเรียน</span>`;

  function renderActiveClassPills() {
    let container = document.getElementById('activeClassPillsContainer');
    let badge = document.getElementById('activeClassCountBadge');
    if (badge) {
      badge.innerHTML = `${ADM_SVG.check}&nbsp;<span>เปิดสอน ${g_ActiveClasses.length} ชั้นเรียน</span>`;
    }
    if (!container) return;

    container.innerHTML = ALL_CLASS_GROUPS_MASTER.map(g => {
      let pills = g.classes.map(cName => {
        let isOn = g_ActiveClasses.includes(cName);
        return `
        <div class="cls-toggle-pill ${isOn ? 'active' : ''}" onclick="toggleActiveClassPill('${cName}')">
          ${isOn ? ADM_SVG.check : ADM_SVG.circleOff}&nbsp;<span>${cName}</span>
        </div>`;
      }).join('');

      let allInGrpOn = g.classes.every(c => g_ActiveClasses.includes(c));
      return `
      <div class="cls-config-row">
        <div style="color:var(--orange); font-weight:bold; font-size:13px;">ระดับ${g.group}</div>
        <div class="cls-pills-grid">${pills}</div>
        <div style="text-align:right;">
          <button type="button" class="btn-save-sm" style="width:100%; padding:5px 8px; font-size:11.5px; display:inline-flex; align-items:center; justify-content:center; gap:4px;" onclick="toggleWholeClassGroup('${g.group}')">
            ${allInGrpOn ? ADM_SVG.circleOff : ADM_SVG.check}&nbsp;<span>${allInGrpOn ? 'ปิดทั้งระดับ' : 'เปิดทั้งระดับ'}</span>
          </button>
        </div>
      </div>`;
    }).join('');
  }

  function toggleActiveClassPill(className) {
    let pos = g_ActiveClasses.indexOf(className);
    if (pos === -1) {
      g_ActiveClasses.push(className);
    } else {
      if (g_ActiveClasses.length <= 1) {
        steamAlert("ต้องเปิดสอนอย่างน้อย 1 ชั้นเรียนครับ");
        return;
      }
      g_ActiveClasses.splice(pos, 1);
    }
    g_ActiveClasses = ALL_ORDERED_CLASSES_MASTER.filter(c => g_ActiveClasses.includes(c));
    renderActiveClassPills();
    let saveBtn = document.getElementById('btnSaveActiveClasses');
    if (saveBtn) saveBtn.style.display = 'inline-flex';
  }

  function toggleWholeClassGroup(groupName) {
    let grpObj = ALL_CLASS_GROUPS_MASTER.find(g => g.group === groupName);
    if (!grpObj) return;
    let allOn = grpObj.classes.every(c => g_ActiveClasses.includes(c));
    if (allOn) {
      let remaining = g_ActiveClasses.filter(c => !grpObj.classes.includes(c));
      if (remaining.length === 0) {
        steamAlert("ไม่สามารถปิดทุกชั้นเรียนได้ ต้องมีชั้นเรียนที่เปิดสอนอย่างน้อย 1 ชั้นครับ");
        return;
      }
      g_ActiveClasses = remaining;
    } else {
      grpObj.classes.forEach(c => {
        if (!g_ActiveClasses.includes(c)) g_ActiveClasses.push(c);
      });
    }
    g_ActiveClasses = ALL_ORDERED_CLASSES_MASTER.filter(c => g_ActiveClasses.includes(c));
    renderActiveClassPills();
    let saveBtn = document.getElementById('btnSaveActiveClasses');
    if (saveBtn) saveBtn.style.display = 'inline-flex';
  }

        stopLoadingBar(() => steamAlert(res.message));

  function renderTeacherEditTable() {
    let container = document.getElementById('adminUserRibbonContainer');
    if (!container) return;

    let totalActive = g_AdminTeachers.filter(t => t.status !== 'ย้าย/เกษียณ').length;
    let roleSum = document.getElementById('roleSummaryContainer');
    if (roleSum) {
      roleSum.innerHTML = `
        <span style="background:rgba(102,192,244,0.15); border:1px solid var(--steam-cyan); color:var(--steam-cyan); padding:5px 12px; border-radius:20px; font-weight:bold; font-size:12px; display:inline-flex; align-items:center; gap:5px;">
          ${ADM_SVG.users}&nbsp;<span>ปกติ: ${totalActive}/${g_AdminTeachers.length} คน</span>
        </span>
      `;
    }

    const q = (document.getElementById('admSearchUserInput') ? document.getElementById('admSearchUserInput').value : '').trim().toLowerCase();
    const catFilter = document.getElementById('admFilterUserCategory') ? document.getElementById('admFilterUserCategory').value : 'ALL';
    const accFilter = document.getElementById('admFilterUserAccess') ? document.getElementById('admFilterUserAccess').value : 'ALL';
    const stFilter = document.getElementById('admFilterUserStatus') ? document.getElementById('admFilterUserStatus').value : 'ALL';

    const filteredItems = [];
    g_AdminTeachers.forEach((t, origIndex) => {
      const empId = String(t.EmpID || t.id || '');
      const normAccess = normalizeRolePermission(t.accessLevel);
      const isActive = (t.status !== 'ย้าย/เกษียณ');

      if (catFilter !== 'ALL' && getStaffCategoryCode(t) !== catFilter) return;
      if (accFilter !== 'ALL' && normAccess !== accFilter) return;
      if (stFilter === 'ACTIVE' && !isActive) return;
      if (stFilter === 'INACTIVE' && isActive) return;

      if (q) {
        const hay = `${t.name || ''} ${empId} ${t.PositionNo || ''} ${t.MemberID || ''} ${t.email || ''} ${t.role || ''} ${t.department || ''} ${t.Division || ''}`.toLowerCase();
        if (!hay.includes(q)) return;
      }

      filteredItems.push({ t, origIndex });
    });

    if (filteredItems.length === 0) {
      container.innerHTML = `
        <div style="background:rgba(0,0,0,0.2); border:1px dashed #2a475e; border-radius:4px; padding:26px; text-align:center; color:var(--text-muted); font-size:13.5px;">
          ไม่พบบัญชีผู้ใช้ที่ตรงกับเงื่อนไขการค้นหา

    container.innerHTML = filteredItems.map(({ t, origIndex }) => {

      const normAccess = normalizeRolePermission(t.accessLevel);

      let permBadge = `<span class="perm-badge perm-user-cls">${ADM_SVG.shield}&nbsp;<span>${escapeHtml(normAccess)}</span></span>`;
      if (normAccess === 'Superuser') permBadge = `<span class="perm-badge perm-super">${ADM_SVG.shield}&nbsp;<span>Superuser</span></span>`;
      else if (normAccess === 'Admin') permBadge = `<span class="perm-badge perm-admin">${ADM_SVG.shield}&nbsp;<span>Admin</span></span>`;

      const identitySubtitleHtml = buildStaffIdentitySubtitle(t);
      const emailDisplay = t.email ? escapeHtml(t.email) : `<span style="color:var(--orange);">ยังไม่ได้ระบุ Email</span>`;
      const deptDisplay = escapeHtml(t.department || '-');
      const statusTextBadge = isActive

  function openEditTeacherModal(index) {
    let t = g_AdminTeachers[index];
    if (!t) return;

    const empId = t.EmpID || t.id;
    document.getElementById('modalEditHeaderName').innerText = `[${empId}] ${t.name}`;
    document.getElementById('edit_empId').value = empId;
    document.getElementById('edit_empId_display').value = empId;
    document.getElementById('edit_oldName').value = t.name;

      if (badgeEl) badgeEl.innerHTML = `<span class="id-unverified-badge">รอตรวจสอบ (คล้ายรหัสบุคลากร)</span>`;
    } else {
      if (posInp) posInp.value = t.PositionNo || t.positionNo || '';
      if (badgeEl) badgeEl.innerHTML = '';
    }

    const memInp = document.getElementById('edit_memberId');
    if (memInp) memInp.value = t.MemberID || t.memberId || '';

    document.getElementById('edit_name').value = t.name;
    document.getElementById('edit_idCard').value = t.idCard || '';
    setDatePickerVal('edit_startDate', t.RawStartDate || t.startDate || '');

    setDatePickerVal('edit_birthDate', t.RawBirthDate || '');
    onBirthDateChangeCalc('edit');

    let cleanRole = String(t.role || 'ครู').replace(/\s*\(คศ\.\s*\d+\)/g, '').replace(/\s*\(รปภ\.\)/g, '').trim();
    setRoleComboValue('edit', cleanRole);

    initEditDivisionTags(t.Division || t.division || 'เจ้าหน้าที่ฝ่ายบริหารวิชาการ');

    document.getElementById('edit_email').value = t.email || '';

    document.getElementById('edit_pass').value = '';

    document.getElementById('edit_access').value = normalizeRolePermission(t.accessLevel || 'User');

    let clsSel = document.getElementById('edit_class');

      clsSel.innerHTML += `<option value="${escapeHtml(t.classLevel)}">${escapeHtml(t.classLevel)}</option>`;

  function onScoutQualChange() {
    const q = document.getElementById('sct_qual').value;
    const t = document.getElementById('sct_type');

    if (q === 'ไม่มีวุฒิลูกเสือ') {

  function onLicenseTypeChange() {
    const type = document.getElementById('lic_type').value;
    const spec = LICENSE_SPECS_CLIENT[type];
    const infoBox = document.getElementById('lic_specInfoBox');
    if (spec && infoBox) infoBox.innerHTML = spec.text;
    autoCalcLicenseExpiry();
  }

  function autoCalcLicenseExpiry() {
    const type = document.getElementById('lic_type').value;
    const issueVal = document.getElementById('lic_issue').value;
    if (!issueVal) return;
    const spec = LICENSE_SPECS_CLIENT[type] || { years: 5 };
    const p = issueVal.split('-');
    if (p.length === 3) {
      const expYear = normalizeYearToCEClient(p[0]) + spec.years;
      const dObj = new Date(expYear, parseInt(p[1], 10) - 1, parseInt(p[2], 10) - 1);
      const yyyy = dObj.getFullYear();
      const mm = String(dObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dObj.getDate()).padStart(2, '0');
      setDatePickerVal('lic_exp', `${yyyy}-${mm}-${dd}`);
    }
  }

  function handleAdminSaveHistory(e, type) {
    e.preventDefault();
    const empId = document.getElementById('edit_empId').value;
    if (!empId) return;
    let payload = { empId: empId };

    if (type === 'LICENSE') {
      payload.recordId = document.getElementById('lic_recordId').value;
      payload.licenseType = document.getElementById('lic_type').value;
      payload.licenseNum = document.getElementById('lic_num').value.trim();
      payload.issueDate = document.getElementById('lic_issue').value;
      payload.expiryDate = document.getElementById('lic_exp').value;
    } else if (type === 'STANDING') {
      const stdVal = getStandingComboValue();
      if (!stdVal) {
        steamAlert('กรุณาเลือกหรือพิมพ์ระบุชื่อตำแหน่ง / การบรรจุ');
        return;
      }
      payload.recordId = document.getElementById('std_recordId').value;
      payload.standingLevel = stdVal;
      payload.effectiveDate = document.getElementById('std_date').value;
      payload.orderNumber = document.getElementById('std_order').value.trim();
    } else if (type === 'SCOUT') {
      payload.recordId = document.getElementById('sct_recordId').value;
      payload.scoutQual = document.getElementById('sct_qual').value;
      payload.scoutType = document.getElementById('sct_type').value;
      payload.certNum = document.getElementById('sct_cert').value.trim();
      payload.approvedDate = document.getElementById('sct_date') ? document.getElementById('sct_date').value : '-';
    } else if (type === 'EDUCATION') {
      payload.recordId = document.getElementById('edu_recordId').value;
      payload.degreeLevel = document.getElementById('edu_level').value;
      payload.degreeShort = document.getElementById('edu_short').value;
      payload.major = document.getElementById('edu_major').value.trim();
      payload.institute = document.getElementById('edu_inst').value.trim();
      payload.gradYear = document.getElementById('edu_year').value;
    }

  function handleWizardExcelFileSelect(event) {
    let file = event.target.files[0];
    if (!file) return;
    setWizardStepState(3);

    let reader = new FileReader();
    reader.onload = function(e) {
      try {
        let data = new Uint8Array(e.target.result);
        let workbook = XLSX.read(data, { type: 'array' });

        let bundle = {
          Personnel: [],
          Education: [],
          Standing: [],
          Scout: [],
          License: []
        };

        workbook.SheetNames.forEach(sName => {
          let rows = XLSX.utils.sheet_to_json(workbook.Sheets[sName]);
          let cleanName = sName.trim().toLowerCase();
          if (cleanName === 'personnel' || cleanName === 'รายชื่อบุคลากร' || cleanName === 'teachers') {
            bundle.Personnel = rows;
          } else if (cleanName === 'education') {
            bundle.Education = rows;
          } else if (cleanName === 'standing') {
            bundle.Standing = rows;
          } else if (cleanName === 'scout') {
            bundle.Scout = rows;
          } else if (cleanName === 'license' || cleanName === 'licenses') {
            bundle.License = rows;
          }
        });

        if (workbook.SheetNames.length === 1 && bundle.Personnel.length === 0) {
          bundle.Personnel = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        }

        let warnings = [];
        bundle.Personnel.forEach((p, idx) => {
          let email = p.Email || p['อีเมล'] || '';
          if (email && !isValidEmailFormat(email)) {
            warnings.push(`Personnel แถวที่ ${idx + 1}: รูปแบบ Email ไม่ถูกต้อง (${email})`);
          }
        });

        g_WizardParsedBundle = bundle;
        setWizardStepState(4);

        const zone = document.getElementById('wizValidationAndPreviewZone');
        const btnImp = document.getElementById('btnWizardConfirmImport');
        if (btnImp) btnImp.style.display = 'inline-flex';

        let warnHtml = warnings.length > 0
          ? `<div style="color:var(--orange); margin-top:6px;">แจ้งเตือนการตรวจสอบ (${warnings.length} รายการ):<br>• ${warnings.map(escapeHtml).join('<br>• ')}</div>`
          : `<div style="color:var(--steam-green); font-weight:bold; margin-top:6px; display:flex; align-items:center; gap:5px;">${ADM_SVG.check}&nbsp;<span>ผ่านการตรวจสอบโครงสร้างข้อมูล (Validation Passed)</span></div>`;

        if (zone) {
          zone.innerHTML = `
            <div style="color:#fff; font-weight:bold; margin-bottom:6px;">ผลลัพธ์การตรวจสอบและพรีวิวข้อมูลก่อนนำเข้า:</div>

              <div style="background:#101822; border:1px solid var(--steam-cyan); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Personnel</div>
                <div style="font-size:16px; font-weight:bold; color:#fff;">${bundle.Personnel.length}</div>
              </div>
              <div style="background:#101822; border:1px solid var(--steam-green); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Education</div>
                <div style="font-size:16px; font-weight:bold; color:var(--steam-green);">${bundle.Education.length}</div>
              </div>
              <div style="background:#101822; border:1px solid var(--steam-cyan); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Standing</div>

              </div>

  function triggerSHA256Migration() {
    steamConfirm('ยืนยันการเข้ารหัสรหัสผ่านของบุคลากรทั้งหมดในฐานข้อมูลด้วยอัลกอริทึม SHA-256 ใช่หรือไม่? (ผู้ใช้งานยังใช้รหัสผ่านเดิมล็อกอินได้ตามปกติ)', () => {
      startLoadingBar('กำลังเข้ารหัสรหัสผ่านทั้งหมดเป็น SHA-256...');
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert(res ? res.message : 'ดำเนินการเสร็จสิ้น', 'เข้ารหัสผ่าน SHA-256 สำเร็จ');
            refreshAdminData();
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('เข้ารหัสไม่สำเร็จ: ' + (err.message || err))))
        .migrateAllPasswordsToSHA256('Superuser');
    });
  }

    let options = `<option value="">-- เลือกผู้รักษาราชการแทน --</option>` + g_AdminTeachers.map(t => `<option value="${escapeHtml(t.name)}">${escapeHtml(t.name)}</option>`).join('');
    sel1.innerHTML = options;
    sel2.innerHTML = options;
    sel1.value = g_SchoolInfo.deputy1 || localStorage.getItem('steam_dep1') || '';
    sel2.value = g_SchoolInfo.deputy2 || localStorage.getItem('steam_dep2') || '';

    const d2 = document.getElementById('adminSettingDep2').value;
    localStorage.setItem('steam_dep1', d1);
    localStorage.setItem('steam_dep2', d2);
    startLoadingBar('กำลังบันทึกผู้รักษาราชการแทน...');
    google.script.run

      .School_saveInfo({ deputy1: d1, deputy2: d2 });

  function getLocationGPS() {
    const status = document.getElementById('gpsStatus');
    if (!status) return;
    status.innerText = "กำลังค้นหาตำแหน่งจากพิกัดดาวเทียม GPS...";
    status.style.color = "var(--steam-cyan)";
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(position => {
        document.getElementById('sch_lat').value = position.coords.latitude.toFixed(6);
        document.getElementById('sch_lng').value = position.coords.longitude.toFixed(6);
        status.innerText = "ดึงพิกัดสำเร็จ! กดปุ่ม 'บันทึกข้อมูลสถานศึกษา' ด้านบนเพื่อยืนยัน";
        status.style.color = "var(--steam-green)";
      }, err => {
        status.innerText = "ไม่สามารถดึงตำแหน่งได้ กรุณาอนุญาตสิทธิ์การเข้าถึงตำแหน่งบนเบราว์เซอร์";
        status.style.color = "var(--red)";
      });
    } else {
      status.innerText = "เบราว์เซอร์ไม่รองรับ GPS";
      status.style.color = "var(--red)";
    }
  }

  function previewLogo(event) {
    const file = event.target.files[0];
    if (!file) return;
    currentLogoFile = file;
    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_SIZE = 240;
        let width = img.width, height = img.height;
        if (width > height) {
          if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
        } else {
          if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
        }
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        currentLogoBase64Full = canvas.toDataURL(file.type);
        const prev = document.getElementById('logoPreview');
        prev.src = currentLogoBase64Full;
        prev.style.display = 'block';
        document.getElementById('logoPlaceholder').style.display = 'none';
        document.getElementById('btnUploadLogo').disabled = false;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function uploadLogo() {
    if (!currentLogoBase64Full) return;
    document.getElementById('btnUploadLogo').disabled = true;
    startLoadingBar("กำลังอัปโหลดและบันทึกโลโก้โรงเรียน...");
    google.script.run
      .withSuccessHandler(res => {
        g_SchoolLogoBase64 = currentLogoBase64Full;
        stopLoadingBar(() => steamAlert(res.message));
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert("ผิดพลาด: " + (err.message || err))))
      .uploadSchoolLogo(currentLogoFile ? currentLogoFile.name : 'logo.png', 'image/png', currentLogoBase64Full);
  }

    startLoadingBar('กำลังบันทึกข้อมูลสถานศึกษา...');
