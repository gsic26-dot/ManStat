<script>
  // =========================================================================
  // MODULE: LEAVE TRACKING CONTROLLER (JS_Mod_LeaveTracking.html)
  // แยกอิสระ 100% ควบคุมการติดตามสถานะคำร้อง ไทม์ไลน์ และพิมพ์ใบลา
  // =========================================================================
  function renderTrackingStepByStepTable() {
    const trackBody = document.getElementById('trackingLogsBody');
    if (!trackBody) return;
    if (!g_LeaveLogs || g_LeaveLogs.length === 0) {
      trackBody.innerHTML = '<tr><td colspan="6" style="padding:20px; color:var(--text-muted);">ยังไม่มีรายการคำร้องให้ติดตาม</td></tr>';
      return;
    }

    const myName = g_CurrentUser ? String(g_CurrentUser.name || '').trim() : '';
    const myEmail = g_CurrentUser ? String(g_CurrentUser.email || '').trim().toLowerCase() : '';
    const myAccess = g_CurrentUser ? normalizeRolePermission(g_CurrentUser.accessLevel) : 'User';
    const myDiv = g_CurrentUser ? String(g_CurrentUser.division || g_CurrentUser.Division || '') : '';
    const myRole = g_CurrentUser ? String(g_CurrentUser.role || '') : '';

    const isSuperOverride = (myEmail === 'superuser' || myAccess === 'Superuser');
    const isHRHead = isSuperOverride || myName.includes('ทัชชกร') || myDiv.includes('หัวหน้าฝ่ายบริหารงานบุคคล') || myDiv.includes('บุคคล');
    const isAcadHead = isSuperOverride || myName.includes('พันธ์ธนัต') || myDiv.includes('หัวหน้าฝ่ายบริหารวิชาการ') || myDiv.includes('วิชาการ');
    const dep1 = g_SchoolInfo.deputy1 || localStorage.getItem('steam_dep1') || '';
    const dep2 = g_SchoolInfo.deputy2 || localStorage.getItem('steam_dep2') || '';
    const isDirectorOrDeputy = isSuperOverride || myRole.includes('ผู้อำนวยการ') || myName === g_SchoolInfo.directorName || (dep1 && myName === dep1) || (dep2 && myName === dep2);

    trackBody.innerHTML = g_LeaveLogs.map(l => {
      const isPermit = (l.LeaveType && l.LeaveType.includes('3 ชม.'));
      const thaiDateRange = formatThaiRangeDisplay(l.StartDate, l.EndDate, isPermit, l.StartTime, l.EndTime);
      const durTxt = isPermit ? `${escapeHtml(l.TotalHours)} ชม.` : `${escapeHtml(l.TotalDays)} วัน`;

      const hrDone = (l.Step1_HR && l.Step1_HR !== 'รอดำเนินการ');
      const acadDone = (l.Step2_Academic && l.Step2_Academic !== 'รอดำเนินการ');
      const dirDone = (l.Step3_Director && l.Step3_Director !== 'รอดำเนินการ') || l.Status === 'อนุมัติ';
      const all3Approved = (hrDone && acadDone && dirDone);

      const checkSvg = '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
      const clockSvg = '<svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>';
      const checkDarkSvg = '<svg class="ui-ico-sm" style="color:#000;" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
      const lockSvg = '<svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
      const printSvg = '<svg class="ui-ico" viewBox="0 0 24 24"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>';

      let btnHR = hrDone
        ? (isHRHead ? `<button type="button" class="btn-table-action delete" onclick="toggleApprovalStep('${escapeHtml(l.LeaveID)}', 'HR', 'UNAPPROVE')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>ยกเลิก</span></button>` : `<span style="color:var(--steam-green); font-weight:bold; font-size:12px; display:inline-flex; align-items:center; gap:8px;">${checkSvg}<span>อนุมัติแล้ว</span></span>`)
        : (isHRHead ? `<button type="button" class="btn-table-action save" onclick="toggleApprovalStep('${escapeHtml(l.LeaveID)}', 'HR', 'APPROVE')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>อนุมัติ</span></button>` : `<span style="color:var(--text-muted); font-size:11.5px;">รออนุมัติ</span>`);

      let btnAcad = acadDone
        ? (isAcadHead ? `<button type="button" class="btn-table-action delete" onclick="toggleApprovalStep('${escapeHtml(l.LeaveID)}', 'ACADEMIC', 'UNAPPROVE')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>ยกเลิก</span></button>` : `<span style="color:var(--steam-green); font-weight:bold; font-size:12px; display:inline-flex; align-items:center; gap:8px;">${checkSvg}<span>อนุมัติแล้ว</span></span>`)
        : (isAcadHead ? `<button type="button" class="btn-table-action save" onclick="toggleApprovalStep('${escapeHtml(l.LeaveID)}', 'ACADEMIC', 'APPROVE')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>อนุมัติ</span></button>` : `<span style="color:var(--text-muted); font-size:11.5px;">รออนุมัติ</span>`);

      let btnDir = dirDone
        ? (isDirectorOrDeputy ? `<button type="button" class="btn-table-action delete" onclick="toggleApprovalStep('${escapeHtml(l.LeaveID)}', 'DIRECTOR', 'UNAPPROVE')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg><span>ยกเลิก</span></button>` : `<span style="color:var(--steam-green); font-weight:bold; font-size:12px; display:inline-flex; align-items:center; gap:8px;">${checkSvg}<span>อนุมัติแล้ว</span></span>`)
        : (isDirectorOrDeputy ? `<button type="button" class="btn-table-action save" onclick="toggleApprovalStep('${escapeHtml(l.LeaveID)}', 'DIRECTOR', 'APPROVE')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>อนุมัติ</span></button>` : `<span style="color:var(--text-muted); font-size:11.5px;">รออนุมัติ</span>`);

      const approval3RowsHtml = `
        <div class="approval-3rows-box">
          <div class="approval-row-item ${hrDone ? 'done' : ''}"><span class="approval-row-label">หัวหน้างานบุคคล</span>${btnHR}</div>
          <div class="approval-row-item ${acadDone ? 'done' : ''}"><span class="approval-row-label">หัวหน้างานวิชาการ</span>${btnAcad}</div>
          <div class="approval-row-item ${dirDone ? 'done' : ''}"><span class="approval-row-label">ผู้อำนวยการ</span>${btnDir}</div>
        </div>
      `;

      const printBtnHtml = all3Approved
        ? `<button class="btn-steam" style="width:auto; padding:7px 14px; font-size:12.5px; display:inline-flex; align-items:center; gap:8px;" onclick="openPrintPreview('${escapeHtml(l.LeaveID)}')">${printSvg}<span>พิมพ์เอกสาร</span></button>`
        : `<button class="btn-save-sm" style="opacity:0.45; cursor:not-allowed; display:inline-flex; align-items:center; gap:8px;" disabled>${lockSvg}<span>พิมพ์เอกสาร</span></button><div style="font-size:10.5px; color:var(--orange); margin-top:3px;">รออนุมัติให้ครบ</div>`;

      return `
        <tr>
          <td style="font-size:11.5px; color:var(--text-muted); border-bottom:none;">${escapeHtml(l.LeaveID)}</td>
          <td style="text-align:left; padding-left:10px; font-weight:bold; border-bottom:none;">${escapeHtml(l.FullName)}</td>
          <td style="border-bottom:none;">${escapeHtml(shortLeaveType(l.LeaveType))}</td>
          <td style="font-size:12.5px; color:var(--steam-cyan); font-weight:bold; border-bottom:none;">${thaiDateRange}<div style="font-size:11px; color:var(--orange);">รวม ${durTxt}</div></td>
          <td style="border-bottom:none;">${approval3RowsHtml}</td>
          <td style="border-bottom:none;">${printBtnHtml}</td>
        </tr>
        <tr class="timeline-attached-row">
          <td colspan="6">
            <div class="tl-bar-wrap">
              <div class="tl-line ${hrDone ? 'done' : ''}"></div>
              <div class="tl-node ${hrDone ? 'done' : ''}">${hrDone ? checkSvg : clockSvg}<span>หัวหน้างานบุคคล</span></div>
              <div class="tl-line ${acadDone ? 'done' : ''}"></div>
              <div class="tl-node ${acadDone ? 'done' : ''}">${acadDone ? checkSvg : clockSvg}<span>หัวหน้างานวิชาการ</span></div>
              <div class="tl-line ${dirDone ? 'done' : ''}"></div>
              <div class="tl-node ${dirDone ? 'done' : ''}">${dirDone ? checkSvg : clockSvg}<span>ผู้อำนวยการ</span></div>
              <div class="tl-final-badge ${all3Approved ? 'done' : ''}">${all3Approved ? checkDarkSvg : clockSvg}<span>${all3Approved ? 'อนุมัติแล้ว' : 'รออนุมัติ'}</span></div>
            </div>
          </td>
        </tr>
      `;
    }).join('');
  }

  function openPrintPreview(leaveId) {
    startLoadingBar('Preparing Leave Form...');
    google.script.run
      .withSuccessHandler(htmlContent => {
        stopLoadingBar(() => {
          const printBox = document.getElementById('officialPrintContainer');
          if (printBox) {
            printBox.innerHTML = htmlContent;
            window.print();
          }
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .getOfficialLeaveFormPrintHtml(leaveId);
  }

  // เชื่อมต่อ Event Bus เพื่ออัปเดตตารางติดตามคำร้องแบบ Real-time
  if (window.LeaveBus && typeof window.LeaveBus.on === 'function') {
    window.LeaveBus.on('LEAVE_UPDATED', function() {
      const viewTracking = document.getElementById('view_tracking');
      if (viewTracking && viewTracking.style.display !== 'none') {
        renderTrackingStepByStepTable();
      }
    });
  }
</script>
