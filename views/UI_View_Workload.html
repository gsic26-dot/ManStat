<!-- VIEW: ภาระงานของบุคลากร (ปรับปรุงใหม่ตามแบบที่ 1A) -->
<div id="view_workload" class="main-view" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:12px; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
    <div>
      <h3 style="color:var(--steam-green); margin:0; font-size:17px; display:flex; align-items:center; gap: 8px;">
        <svg class="ui-ico-lg" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg><span>ภาระงานของบุคลากร</span>
      </h3>
      <div style="color:var(--text-muted); font-size:12.5px; margin-top:3px;">
        ตรวจสอบและบริหารภาระงาน 4 หมวด: งานสอนและการจัดการเรียนรู้ งานบริหารและงานประจำฝ่าย งานโครงการพิเศษ และงานดูแลช่วยเหลือนักเรียนและเวรปฏิบัติหน้าที่
      </div>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button type="button" id="btnAdminAddWorkload" class="btn-circle-glow glow-green" onclick="openWorkloadModal(null)" title="มอบหมายภาระงาน" aria-label="มอบหมายภาระงาน" style="display:none;">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </button>
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <!-- 1. STAT SUMMARY CARDS (4 Compact Pills สไตล์ Dashboard ทะเบียนประวัติ) -->
  <div class="compact-stat-strip" style="grid-template-columns: repeat(4, 1fr); margin-bottom:12px;">
    <div class="compact-stat-pill" style="border-left: 3px solid var(--steam-cyan); cursor:pointer;" onclick="setWorkloadTierFilter('ALL')">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>บุคลากรทั้งหมด</span>
      </span>
      <span class="stat-val" style="color:#fff;" id="wlTotalStaffCount">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid #66c0f4; cursor:pointer;" onclick="setWorkloadTierFilter('AVAIL')">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:#66c0f4;" viewBox="0 0 24 24"><path d="M14 9.536V7a4 4 0 0 1 4-4h1.5a.5.5 0 0 1 .5.5V5a4 4 0 0 1-4 4 4 4 0 0 0-4 4c0 2 1 3 1 5a5 5 0 0 1-1 3"/><path d="M4 9a5 5 0 0 1 8 4 5 5 0 0 1-8-4"/><path d="M5 21h14"/></svg><span>รับงานเพิ่มได้ ระดับ 1-3</span>
      </span>
      <span class="stat-val" style="color:#66c0f4;" id="wlTierAvailCount">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid var(--steam-green); cursor:pointer;" onclick="setWorkloadTierFilter('BAL')">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg><span>ภาระงานสมดุล ระดับ 4-6</span>
      </span>
      <span class="stat-val" style="color:var(--steam-green);" id="wlTierBalancedCount">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid var(--orange); cursor:pointer;" onclick="setWorkloadTierFilter('HIGH')">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M12 3q1 4 4 6.5t3 5.5a1 1 0 0 1-14 0 5 5 0 0 1 1-3 1 1 0 0 0 5 0c0-2-1.5-3-1.5-5q0-2 2.5-4"/></svg><span>ภาระงานสูง ระดับ 7-10</span>
      </span>
      <span class="stat-val" style="color:var(--orange);" id="wlTierHeavyCount">0</span>
    </div>
  </div>
  <span id="wlTotalTasksCount" style="display:none;">0</span>

  <!-- 2. SUB VIEW TABS -->
  <div class="g-segmented-btn-group" style="margin-bottom:14px;">
    <button type="button" class="g-seg-btn active" id="btnWlTab_personnel" onclick="switchWorkloadViewTab('PERSONNEL')">
      <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>รายชื่อบุคลากรและภาระงาน</span>
    </button>
    <button type="button" class="g-seg-btn" id="btnWlTab_levels" onclick="switchWorkloadViewTab('LEVELS')">
      <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
      <span>จำแนกตามระดับภาระงาน</span>
    </button>
  </div>

  <!-- 3. CLEAN 4-COLUMN FILTER BAR -->
  <div class="emp-filter-bar" style="grid-template-columns: 1.5fr 1fr 1.1fr auto; margin-bottom:12px;">
    <input type="text" id="wlSearchInput" class="steam-input" placeholder="ค้นหาชื่อ-นามสกุล, รหัสบุคลากร หรือชื่องาน..." oninput="filterStaffWorkloadList()">
    <select id="wlFilterTier" class="steam-input" onchange="filterStaffWorkloadList()">
      <option value="ALL">ระดับภาระงาน: ทั้งหมด</option>
      <option value="AVAIL">รับงานเพิ่มได้ (ระดับ 1-3)</option>
      <option value="BAL">สมดุล (ระดับ 4-6)</option>
      <option value="HIGH">ภาระงานสูง (ระดับ 7-8)</option>
      <option value="HEAVY">หนาแน่นมาก (ระดับ 9-10)</option>
    </select>
    <select id="wlFilterDept" class="steam-input" onchange="filterStaffWorkloadList()">
      <option value="ALL">ฝ่ายงาน / กลุ่มสาระ: ทั้งหมด</option>
    </select>
    <button type="button" class="btn-steam-secondary" style="height:34px;" onclick="resetWorkloadFilters()"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span>ล้างตัวกรอง</span></button>
  </div>

  <div id="staffWorkloadRibbonContainer" style="display:flex; flex-direction:column; gap:5px;"></div>
</div>
