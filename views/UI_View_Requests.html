<!-- VIEW: รายการคำร้อง -->
<div id="view_requests" class="main-view" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:10px; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
    <div>
      <h3 style="color:var(--orange); margin:0; font-size:17.5px; display:flex; align-items:center; gap:8px;">
        <svg class="ui-ico-lg" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg><span>รายการคำร้อง</span>
      </h3>
      <div style="color:var(--text-muted); font-size:12.5px; margin-top:3px;">ตรวจสอบและพิจารณาอนุมัติคำร้องขอลาของบุคลากร</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width:11%;">รหัสคำร้อง</th>
          <th style="width:18%; text-align:left; padding-left:10px;">ผู้ยื่นคำร้อง</th>
          <th style="width:14%;">ประเภท</th>
          <th style="width:18%;">ช่วงวันที่ / เวลา</th>
          <th style="width:9%;">รวมเวลา</th>
          <th style="width:18%;">ผู้สอนแทน</th>
          <th style="width:12%;">สถานะ</th>
        </tr>
      </thead>
      <tbody id="leaveLogsBody"></tbody>
    </table>
  </div>
</div>
