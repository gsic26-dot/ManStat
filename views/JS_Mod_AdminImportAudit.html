<script>
  // =========================================================
  // MODULE: ADMIN IMPORT & AUDIT (5-Sheet Excel Wizard, System Data Audit, SHA-256 Migration)
  // =========================================================
  var g_WizardParsedBundle = null;

  // =========================================================
  // 5-SHEET TEMPLATE & 5-STEP UPLOAD WIZARD
  // =========================================================
  function setWizardStepState(activeStep) {
    for (var s = 1; s <= 5; s++) {
      var el = document.getElementById('wizStepIndicator_' + s);
      if (!el) continue;
      el.classList.remove('active', 'done');
      if (s < activeStep) el.classList.add('done');
      else if (s === activeStep) el.classList.add('active');
    }
  }

  function openExcelUploadWizard() {
    g_WizardParsedBundle = null;
    setWizardStepState(1);
    var btnImp = document.getElementById('btnWizardConfirmImport');
    if (btnImp) btnImp.style.display = 'none';
    var zone = document.getElementById('wizValidationAndPreviewZone');
    if (zone) {
      zone.innerHTML = 'กรุณาเลือกไฟล์ Excel ที่กรอกข้อมูลแล้วเพื่อตรวจสอบและดูพรีวิวก่อนนำเข้า';
    }
    var fileInp = document.getElementById('wizExcelFileInput');
    if (fileInp) fileInp.value = '';
    var mod = document.getElementById('modalExcelUploadWizard');
    if (mod) mod.style.display = 'flex';
  }

  function closeExcelUploadWizard() {
    var mod = document.getElementById('modalExcelUploadWizard');
    if (mod) mod.style.display = 'none';
  }

  function downloadMultiSheetTemplate() {
    if (typeof XLSX === 'undefined') {
      steamAlert('Unable to read the selected file.', 'File Error');
      return;
    }

    const personnelSample = [
      {
        "EmpID": "TCH-001",
        "PositionNo": "10001",
        "สมาชิกประเภทสามัญ เลขที่": "6510001234",
        "Name": "นางสาวสมหญิง ใจงาม",
        "BirthDate": "1985-10-15",
        "Role": "ครูชำนาญการพิเศษ",
        "Division": "เจ้าหน้าที่ฝ่ายบริหารวิชาการ, งานวัดผลและประเมินผล / ทะเบียนนักเรียน",
        "Department": "สังคมศึกษา ศาสนาและวัฒนธรรม",
        "Class_Level": "ประถมศึกษาปีที่ 1",
        "StartDate": "2015-05-16",
        "Email": "somying@school.ac.th",
        "Phone": "0812345678",
        "Access_Level": "User"
      },
      {
        "EmpID": "TCH-002",
        "PositionNo": "10002",
        "สมาชิกประเภทสามัญ เลขที่": "6510005678",
        "Name": "นายสมชาย รักเรียน",
        "BirthDate": "1990-04-20",
        "Role": "ครู",
        "Division": "เจ้าหน้าที่ฝ่ายบริหารงานบุคคล",
        "Department": "วิทยาศาสตร์และเทคโนโลยี",
        "Class_Level": "ประถมศึกษาปีที่ 4",
        "StartDate": "2018-11-01",
        "Email": "somchai@school.ac.th",
        "Phone": "0898765432",
        "Access_Level": "User"
      }
    ];

    const eduSample = [
      { "EmpID": "TCH-001", "DegreeLevel": "ปริญญาตรี", "DegreeShort": "ค.บ.", "Major": "สังคมศึกษา", "Institute": "มหาวิทยาลัยราชภัฏนครราชสีมา", "GradYear": "2551" },
      { "EmpID": "TCH-002", "DegreeLevel": "ปริญญาตรี", "DegreeShort": "วท.บ.", "Major": "วิทยาศาสตร์ทั่วไป", "Institute": "มหาวิทยาลัยขอนแก่น", "GradYear": "2556" }
    ];

    const standingSample = [
      { "EmpID": "TCH-001", "StandingLevel": "บรรจุครูผู้ช่วย", "EffectiveDate": "2015-05-16", "OrderNumber": "สพป.นม.3 ที่ 120/2558" },
      { "EmpID": "TCH-001", "StandingLevel": "ครูชำนาญการพิเศษ", "EffectiveDate": "2022-10-01", "OrderNumber": "สพป.นม.3 ที่ 412/2565" },
      { "EmpID": "TCH-002", "StandingLevel": "บรรจุครูผู้ช่วย", "EffectiveDate": "2018-11-01", "OrderNumber": "สพป.นม.3 ที่ 305/2561" }
    ];

    const scoutSample = [
      { "EmpID": "TCH-001", "ScoutQualification": "A.T.C.", "ScoutType": "ลูกเสือสามัญ", "CertNumber": "นม.1045/2562", "ApprovedDate": "2019-04-10" },
      { "EmpID": "TCH-002", "ScoutQualification": "B.T.C.", "ScoutType": "ลูกเสือสำรอง", "CertNumber": "นม.2099/2564", "ApprovedDate": "2021-05-12" }
    ];

    const licenseSample = [
      { "EmpID": "TCH-001", "LicenseType": "B License (ใบอนุญาตประกอบวิชาชีพครู ชั้นต้น)", "LicenseNumber": "6520112000111", "IssueDate": "2023-06-01", "ExpiryDate": "2028-05-31" },
      { "EmpID": "TCH-002", "LicenseType": "B License (ใบอนุญาตประกอบวิชาชีพครู ชั้นต้น)", "LicenseNumber": "6520112000222", "IssueDate": "2024-01-15", "ExpiryDate": "2029-01-14" }
    ];

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(personnelSample), "Personnel");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(eduSample), "Education");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(standingSample), "Standing");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(scoutSample), "Scout");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(licenseSample), "License");

    XLSX.writeFile(wb, "ManStat_Import_Template.xlsx");
    setWizardStepState(2);
  }

  function downloadTeacherExcelTemplate() {
    downloadMultiSheetTemplate();
  }

  function handleWizardExcelFileSelect(event) {
    let file = event.target.files[0];
    if (!file) return;
    setWizardStepState(3);

    let reader = new FileReader();
    reader.onload = function(e) {
      try {
        let data = new Uint8Array(e.target.result);
        let workbook = XLSX.read(data, { type: 'array' });

        let bundle = {
          Personnel: [],
          Education: [],
          Standing: [],
          Scout: [],
          License: []
        };

        workbook.SheetNames.forEach(sName => {
          let rows = XLSX.utils.sheet_to_json(workbook.Sheets[sName]);
          let cleanName = sName.trim().toLowerCase();
          if (cleanName === 'personnel' || cleanName === 'รายชื่อบุคลากร' || cleanName === 'teachers') {
            bundle.Personnel = rows;
          } else if (cleanName === 'education') {
            bundle.Education = rows;
          } else if (cleanName === 'standing') {
            bundle.Standing = rows;
          } else if (cleanName === 'scout') {
            bundle.Scout = rows;
          } else if (cleanName === 'license' || cleanName === 'licenses') {
            bundle.License = rows;
          }
        });

        if (workbook.SheetNames.length === 1 && bundle.Personnel.length === 0) {
          bundle.Personnel = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]]);
        }

        let warnings = [];
        bundle.Personnel.forEach((p, idx) => {
          let email = p.Email || p['อีเมล'] || '';
          if (email && !isValidEmailFormat(email)) {
            warnings.push(`Personnel แถวที่ ${idx + 1}: รูปแบบ Email ไม่ถูกต้อง (${email})`);
          }
        });

        g_WizardParsedBundle = bundle;
        setWizardStepState(4);

        const zone = document.getElementById('wizValidationAndPreviewZone');
        const btnImp = document.getElementById('btnWizardConfirmImport');
        if (btnImp) btnImp.style.display = 'inline-flex';

        let warnHtml = warnings.length > 0
          ? `<div style="color:var(--orange); margin-top:6px;">แจ้งเตือนการตรวจสอบ (${warnings.length} รายการ):<br>• ${warnings.map(escapeHtml).join('<br>• ')}</div>`
          : `<div style="color:var(--steam-green); font-weight:bold; margin-top:6px; display:flex; align-items:center; gap:10px;">${ADM_SVG.check}<span>ผ่านการตรวจสอบโครงสร้างข้อมูล (Validation Passed)</span></div>`;

        if (zone) {
          zone.innerHTML = `
            <div style="color:#fff; font-weight:bold; margin-bottom:6px;">ผลลัพธ์การตรวจสอบและพรีวิวข้อมูลก่อนนำเข้า:</div>
            <div style="display:grid; grid-template-columns: repeat(5, 1fr); gap:10px; text-align:center; margin-bottom:8px;">
              <div style="background:#101822; border:1px solid var(--steam-cyan); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Personnel</div>
                <div style="font-size:16px; font-weight:bold; color:#fff;">${bundle.Personnel.length}</div>
              </div>
              <div style="background:#101822; border:1px solid var(--steam-green); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Education</div>
                <div style="font-size:16px; font-weight:bold; color:var(--steam-green);">${bundle.Education.length}</div>
              </div>
              <div style="background:#101822; border:1px solid var(--steam-cyan); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Standing</div>
                <div style="font-size:16px; font-weight:bold; color:var(--steam-cyan);">${bundle.Standing.length}</div>
              </div>
              <div style="background:#101822; border:1px solid var(--orange); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">Scout</div>
                <div style="font-size:16px; font-weight:bold; color:var(--orange);">${bundle.Scout.length}</div>
              </div>
              <div style="background:#101822; border:1px solid var(--steam-green); padding:8px; border-radius:4px;">
                <div style="font-size:11px; color:var(--text-muted);">License</div>
                <div style="font-size:16px; font-weight:bold; color:var(--steam-green);">${bundle.License.length}</div>
              </div>
            </div>
            ${warnHtml}
          `;
        }
      } catch (err) {
        steamAlert('The file format is not supported.', 'Invalid File');
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function executeWizardFinalImport() {
    if (!g_WizardParsedBundle) return;
    setWizardStepState(5);
    startLoadingBar('Importing Data...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          closeExcelUploadWizard();
          steamAlert('Changes saved successfully.', 'Success');
          refreshAdminData();
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .importMultiSheetBundleJSON(g_WizardParsedBundle);
  }

  function handleTeacherExcelUpload(event) {
    openExcelUploadWizard();
    handleWizardExcelFileSelect(event);
  }

  // =========================================================
  // SYSTEM DATA AUDIT & SHA-256 MIGRATION
  // =========================================================
  function triggerSystemDataAudit() {
    startLoadingBar('Auditing Database...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          if (!res || res.status !== 'success') {
            steamAlert('Unable to audit database schema.', 'Audit Failed');
            return;
          }
          let html = `
            <div>• <b>จำนวนบุคลากรทั้งหมด:</b> ${res.totalTeachers} คน</div>
            <div>• <b>รหัสบุคลากรซ้ำ (Duplicate ID):</b> ${res.duplicateIds.length === 0 ? '<span style="color:var(--steam-green);">ไม่พบ</span>' : '<span style="color:var(--red);">' + escapeHtml(res.duplicateIds.join(', ')) + '</span>'}</div>
            <div>• <b>บัญชีที่ยังไม่ได้ระบุ Email หรือผิดรูปแบบ:</b> ${res.missingEmails.length === 0 ? '<span style="color:var(--steam-green);">ครบถ้วนทุกรายการ</span>' : '<span style="color:var(--orange);">' + res.missingEmails.length + ' รายการ</span>'}</div>
            <div>• <b>รหัสผ่านที่ยังไม่ได้เข้ารหัส SHA-256:</b> ${res.unhashedPasswordsCount === 0 ? '<span style="color:var(--steam-green);">เข้ารหัส SHA-256 ครบ 100%</span>' : '<span style="color:var(--orange);">' + res.unhashedPasswordsCount + ' บัญชี (กดปุ่ม เข้ารหัสผ่าน เพื่อแปลงทันที)</span>'}</div>
            <div>• <b>วันที่ผิดปกติ (เช่น ปี 3102):</b> ${res.invalidDates.length === 0 ? '<span style="color:var(--steam-green);">ไม่พบ</span>' : '<span style="color:var(--orange);">พบ ' + res.invalidDates.length + ' จุด (ระบบซ่อมแซมการแสดงผลอัตโนมัติแล้ว)</span>'}</div>
          `;
          steamAlert(html, 'Database Audit');
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .runSystemDataAudit();
  }

  function triggerSHA256Migration() {
    steamConfirm('Are you sure you want to hash all passwords to SHA-256?', () => {
      startLoadingBar('Hashing Passwords...');
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert('Changes saved successfully.', 'Success');
            refreshAdminData();
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
        .migrateAllPasswordsToSHA256('Superuser');
    });
  }

</script>
