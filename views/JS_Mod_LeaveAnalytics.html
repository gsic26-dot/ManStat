<script>
// =========================================================================
// MODULE: EXECUTIVE ANALYTICS CONTROLLER (JS_Mod_LeaveAnalytics.html)
// ยกเครื่องใหม่ 100% - เบา เร็ว ไร้บัค ประมวลผลแบบ Real-time ทันที
// =========================================================================

var _anaMonthlyChartInstance = null;
var _anaDonutChartInstance = null;
var _anaRetireChartInstance = null;
var _anaRetireDataByYear = {};

function _anaEscapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function _anaParseDate(raw) {
  if (!raw) return null;
  if (Object.prototype.toString.call(raw) === '[object Date]') {
    return isNaN(raw.getTime()) ? null : raw;
  }
  var s = String(raw).trim().split(' ')[0];
  if (s.indexOf('-') !== -1) {
    var p = s.split('-');
    if (p.length === 3) {
      var y = parseInt(p[0], 10);
      if (y > 2400) y -= 543;
      var d = new Date(y, parseInt(p[1], 10) - 1, parseInt(p[2], 10));
      return isNaN(d.getTime()) ? null : d;
    }
  } else if (s.indexOf('/') !== -1) {
    var p2 = s.split('/');
    if (p2.length === 3) {
      var y2 = parseInt(p2[2], 10);
      if (y2 > 2400) y2 -= 543;
      var d2 = new Date(y2, parseInt(p2[1], 10) - 1, parseInt(p2[0], 10));
      return isNaN(d2.getTime()) ? null : d2;
    }
  }
  return null;
}

function _anaDateToNum(raw) {
  var d = _anaParseDate(raw);
  if (!d) return 0;
  return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
}

function _anaGetPeriodBounds(periodMode, yearBE) {
  var yBE = parseInt(yearBE, 10) || 2570;
  var yCE = yBE - 543;
  var prevYCE = yCE - 1;
  var prevYBE = yBE - 1;
  var mode = String(periodMode || 'FULL').toUpperCase();

  if (mode === 'PERIOD_1') {
    return {
      startNum: prevYCE * 10000 + 1001,
      endNum: yCE * 10000 + 331,
      label: 'รอบที่ 1 (1 ต.ค. ' + prevYBE + ' – 31 มี.ค. ' + yBE + ')',
      months: [
        { key: prevYCE + '-10', label: 'ต.ค.', monthNum: 10, yearCE: prevYCE },
        { key: prevYCE + '-11', label: 'พ.ย.', monthNum: 11, yearCE: prevYCE },
        { key: prevYCE + '-12', label: 'ธ.ค.', monthNum: 12, yearCE: prevYCE },
        { key: yCE + '-01', label: 'ม.ค.', monthNum: 1, yearCE: yCE },
        { key: yCE + '-02', label: 'ก.พ.', monthNum: 2, yearCE: yCE },
        { key: yCE + '-03', label: 'มี.ค.', monthNum: 3, yearCE: yCE }
      ]
    };
  } else if (mode === 'PERIOD_2') {
    return {
      startNum: yCE * 10000 + 401,
      endNum: yCE * 10000 + 930,
      label: 'รอบที่ 2 (1 เม.ย. ' + yBE + ' – 30 ก.ย. ' + yBE + ')',
      months: [
        { key: yCE + '-04', label: 'เม.ย.', monthNum: 4, yearCE: yCE },
        { key: yCE + '-05', label: 'พ.ค.', monthNum: 5, yearCE: yCE },
        { key: yCE + '-06', label: 'มิ.ย.', monthNum: 6, yearCE: yCE },
        { key: yCE + '-07', label: 'ก.ค.', monthNum: 7, yearCE: yCE },
        { key: yCE + '-08', label: 'ส.ค.', monthNum: 8, yearCE: yCE },
        { key: yCE + '-09', label: 'ก.ย.', monthNum: 9, yearCE: yCE }
      ]
    };
  }
  return {
    startNum: prevYCE * 10000 + 1001,
    endNum: yCE * 10000 + 930,
    label: 'ทั้งปีงบประมาณ ' + yBE + ' (1 ต.ค. ' + prevYBE + ' – 30 ก.ย. ' + yBE + ')',
    months: [
      { key: prevYCE + '-10', label: 'ต.ค.', monthNum: 10, yearCE: prevYCE },
      { key: prevYCE + '-11', label: 'พ.ย.', monthNum: 11, yearCE: prevYCE },
      { key: prevYCE + '-12', label: 'ธ.ค.', monthNum: 12, yearCE: prevYCE },
      { key: yCE + '-01', label: 'ม.ค.', monthNum: 1, yearCE: yCE },
      { key: yCE + '-02', label: 'ก.พ.', monthNum: 2, yearCE: yCE },
      { key: yCE + '-03', label: 'มี.ค.', monthNum: 3, yearCE: yCE },
      { key: yCE + '-04', label: 'เม.ย.', monthNum: 4, yearCE: yCE },
      { key: yCE + '-05', label: 'พ.ค.', monthNum: 5, yearCE: yCE },
      { key: yCE + '-06', label: 'มิ.ย.', monthNum: 6, yearCE: yCE },
      { key: yCE + '-07', label: 'ก.ค.', monthNum: 7, yearCE: yCE },
      { key: yCE + '-08', label: 'ส.ค.', monthNum: 8, yearCE: yCE },
      { key: yCE + '-09', label: 'ก.ย.', monthNum: 9, yearCE: yCE }
    ]
  };
}

function MOD_Analytics_initView() {
  var selYear = document.getElementById('ana_fiscalYearSelect');
  var selPeriod = document.getElementById('ana_periodSelect');

  // ตั้งค่าปีงบประมาณอัตโนมัติ
  var curYearBE = 2570;
  var curMode = 'PERIOD_1';
  if (window.g_FiscalData && window.g_FiscalData.active) {
    curYearBE = parseInt(window.g_FiscalData.active.yearBE, 10) || 2570;
    curMode = window.g_FiscalData.active.ActivePeriodMode || 'PERIOD_1';
  } else {
    var now = new Date();
    var nowM = now.getMonth() + 1;
    var nowYBE = now.getFullYear() + 543;
    if (nowM >= 4 && nowM <= 9) {
      curYearBE = nowYBE + 1;
      curMode = 'PERIOD_1';
    } else if (nowM >= 10) {
      curYearBE = nowYBE + 1;
      curMode = 'PERIOD_2';
    } else {
      curYearBE = nowYBE;
      curMode = 'PERIOD_2';
    }
  }

  if (selYear) {
    selYear.innerHTML = '';
    var availableYears = [];
    if (window.g_FiscalData && Array.isArray(window.g_FiscalData.list) && window.g_FiscalData.list.length > 0) {
      window.g_FiscalData.list.forEach(function(item) {
        if (item && item.yearBE) {
          var num = parseInt(item.yearBE, 10);
          if (num && availableYears.indexOf(num) === -1) availableYears.push(num);
        }
      });
    } else if (window.g_FiscalData && Array.isArray(window.g_FiscalData.years) && window.g_FiscalData.years.length > 0) {
      window.g_FiscalData.years.forEach(function(y) {
        var num = parseInt(y, 10);
        if (num && availableYears.indexOf(num) === -1) availableYears.push(num);
      });
    }
    if (availableYears.length === 0) {
      availableYears.push(curYearBE);
    }
    availableYears.sort(function(a, b) { return b - a; });

    availableYears.forEach(function(y) {
      var opt = document.createElement('option');
      opt.value = y;
      opt.textContent = 'ปีงบประมาณ ' + y;
      if (y === curYearBE) opt.selected = true;
      selYear.appendChild(opt);
    });
    if (!selYear.value && availableYears.length > 0) {
      selYear.value = availableYears[0];
    }
  }

  if (selPeriod) {
    selPeriod.value = curMode;
  }

  // เรนเดอร์ทันทีด้วยข้อมูลใน Memory (0 latency)
  renderAnalyticsDashboard();

  // ดึงข้อมูลแบ็กเอนด์มาอัปเดตแบบเบื้องหลัง (Background sync)
  if (typeof google !== 'undefined' && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.status === 'success') {
          if (res.staffList && Array.isArray(res.staffList)) window.g_UsersSummary = res.staffList;
          if (res.leaveLogs && Array.isArray(res.leaveLogs)) window.g_LeaveLogs = res.leaveLogs;
          renderAnalyticsDashboard();
        }
      })
      .withFailureHandler(function(err) {
        console.warn('MOD_Analytics_fetchDirectData background sync failed:', err);
      })
      .MOD_Analytics_fetchDirectData(false);
  }
}

function onAnalyticsFilterChange() {
  renderAnalyticsDashboard();
}

function renderAnalyticsDashboard() {
  var selYear = document.getElementById('ana_fiscalYearSelect');
  var selPeriod = document.getElementById('ana_periodSelect');
  var yBE = selYear ? parseInt(selYear.value, 10) : 2570;
  var mode = selPeriod ? selPeriod.value : 'PERIOD_1';
  var bounds = _anaGetPeriodBounds(mode, yBE);

  // อัปเดต Subtitle
  var lblDesc = document.getElementById('lblAnalyticsActivePeriodDesc');
  if (lblDesc) {
    lblDesc.textContent = 'ปีงบประมาณ พ.ศ. ' + yBE + ' • ' + bounds.label;
  }
  var lblMonthlyBadge = document.getElementById('ana_lblMonthlyTrendBadge');
  if (lblMonthlyBadge) {
    lblMonthlyBadge.textContent = bounds.label;
  }

  // 1. ดึงข้อมูลบุคลากรและรายการลา
  var staff = Array.isArray(window.g_UsersSummary) ? window.g_UsersSummary : [];
  var activeStaff = staff.filter(function(u) { return u.status !== 'ย้าย/เกษียณ'; });
  var totalStaff = activeStaff.length;

  var countExe = 0, countTch = 0, countStf = 0;
  activeStaff.forEach(function(u) {
    var p = String(u.Position || u.role || '');
    var t = String(u.empType || u.EmpType || '');
    if (p.indexOf('ผู้อำนวยการ') !== -1) countExe++;
    else if (t.indexOf('สนับสนุน') !== -1 || t.indexOf('ลูกจ้าง') !== -1 || p.indexOf('ลูกจ้าง') !== -1 || p.indexOf('ธุรการ') !== -1) countStf++;
    else countTch++;
  });

  // อัปเดต KPI Card 1: บุคลากร
  var elTot = document.getElementById('analyticsKpi_totalStaff');
  var elTotSub = document.getElementById('analyticsKpi_subStaff');
  if (elTot) elTot.innerHTML = totalStaff + ' <span class="unit">คน</span>';
  if (elTotSub) elTotSub.textContent = 'ผอ. ' + countExe + ' • ครูผู้สอน ' + countTch + ' • สนับสนุน/ลูกจ้าง ' + countStf;

  // 2. ประมวลผล Leave Logs ตามช่วงเวลา bounds
  var allLogs = Array.isArray(window.g_LeaveLogs) ? window.g_LeaveLogs : [];
  var pendingCount = 0;
  var sickCount = 0, personalCount = 0, permitCount = 0, otherCount = 0;
  var sumSickDays = 0, sumPersonalDays = 0;

  var userDaysMap = {}; // empId -> { name, role, sickDays, personalDays, totalDays }
  activeStaff.forEach(function(u) {
    var uId = String(u.EmpID || u.id || '').trim();
    userDaysMap[uId] = {
      name: u.FullName || u.name || '-',
      role: u.Position || u.role || 'ครู',
      sickDays: 0,
      personalDays: 0,
      totalDays: 0
    };
  });

  // ข้อมูลสถิติรายเดือนสำหรับกราฟแนวโน้ม
  var monthlyMap = {}; // key: "YYYY-MM" -> { sick: 0, personal: 0, total: 0 }
  bounds.months.forEach(function(m) {
    monthlyMap[m.key] = { sick: 0, personal: 0, total: 0 };
  });

  allLogs.forEach(function(l) {
    var st = String(l.Status || '').trim();
    if (st === 'รอดำเนินการ' || st.indexOf('รอ') !== -1) {
      pendingCount++;
    }

    var startNum = _anaDateToNum(l.StartDate);
    if (startNum >= bounds.startNum && startNum <= bounds.endNum) {
      if (st.indexOf('อนุมัติ') !== -1 || st === 'ผ่าน' || st === 'เสร็จสิ้น') {
        var lt = String(l.LeaveType || '');
        var days = parseFloat(l.TotalDays) || 1;
        var uId = String(l.EmpID || l.id || '').trim();

        // Month key
        var dObj = _anaParseDate(l.StartDate);
        var mKey = dObj ? (dObj.getFullYear() + '-' + String(dObj.getMonth() + 1).padStart(2, '0')) : '';

        if (lt.indexOf('ลาป่วย') !== -1) {
          sickCount++;
          sumSickDays += days;
          if (userDaysMap[uId]) {
            userDaysMap[uId].sickDays += days;
            userDaysMap[uId].sickCount = (userDaysMap[uId].sickCount || 0) + 1;
          }
          if (monthlyMap[mKey]) { monthlyMap[mKey].sick += days; monthlyMap[mKey].total += days; }
        } else if (lt.indexOf('ลากิจ') !== -1) {
          personalCount++;
          sumPersonalDays += days;
          if (userDaysMap[uId]) {
            userDaysMap[uId].personalDays += days;
            userDaysMap[uId].personalCount = (userDaysMap[uId].personalCount || 0) + 1;
          }
          if (monthlyMap[mKey]) { monthlyMap[mKey].personal += days; monthlyMap[mKey].total += days; }
        } else if (lt.indexOf('3 ชม.') !== -1 || lt.indexOf('ขออนุญาต') !== -1) {
          permitCount++;
        } else {
          otherCount++;
        }
      }
    }
  });

  // อัปเดต KPI Card 2: คำร้องรอดำเนินการ
  var elPend = document.getElementById('analyticsKpi_pending');
  var elPendSub = document.getElementById('analyticsKpi_subPending');
  if (elPend) elPend.innerHTML = pendingCount + ' <span class="unit">รายการ</span>';
  if (elPendSub) {
    if (pendingCount === 0) {
      elPendSub.textContent = 'อนุมัติครบทุกรายการแล้ว ไม่มีงานคั่งค้าง';
      elPendSub.style.color = 'var(--steam-green)';
    } else {
      elPendSub.textContent = 'รอผู้อำนวยการ/ผู้ตรวจลงนาม ' + pendingCount + ' รายการ';
      elPendSub.style.color = 'var(--steam-orange)';
    }
  }

  // อัปเดต KPI Card 3: วันลาเฉลี่ย
  var totalLeaveDays = sumSickDays + sumPersonalDays;
  var avgDays = totalStaff > 0 ? (totalLeaveDays / totalStaff).toFixed(1) : '0';
  var elAvg = document.getElementById('analyticsKpi_avgLeave');
  var elAvgSub = document.getElementById('analyticsKpi_subLeave');
  if (elAvg) elAvg.innerHTML = avgDays + ' <span class="unit">วัน/คน</span>';
  if (elAvgSub) elAvgSub.textContent = 'ป่วย ' + sumSickDays + ' วัน • กิจ ' + sumPersonalDays + ' วัน (ในเกณฑ์ปกติ)';

  // 3. ข้อมูลเกษียณอายุราชการ
  var today = new Date();
  var curCE = today.getFullYear();
  var curBE = curCE + 543;
  var retire1Y = 0, retire3Y = 0;
  _anaRetireDataByYear = {};
  for (var y = curBE; y <= curBE + 20; y++) {
    _anaRetireDataByYear[String(y)] = [];
  }

  activeStaff.forEach(function(u) {
    var rawB = u.BirthDate || u.birthDate || u.RawBirthDate || '';
    var bDate = _anaParseDate(rawB);
    if (bDate) {
      var bYearCE = bDate.getFullYear();
      var bMonth = bDate.getMonth() + 1;
      var bDay = bDate.getDate();
      var retCE = bYearCE + 60;
      if (bMonth > 10 || (bMonth === 10 && bDay > 1)) retCE += 1;
      var retBE = retCE + 543;
      var diffY = retBE - curBE;
      if (diffY >= 0 && diffY <= 1) retire1Y++;
      if (diffY >= 0 && diffY <= 3) retire3Y++;

      var retKey = String(retBE);
      if (_anaRetireDataByYear[retKey]) {
        _anaRetireDataByYear[retKey].push({
          name: u.FullName || u.name,
          role: u.Position || u.role,
          retYear: retBE,
          remainYears: diffY
        });
      }
    }
  });

  // อัปเดต KPI Card 4: เกษียณอายุ
  var elRet = document.getElementById('analyticsKpi_retireSoon');
  var elRetSub = document.getElementById('analyticsKpi_subRetire');
  if (elRet) elRet.innerHTML = retire3Y + ' <span class="unit">คน</span>';
  if (elRetSub) elRetSub.textContent = 'ภายใน 1 ปี (' + retire1Y + ' คน) • ภายใน 3 ปี (' + retire3Y + ' คน)';

  // 4. เรนเดอร์ Top 5 ตารางผู้ลาสูงสุด (ว15/2561)
  Object.keys(userDaysMap).forEach(function(id) {
    userDaysMap[id].totalDays = userDaysMap[id].sickDays + userDaysMap[id].personalDays;
    userDaysMap[id].totalCount = (userDaysMap[id].sickCount || 0) + (userDaysMap[id].personalCount || 0);
  });
  var sortedUsers = Object.keys(userDaysMap).map(function(id) { return userDaysMap[id]; })
    .filter(function(u) { return u.role.indexOf('ผู้อำนวยการ') === -1; })
    .sort(function(a, b) { return b.totalDays - a.totalDays; })
    .slice(0, 5);

  var tbody = document.getElementById('ana_topLeaveTableBody');
  if (tbody) {
    if (sortedUsers.length === 0 || sortedUsers[0].totalDays === 0) {
      tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:20px;">ไม่พบประวัติการลาในรอบช่วงเวลานี้</td></tr>';
    } else {
      var rowsHtml = '';
      sortedUsers.forEach(function(u) {
        var statusBadge = '';
        var isExceed = (u.totalCount > 6 || u.totalDays > 23);
        var isNear = (u.totalCount >= 5 || u.totalDays > 15);
        if (isExceed) {
          statusBadge = '<span class="badge-status badge-alert" title="ตามเกณฑ์ ก.ค.ศ. ว15/2561: ลาเกิน 6 ครั้ง หรือเกิน 23 วัน/รอบ">เกินเกณฑ์ ว15</span>';
        } else if (isNear) {
          statusBadge = '<span class="badge-status badge-warn" title="เฝ้าระวัง">เฝ้าระวัง</span>';
        } else {
          statusBadge = '<span class="badge-status badge-ok">ปกติ</span>';
        }
        rowsHtml += '<tr>' +
          '<td><b>' + _anaEscapeHtml(u.name) + '</b><div style="font-size:11px; color:var(--text-muted);">' + _anaEscapeHtml(u.role) + '</div></td>' +
          '<td style="text-align:center;">' + u.sickDays + '</td>' +
          '<td style="text-align:center;">' + u.personalDays + '</td>' +
          '<td style="text-align:center; font-weight:bold; color:var(--steam-cyan);">' + u.totalDays + '</td>' +
          '<td style="text-align:center;">' + statusBadge + '</td>' +
        '</tr>';
      });
      tbody.innerHTML = rowsHtml;
    }
  }

  // 5. เรนเดอร์ Chart.js กราฟแนวโน้มรายเดือน (Monthly Trend)
  _renderMonthlyChart(bounds.months, monthlyMap);

  // 6. เรนเดอร์ Chart.js กราฟโดนัท (Donut Leave Types)
  _renderDonutChart(sickCount, personalCount, permitCount, otherCount);

  // 7. เรนเดอร์ Chart.js กราฟเกษียณอายุ (Retirement Bar)
  _renderRetireChart(_anaRetireDataByYear, curBE);
}

function _renderMonthlyChart(months, monthlyMap) {
  var canvas = document.getElementById('ana_chartMonthly');
  if (!canvas || typeof Chart === 'undefined') return;

  var labels = months.map(function(m) { return m.label; });
  var sickData = months.map(function(m) { return monthlyMap[m.key] ? monthlyMap[m.key].sick : 0; });
  var personalData = months.map(function(m) { return monthlyMap[m.key] ? monthlyMap[m.key].personal : 0; });

  if (_anaMonthlyChartInstance) {
    try { _anaMonthlyChartInstance.destroy(); } catch (e) {}
  }

  var ctx = canvas.getContext('2d');
  _anaMonthlyChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [
        {
          label: 'ลาป่วย (วัน)',
          data: sickData,
          backgroundColor: 'rgba(248, 81, 73, 0.75)',
          borderRadius: 4
        },
        {
          label: 'ลากิจ (วัน)',
          data: personalData,
          backgroundColor: 'rgba(102, 192, 244, 0.75)',
          borderRadius: 4
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: '#c7d5e0', font: { family: 'Sarabun' } }
        }
      },
      scales: {
        x: {
          ticks: { color: '#8f98a0', font: { family: 'Sarabun' } },
          grid: { color: 'rgba(42, 71, 94, 0.2)' }
        },
        y: {
          beginAtZero: true,
          ticks: { color: '#8f98a0', font: { family: 'Sarabun' }, stepSize: 1 },
          grid: { color: 'rgba(42, 71, 94, 0.2)' }
        }
      }
    }
  });
}

function _renderDonutChart(sick, personal, permit, other) {
  var canvas = document.getElementById('ana_chartDonut');
  if (!canvas || typeof Chart === 'undefined') return;

  var total = sick + personal + permit + other;
  var data = total > 0 ? [sick, personal, permit, other] : [1];
  var labels = total > 0 ? ['ลาป่วย', 'ลากิจส่วนตัว', 'ขออนุญาต 3 ชม.', 'อื่นๆ'] : ['ไม่มีการลา'];
  var colors = total > 0 ? ['#f85149', '#66c0f4', '#a4d007', '#d29922'] : ['#2a475e'];

  if (_anaDonutChartInstance) {
    try { _anaDonutChartInstance.destroy(); } catch (e) {}
  }

  var ctx = canvas.getContext('2d');
  _anaDonutChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels,
      datasets: [{
        data: data,
        backgroundColor: colors,
        borderWidth: 2,
        borderColor: '#16202d'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '68%',
      plugins: {
        legend: {
          position: 'right',
          labels: { color: '#c7d5e0', font: { family: 'Sarabun', size: 12 } }
        }
      }
    }
  });
}

function _renderRetireChart(retireDataByYear, curBE) {
  var canvas = document.getElementById('ana_chartRetire');
  if (!canvas || typeof Chart === 'undefined') return;

  var years = Object.keys(retireDataByYear).sort(function(a, b) { return parseInt(a, 10) - parseInt(b, 10); });
  var counts = years.map(function(y) { return retireDataByYear[y].length; });

  if (_anaRetireChartInstance) {
    try { _anaRetireChartInstance.destroy(); } catch (e) {}
  }

  var ctx = canvas.getContext('2d');
  _anaRetireChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: years.map(function(y) { return String(y).slice(-2); }),
      datasets: [{
        label: 'จำนวนบุคลากรเกษียณ (คน)',
        data: counts,
        backgroundColor: 'rgba(56, 139, 253, 0.75)',
        hoverBackgroundColor: 'rgba(102, 192, 244, 0.95)',
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            title: function(items) {
              if (!items || !items.length) return '';
              var idx = items[0].dataIndex;
              return 'ปี พ.ศ. ' + years[idx];
            },
            label: function(item) {
              return 'เกษียณ ' + item.parsed.y + ' คน';
            }
          }
        }
      },
      onClick: function(evt, elements) {
        if (elements && elements.length > 0) {
          var idx = elements[0].index;
          var yr = years[idx];
          showRetireDrilldown(yr);
        }
      },
      scales: {
        x: {
          ticks: { color: '#8f98a0', font: { family: 'Sarabun', size: 11 } },
          grid: { display: false }
        },
        y: {
          beginAtZero: true,
          ticks: { color: '#8f98a0', font: { family: 'Sarabun' }, stepSize: 1 },
          grid: { color: 'rgba(42, 71, 94, 0.2)' }
        }
      }
    }
  });

  // อัปเดต Summary Boxes ท้ายกราฟ
  var thisYear = retireDataByYear[String(curBE)] ? retireDataByYear[String(curBE)].length : 0;
  var in5Y = 0;
  var peakY = '-', maxC = 0;
  years.forEach(function(y) {
    var c = retireDataByYear[y].length;
    var yNum = parseInt(y, 10);
    if (yNum >= curBE && yNum <= curBE + 4) in5Y += c;
    if (c > maxC) { maxC = c; peakY = 'ปี ' + y + ' (' + c + ' คน)'; }
  });

  var elThisY = document.getElementById('statRetireThisYear');
  var elIn5Y = document.getElementById('statRetire5Years');
  var elPeak = document.getElementById('statRetirePeakYear');
  if (elThisY) elThisY.textContent = thisYear + ' คน';
  if (elIn5Y) elIn5Y.textContent = in5Y + ' คน';
  if (elPeak) elPeak.textContent = maxC > 0 ? peakY : '-';
}

function showRetireDrilldown(yr) {
  var box = document.getElementById('retireDrilldownBox');
  var title = document.getElementById('retireDrilldownTitle');
  var list = document.getElementById('retireDrilldownList');
  if (!box || !title || !list) return;

  var people = _anaRetireDataByYear[String(yr)] || [];
  title.textContent = 'รายชื่อผู้เกษียณอายุราชการในปี พ.ศ. ' + yr + ' (' + people.length + ' คน)';
  if (people.length === 0) {
    list.innerHTML = '<span style="color:var(--text-muted);">ไม่มีบุคลากรเกษียณอายุในปีนี้</span>';
  } else {
    list.innerHTML = people.map(function(p) {
      return '<div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed rgba(42,71,94,0.4);">' +
        '<span><b>' + _anaEscapeHtml(p.name) + '</b> (' + _anaEscapeHtml(p.role) + ')</span>' +
        '<span style="color:var(--steam-cyan);">' + (p.remainYears === 0 ? 'เกษียณในปีนี้' : 'อีก ' + p.remainYears + ' ปี') + '</span>' +
      '</div>';
    }).join('');
  }
  box.style.display = 'block';
}

function closeRetireDrilldown() {
  var box = document.getElementById('retireDrilldownBox');
  if (box) box.style.display = 'none';
}

function toggleRetirementView(mode) {
  var chartWrap = document.getElementById('retireChartView');
  var tblWrap = document.getElementById('retireTableView');
  var btnChart = document.getElementById('btnRetireViewChart');
  var btnTbl = document.getElementById('btnRetireViewTable');

  if (mode === 'table') {
    if (chartWrap) chartWrap.style.display = 'none';
    if (tblWrap) tblWrap.style.display = 'block';
    if (btnChart) { btnChart.style.background = 'transparent'; btnChart.style.color = '#c7d5e0'; }
    if (btnTbl) { btnTbl.style.background = 'var(--steam-cyan)'; btnTbl.style.color = '#000'; }
    _renderRetireTable();
  } else {
    if (chartWrap) chartWrap.style.display = 'block';
    if (tblWrap) tblWrap.style.display = 'none';
    if (btnChart) { btnChart.style.background = 'var(--steam-cyan)'; btnChart.style.color = '#000'; }
    if (btnTbl) { btnTbl.style.background = 'transparent'; btnTbl.style.color = '#c7d5e0'; }
  }
}

function _renderRetireTable() {
  var tbody = document.getElementById('retirementForecastBody');
  if (!tbody) return;
  var staff = Array.isArray(window.g_UsersSummary) ? window.g_UsersSummary : [];
  var active = staff.filter(function(u) { return u.status !== 'ย้าย/เกษียณ'; });
  var today = new Date();
  var curCE = today.getFullYear();
  var curBE = curCE + 543;

  var list = [];
  active.forEach(function(u) {
    var rawB = u.BirthDate || u.birthDate || u.RawBirthDate || '';
    var bDate = _anaParseDate(rawB);
    if (bDate) {
      var bYearCE = bDate.getFullYear();
      var bMonth = bDate.getMonth() + 1;
      var bDay = bDate.getDate();
      var retCE = bYearCE + 60;
      if (bMonth > 10 || (bMonth === 10 && bDay > 1)) retCE += 1;
      var retBE = retCE + 543;
      var age = curCE - bYearCE;
      if (today.getMonth() + 1 < bMonth || (today.getMonth() + 1 === bMonth && today.getDate() < bDay)) age--;

      var diffY = retBE - curBE;
      list.push({
        name: u.FullName || u.name,
        role: u.Position || u.role,
        age: age + ' ปี',
        retireDate: '30 ก.ย. ' + retBE,
        remainText: diffY <= 0 ? 'เกษียณในปีนี้' : 'อีก ' + diffY + ' ปี',
        retBE: retBE
      });
    }
  });

  list.sort(function(a, b) { return a.retBE - b.retBE; });

  if (list.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--text-muted); padding:20px;">ไม่พบข้อมูลวันเกิดของบุคลากร</td></tr>';
  } else {
    tbody.innerHTML = list.map(function(item) {
      return '<tr style="border-bottom:1px solid rgba(42,71,94,0.35); transition:background 0.2s;">' +
        '<td style="text-align:left; padding:9px 14px; font-weight:600; color:#fff;">' + _anaEscapeHtml(item.name) + '</td>' +
        '<td style="text-align:center; padding:9px 8px; color:var(--text-muted);">' + _anaEscapeHtml(item.role) + '</td>' +
        '<td style="text-align:center; padding:9px 8px;">' + item.age + '</td>' +
        '<td style="text-align:center; padding:9px 8px; color:var(--orange); font-weight:600;">' + item.retireDate + '</td>' +
        '<td style="text-align:center; padding:9px 8px; color:var(--steam-cyan); font-weight:600;">' + item.remainText + '</td>' +
      '</tr>';
    }).join('');
  }
}

// Global exports
window.MOD_Analytics_initView = MOD_Analytics_initView;
window.renderAnalyticsCharts = renderAnalyticsDashboard;
window.onAnalyticsFilterChange = onAnalyticsFilterChange;
window.showRetireDrilldown = showRetireDrilldown;
window.closeRetireDrilldown = closeRetireDrilldown;
window.toggleRetirementView = toggleRetirementView;
</script>
