<script>
  // =========================================================================
  // MODULE: REGISTRY STANDING CONTROLLER (JS_Mod_RegStanding.html)
  // แยกอิสระ 100% ควบคุมทะเบียนประวัติวิทยฐานะและคำสั่งแต่งตั้ง
  // =========================================================================

  function openPersonnelPortfolioPrint(empId, event) {
    if (event) event.stopPropagation();
    startLoadingBar('Generating Personnel Summary...');
    google.script.run
      .withSuccessHandler(html => {
        stopLoadingBar(() => {
          const bodyEl = document.getElementById('printPreviewBody');
          const offEl = document.getElementById('officialPrintContainer');
          const modEl = document.getElementById('modalPrintPreview');
          if (bodyEl) bodyEl.innerHTML = html;
          if (offEl) offEl.innerHTML = html;
          if (modEl) modEl.style.display = 'flex';
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .getPersonnelPortfolioPrintHtml(empId);
  }

// =========================================================================
  // ACADEMIC STANDING DIRECTORY MODULE (Modeled after dir_license & Leave Dashboard)
  // =========================================================================
  var g_CurrentStandingViewTab = 'PERSONNEL';
  var g_ExpandedStandingEmpId = null;

  function switchStandingViewTab(tabName) {
    g_CurrentStandingViewTab = tabName;
    ['btnStdTab_personnel', 'btnStdTab_levels'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) btn.classList.remove('active');
    });
    if (tabName === 'PERSONNEL') {
      const b = document.getElementById('btnStdTab_personnel');
      if (b) b.classList.add('active');
    } else if (tabName === 'LEVELS') {
      const b = document.getElementById('btnStdTab_levels');
      if (b) b.classList.add('active');
    }
    renderStrictStandingDirectory();
  }

  function toggleStandingRibbonExpand(empId, event) {
    if (event) event.stopPropagation();
    g_ExpandedStandingEmpId = (g_ExpandedStandingEmpId === empId) ? null : empId;
    renderStrictStandingDirectory();
  }

  function filterStandingDirectory() {
    renderStrictStandingDirectory();
  }

  function resetStandingFilters() {
    const sInput = document.getElementById('searchStandingInput');
    const sLevel = document.getElementById('filterStandingLevel');
    const sDept = document.getElementById('filterStandingDept');
    if (sInput) sInput.value = '';
    if (sLevel) sLevel.value = 'ALL';
    if (sDept) sDept.value = 'ALL';
    renderStrictStandingDirectory();
  }

  function getAcademicStandingBadge(standingStr, roleStr) {
    const s = String(standingStr || '').trim();
    const r = String(roleStr || '').trim();
    const combined = (s + ' ' + r).toLowerCase();

    if (combined.indexOf('เชี่ยวชาญพิเศษ') !== -1 || combined.indexOf('คศ.5') !== -1) {
      return {
        badgeClass: 'std-badge-gold',
        levelCode: 'คศ.5',
        title: 'เชี่ยวชาญพิเศษ',
        desc: 'วิทยฐานะเชี่ยวชาญพิเศษ เงินวิทยฐานะ 13,000–15,600 บาท และค่าตอบแทนเท่ากัน',
        allowance: '13,000–15,600 บ./ด.',
        rankKey: 'EXPERT_SPECIAL'
      };
    }
    if (combined.indexOf('เชี่ยวชาญ') !== -1 || combined.indexOf('คศ.4') !== -1) {
      return {
        badgeClass: 'std-badge-gold',
        levelCode: 'คศ.4',
        title: 'เชี่ยวชาญ',
        desc: 'วิทยฐานะเชี่ยวชาญ เงินวิทยฐานะ 9,900 + ค่าตอบแทน 9,900 รวมเป็น 19,800 บาทต่อเดือน',
        allowance: '9,900 + 9,900 บ./ด.',
        rankKey: 'EXPERT'
      };
    }
    if (combined.indexOf('ชำนาญการพิเศษ') !== -1 || combined.indexOf('คศ.3') !== -1) {
      return {
        badgeClass: 'std-badge-orange',
        levelCode: 'คศ.3',
        title: 'ชำนาญการพิเศษ',
        desc: 'วิทยฐานะชำนาญการพิเศษ เงินวิทยฐานะ 5,600 + ค่าตอบแทน 5,600 รวมเป็น 11,200 บาทต่อเดือน',
        allowance: '5,600 + 5,600 บ./ด.',
        rankKey: 'SPECIAL'
      };
    }
    if (combined.indexOf('ชำนาญการ') !== -1 || combined.indexOf('คศ.2') !== -1) {
      return {
        badgeClass: 'std-badge-green',
        levelCode: 'คศ.2',
        title: 'ชำนาญการ',
        desc: 'วิทยฐานะชำนาญการ เงินวิทยฐานะ 3,500 บาทต่อเดือน',
        allowance: '3,500 บ./ด.',
        rankKey: 'SENIOR'
      };
    }
    if (combined.indexOf('ครูผู้ช่วย') !== -1) {
      return {
        badgeClass: 'std-badge-blue',
        levelCode: 'ไม่มีวิทยฐานะ',
        title: 'ไม่มีวิทยฐานะ',
        desc: 'ครูผู้ช่วย ช่วงเตรียมความพร้อมและพัฒนาอย่างเข้ม 2 ปี',
        allowance: 'ไม่มีเงินวิทยฐานะ',
        rankKey: 'ASSISTANT'
      };
    }
    if (combined.indexOf('ครู') !== -1 || combined.indexOf('คศ.1') !== -1) {
      return {
        badgeClass: 'std-badge-cyan',
        levelCode: 'คศ.1',
        title: 'ครู คศ.1',
        desc: 'ข้าราชการครูอันดับ คศ.1 ยังไม่มีวิทยฐานะ',
        allowance: 'ไม่มีเงินวิทยฐานะ',
        rankKey: 'TEACHER'
      };
    }
    if (combined.indexOf('ผู้อำนวยการ') !== -1 || combined.indexOf('รองผู้อำนวยการ') !== -1) {
      return {
        badgeClass: 'std-badge-cyan',
        levelCode: 'บริหาร',
        title: r || 'ผู้บริหารสถานศึกษา',
        desc: 'สายงานบริหารสถานศึกษา',
        allowance: 'ตามอันดับเงินเดือน/วิทยฐานะ',
        rankKey: 'EXECUTIVE'
      };
    }
    return {
      badgeClass: 'std-badge-gray',
      levelCode: 'ไม่มีวิทยฐานะ',
      title: 'ไม่มีวิทยฐานะ',
      desc: 'บุคลากรสายสนับสนุน ลูกจ้าง และพนักงานราชการ ไม่มีวิทยฐานะ',
      allowance: 'ตามอัตราค่าจ้าง',
      rankKey: 'SUPPORT'
    };
  }

  function renderStrictStandingDirectory() {
    const ribbonContainer = document.getElementById('employeeStandingRibbonContainer');
    const tableWrap = document.getElementById('standingAllOrdersTableWrap');
    const stdBody = document.getElementById('dirStandingBody');
    if (!ribbonContainer) return;

    // 1. Populate Department Filter
    const sDept = document.getElementById('filterStandingDept');
    if (sDept && sDept.options && sDept.options.length <= 1 && Array.isArray(g_UsersSummary)) {
      const deptSet = new Set();
      g_UsersSummary.forEach(u => {
        const d = String(u.Department || '').trim();
        if (d && d !== '-') deptSet.add(d);
      });
      deptSet.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d;
        sDept.appendChild(opt);
      });
    }

    // 2. Compute Top Summary Stats
    const totalCount = g_UsersSummary.length;
    let specialCount = 0; // คศ.3 - คศ.5
    let seniorCount = 0;  // คศ.2
    let entryCount = 0;   // คศ.1, ผู้ช่วย, สนับสนุน

    g_UsersSummary.forEach(u => {
      const badgeObj = getAcademicStandingBadge(u.HighestStanding, u.Position);
      if (badgeObj.rankKey === 'EXPERT_SPECIAL' || badgeObj.rankKey === 'EXPERT' || badgeObj.rankKey === 'SPECIAL') {
        specialCount++;
      } else if (badgeObj.rankKey === 'SENIOR') {
        seniorCount++;
      } else {
        entryCount++;
      }
    });

    const elTot = document.getElementById('stdStatTotal');
    const elSpec = document.getElementById('stdStatSpecial');
    const elSen = document.getElementById('stdStatSenior');
    const elEnt = document.getElementById('stdStatEntry');
    if (elTot) elTot.innerText = totalCount;
    if (elSpec) elSpec.innerText = specialCount;
    if (elSen) elSen.innerText = seniorCount;
    if (elEnt) elEnt.innerText = entryCount;

    // 3. Filter Users
    const qSearch = (document.getElementById('searchStandingInput') ? document.getElementById('searchStandingInput').value : '').trim().toLowerCase();
    const fLevel = document.getElementById('filterStandingLevel') ? document.getElementById('filterStandingLevel').value : 'ALL';
    const fDept = document.getElementById('filterStandingDept') ? document.getElementById('filterStandingDept').value : 'ALL';

    const filteredUsers = g_UsersSummary.filter(u => {
      if (u.status === 'ย้าย/เกษียณ') return false;

      const badgeObj = getAcademicStandingBadge(u.HighestStanding, u.Position);
      const userDept = String(u.Department || '');

      // Level Filter
      if (fLevel !== 'ALL') {
        if (fLevel === 'SUPPORT') {
          if (badgeObj.rankKey !== 'SUPPORT' && badgeObj.rankKey !== 'ASSISTANT') return false;
        } else if (badgeObj.rankKey !== fLevel) {
          return false;
        }
      }

      // Dept Filter
      if (fDept !== 'ALL' && userDept !== fDept) return false;

      // Text Search
      if (qSearch) {
        const empMatch = String(u.EmpID || '').toLowerCase().includes(qSearch);
        const nameMatch = String(u.FullName || '').toLowerCase().includes(qSearch);
        const posMatch = String(u.Position || '').toLowerCase().includes(qSearch);
        const stdMatch = String(u.HighestStanding || '').toLowerCase().includes(qSearch);
        const ordMatch = String(u.StandingOrder || '').toLowerCase().includes(qSearch);
        const deptMatch = String(u.Department || '').toLowerCase().includes(qSearch);
        if (!empMatch && !nameMatch && !posMatch && !stdMatch && !ordMatch && !deptMatch) return false;
      }

      return true;
    });

    // 4. Render Table for Tab ALL_ORDERS & maintain dirStandingBody
    if (stdBody) {
      let rowsHtml = '';
      filteredUsers.forEach(u => {
        const sStartDate = formatSlashDateBE(u.StartDate || u.RawStartDate);
        const hist = (Array.isArray(u.StandingsHistory) && u.StandingsHistory.length > 0)
          ? u.StandingsHistory
          : [{ StandingLevel: u.HighestStanding || u.Position, EffectiveDate: u.StandingDate, OrderNumber: u.StandingOrder }];

        hist.forEach(h => {
          const badgeObj = getAcademicStandingBadge(h.StandingLevel, u.Position);
          rowsHtml += `
            <tr>
              <td style="color:var(--steam-cyan); font-weight:bold; font-family:monospace;">${escapeHtml(u.EmpID)}</td>
              <td style="text-align:left; padding-left:12px; font-weight:bold;">${escapeHtml(u.FullName)}</td>
              <td>${escapeHtml(sStartDate)}</td>
              <td><span class="std-badge ${badgeObj.badgeClass}">${escapeHtml(badgeObj.title)}</span></td>
              <td>${escapeHtml(formatSlashDateBE(h.FormattedDate || h.EffectiveDate))}</td>
              <td style="font-family:monospace; color:var(--steam-cyan);">${escapeHtml(h.OrderNumber || '-')}</td>
            </tr>
          `;
        });
      });
      stdBody.innerHTML = rowsHtml || '<tr><td colspan="6" style="text-align:center; padding:20px; color:var(--text-muted);">ไม่พบข้อมูลคำสั่งวิทยฐานะตามเงื่อนไขที่เลือก</td></tr>';
    }

    // Toggle between Table View and Ribbon Views
    if (g_CurrentStandingViewTab === 'ALL_ORDERS') {
      ribbonContainer.style.display = 'none';
      if (tableWrap) tableWrap.style.display = 'block';
      return;
    } else {
      if (tableWrap) tableWrap.style.display = 'none';
      ribbonContainer.style.display = 'flex';
    }

    // 5. Render Tab LEVELS (Grouped by Academic Standing Tier)
    if (g_CurrentStandingViewTab === 'LEVELS') {
      const tiers = [
        { key: 'EXPERT_SPECIAL', title: 'เชี่ยวชาญพิเศษ', allowance: 'เงินวิทยฐานะ 13,000–15,600 บ./ด.', color: 'var(--orange)' },
        { key: 'EXPERT', title: 'เชี่ยวชาญ', allowance: 'เงินวิทยฐานะ 9,900 + 9,900 บ./ด.', color: 'var(--orange)' },
        { key: 'SPECIAL', title: 'ชำนาญการพิเศษ', allowance: 'เงินวิทยฐานะ 5,600 + 5,600 บ./ด.', color: 'var(--orange)' },
        { key: 'SENIOR', title: 'ชำนาญการ', allowance: 'เงินวิทยฐานะ 3,500 บ./ด.', color: 'var(--steam-green)' },
        { key: 'TEACHER', title: 'ครู คศ.1', allowance: 'ไม่มีเงินวิทยฐานะ', color: 'var(--steam-cyan)' },
        { key: 'ASSISTANT', title: 'ครูผู้ช่วย', allowance: 'ไม่มีเงินวิทยฐานะ', color: '#a5d6f5' },
        { key: 'SUPPORT', title: 'ไม่มีวิทยฐานะ', allowance: 'สายสนับสนุน / ลูกจ้าง', color: 'var(--text-muted)' }
      ];

      let levelsHtml = '';
      tiers.forEach(t => {
        const staffInTier = filteredUsers.filter(u => {
          const b = getAcademicStandingBadge(u.HighestStanding, u.Position);
          return b.rankKey === t.key;
        });

        if (staffInTier.length === 0) return; // Skip empty tiers for clean presentation

        levelsHtml += `
          <div style="background:rgba(0,0,0,0.22); border:1px solid #2a475e; border-radius:6px; padding:12px 16px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #2a475e; padding-bottom:8px; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
              <div>
                <div style="font-weight:bold; font-size:14px; color:${t.color}; display:flex; align-items:center; gap:0;">
                  <svg class="ui-ico-sm" style="color:${t.color}; margin-right:8px;" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg>
                  <span>${t.title}</span>
                </div>
                <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">${t.allowance}</div>
              </div>
              <span style="background:rgba(102,192,244,0.14); border:1px solid var(--steam-cyan); color:var(--steam-cyan); padding:2px 10px; border-radius:12px; font-size:11.5px; font-weight:bold;">
                ${staffInTier.length} ท่าน
              </span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:8px;">
              ${staffInTier.map(u => {
                const badgeObj = getAcademicStandingBadge(u.HighestStanding, u.Position);
                const sDate = formatSlashDateBE(u.StartDate || u.RawStartDate);
                return `
                  <div style="background:#101822; border:1px solid #23384c; border-radius:4px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <div style="font-weight:bold; color:#fff; font-size:13px;">${escapeHtml(u.FullName)}</div>
                      <div style="font-size:11.5px; color:var(--text-muted);">${escapeHtml(u.Department || '')} · บรรจุ: ${escapeHtml(sDate)}</div>
                    </div>
                    <span class="std-badge ${badgeObj.badgeClass}" style="font-size:11px;">${escapeHtml(badgeObj.levelCode)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      ribbonContainer.innerHTML = levelsHtml || '<div class="emp-empty-state">ไม่พบข้อมูลบุคลากรในหมวดหมู่นี้</div>';
      return;
    }

    // 6. Render Tab PERSONNEL (Default Modern Ribbon Cards)
    if (filteredUsers.length === 0) {
      ribbonContainer.innerHTML = `<div class="emp-empty-state">ไม่พบข้อมูลบุคลากรที่ตรงกับเงื่อนไขการค้นหาวิทยฐานะ</div>`;
      return;
    }

    const icoBriefcase = `<svg class="ui-ico-sm" style="color:var(--steam-cyan); flex-shrink:0; width:15px; height:15px; margin-right:4px;" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="7" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>`;
    const icoCalendar = `<svg class="ui-ico-sm" style="color:var(--amber, #f59e0b); flex-shrink:0; width:15px; height:15px; margin-right:4px;" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="M8 2v4"/><path d="M16 2v4"/></svg>`;
    const icoTenure = `<svg class="ui-ico-sm" style="color:var(--steam-green); flex-shrink:0; width:15px; height:15px; margin-right:4px;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;

    ribbonContainer.innerHTML = filteredUsers.map(u => {
      const empId = u.EmpID || u.id;
      const isExpanded = (g_ExpandedStandingEmpId === empId);
      const identitySubtitleHtml = buildStaffIdentitySubtitle(u);

      const posTxt = u.PositionNo ? escapeHtml(u.PositionNo) : (u.IsPositionUnverified ? `<span class="id-unverified-badge">รอตรวจสอบ</span>` : `<span style="color:var(--text-muted);">-</span>`);
      const sStartDate = formatSlashDateBE(u.StartDate || u.RawStartDate);
      const tenureTxt = calculateStaffTenureText(u.RawStartDate || u.StartDate);

      const badgeObj = getAcademicStandingBadge(u.HighestStanding, u.Position);
      const stdHistory = u.StandingsHistory || [];
      const extraCountTxt = stdHistory.length > 1
        ? `<span style="background:rgba(102,192,244,0.16); border:1px solid var(--steam-cyan); color:var(--steam-cyan); padding:2px 8px; border-radius:12px; font-size:11px; font-weight:bold;">+ รวม ${stdHistory.length} คำสั่ง</span>`
        : '';

      const effDateTxt = u.StandingDate ? `<span style="color:var(--text-muted); font-size:11.5px; margin-left:6px;">(มีผล: ${escapeHtml(formatSlashDateBE(u.StandingDate))})</span>` : '';
      const orderTxt = u.StandingOrder ? `<span style="color:var(--steam-cyan); font-family:monospace; margin-left:6px;">คำสั่งที่: ${escapeHtml(u.StandingOrder)}</span>` : '';

      const arrowIcon = isExpanded
        ? `<svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>`
        : `<svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`;

      // Build Expanded Details Panel
      let detailHtml = '';
      if (isExpanded) {
        let historyCardsHtml = '';
        if (stdHistory.length === 0) {
          historyCardsHtml = `
            <div class="std-sub-item">
              <div>
                <b>${badgeObj.title}</b>
                <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">
                  วันที่มีผล: ${escapeHtml(formatSlashDateBE(u.StandingDate))} · เลขที่คำสั่ง: ${escapeHtml(u.StandingOrder || '-')}
                </div>
              </div>
              <div style="display:flex; gap:8px;">
                <button type="button" class="btn-table-action edit" onclick="goToAdminPage(event, 'tab2')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>แก้ไขในตั้งค่า</span></button>
              </div>
            </div>
          `;
        } else {
          historyCardsHtml = stdHistory.map((s, idx) => {
            const hBadge = getAcademicStandingBadge(s.StandingLevel, u.Position);
            return `
              <div class="std-sub-item">
                <div style="display:flex; align-items:center; gap:8px;">
                  <span class="std-badge ${hBadge.badgeClass}">${escapeHtml(hBadge.levelCode)}</span>
                  <div>
                    <b style="color:#fff;">${escapeHtml(s.StandingLevel || '-')}</b>
                    <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">
                      วันที่มีผล: <b style="color:#fff;">${escapeHtml(formatSlashDateBE(s.FormattedDate || s.EffectiveDate))}</b> · 
                      เลขที่คำสั่ง: <b style="color:var(--steam-cyan); font-family:monospace;">${escapeHtml(s.OrderNumber || '-')}</b>
                      ${s.DocLink ? ` · <a href="${escapeHtml(s.DocLink)}" target="_blank" style="color:var(--steam-cyan); text-decoration:underline;">เปิดไฟล์คำสั่ง</a>` : ''}
                    </div>
                  </div>
                </div>
                <div style="display:flex; gap:6px;">
                  <button type="button" class="btn-table-action edit" onclick="goToAdminPage(event, 'tab2')"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg><span>แก้ไข</span></button>
                </div>
              </div>
            `;
          }).join('');
        }

        // Format Division / Duties list cleanly
        let dutiesHtml = '-';
        if (u.Division && u.Division !== '-') {
          const dParts = String(u.Division).split(/,\s*(?![^()]*\))/).map(s => s.trim()).filter(Boolean);
          if (dParts.length > 1) {
            dutiesHtml = dParts.map(p => `• ${escapeHtml(p)}`).join('<br>');
          } else {
            dutiesHtml = escapeHtml(u.Division);
          }
        }

        detailHtml = `
          <div class="std-expanded-refs-grid">
            <div class="std-ref-card std-ref-pos">
              ${icoBriefcase}
              <div>เลขที่ตำแหน่ง: <b style="color:#fff; font-family:monospace; font-size:13px;">${posTxt}</b></div>
            </div>
            <div class="std-ref-card std-ref-start">
              ${icoCalendar}
              <div>บรรจุ: <b style="color:#fff;">${escapeHtml(sStartDate)}</b></div>
            </div>
            <div class="std-ref-card std-ref-tenure">
              ${icoTenure}
              <div>อายุราชการ: <b style="color:#fff;">${escapeHtml(tenureTxt)}</b></div>
            </div>
          </div>

          <div class="std-opt2-box" style="margin-bottom:12px;">
            <div class="std-opt2-box-header" style="color:var(--orange);">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 2v4"/><path d="M12 18v4"/><path d="M4.93 4.93l2.83 2.83"/><path d="M16.24 16.24l2.83 2.83"/></svg>
              <span>สิทธิประโยชน์และอัตราเงินวิทยฐานะ</span>
            </div>
            <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap:10px;">
              <div class="std-opt2-item">
                <span class="std-opt2-label">อันดับปัจจุบัน:</span>
                <span style="font-weight:700; color:#ffbe40;">${escapeHtml(badgeObj.title)}</span>
              </div>
              <div class="std-opt2-item">
                <span class="std-opt2-label">เงินวิทยฐานะและค่าตอบแทน:</span>
                <span style="font-weight:700; color:#fff;">${escapeHtml(badgeObj.allowance)}</span>
              </div>
            </div>
            <div class="std-opt2-item" style="flex-direction:column; gap:4px; margin-top:8px; padding-top:6px; border-top:1px dashed #2a475e;">
              <span class="std-opt2-label" style="color:var(--steam-green); font-weight:600;">คำอธิบายระเบียบการจ่าย:</span>
              <div style="font-size:12px; color:var(--text-muted); line-height:1.45;">
                ${escapeHtml(badgeObj.desc)}
              </div>
            </div>
          </div>

          <div style="font-size:12px; font-weight:bold; color:var(--steam-cyan); margin-bottom:6px;">
            ประวัติการดำรงตำแหน่งและวิทยฐานะ
          </div>
          ${historyCardsHtml}
        `;
      }

      return `
        <div class="std-ribbon-card ${isExpanded ? 'expanded' : ''}" id="stdRibbonCard_${escapeHtml(empId)}">
          <div class="std-ribbon-main" onclick="toggleStandingRibbonExpand('${escapeHtml(empId)}', event)">
            
            <div class="std-ident-zone">
              <div class="std-name-line">${escapeHtml(u.FullName)}</div>
              <div class="std-meta-line">${identitySubtitleHtml}</div>
            </div>

            <div class="std-status-zone">
              <div style="display:flex; align-items:center; flex-wrap:wrap; gap:6px;">
                <span class="std-badge ${badgeObj.badgeClass}">${escapeHtml(badgeObj.title)}</span>
                ${extraCountTxt}
              </div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">
                ${effDateTxt} ${orderTxt}
              </div>
            </div>

            <button type="button" class="emp-expand-btn" title="${isExpanded ? 'ซ่อนรายละเอียด' : 'ดูประวัติวิทยฐานะ'}" onclick="toggleStandingRibbonExpand('${escapeHtml(empId)}', event)">
              ${arrowIcon}
            </button>
          </div>

          <div class="std-detail-panel" id="stdDetailPanel_${escapeHtml(empId)}">
            ${detailHtml}
          </div>
        </div>
      `;
    }).join('');
  }

  // เชื่อมต่อ Event Bus เพื่ออัปเดตทะเบียนวิทยฐานะแบบ Real-time
  if (window.LeaveBus && typeof window.LeaveBus.on === 'function') {
    window.LeaveBus.on('LEAVE_UPDATED', function() {
      const view = document.getElementById('view_dir_standing');
      if (view && view.style.display !== 'none') {
        renderStrictStandingDirectory();
      }
    });
  }
</script>
