    <!-- TAB 4: ข้อมูลสถานศึกษา -->
    <div id="tab4" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:12px; margin-bottom:18px; flex-wrap:wrap; gap:12px;">
        <div>
          <h3 style="color:var(--steam-cyan); margin:0; font-size:17px; display:flex; align-items:center; gap:8px;">
            <svg class="ui-ico-lg" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>ข้อมูลสถานศึกษา</span>
          </h3>
          <div style="color:var(--text-muted); font-size:12.5px; margin-top:3px;">กำหนดข้อมูลทั่วไป พิกัดภูมิศาสตร์</div>
        </div>
        <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
          <button type="button" class="btn-circle-glow glow-cyan" id="btnBackupDatabase" onclick="triggerDatabaseBackupNow()" title="สำรองข้อมูล" aria-label="สำรองข้อมูล">
            <svg class="ui-ico" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          </button>
          <button type="button" class="btn-circle-glow glow-green" id="btnSaveSchool" onclick="saveSchoolData()" title="บันทึกข้อมูลสถานศึกษา" aria-label="บันทึกข้อมูลสถานศึกษา">
            <svg class="ui-ico" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          </button>
        </div>
      </div>

      <div class="sch-top-grid">
        <div class="sch-card" style="text-align:center; align-items:center;">
          <div class="sch-card-head" style="width:100%; justify-content:center;">ตราสัญลักษณ์โรงเรียน</div>
          <div style="width:125px; height:125px; border:2px dashed #2a475e; border-radius:8px; display:flex; align-items:center; justify-content:center; background:#101822; overflow:hidden; margin: 6px auto 12px auto;">
            <img id="logoPreview" src="" style="max-width:100%; max-height:100%; display:none; object-fit:contain;">
            <span id="logoPlaceholder" style="color:var(--text-muted); font-size:12px;">ไม่มีรูปภาพ</span>
          </div>
          <div style="width:100%;">
            <input type="file" id="logoFileInput" accept="image/png, image/jpeg" style="display:none;" onchange="previewLogo(event)">
            <button type="button" class="btn-save-sm" style="width:100%; margin-bottom:6px; padding:7px 12px; display:inline-flex; align-items:center; justify-content:center; gap:8px;" onclick="document.getElementById('logoFileInput').click()">
              <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
              <span>เลือกรูปภาพ</span>
            </button>
            <button type="button" class="btn-steam" style="width:100%; padding:7px 12px; font-size:12.5px; display:inline-flex; align-items:center; justify-content:center; gap:8px;" id="btnUploadLogo" onclick="uploadLogo()" disabled>
              <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
              <span>อัพโหลด</span>
            </button>
          </div>
        </div>

        <div class="sch-card">
          <div>
            <div class="sch-card-head">ข้อมูลพื้นฐานสถานศึกษาและผู้บริหาร</div>
            <div class="grid-2">
              <div class="input-group"><label>ชื่อสถานศึกษา</label><input type="text" id="sch_schoolName" class="steam-input"></div>
              <div class="input-group"><label>หน่วยงานต้นสังกัด</label><input type="text" id="sch_affiliation" class="steam-input"></div>
              <div class="input-group"><label>รหัสสถานศึกษา</label><input type="text" id="sch_schoolCode10" class="steam-input"></div>
              <div class="input-group"><label>รหัส SMIS</label><input type="text" id="sch_schoolCode8" class="steam-input"></div>
              <div class="input-group"><label>ชื่อ-นามสกุล ผู้อำนวยการ</label><input type="text" id="sch_directorName" class="steam-input"></div>
              <div class="input-group"><label>ตำแหน่งที่ระบุในเอกสารราชการ</label><input type="text" id="sch_directorPosition" class="steam-input"></div>
            </div>
          </div>
          <input type="hidden" id="sch_systemName" value="ManStat">
        </div>
      </div>

      <div class="sch-card">
        <div class="sch-card-head">ข้อมูลการติดต่อและพิกัดภูมิศาสตร์</div>
        <div class="grid-2">
          <div class="input-group"><label>เบอร์โทรศัพท์ติดต่อ</label><input type="text" id="sch_contactPhone" class="steam-input"></div>
          <div class="input-group"><label>อีเมลโรงเรียน</label><input type="text" id="sch_contactEmail" class="steam-input"></div>
          <div class="input-group" style="grid-column: 1 / -1;"><label>ที่อยู่สถานศึกษา</label><input type="text" id="sch_address" class="steam-input"></div>
          <div class="input-group"><label>ละติจูด</label><input type="text" id="sch_lat" class="steam-input" placeholder="เช่น 14.979900"></div>
          <div class="input-group">
            <label>ลองจิจูด</label>
            <div style="display:flex; gap:10px;">
              <input type="text" id="sch_lng" class="steam-input" placeholder="เช่น 102.097770" style="flex:1; margin:0;">
              <button type="button" class="btn-save-sm" style="width:auto; padding:6px 14px; background:#2a475e; border-color:var(--steam-cyan); color:var(--steam-cyan); white-space:nowrap; display:inline-flex; align-items:center; gap: 8px;" onclick="getLocationGPS()">
                <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>ค้นหาจาก GPS</span>
              </button>
            </div>
            <span id="gpsStatus" style="font-size:11.5px; color:var(--text-muted); display:block; margin-top:4px;"></span>
          </div>
        </div>
      </div>
    </div>
