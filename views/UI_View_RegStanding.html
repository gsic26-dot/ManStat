<!-- VIEW: วิทยฐานะ (ปรับปรุง UI/UX ตามต้นแบบ License & Leave Dashboard) -->
<div id="view_dir_standing" class="main-view" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:12px; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
    <div>
      <h3 style="color:var(--steam-cyan); margin:0; font-size:17px; display:flex; align-items:center; gap:0;">
        <svg class="ui-ico-lg" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span>ทะเบียนประวัติและวิทยฐานะ</span>
      </h3>
      <div style="font-size:12.5px; color:var(--text-muted); margin-top:3px;">
        ฐานข้อมูลอันดับและวิทยฐานะข้าราชการครูและบุคลากรทางการศึกษา (คศ.1 - คศ.5) ตามเกณฑ์ ก.ค.ศ. และ สพฐ.
      </div>
    </div>
    <div style="display:flex; gap: 8px; align-items:center;">
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <!-- 1. STAT SUMMARY CARDS (แบบเดียวกับ Leave Dashboard และ License) -->
  <div class="compact-stat-strip" style="grid-template-columns: repeat(4, 1fr); margin-bottom:12px;">
    <div class="compact-stat-pill" style="border-left: 3px solid var(--steam-cyan);">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>บุคลากรทั้งหมด</span>
      </span>
      <span class="stat-val" style="color:#fff;" id="stdStatTotal">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid var(--orange);">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg><span>ชำนาญการพิเศษขึ้นไป</span>
      </span>
      <span class="stat-val" style="color:var(--orange);" id="stdStatSpecial">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid var(--steam-green);">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>ชำนาญการ</span>
      </span>
      <span class="stat-val" style="color:var(--steam-green);" id="stdStatSenior">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid #6b7280;">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:#9ca3af;" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg><span>ไม่มีวิทยฐานะ</span>
      </span>
      <span class="stat-val" style="color:#9ca3af;" id="stdStatEntry">0</span>
    </div>
  </div>

  <!-- 2. SUB VIEW TABS -->
  <div class="g-segmented-btn-group" style="margin-bottom:14px;">
    <button type="button" class="g-seg-btn active" id="btnStdTab_personnel" onclick="switchStandingViewTab('PERSONNEL')">
      <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
      <span>รายชื่อบุคลากรและวิทยฐานะ</span>
    </button>
    <button type="button" class="g-seg-btn" id="btnStdTab_levels" onclick="switchStandingViewTab('LEVELS')">
      <svg class="ui-ico-sm" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      <span>จำแนกตามวิทยฐานะ</span>
    </button>
  </div>

  <!-- 3. FILTER BAR -->
  <div class="emp-filter-bar" style="grid-template-columns: 1.4fr 1.1fr 1.1fr auto; margin-bottom:12px;">
    <input type="text" id="searchStandingInput" class="steam-input" placeholder="ค้นหาชื่อ-นามสกุล, รหัสบุคลากร, ตำแหน่ง, เลขที่คำสั่ง..." oninput="filterStandingDirectory()">
    
    <select id="filterStandingLevel" class="steam-input" onchange="filterStandingDirectory()">
      <option value="ALL">วิทยฐานะ: ทั้งหมด</option>
      <option value="EXPERT_SPECIAL">เชี่ยวชาญพิเศษ</option>
      <option value="EXPERT">เชี่ยวชาญ</option>
      <option value="SPECIAL">ชำนาญการพิเศษ</option>
      <option value="SENIOR">ชำนาญการ</option>
      <option value="TEACHER">ครู คศ.1</option>
      <option value="EXECUTIVE">สายงานบริหาร</option>
      <option value="SUPPORT">ไม่มีวิทยฐานะ</option>
    </select>

    <select id="filterStandingDept" class="steam-input" onchange="filterStandingDirectory()">
      <option value="ALL">กลุ่มสาระ / งาน: ทั้งหมด</option>
    </select>

    <button type="button" class="btn-save-sm" style="height:34px; padding:0 12px; display:inline-flex; align-items:center; gap:0;" onclick="resetStandingFilters()">
      <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span>ล้างตัวกรอง</span>
    </button>
  </div>

  <!-- 4. MAIN CONTENT CONTAINER -->
  <div id="employeeStandingRibbonContainer" class="lic-ribbon-list"></div>

  <!-- 5. TABLE CONTAINER FOR ALL_ORDERS VIEW (รักษา id="dirStandingBody" เพื่อความเข้ากันได้ 100%) -->
  <div id="standingAllOrdersTableWrap" class="table-container" style="display:none; margin-top:10px;">
    <table>
      <thead>
        <tr>
          <th style="width:10%;">รหัส</th>
          <th style="width:22%; text-align:left; padding-left:12px;">ชื่อ-นามสกุล</th>
          <th style="width:13%;">วันที่บรรจุ</th>
          <th style="width:16%;">วิทยฐานะ</th>
          <th style="width:14%;">วันที่มีผล</th>
          <th style="width:25%;">เลขที่คำสั่ง</th>
        </tr>
      </thead>
      <tbody id="dirStandingBody"></tbody>
    </table>
  </div>
</div>
