    <!-- TAB 1: เพิ่มบัญชีผู้ใช้งานระบบ -->
    <div id="tab1" class="tab-content active">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin-bottom:14px; border-bottom:1px solid #2a475e; padding-bottom:10px;">
        <div>
          <h3 style="color:var(--steam-cyan); margin:0; font-size:16.5px; display:flex; align-items:center; gap:0;">
            <svg class="ui-ico-lg" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg><span>เพิ่มบุคลากรใหม่</span>
          </h3>
          <div style="color:var(--text-muted); font-size:12.5px; margin-top:2px;">ระบบจะออกรหัสประจำตัวบุคลากรโดยอัตโนมัติตามสายงาน และเข้ารหัสรหัสผ่านด้วย SHA-256</div>
        </div>

      </div>

      <div style="max-width: 920px;">
        <div class="adm-sec-card">
          <div class="adm-sec-title">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><line x1="15" y1="8" x2="17" y2="8"/><line x1="15" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/></svg><span>ข้อมูลระบุตัวตน</span>
          </div>
          <div class="grid-4" style="display:grid; grid-template-columns: 1.25fr 1fr 1.15fr 1.1fr; gap: 8px;">
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>ชื่อ-นามสกุล <span class="req-star">*</span></span></label>
              <input type="text" id="new_name" class="steam-input" style="margin:0;" placeholder="เช่น นายสมชาย ใจดี" required>
            </div>
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg><span>เลขที่ตำแหน่ง</span></label>
              <input type="text" id="new_positionNo" class="steam-input" style="margin:0;" placeholder="เลขที่ราชการ (เว้นว่างได้)">
            </div>
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg><span>สมาชิกประเภทสามัญ เลขที่</span></label>
              <input type="text" id="new_memberId" class="steam-input" style="margin:0;" placeholder="สมาชิกประเภทสามัญ เลขที่">
            </div>
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>เลขประจำตัวประชาชน <span class="req-star">*</span></span></label>
              <input type="text" id="new_idCard" class="steam-input" style="margin:0;" maxlength="13" placeholder="เลข 13 หลัก">
            </div>
          </div>
        </div>

        <div class="adm-sec-card" style="border-left-color:var(--steam-green);">
          <div class="adm-sec-title" style="color:var(--steam-green);">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>ข้อมูลวันเกิดและวันเกษียณอายุราชการ</span>
          </div>
          <div style="display:grid; grid-template-columns: 240px 1fr; gap:12px; align-items:flex-end;">
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>วันเกิด</span></label>
              <input type="date" id="new_birthDate" class="steam-input" onchange="onBirthDateChangeCalc('new')">
            </div>
            <div id="new_retirementPreviewBox" class="retire-calc-card" style="margin-top:0; min-height:38px; display:flex; align-items:center;">
              เลือกวันเดือนปีเกิดเพื่อคำนวณอายุ (ปี-เดือน-วัน) และวันเกษียณอายุราชการอัตโนมัติ
            </div>
          </div>
        </div>

        <div class="adm-sec-card" style="border-left-color:var(--orange);">
          <div class="adm-sec-title" style="color:var(--orange);">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg><span>ตำแหน่งและสังกัด</span>
          </div>
          <div class="grid-2">
            <div class="input-group">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>วันที่บรรจุเข้ารับราชการ <span class="req-star">*</span></span></label>
              <input type="date" id="new_startDate" class="steam-input">
            </div>
            
            <div class="input-group">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>กลุ่มสาระการเรียนรู้ <span class="req-star">*</span></span></label>
              <select id="new_dept" class="steam-input" onchange="onDeptComboChange('new')">
                <optgroup label="กลุ่มสาระการเรียนรู้ และปฐมวัย">
                  <option value="ภาษาไทย">กลุ่มสาระการเรียนรู้ภาษาไทย</option>
                  <option value="คณิตศาสตร์">กลุ่มสาระการเรียนรู้คณิตศาสตร์</option>
                  <option value="วิทยาศาสตร์และเทคโนโลยี">กลุ่มสาระการเรียนรู้วิทยาศาสตร์และเทคโนโลยี</option>
                  <option value="สังคมศึกษา ศาสนาและวัฒนธรรม">กลุ่มสาระการเรียนรู้สังคมศึกษา ศาสนาและวัฒนธรรม</option>
                  <option value="สุขศึกษาและพลศึกษา">กลุ่มสาระการเรียนรู้สุขศึกษาและพลศึกษา</option>
                  <option value="ศิลปะ">กลุ่มสาระการเรียนรู้ศิลปะ</option>
                  <option value="การงานอาชีพ">กลุ่มสาระการเรียนรู้การงานอาชีพ</option>
                  <option value="ภาษาต่างประเทศ">กลุ่มสาระการเรียนรู้ภาษาต่างประเทศ</option>
                  <option value="การศึกษาปฐมวัย">การศึกษาปฐมวัย</option>
                </optgroup>
                <optgroup label="กิจกรรมพัฒนาผู้เรียน">
                  <option value="กิจกรรมแนะแนว">กิจกรรมแนะแนว</option>
                  <option value="กิจกรรมนักเรียน">กิจกรรมนักเรียน</option>
                  <option value="กิจกรรมเพื่อสังคมและสาธารณประโยชน์">กิจกรรมเพื่อสังคมและสาธารณประโยชน์</option>
                </optgroup>
                <optgroup label="สายงานบริหารและสนับสนุน">
                  <option value="สายงานบริหารและสนับสนุนการศึกษา">สายงานบริหารและสนับสนุนการศึกษา</option>
                </optgroup>
                <optgroup label="กำหนดเอง (ComboBox)">
                  <option value="__CUSTOM_DEPT__">+ พิมพ์ระบุกลุ่มสาระ/งานใหม่เอง...</option>
                </optgroup>
              </select>
              <input type="text" id="new_dept_custom" class="steam-input" style="display:none; margin-top:6px; border-color:var(--steam-green);" placeholder="พิมพ์ชื่อกลุ่มสาระ / สายงานใหม่...">
            </div>

            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg><span>ตำแหน่ง <span class="req-star">*</span></span></label>
              <select id="new_role" class="steam-input" style="margin:0;" onchange="onRoleComboChange('new')">
                <optgroup label="ผู้บริหาร">
                  <option value="ผู้อำนวยการสถานศึกษา">ผู้อำนวยการสถานศึกษา</option>
                  <option value="รองผู้อำนวยการสถานศึกษา">รองผู้อำนวยการสถานศึกษา</option>
                </optgroup>
                <optgroup label="สายวิชาการ">
                  <option value="ครูเชี่ยวชาญพิเศษ">ครูเชี่ยวชาญพิเศษ</option>
                  <option value="ครูเชี่ยวชาญ">ครูเชี่ยวชาญ</option>
                  <option value="ครูชำนาญการพิเศษ">ครูชำนาญการพิเศษ</option>
                  <option value="ครูชำนาญการ">ครูชำนาญการ</option>
                  <option value="ครู" selected>ครู</option>
                  <option value="ครูผู้ช่วย">ครูผู้ช่วย</option>
                </optgroup>
                <optgroup label="อื่นๆ">
                  <option value="ศึกษานิเทศก์">ศึกษานิเทศก์</option>
                  <option value="พนักงานราชการ">พนักงานราชการ</option>
                  <option value="ครูอัตราจ้าง">ครูอัตราจ้าง</option>
                  <option value="ลูกจ้างประจำ">ลูกจ้างประจำ</option>
                  <option value="ลูกจ้างชั่วคราว">ลูกจ้างชั่วคราว</option>
                  <option value="เจ้าหน้าที่ธุรการ">เจ้าหน้าที่ธุรการ</option>
                </optgroup>
                <optgroup label="กำหนดเอง (ComboBox)">
                  <option value="__CUSTOM_ROLE__">+ พิมพ์ระบุตำแหน่งใหม่เอง...</option>
                </optgroup>
              </select>
              <input type="text" id="new_role_custom" class="steam-input" style="display:none; margin-top:6px; border-color:var(--steam-cyan);" placeholder="พิมพ์ชื่อตำแหน่งใหม่...">
            </div>

            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg><span>ระดับสิทธิ์ในระบบ (Permission) <span class="req-star">*</span></span></label>
              <select id="new_access" class="steam-input" style="margin:0;">
                <option value="User" selected>User (บุคลากรทั่วไป)</option>
                <option value="Admin">Admin (หัวหน้าฝ่ายบุคคล / วิชาการ)</option>
                <option value="Superuser">Superuser (ผู้บริหาร / ผู้ดูแลสูงสุด)</option>
              </select>
            </div>
          </div>
        </div>

        <div class="adm-sec-card" style="border-left-color:var(--steam-cyan);">
          <div class="adm-sec-title">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span>ข้อมูลการติดต่อและรหัสผ่านเริ่มต้น</span>
          </div>
          <div class="grid-3">
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg><span>Email <span class="req-star">*</span></span></label>
              <input type="email" id="new_email" class="steam-input" style="margin:0;" placeholder="name@school.ac.th" required>
            </div>
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>เบอร์โทรศัพท์ติดต่อ</span></label>
              <input type="text" id="new_phone" class="steam-input" style="margin:0;" placeholder="08xxxxxxxx">
            </div>
            <div class="input-group" style="margin-bottom:0;">
              <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>รหัสผ่านเริ่มต้น (SHA-256) <span class="req-star">*</span></span></label>
              <input type="text" id="new_pass" class="steam-input" style="margin:0;" value="123456">
            </div>
          </div>
        </div>

        <div style="text-align:right; margin-top:10px;">
          <button id="btnAddNew" class="btn-steam" style="width:auto; padding:10px 28px;" onclick="addNewTeacher()">
            <svg class="ui-ico" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg><span>เพิ่มบัญชีใหม่</span>
          </button>
        </div>
      </div>
    </div>
