    <!-- TAB 3: ระบบปีงบประมาณ (Fiscal Year Management) -->
    <div id="tab3" class="tab-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <div>
          <div style="font-size:16px; color:#fff; font-weight:bold; display:flex; align-items:center; gap:8px;">
            <svg class="ui-ico" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="m9 16 2 2 4-4"/></svg>
            <span>ปีงบประมาณ</span>
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
            ระบบตรวจจับปีงบประมาณและรอบช่วงเวลาประเมิน (ช่วงที่ 1 / ช่วงที่ 2) อัตโนมัติตามวันเวลาจริงของระบบ
          </div>
        </div>
      </div>

      <!-- 1. การ์ดสถานะปัจจุบัน (Active & Auto-Detected Fiscal Banner) -->
      <div id="adm_fiscalActiveBanner" class="sch-card" style="margin-bottom:16px; border-left:4px solid var(--steam-green); background:linear-gradient(180deg, rgba(164,208,7,0.08) 0%, rgba(20,29,42,0.6) 100%); padding:16px 20px;">
        <div style="color:var(--text-muted); font-size:12.5px;">กำลังตรวจจับและประมวลผลสถานะปีงบประมาณ...</div>
      </div>

      <!-- 2. แผงควบคุมกำหนดและปรับเปลี่ยนปีงบประมาณ (Interactive Settings) -->
      <div class="sch-card" style="margin-bottom:16px; border-left:4px solid var(--steam-cyan); padding:16px 20px;">
        <div class="sch-card-head" style="color:var(--steam-cyan); font-size:14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span style="font-weight:bold;">ปีงบประมาณและรอบเวลา</span>
          </div>
          <span style="font-size:11.5px; color:var(--text-muted);">สามารถเลือกปีงบประมาณและรอบเวลาเพื่อเปิดใช้งาน</span>
        </div>

        <div style="display:grid; grid-template-columns: minmax(160px, 1fr) minmax(240px, 1.6fr) auto; gap:14px; align-items:end;">
          <div>
            <label style="display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; font-weight:bold;">ปีงบประมาณ (Fiscal Year):</label>
            <select id="adm_fiscalYearSelect" class="steam-input" style="height:36px; font-size:13px; font-weight:bold;" onchange="onAdminFiscalYearChange()">
              <!-- Options populated dynamically -->
            </select>
          </div>

          <div>
            <label style="display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px; font-weight:bold;">รอบช่วงเวลาประเมิน (Sub-Period Mode):</label>
            <select id="adm_fiscalPeriodSelect" class="steam-input" style="height:36px; font-size:12.5px;" onchange="onAdminFiscalPeriodChange()">
              <!-- Dynamic options for selected year -->
            </select>
          </div>

          <div>
            <button type="button" class="btn-steam" style="width:auto; height:36px; padding:0 22px; font-size:13px; font-weight:bold; white-space:nowrap; display:inline-flex; align-items:center; gap:8px;" onclick="handleSaveActiveFiscalConfig()">
              <svg class="ui-ico-sm" style="color:#000;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
              <span>บันทึกการตั้งค่ารอบเวลา</span>
            </button>
          </div>
        </div>

        <!-- Preview Info Box -->
        <div id="adm_fiscalPeriodPreviewHint" style="font-size:12px; color:var(--steam-cyan); margin-top:12px; background:rgba(0,0,0,0.22); padding:10px 14px; border-radius:6px; border:1px solid #2a475e; display:flex; align-items:center; gap:8px;"></div>
      </div>

      <!-- 3. ตารางจัดการปีงบประมาณในระบบ (สร้างเพิ่ม / ลบ ได้อิสระ) -->
      <div class="sch-card" style="margin-bottom:16px; border-left:4px solid var(--steam-orange); padding:16px 20px;">
        <div class="sch-card-head" style="color:var(--steam-orange); font-size:14px; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
          <div style="display:flex; align-items:center; gap:8px;">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            <span style="font-weight:bold;">ฐานข้อมูลปีงบประมาณ</span>
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            <input type="number" id="adm_newFiscalYearInput" class="steam-input" placeholder="ระบุ พ.ศ. เช่น 2571" style="height:32px; width:150px; padding:0 8px; font-size:12px; margin:0;">
            <button type="button" class="btn-save-sm" style="background:var(--steam-green); color:#000; border:1px solid #bfe726; font-weight:700; height:34px; padding:0 14px; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; box-shadow:0 0 12px rgba(164,208,7,0.4); cursor:pointer;" onclick="handleAddNewFiscalYear()">
              <svg class="ui-ico-sm" style="color:#000; stroke-width:2.5;" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" y2="19" y2="12"/></svg>
              <span>เพิ่มปีงบประมาณ</span>
            </button>
          </div>
        </div>

        <div class="g-table-card">
          <div style="overflow-x:auto;">
            <table class="g-table" style="font-size:12.5px;">
              <thead>
                <tr>
                  <th style="width:130px; padding-left:16px;">ปีงบประมาณ</th>
                  <th>ช่วงที่ 1</th>
                  <th>ช่วงที่ 2</th>
                  <th style="width:120px; text-align:center;">สถานะ</th>
                  <th style="width:160px; text-align:center;">จัดการ</th>
                </tr>
              </thead>
              <tbody id="adm_fiscalYearsTableBody">
                <!-- Rendered dynamically by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
