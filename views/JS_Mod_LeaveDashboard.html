<script>
  // =========================================================================
  // MODULE: ISOLATED LEAVE SUMMARY FRONTEND (JS_Mod_LeaveDashboard.html)
  // ควบคุมหน้า 1.1 สรุปสถิติการลาบุคลากร แยกอิสระ 100% + มาตรฐานไอคอน SVG เว้น 1 เคาะ
  // =========================================================================
  var g_ModStaffList = [];
  var g_ModLeaveLogs = [];
  var g_ModExpandedEmpId = null;
  var g_ModShowAllLogsMap = {};

  var MOD_ICO = {
    user: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
    sick: '<svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>',
    personal: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>',
    permit: '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    chevDown: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
    chevUp: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>',
    check: '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
    clock: '<svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    alert: '<svg class="ui-ico-sm" style="color:var(--red);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>',
    idCard: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><line x1="15" y1="8" x2="17" y2="8"/><line x1="15" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/></svg>',
    chart: '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
    list: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg>',
    track: '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m16 9-5.5 5.5L8 12"/></svg>'
  };

  var _isDashboardBooting = false;

  function MOD_LeaveDashboard_boot(force) {
    // หากมีข้อมูล g_UsersSummary ใน window อยู่แล้ว และไม่ได้บังคับดึงตรง ให้ใช้ข้อมูลที่มีทันทีโดยไม่ยิง RPC ซ้ำซ้อน
    if (!force && Array.isArray(window.g_UsersSummary) && window.g_UsersSummary.length > 0) {
      g_ModStaffList = window.g_UsersSummary;
      if (Array.isArray(window.g_LeaveLogs) && window.g_LeaveLogs.length > 0) {
        g_ModLeaveLogs = window.g_LeaveLogs;
      }
      try { MOD_LeaveDashboard_updateHeaderAndCards(); } catch(eH) {}
      try { MOD_LeaveDashboard_populateDeptOptions(); } catch(eP) {}
      try { MOD_LeaveDashboard_renderList(); } catch(eR) {}
      return;
    }

    if (_isDashboardBooting) return;
    _isDashboardBooting = true;

    google.script.run
      .withSuccessHandler(function(res) {
        _isDashboardBooting = false;
        if (!res || res.status === 'error') {
          var errBox = document.getElementById('employeeRibbonListContainer');
          if (errBox) {
            errBox.innerHTML = `
              <div class="emp-empty-state" style="border-color:var(--red); color:#fff;">
                <div style="display:inline-flex; align-items:center; gap:6px; color:var(--red); font-weight:bold; font-size:15px;">
                  ${MOD_ICO.alert}<span>เกิดข้อผิดพลาดในการดึงข้อมูลสรุปสถิติการลา</span>
                </div>
                <div style="font-size:13px; color:#d0d7de; margin-top:6px;">${escapeHtml(res ? res.message : 'ไม่ทราบสาเหตุ')}</div>
              </div>
            `;
          }
          return;
        }

        g_ModStaffList = res.staffList || [];
        g_ModLeaveLogs = res.leaveLogs || [];
        if (Array.isArray(res.staffList) && res.staffList.length > 0) {
          g_ModStaffList = res.staffList;
          // ซิงค์เข้าตัวแปรหลักของระบบเพื่อให้หน้าอื่นๆ (ยื่นใบลา, แผนผัง, ทะเบียนประวัติ) มีข้อมูลครบถ้วนสมบูรณ์
          if (!g_UsersSummary || g_UsersSummary.length === 0) {
            g_UsersSummary = g_ModStaffList;
          } else {
            g_UsersSummary = g_UsersSummary.map(function(u) {
              var fresh = g_ModStaffList.find(function(x) { return (x.EmpID || x.id) === (u.EmpID || u.id); });
              return fresh ? Object.assign({}, u, fresh) : u;
            });
          }
        }
        if (g_ModLeaveLogs.length > 0 && (!g_LeaveLogs || g_LeaveLogs.length === 0)) {
          g_LeaveLogs = g_ModLeaveLogs;
        }
        if (res.schoolInfo) {
          g_SchoolInfo = Object.assign({}, g_SchoolInfo, res.schoolInfo);
        }

        try { MOD_LeaveDashboard_updateHeaderAndCards(); } catch(eH) { console.warn('updateHeader:', eH); }
        try { MOD_LeaveDashboard_populateDeptOptions(); } catch(eP) { console.warn('populateDept:', eP); }
        try { MOD_LeaveDashboard_renderList(); } catch(eR) { console.warn('renderList:', eR); }

                try { if (typeof populateSubstituteDropdown === 'function') populateSubstituteDropdown(); } catch(e){}
        try { if (typeof renderStrictLicenseDirectory === 'function') renderStrictLicenseDirectory(); } catch(e){}
        try { if (typeof renderStrictStandingDirectory === 'function') renderStrictStandingDirectory(); } catch(e){}
        try { if (typeof renderStrictScoutDirectory === 'function') renderStrictScoutDirectory(); } catch(e){}
        if (typeof renderAnalyticsCharts === 'function') {
          var viewAn = document.getElementById('view_analytics');
          if (viewAn && viewAn.style.display !== 'none') {
            setTimeout(function() { renderAnalyticsCharts(); }, 40);
          }
        }
        if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
          window.LeaveBus.emit('LEAVE_UPDATED', { type: 'MOD_SYNC', timestamp: Date.now() });
        }
      })
      .withFailureHandler(function(err) {
        _isDashboardBooting = false;
        var errBox = document.getElementById('employeeRibbonListContainer');
        if (errBox) {
          errBox.innerHTML = `
            <div class="emp-empty-state" style="border-color:var(--red); color:#fff;">
              <div style="display:inline-flex; align-items:center; gap:6px; color:var(--red); font-weight:bold;">
                ${MOD_ICO.alert}<span>เชื่อมต่อโมดูลสถิติการลาไม่สำเร็จ: ${escapeHtml(err.message || err)}</span>
              </div>
            </div>
          `;
        }
      })
      .MOD_LeaveSummary_fetchDirectData();
  }

  function MOD_LeaveDashboard_updateHeaderAndCards() {
    var activeStaffList = (g_ModStaffList && g_ModStaffList.length > 0) ? g_ModStaffList : (g_UsersSummary || []);
    var activeLogsList = (g_ModLeaveLogs && g_ModLeaveLogs.length > 0) ? g_ModLeaveLogs : (g_LeaveLogs || []);

    // Set Thai Today Date
    var elTodayDate = document.getElementById('lblDashboardTodayDate');
    if (elTodayDate) {
      var days = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];
      var months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
      var now = new Date();
      elTodayDate.innerText = 'ข้อมูลประจำวัน: ' + days[now.getDay()] + 'ที่ ' + now.getDate() + ' ' + months[now.getMonth()] + ' พ.ศ. ' + (now.getFullYear() + 543);
    }

    // Set Big Hero KPI (Duty Attendance Rate)
    var elRateNum = document.getElementById('lblDutyRateNumber');
    var elRateTxt = document.getElementById('lblDutyRateText');
    if (elRateNum && elRateTxt) {
      var totalStaff = activeStaffList.length || 1;
      var todayStr = new Date().toISOString().split('T')[0];
      var onLeaveToday = activeLogsList.filter(function(l) {
        if (l.Status !== 'อนุมัติ' && l.Status !== 'อนุมัติเรียบร้อย') return false;
        var start = String(l.StartDate || '');
        var end = String(l.EndDate || start);
        return (start <= todayStr && todayStr <= end);
      }).length;

      var presentCount = Math.max(0, totalStaff - onLeaveToday);
      var rate = ((presentCount / totalStaff) * 100).toFixed(2);
      elRateNum.innerText = rate + '%';
      if (rate >= 90) {
        elRateNum.style.color = 'var(--steam-green)';
      } else if (rate >= 75) {
        elRateNum.style.color = 'var(--orange)';
      } else {
        elRateNum.style.color = 'var(--red)';
      }
    }

    var elTot = document.getElementById('cardTotalUsers');
    if (elTot) elTot.innerText = activeStaffList.length;

    var pendingCount = activeLogsList.filter(function(l) {
      return l.Status !== 'อนุมัติ' && l.Status !== 'อนุมัติเรียบร้อย' && l.Status !== 'ไม่อนุมัติ';
    }).length;
    var approvedCount = activeLogsList.filter(function(l) {
      return l.Status === 'อนุมัติ' || l.Status === 'อนุมัติเรียบร้อย';
    }).length;

    var elPend = document.getElementById('cardPendingLeaves');
    if (elPend) elPend.innerText = pendingCount;
    var elApp = document.getElementById('cardApprovedLeaves');
    if (elApp) elApp.innerText = approvedCount;

    var elDir = document.getElementById('lblDirectorHeader');
    if (elDir) {
      var dirName = (g_SchoolInfo && g_SchoolInfo.directorName && g_SchoolInfo.directorName !== '-') ? g_SchoolInfo.directorName : '';
      if (!dirName && activeStaffList.length > 0) {
        var foundDir = activeStaffList.find(function(u) { return String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') !== -1; });
        if (foundDir) dirName = foundDir.FullName;
      }
      elDir.innerText = dirName || 'นายธีรศักดิ์ มโนธรรม';
    }
  }

  function MOD_LeaveDashboard_populateDeptOptions() {
    var deptSel = document.getElementById('filterStaffDept');
    if (!deptSel) return;
    var prevVal = deptSel.value || 'ALL';
    var activeStaffList = (g_ModStaffList && g_ModStaffList.length > 0) ? g_ModStaffList : (g_UsersSummary || []);

    var deptSet = new Set();
    var divSet = new Set();

    activeStaffList.forEach(function(u) {
      var d = String(u.Department || '').trim();
      if (d && d !== '-') deptSet.add(d);
      var dv = String(u.Division || '').trim();
      if (dv && dv !== '-') {
        dv.split(',').forEach(function(part) {
          var cl = part.trim();
          if (cl) divSet.add(cl);
        });
      }
    });

    var html = '<option value="ALL">กลุ่มสาระ / งาน: ทั้งหมด</option>';
    if (deptSet.size > 0) {
      html += '<optgroup label="กลุ่มสาระการเรียนรู้">';
      Array.from(deptSet).forEach(function(d) {
        html += '<option value="DEPT:' + escapeHtml(d) + '">' + escapeHtml(d) + '</option>';
      });
      html += '</optgroup>';
    }
    if (divSet.size > 0) {
      html += '<optgroup label="ฝ่ายงาน / หน้าที่รับผิดชอบ">';
      Array.from(divSet).forEach(function(dv) {
        html += '<option value="DIV:' + escapeHtml(dv) + '">' + escapeHtml(dv) + '</option>';
      });
      html += '</optgroup>';
    }

    deptSel.innerHTML = html;
    try {
      if (deptSel.options && Array.from(deptSel.options).some(function(o) { return o.value === prevVal; })) {
        deptSel.value = prevVal;
      }
    } catch (eOpt) {}
  }

  function MOD_LeaveDashboard_getLatestLeave(empId) {
    var activeLogsList = (g_ModLeaveLogs && g_ModLeaveLogs.length > 0) ? g_ModLeaveLogs : (g_LeaveLogs || []);
    var userLogs = activeLogsList.filter(function(l) { return l.EmpID === empId; });
    if (userLogs.length === 0) return null;
    var sorted = userLogs.slice().sort(function(a, b) {
      var dA = _dateStrToComparableNum(a.StartDate);
      var dB = _dateStrToComparableNum(b.StartDate);
      if (dB !== dA) return dB - dA;
      return String(b.LeaveID || '').localeCompare(String(a.LeaveID || ''));
    });
    return sorted[0];
  }

  function MOD_LeaveDashboard_buildExpandedHtml(u) {
    var empId = u.EmpID || u.id;
    var isSchoolDirector = (String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') !== -1);
    var activeLogsList = (g_ModLeaveLogs && g_ModLeaveLogs.length > 0) ? g_ModLeaveLogs : (g_LeaveLogs || []);
    var userLogsAll = activeLogsList.filter(function(l) { return l.EmpID === empId; });

    var sortedLogs = userLogsAll.slice().sort(function(a, b) {
      var dA = _dateStrToComparableNum(a.StartDate);
      var dB = _dateStrToComparableNum(b.StartDate);
      if (dB !== dA) return dB - dA;
      return String(b.LeaveID || '').localeCompare(String(a.LeaveID || ''));
    });

    var approvedByType = {};
    var pendingItemsCount = 0;
    var rejectedItemsCount = 0;

    sortedLogs.forEach(function(l) {
      var isApp = (l.Status === 'อนุมัติ' || l.Status === 'อนุมัติเรียบร้อย');
      var isRej = (l.Status === 'ไม่อนุมัติ');
      if (isApp) {
        var tName = l.LeaveType || 'ไม่ระบุประเภท';
        if (!approvedByType[tName]) {
          approvedByType[tName] = { count: 0, days: 0, hours: 0, isPermit: tName.indexOf('3 ชม.') !== -1 };
        }
        approvedByType[tName].count++;
        approvedByType[tName].days += (parseFloat(l.TotalDays) || 0);
        approvedByType[tName].hours = Number((approvedByType[tName].hours + (parseFloat(l.TotalHours) || 0)).toFixed(2));
      } else if (isRej) {
        rejectedItemsCount++;
      } else {
        pendingItemsCount++;
      }
    });

    var typeKeys = Object.keys(approvedByType);
    var breakdownHtml = '';
    if (typeKeys.length === 0) {
      breakdownHtml = '<span style="color:var(--text-muted); font-size:12px;">ยังไม่มีรายการลาที่ได้รับอนุมัติในปีงบประมาณนี้</span>';
    } else {
      breakdownHtml = typeKeys.map(function(k) {
        var obj = approvedByType[k];
        var unitTxt = obj.isPermit ? (obj.hours + ' ชั่วโมง') : (obj.days + ' วัน');
        return '<span class="emp-type-chip"><b style="color:var(--steam-cyan);">' + escapeHtml(k) + ':</b> ' + obj.count + ' ครั้ง · ' + unitTxt + '</span>';
      }).join('');
    }

    var posNoTxt = u.PositionNo || '—';
    var memberIdTxt = u.MemberID || '—';
    var divFullTxt = u.Division || u.division || '—';
    var deptFullTxt = u.Department || u.department || '—';
    var clsFullTxt = u.classLevel || '—';

    // คำนวณสถิติตามรอบการประเมิน ก.ค.ศ. ว15/2561 (รอบที่ 1: 1 ต.ค.-31 มี.ค. / รอบที่ 2: 1 เม.ย.-30 ก.ย.) ประจำปีงบประมาณปัจจุบัน
    var r1SickPersCount = 0, r1SickPersDays = 0;
    var r2SickPersCount = 0, r2SickPersDays = 0;
    var activeFiscalYearBE = (window.g_FiscalData && window.g_FiscalData.active && window.g_FiscalData.active.yearBE)
      ? parseInt(window.g_FiscalData.active.yearBE, 10)
      : (g_SchoolInfo && g_SchoolInfo.fiscalYear ? parseInt(g_SchoolInfo.fiscalYear, 10) : 2570);

    sortedLogs.forEach(function(l) {
      var isApp = (l.Status === 'อนุมัติ' || l.Status === 'อนุมัติเรียบร้อย');
      if (!isApp) return;
      var tName = String(l.LeaveType || '');
      if (tName === 'ลาป่วย' || tName === 'ลากิจ' || tName === 'ลากิจส่วนตัว') {
        var dStr = String(l.StartDate || '');
        var p = dStr.split('-');
        var mo = 0;
        var yBE = 0;
        if (p.length === 3) {
          if (p[0].length === 4) {
            yBE = (typeof normalizeYearToBEClient === 'function') ? normalizeYearToBEClient(p[0]) : parseInt(p[0], 10);
            mo = parseInt(p[1], 10);
          } else {
            yBE = (typeof normalizeYearToBEClient === 'function') ? normalizeYearToBEClient(p[2]) : parseInt(p[2], 10);
            mo = parseInt(p[1], 10);
          }
        } else {
          var p2 = dStr.split('/');
          if (p2.length === 3) {
            if (p2[0].length === 4) {
              yBE = (typeof normalizeYearToBEClient === 'function') ? normalizeYearToBEClient(p2[0]) : parseInt(p2[0], 10);
              mo = parseInt(p2[1], 10);
            } else {
              yBE = (typeof normalizeYearToBEClient === 'function') ? normalizeYearToBEClient(p2[2]) : parseInt(p2[2], 10);
              mo = parseInt(p2[1], 10);
            }
          }
        }

        var leaveFY = l.FiscalYear ? parseInt(l.FiscalYear, 10) : ((mo >= 10 && mo <= 12) ? (yBE + 1) : yBE);
        if (activeFiscalYearBE && leaveFY && leaveFY !== activeFiscalYearBE) return;

        var days = parseFloat(l.TotalDays) || 0;
        if (mo >= 10 || (mo >= 1 && mo <= 3)) {
          r1SickPersCount++;
          r1SickPersDays += days;
        } else if (mo >= 4 && mo <= 9) {
          r2SickPersCount++;
          r2SickPersDays += days;
        }
      }
    });

    var r1Warn = (r1SickPersCount > 6 || r1SickPersDays > 23);
    var r2Warn = (r2SickPersCount > 6 || r2SickPersDays > 23);
    var v15WarningHtml = '';
    if (r1Warn || r2Warn) {
      var wList = [];
      if (r1SickPersCount > 6) wList.push('รอบ 1 ลาบ่อยครั้ง (' + r1SickPersCount + ' ครั้ง > 6)');
      if (r1SickPersDays > 23) wList.push('รอบ 1 เกิน 23 วัน (' + r1SickPersDays + ' วัน)');
      if (r2SickPersCount > 6) wList.push('รอบ 2 ลาบ่อยครั้ง (' + r2SickPersCount + ' ครั้ง > 6)');
      if (r2SickPersDays > 23) wList.push('รอบ 2 เกิน 23 วัน (' + r2SickPersDays + ' วัน)');

      v15WarningHtml = '<div style="margin-top:8px; background:rgba(248,81,73,0.12); border:1px solid var(--red); border-left:3px solid var(--red); padding:6px 12px; border-radius:4px; display:flex; align-items:center; gap:8px; font-size:11.5px; color:#fff;">' +
        '<svg class="ui-ico-sm" style="color:var(--red); flex-shrink:0;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>' +
        '<div><b>แจ้งเตือนเกณฑ์เลื่อนเงินเดือน (ก.ค.ศ. ว15/2561):</b> ' + escapeHtml(wList.join(' · ')) + '</div>' +
      '</div>';
    }

    var quotaOrPolicyHtml = '';
    if (isSchoolDirector) {
      quotaOrPolicyHtml = '<div style="margin-top:6px; color:var(--steam-cyan); font-size:12px;"><b>แนวทางการยื่นลา:</b> ผู้อำนวยการสถานศึกษายื่นใบลาต่อผู้อำนวยการสำนักงานเขตพื้นที่การศึกษา สพป. ตามระเบียบ</div>';
    } else {
      var sickQuotaTxt = (u.SickMax !== undefined && u.SickMax !== null) ? ((u.SickDays || 0) + ' / ' + u.SickMax + ' วัน') : ((u.SickDays || 0) + ' วัน');
      var persQuotaTxt = (u.PersonalMax !== undefined && u.PersonalMax !== null) ? ((u.PersonalDays || 0) + ' / ' + u.PersonalMax + ' วัน') : ((u.PersonalDays || 0) + ' วัน');
      quotaOrPolicyHtml = '<div style="margin-top:6px; font-size:12px; color:var(--text-muted);">ยอดใช้สิทธิ์สะสม: <span style="color:#e6edf3;">ลาป่วย <b>' + escapeHtml(sickQuotaTxt) + '</b></span> · <span style="color:#e6edf3;">ลากิจส่วนตัว <b>' + escapeHtml(persQuotaTxt) + '</b></span></div>' + v15WarningHtml;
    }

    var showAll = !!g_ModShowAllLogsMap[empId];
    var logsToRender = showAll ? sortedLogs : sortedLogs.slice(0, 5);

    var historyListHtml = '';
    if (sortedLogs.length === 0) {

        var latestSummaryTxt = 'ยังไม่เคยมีประวัติการลา';
        if (latestLog) {
          var isPermit = (latestLog.LeaveType && latestLog.LeaveType.indexOf('3 ชม.') !== -1);
          var dateRangeStr = formatThaiRangeDisplay(latestLog.StartDate, latestLog.EndDate, isPermit, latestLog.StartTime, latestLog.EndTime);
          var isApp = (latestLog.Status === 'อนุมัติ' || latestLog.Status === 'อนุมัติเรียบร้อย');
          var isRej = (latestLog.Status === 'ไม่อนุมัติ');
          var stColor = isApp ? 'var(--steam-green)' : (isRej ? 'var(--red)' : 'var(--orange)');
          var stLabel = latestLog.Status || 'รออนุมัติ';
          if (isApp) stLabel = 'อนุมัติแล้ว';
          latestSummaryTxt = `ล่าสุด: ${escapeHtml(shortLeaveType(latestLog.LeaveType))} · ${dateRangeStr} · <b style="color:${stColor};">${escapeHtml(stLabel)}</b>`;
        }

        statusBadgeHtml = `
          <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:flex-end;">
            ${v15BadgePill}
            ${leavePill}
            ${permitPill}
          </div>
          <div style="font-size:12px; color:var(--text-muted); margin-top:3px;">
            ${latestSummaryTxt}
          </div>
        `;
      }

      return `
        <div class="emp-ribbon-card ${isExpanded ? 'expanded' : ''}" id="empRibbonCard_${escapeHtml(empId)}">
          <div class="emp-ribbon-main" onclick="MOD_LeaveDashboard_toggleExpand('${escapeHtml(empId)}', event)">
            <div class="std-ident-zone">
              <div class="std-name-line">${escapeHtml(u.FullName)}</div>
              <div class="std-meta-line">${identitySubtitleHtml}</div>
            </div>

            <div class="std-status-zone">
              ${statusBadgeHtml}
            </div>

            <button type="button" class="emp-expand-btn" title="${isExpanded ? 'ซ่อนรายละเอียด' : 'ดูประวัติการลา'}" onclick="MOD_LeaveDashboard_toggleExpand('${escapeHtml(empId)}', event)">
              ${arrowIcon}
            </button>
          </div>

          <div class="emp-detail-panel" id="empDetailPanel_${escapeHtml(empId)}">
            ${isExpanded ? MOD_LeaveDashboard_buildExpandedHtml(u) : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function MOD_LeaveDashboard_toggleExpand(empId, event) {
    if (event) event.stopPropagation();
    g_ModExpandedEmpId = (g_ModExpandedEmpId === empId) ? null : empId;
    MOD_LeaveDashboard_renderList();
  }

  function MOD_LeaveDashboard_showAllLogs(empId, event) {
    if (event) event.stopPropagation();
    g_ModShowAllLogsMap[empId] = true;
    MOD_LeaveDashboard_renderList();
  }

  function MOD_LeaveDashboard_resetFilters() {
    var s = document.getElementById('searchStaffInput'); if (s) s.value = '';
    var c = document.getElementById('filterStaffCategory'); if (c) c.value = 'ALL';
    var d = document.getElementById('filterStaffDept'); if (d) d.value = 'ALL';
    var st = document.getElementById('filterLeaveStatus'); if (st) st.value = 'ALL';
    var p = document.getElementById('filterDashboardPeriod'); if (p) p.value = 'ACTIVE';
    MOD_LeaveDashboard_renderList();
  }

  
  // ลงทะเบียนรับสัญญาณ Event Bus ข้ามโมดูล
  if (window.LeaveBus && typeof window.LeaveBus.on === 'function') {
    window.LeaveBus.on('LEAVE_UPDATED', function(data) {
      if (Array.isArray(window.g_UsersSummary) && window.g_UsersSummary.length > 0) {
        g_ModStaffList = window.g_UsersSummary;
      }
      if (Array.isArray(window.g_LeaveLogs) && window.g_LeaveLogs.length > 0) {
        g_ModLeaveLogs = window.g_LeaveLogs;
      }
      MOD_LeaveDashboard_updateHeaderAndCards();
      MOD_LeaveDashboard_renderList();
    });
  }

  // เชื่อมฟังก์ชันเดิมเข้ากับโมดูลใหม่ทั้งหมด
  window.renderMainDashboard = function() {
    if (Array.isArray(window.g_UsersSummary) && window.g_UsersSummary.length > 0) {
      g_ModStaffList = window.g_UsersSummary;
    }
    if (Array.isArray(window.g_LeaveLogs) && window.g_LeaveLogs.length > 0) {
      g_ModLeaveLogs = window.g_LeaveLogs;
    }
    MOD_LeaveDashboard_updateHeaderAndCards();
    MOD_LeaveDashboard_populateDeptOptions();
    MOD_LeaveDashboard_renderList();
    if (window.g_CurrentUser && (!g_ModStaffList || g_ModStaffList.length === 0) && (!window.g_UsersSummary || window.g_UsersSummary.length === 0)) {
      MOD_LeaveDashboard_boot(false);
    }
  };
  window.renderEmployeeRibbonList = MOD_LeaveDashboard_renderList;
  window.filterDashboardUsers = MOD_LeaveDashboard_renderList;
  window.resetDashboardFilters = MOD_LeaveDashboard_resetFilters;
</script>
