<script>
  // =========================================================================
  // MODULE: WORKLOAD CONTROLLER (JS_Mod_Workload.html)
  // แยกอิสระ 100% ควบคุมระบบบริหารและคำนวณภาระงานบุคลากร 4 หมวด
  // =========================================================================
  var g_ExpandedWlEmpId = null;
  var g_CurrentWorkloadViewTab = 'PERSONNEL';

  function switchWorkloadViewTab(tabName) {
    g_CurrentWorkloadViewTab = tabName;
    ['btnWlTab_personnel', 'btnWlTab_levels'].forEach(id => {
      const btn = document.getElementById(id);
      if (btn) btn.classList.remove('active');
    });
    if (tabName === 'PERSONNEL') {
      const b = document.getElementById('btnWlTab_personnel');
      if (b) b.classList.add('active');
    } else if (tabName === 'LEVELS') {
      const b = document.getElementById('btnWlTab_levels');
      if (b) b.classList.add('active');
    }
    renderStaffWorkloadList();
  }

  // =========================================================
  // 2. ภาระงานของบุคลากร (STAFF WORKLOAD MANAGEMENT)
  // =========================================================
  function renderStaffWorkloadModule() {
    populateWorkloadDeptFilters();
    renderStaffWorkloadList();

    const isAdmin = g_CurrentUser && (g_CurrentUser.accessLevel === 'Admin' || g_CurrentUser.accessLevel === 'Super Admin');
    const addBtn = document.getElementById('btnAdminAddWorkload');
    if (addBtn) addBtn.style.display = isAdmin ? 'inline-block' : 'none';
  }

  function populateWorkloadDeptFilters() {
    const sel = document.getElementById('wlFilterDept');
    if (!sel) return;
    const curVal = sel.value || 'ALL';

    const divSet = new Set();
    g_UsersSummary.forEach(u => {
      const uDiv = u.Division || u.division || '';
      if (uDiv && uDiv !== '-') {
        uDiv.split(',').forEach(p => {
          let c = p.trim();
          c = c.replace(/^\[(หลัก|รอง)\]\s*/, '').replace(/\((หลัก|รอง)\)\s*/, '').trim();
          if (c) divSet.add(c);
        });
      }
      const uDept = u.Department || u.department || '';
      if (uDept && uDept !== '-') {
        divSet.add(uDept.trim());
      }
    });

    let html = `<option value="ALL">ฝ่ายงาน / กลุ่มสาระ: ทั้งหมด</option>`;
    divSet.forEach(d => { html += `<option value="${escapeHtml(d)}">${escapeHtml(d)}</option>`; });
    sel.innerHTML = html;
    if (divSet.has(curVal)) sel.value = curVal;
  }

  function resetWorkloadFilters() {
    const s = document.getElementById('wlSearchInput'); if (s) s.value = '';
    const t = document.getElementById('wlFilterTier'); if (t) t.value = 'ALL';
    const d = document.getElementById('wlFilterDept'); if (d) d.value = 'ALL';
    g_WorkloadTierFilter = 'ALL';
    renderStaffWorkloadList();
  }

  function filterStaffWorkloadList() {
    const t = document.getElementById('wlFilterTier');
    if (t && t.value !== 'ALL') {
      g_WorkloadTierFilter = t.value;
    }
    renderStaffWorkloadList();
  }

  var g_WorkloadTierFilter = 'ALL';

  const HIGH_WEIGHT_TASKS = [
    'งานการเงิน', 'งานบัญชี', 'งานจัดซื้อจัดจ้าง', 'งานพัสดุ', 'งานแผนงาน', 'งานวัดผล', 'งานทะเบียนนักเรียน',
    'e-GP', 'GFMIS', 'e-Budget', 'DMC', 'SGS', 'ปพ.3', 'GPA'
  ];
  const MED_WEIGHT_TASKS = [
    'งานหลักสูตร', 'งานจัดการเรียนการสอน', 'งานนิเทศ', 'งานประกันคุณภาพ', 'งานระบบดูแลช่วยเหลือนักเรียน',
    'งานกิจการนักเรียน', 'งานสภานักเรียน', 'งานวินัย', 'อาหารกลางวัน', 'Thai School Lunch', 'CCT', 'HERO',
    'HRMS', 'DPA', 'e-Office', 'Smart OBEC', 'e-MES'
  ];

  function getTaskWeight(taskName, isSecondary) {
    let baseWeight = 2.0;
    if (HIGH_WEIGHT_TASKS.some(kw => taskName.includes(kw))) {
      baseWeight = 4.0;
    } else if (MED_WEIGHT_TASKS.some(kw => taskName.includes(kw))) {
      baseWeight = 3.0;
    }
    return isSecondary ? (baseWeight * 0.5) : baseWeight;
  }

  function calculateStaffWorkloadScore(u, customWls) {
    let points = 2.0; // base workload
    const advisorTxt = (u.classLevel && u.classLevel !== '-') ? u.classLevel : ((u.Class_Level && u.Class_Level !== '-') ? u.Class_Level : null);
    if (advisorTxt) points += 2.5;

    const divStr = String(u.Division || u.division || '').trim();
    const roleStr = String(u.Role || u.role || u.Position || '').trim();
    const isLeader = (divStr && (divStr.includes('หัวหน้า') || divStr.includes('รักษาราชการ') || divStr.includes('ผู้บริหาร'))) || (roleStr && (roleStr.includes('ผู้อำนวยการ') || roleStr.includes('รอง')));
    if (isLeader) points += 3.0;

    let primaryCount = 0;
    let secondaryCount = 0;

    if (divStr && divStr !== '-') {
      const parts = divStr.split(',');
      parts.forEach(p => {
        const clean = p.trim();
        if (!clean) return;
        const isSec = clean.startsWith('[รอง]') || clean.includes('(รอง)');
        if (isSec) secondaryCount++;
        else primaryCount++;
        points += getTaskWeight(clean, isSec);
      });
    }

    const cCount = (customWls ? customWls.length : 0);
    points += cCount * 1.5;

    const level = Math.min(10, Math.max(1, Math.round(points / 2.5)));
    return { points, level, primaryCount, secondaryCount };
  }

  function setWorkloadTierFilter(tier) {
    g_WorkloadTierFilter = tier;
    const tSel = document.getElementById('wlFilterTier');
    if (tSel) tSel.value = tier;
    renderStaffWorkloadList();
  }

  function renderStaffWorkloadList() {
    const container = document.getElementById('staffWorkloadRibbonContainer');
    if (!container) return;

    const q = (document.getElementById('wlSearchInput') ? document.getElementById('wlSearchInput').value : '').trim().toLowerCase();
    const tierSel = document.getElementById('wlFilterTier') ? document.getElementById('wlFilterTier').value : 'ALL';
    const deptFilter = document.getElementById('wlFilterDept') ? document.getElementById('wlFilterDept').value : 'ALL';

    const activeUsers = g_UsersSummary.filter(u => u.status !== 'ย้าย/เกษียณ');

    // 1. Calculate school benchmark metrics across all active users
    let sumPoints = 0;
    let sumLevels = 0;
    let tierAvailableCount = 0;
    let tierBalancedCount = 0;
    let tierHighCount = 0;
    let tierHeavyCount = 0;

    const userWorkloadMap = {};
    activeUsers.forEach(u => {
      const empId = u.EmpID || u.id;
      const customWls = g_Workloads.filter(w => (w.EmpID || w.empId) === empId);
      const wlData = calculateStaffWorkloadScore(u, customWls);
      userWorkloadMap[empId] = wlData;

      sumPoints += wlData.points;
      sumLevels += wlData.level;

      if (wlData.level <= 3) tierAvailableCount++;
      else if (wlData.level <= 6) tierBalancedCount++;
      else if (wlData.level <= 8) tierHighCount++;
      else tierHeavyCount++;
    });

    const avgPoints = activeUsers.length > 0 ? (sumPoints / activeUsers.length).toFixed(1) : '0.0';
    const avgLevel = activeUsers.length > 0 ? (sumLevels / activeUsers.length).toFixed(1) : '0.0';

    // 2. Filter users
    const filteredUsers = activeUsers.filter(u => {
      const empId = u.EmpID || u.id;
      const customWls = g_Workloads.filter(w => (w.EmpID || w.empId) === empId);
      const wlData = userWorkloadMap[empId] || { points: 2, level: 1 };

      const activeTier = (tierSel !== 'ALL') ? tierSel : g_WorkloadTierFilter;
      if (activeTier === 'AVAIL' && wlData.level > 3) return false;
      if (activeTier === 'BAL' && (wlData.level < 4 || wlData.level > 6)) return false;
      if (activeTier === 'HIGH' && (wlData.level < 7 || wlData.level > 8)) return false;
      if (activeTier === 'HEAVY' && wlData.level < 9) return false;

      if (q) {
        const hay = `${u.FullName || u.name || ''} ${empId} ${u.Position || u.role || ''} ${u.Department || u.department || ''} ${u.Division || u.division || ''}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      if (deptFilter !== 'ALL') {
        const userDiv = u.Division || u.division || '';
        const userDept = u.Department || u.department || '';
        const divs = String(userDiv).split(',').map(s => s.trim());
        if (!divs.includes(deptFilter) && String(userDept) !== deptFilter) return false;
      }

      return true;
    });

    const totalStaffCount = activeUsers.length;

    // Calculate total duty assignments across all staff Division fields + custom workloads
    let totalDutyAssignments = 0;
    activeUsers.forEach(u => {
      const divStr = String(u.Division || u.division || '').trim();
      if (divStr && divStr !== '-') {
        divStr.split(',').forEach(part => {
          if (part.trim()) totalDutyAssignments++;
        });
      }
    });
    const totalTasksCount = totalDutyAssignments + (g_Workloads ? g_Workloads.length : 0);

    // Core statutory school responsibilities to track vacancies
    const CORE_SCHOOL_TASKS = [
      { name: 'หัวหน้าฝ่ายบริหารวิชาการ', label: 'หน.วิชาการ' },
      { name: 'หัวหน้าฝ่ายบริหารงบประมาณ', label: 'หน.งบประมาณ' },
      { name: 'หัวหน้าฝ่ายบริหารงานบุคคล', label: 'หน.บุคคล' },
      { name: 'หัวหน้าฝ่ายบริหารทั่วไป', label: 'หน.บริหารทั่วไป' },
      { name: 'งานทะเบียน', label: 'ทะเบียน-วัดผล' },
      { name: 'งานหลักสูตร', label: 'หลักสูตร' },
      { name: 'งานการเงิน', label: 'การเงิน-พัสดุ' },
      { name: 'งานประกันคุณภาพ', label: 'ประกันคุณภาพ' },
      { name: 'งานแนะแนว', label: 'แนะแนว' },
      { name: 'สภานักเรียน', label: 'สภานักเรียน/กิจการ' }
    ];

    const vacantTasksList = [];
    CORE_SCHOOL_TASKS.forEach(t => {
      const isFilled = activeUsers.some(u => {
        const div = String(u.Division || u.division || '');
        return div.includes(t.name);
      });
      if (!isFilled) {
        vacantTasksList.push(t.label);
      }
    });

    // Update compact stat strip elements
    const elTotStaff = document.getElementById('wlTotalStaffCount'); if (elTotStaff) elTotStaff.innerText = totalStaffCount;
    const elAvail = document.getElementById('wlTierAvailCount'); if (elAvail) elAvail.innerText = tierAvailableCount;
    const elBal = document.getElementById('wlTierBalancedCount'); if (elBal) elBal.innerText = tierBalancedCount;
    const elHvy = document.getElementById('wlTierHeavyCount'); if (elHvy) elHvy.innerText = (tierHighCount + tierHeavyCount);
    const elTotTasks = document.getElementById('wlTotalTasksCount'); if (elTotTasks) elTotTasks.innerText = totalTasksCount;

    // 3. Render Tab LEVELS (จำแนกตามระดับภาระงาน)
    if (g_CurrentWorkloadViewTab === 'LEVELS') {
      const tiers = [
        { key: 'HEAVY', title: 'หนาแน่นมาก ระดับ 9 - 10', desc: 'ภาระงานสูงมาก ควรพิจารณาเกลี่ยงานหรือมอบหมายผู้ร่วมรับผิดชอบช่วยเสริม', color: '#ff6b6b', filter: u => (userWorkloadMap[u.EmpID || u.id] || {}).level >= 9 },
        { key: 'HIGH', title: 'ภาระงานสูง ระดับ 7 - 8', desc: 'มีภาระงานและหน้าที่ความรับผิดชอบหลายด้าน', color: 'var(--orange)', filter: u => { const l = (userWorkloadMap[u.EmpID || u.id] || {}).level; return l >= 7 && l <= 8; } },
        { key: 'BAL', title: 'ภาระงานสมดุล ระดับ 4 - 6', desc: 'ภาระงานมาตรฐาน มีความเหมาะสมตามตำแหน่งและวิทยฐานะ', color: 'var(--steam-green)', filter: u => { const l = (userWorkloadMap[u.EmpID || u.id] || {}).level; return l >= 4 && l <= 6; } },
        { key: 'AVAIL', title: 'รับงานเพิ่มได้ ระดับ 1 - 3', desc: 'มีเวลาและขีดความสามารถพร้อมรับมอบหมายหน้าที่โครงการเพิ่มเติม', color: 'var(--steam-cyan)', filter: u => (userWorkloadMap[u.EmpID || u.id] || {}).level <= 3 }
      ];

      let levelsHtml = '';
      tiers.forEach(t => {
        const staffInTier = filteredUsers.filter(t.filter);
        if (staffInTier.length === 0) return;

        levelsHtml += `
          <div style="background:rgba(0,0,0,0.22); border:1px solid #2a475e; border-radius:6px; padding:12px 16px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px dashed #2a475e; padding-bottom:8px; margin-bottom:10px; flex-wrap:wrap; gap:8px;">
              <div>
                <div style="font-weight:bold; font-size:14px; color:${t.color}; display:flex; align-items:center; gap:0;">
                  <svg class="ui-ico-sm" style="color:${t.color}; margin-right:8px;" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
                  <span>${t.title}</span>
                </div>
                <div style="font-size:11.5px; color:var(--text-muted); margin-top:2px;">${t.desc}</div>
              </div>
              <span style="background:rgba(102,192,244,0.14); border:1px solid var(--steam-cyan); color:var(--steam-cyan); padding:2px 10px; border-radius:12px; font-size:11.5px; font-weight:bold;">
                ${staffInTier.length} ท่าน
              </span>
            </div>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:8px;">
              ${staffInTier.map(u => {
                const empId = u.EmpID || u.id;
                const wlData = userWorkloadMap[empId] || { points: 2, level: 1 };
                let cbClass = 'cb-cyan';
                if (wlData.level >= 9) cbClass = 'cb-red';
                else if (wlData.level >= 7) cbClass = 'cb-orange';
                else if (wlData.level >= 4) cbClass = 'cb-green';

                return `
                  <div style="background:#101822; border:1px solid #23384c; border-radius:4px; padding:8px 12px; display:flex; justify-content:space-between; align-items:center;">
                    <div>
                      <div style="font-weight:bold; color:#fff; font-size:13px;">${escapeHtml(u.FullName)}</div>
                      <div style="font-size:11.5px; color:var(--text-muted);">${escapeHtml(u.Department || '')} · ${wlData.points.toFixed(1)} แต้ม</div>
                    </div>
                    <div class="circle-badge-10 ${cbClass}" style="width:30px; height:30px; font-size:14px;">${wlData.level}</div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = levelsHtml || '<div class="emp-empty-state">ไม่พบข้อมูลบุคลากรในหมวดหมู่นี้</div>';
      return;
    }

    // 4. Render Tab PERSONNEL (ทางเลือกที่ 3: Super Minimal สองโซนเรียบสนิท)
    if (filteredUsers.length === 0) {
      container.innerHTML = `
        <div class="emp-empty-state">
          <div style="font-weight:bold; color:#fff; font-size:14.5px; margin-bottom:4px;">ไม่พบข้อมูลภาระงานตามเงื่อนไขที่เลือก</div>
          <button type="button" class="btn-save-sm" onclick="resetWorkloadFilters()">แสดงบุคลากรทั้งหมด</button>
        </div>
      `;
      return;
    }

    const cardsHtml = filteredUsers.map(u => {
      const empId = u.EmpID || u.id;
      const isExpanded = (g_ExpandedWlEmpId === empId);
      const identitySubtitleHtml = buildStaffIdentitySubtitle(u);

      const customWls = g_Workloads.filter(w => (w.EmpID || w.empId) === empId);
      const wlData = userWorkloadMap[empId] || calculateStaffWorkloadScore(u, customWls);

      // Status Block & Circle Badge (สเกล 1 - 10)
      let cbClass = 'cb-cyan';
      let statusDesc = 'รับงานเพิ่มได้';
      let stColor = 'var(--steam-cyan)';
      if (wlData.level >= 9) {
        cbClass = 'cb-red';
        statusDesc = 'หนาแน่นมาก';
        stColor = '#ff6b6b';
      } else if (wlData.level >= 7) {
        cbClass = 'cb-orange';
        statusDesc = 'ภาระงานสูง';
        stColor = 'var(--orange)';
      } else if (wlData.level >= 4) {
        cbClass = 'cb-green';
        statusDesc = 'ภาระงานสมดุล';
        stColor = 'var(--steam-green)';
      }

      const arrowIcon = isExpanded
        ? `<svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="m18 15-6-6-6 6"/></svg>`
        : `<svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>`;

      return `
        <div class="wl-ribbon-card ${isExpanded ? 'expanded' : ''}" id="wlRibbonCard_${escapeHtml(empId)}">
          <div class="wl-ribbon-main" onclick="toggleWorkloadRibbonExpand('${escapeHtml(empId)}', event)">
            
            <div class="std-ident-zone">
              <div class="std-name-line">${escapeHtml(u.FullName || u.name)}</div>
              <div class="std-meta-line">${identitySubtitleHtml}</div>
            </div>

            <div class="wl-stats-middle-zone">
              <div class="circle-badge-10 ${cbClass}" title="ภาระงานระดับ ${wlData.level} จาก 10">${wlData.level}</div>
              <div>
                <div style="font-size:13.5px; font-weight:bold; color:${stColor};">${statusDesc}</div>
                <div style="font-size:11.5px; color:var(--text-muted);">${wlData.points.toFixed(1)} แต้ม</div>
              </div>
            </div>

            <button type="button" class="emp-expand-btn" title="${isExpanded ? 'ย่อรายละเอียด' : 'ดูรายละเอียดภาระงาน'}" onclick="toggleWorkloadRibbonExpand('${escapeHtml(empId)}', event)">${arrowIcon}</button>
          </div>

          <div class="std-detail-panel" id="wlDetailPanel_${escapeHtml(empId)}">
            ${isExpanded ? buildStaffWorkloadDetailHtml(u, customWls) : ''}
          </div>
        </div>
      `;
    }).join('');

    container.innerHTML = cardsHtml;
  }

  function toggleWorkloadRibbonExpand(empId, event) {
    if (event) event.stopPropagation();
    g_ExpandedWlEmpId = (g_ExpandedWlEmpId === empId) ? null : empId;
    renderStaffWorkloadList();
  }

  function buildStaffWorkloadDetailHtml(u, customWls) {
    const empId = u.EmpID || u.id;
    const isAdmin = g_CurrentUser && (g_CurrentUser.accessLevel === 'Admin' || g_CurrentUser.accessLevel === 'Super Admin');
    const wlData = calculateStaffWorkloadScore(u, customWls);
    const advisorClass = (u.classLevel && u.classLevel !== '-') ? u.classLevel : ((u.Class_Level && u.Class_Level !== '-') ? u.Class_Level : 'ไม่มีชั้นที่ปรึกษา');
    const dutyDayTxt = (u.dutyDay && u.dutyDay !== '-') ? u.dutyDay : ((u.Duty_Day && u.Duty_Day !== '-') ? u.Duty_Day : 'ตามคำสั่งโรงเรียน');
    const userDept = u.Department || u.department || '-';

    const topCardsHtml = `
      <div class="std-expanded-refs-grid">
        <div class="std-ref-card std-ref-pos">
          <svg class="ui-ico-sm" style="color:var(--steam-cyan); flex-shrink:0; width:15px; height:15px; margin-right:4px;" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>
          <div>กลุ่มสาระ: <b style="color:#66c0f4;">${escapeHtml(userDept)}</b></div>
        </div>
        <div class="std-ref-card std-ref-start">
          <svg class="ui-ico-sm" style="color:var(--amber, #f59e0b); flex-shrink:0; width:15px; height:15px; margin-right:4px;" viewBox="0 0 24 24"><path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/></svg>
          <div>ชั้นที่ปรึกษา: <b style="color:#fff;">${escapeHtml(advisorClass)}</b></div>
        </div>
        <div class="std-ref-card std-ref-tenure">
          <svg class="ui-ico-sm" style="color:var(--steam-green); flex-shrink:0; width:15px; height:15px; margin-right:4px;" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
          <div>ภาระงานรวม: <b style="color:var(--steam-green);">${wlData.points.toFixed(1)} แต้ม · ระดับ ${wlData.level}</b></div>
        </div>
      </div>
    `;

    // 1. หมวดที่ 1: งานสอนและการจัดการเรียนรู้
    const teachingTasks = (customWls || []).filter(w => {
      const c = w.Category || w.category || '';
      return c === 'งานสอน' || c === 'งานสอนและการจัดการเรียนรู้';
    });
    const totalTeachingHours = teachingTasks.reduce((sum, w) => sum + (parseFloat(w.HoursPerWeek || w.hoursPerWeek) || 0), 0);
    const isEarlyChildhood = (advisorClass.includes('ปฐมวัย') || advisorClass.includes('อนุบาล')) || 
                             (userDept.includes('ปฐมวัย') || userDept.includes('อนุบาล'));
    const minTeachingHours = isEarlyChildhood ? 14 : 12; // ชั่วโมงสอนขั้นต่ำตามเกณฑ์ ว9/2564
    const minRequiredHours = minTeachingHours;
    const isTeachingHoursMet = totalTeachingHours >= minTeachingHours;

  function handleWorkloadCategoryChange(currentTitle) {
    const catSel = document.getElementById('wlForm_category');
    const presetSel = document.getElementById('wlForm_taskPreset');
    if (!catSel || !presetSel) return;

    const cat = catSel.value;
    const presets = WORKLOAD_CATEGORY_PRESETS[cat] || [];
    
    let opts = `<option value="">+ คลิกเลือกรายการมาตรฐานในหมวดนี้ หรือพิมพ์ระบุเองด้านล่าง...</option>`;
    presets.forEach(p => {
      opts += `<option value="${escapeHtml(p.title)}" data-sub="${escapeHtml(p.sub)}" data-role="${escapeHtml(p.role)}">${escapeHtml(p.title)}</option>`;
    });
    opts += `<option value="__CUSTOM__">+ พิมพ์ระบุชื่องานเอง (กำหนดเอง)...</option>`;
    presetSel.innerHTML = opts;

    if (currentTitle) {
      const match = presets.find(p => p.title === currentTitle);
      if (match) presetSel.value = currentTitle;
      else presetSel.value = '__CUSTOM__';
    } else {
      presetSel.value = '';
    }
  }

  function applyWorkloadTaskPreset(val) {
    const titleInp = document.getElementById('wlForm_title');
    const presetSel = document.getElementById('wlForm_taskPreset');
    if (!titleInp || !presetSel) return;

    if (val === '__CUSTOM__') {
      titleInp.value = '';
      titleInp.focus();
      return;
    }
    if (!val) return;

    titleInp.value = val;
    const selectedOpt = presetSel.options[presetSel.selectedIndex];
    if (selectedOpt) {
      const subVal = selectedOpt.getAttribute('data-sub');
      const roleVal = selectedOpt.getAttribute('data-role');
      const subInp = document.getElementById('wlForm_subGroup');
      const roleInp = document.getElementById('wlForm_role');
      if (subInp && !subInp.value.trim() && subVal) subInp.value = subVal;
      if (roleInp && roleVal) roleInp.value = roleVal;
    }
  }

  function openWorkloadModal(workloadObj) {
    const modal = document.getElementById('modalWorkloadForm');
    const selEmp = document.getElementById('wlForm_empId');
    if (!modal || !selEmp) return;

    let opts = `<option value="">-- เลือกบุคลากรผู้รับผิดชอบหลัก --</option>` +
      g_UsersSummary.filter(u => u.status !== 'ย้าย/เกษียณ').map(u =>
        `<option value="${escapeHtml(u.EmpID)}">${escapeHtml(u.FullName)} · ${escapeHtml(u.EmpID)}</option>`
      ).join('');
    selEmp.innerHTML = opts;

    if (workloadObj) {
      document.getElementById('wlModalFormTitle').innerText = 'Personnel Workload';
      document.getElementById('wlForm_workloadId').value = workloadObj.WorkloadID || '';
      selEmp.value = workloadObj.EmpID || '';
      let cVal = workloadObj.Category || 'งานบริหารและงานประจำฝ่าย/กลุ่มงาน';
      if (cVal === 'งานสอน') cVal = 'งานสอนและการจัดการเรียนรู้';
      else if (cVal === 'งานประจำฝ่าย') cVal = 'งานบริหารและงานประจำฝ่าย/กลุ่มงาน';
      else if (cVal === 'งานที่ได้รับมอบหมาย') cVal = 'งานโครงการ กิจกรรม และงานที่ได้รับมอบหมายพิเศษ';
      else if (cVal === 'งานอื่น ๆ') cVal = 'งานดูแลช่วยเหลือนักเรียน งานครูที่ปรึกษา และเวรปฏิบัติหน้าที่';
      document.getElementById('wlForm_category').value = cVal;
      document.getElementById('wlForm_title').value = workloadObj.Title || '';
      document.getElementById('wlForm_subGroup').value = workloadObj.SubGroupOrLevel || '';
      document.getElementById('wlForm_hours').value = workloadObj.HoursPerWeek || '';
      document.getElementById('wlForm_role').value = workloadObj.RoleInTask || 'ผู้รับผิดชอบหลัก';
      document.getElementById('wlForm_orderRef').value = workloadObj.OrderOrRef || '';
      document.getElementById('wlForm_status').value = workloadObj.Status || 'กำลังดำเนินการ';
      document.getElementById('wlForm_coEmp').value = workloadObj.CoEmpIDs || '';
      handleWorkloadCategoryChange(workloadObj.Title || '');
    } else {
      document.getElementById('wlModalFormTitle').innerText = 'Personnel Workload';
      document.getElementById('workloadDataForm').reset();
      document.getElementById('wlForm_workloadId').value = '';
      handleWorkloadCategoryChange();
    }
    modal.style.display = 'flex';
  }

  function closeWorkloadModal() {
    const modal = document.getElementById('modalWorkloadForm');
    if (modal) modal.style.display = 'none';
  }

  function handleWorkloadFormSubmit(e) {
    e.preventDefault();
    const payload = {
      workloadId: document.getElementById('wlForm_workloadId').value,
      empId: document.getElementById('wlForm_empId').value,
      category: document.getElementById('wlForm_category').value,
      title: document.getElementById('wlForm_title').value.trim(),
      subGroupOrLevel: document.getElementById('wlForm_subGroup').value.trim(),
      hoursPerWeek: document.getElementById('wlForm_hours').value.trim(),
      roleInTask: document.getElementById('wlForm_role').value,
      academicTerm: (g_FiscalData && g_FiscalData.active && g_FiscalData.active.yearBE) ? g_FiscalData.active.yearBE : '2570',
      orderOrRef: document.getElementById('wlForm_orderRef').value.trim(),
      status: document.getElementById('wlForm_status').value,
      coEmpIds: document.getElementById('wlForm_coEmp').value.trim(),
      assignedBy: g_CurrentUser ? g_CurrentUser.name : 'Admin'
    };

    startLoadingBar('Saving Workload...');
    const actor = g_CurrentUser ? (g_CurrentUser.email || g_CurrentUser.name) : 'Admin';
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          steamAlert(res.message);
          if (res.status === 'success') {
            closeWorkloadModal();
            refreshAllData();
          }
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .saveStaffWorkloadRecord(payload, actor);
  }

  function handleDeleteWorkloadItem(wlId) {
    steamConfirm('Are you sure you want to delete this record?', () => {
      startLoadingBar('Deleting Workload...');
      const actor = g_CurrentUser ? (g_CurrentUser.email || g_CurrentUser.name) : 'Admin';
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert(res.message);
            refreshAllData();
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
        .deleteStaffWorkloadRecord(wlId, actor);
    });
  }

  // เชื่อมต่อ Event Bus เพื่ออัปเดตภาระงานบุคลากรแบบ Real-time
  if (window.LeaveBus && typeof window.LeaveBus.on === 'function') {
    window.LeaveBus.on('LEAVE_UPDATED', function() {
      const view = document.getElementById('view_workload');
      if (view && view.style.display !== 'none') {
        renderStaffWorkloadModule();
      }
    });
  }
