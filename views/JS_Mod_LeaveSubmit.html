        .c-svg-dd-group { padding: 6px 12px 4px 12px; font-size: 11px; font-weight: bold; color: var(--steam-cyan); text-transform: uppercase; letter-spacing: 0.3px; background: rgba(102,192,244,0.06); }

        .c-svg-dd-item { padding: 8px 14px; display: flex; align-items: center; gap: 0; font-size: 13.5px; color: #e6edf3; cursor: pointer; transition: 0.15s; }

        .c-svg-dd-item.locked-opt { color: var(--orange); opacity: 0.85; }
        .c-svg-dd-item.locked-opt:hover { background: rgba(210,153,34,0.15); }
      `;
      document.head.appendChild(st);
    }

    const nativeSel = document.getElementById('leaveType');
    if (nativeSel && !document.getElementById('customLeaveTypeDropdownWrap')) {
      nativeSel.style.display = 'none';
      const wrap = document.createElement('div');
      wrap.id = 'customLeaveTypeDropdownWrap';
      wrap.className = 'c-svg-dd-wrap';

      let menuHtml = '';
      LEAVE_TYPE_SVG_OPTIONS.forEach(grp => {
        if (grp.divider) menuHtml += `<hr class="c-svg-dd-divider">`;
        menuHtml += `<div class="c-svg-dd-group">${escapeHtml(grp.group)}</div>`;
        grp.items.forEach(it => {

          `;

      });

      const chevDownSvg = '<svg class="ui-ico-sm" style="color:var(--text-muted);" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';

          <span id="customLeaveTypeSelectedContent" style="display:inline-flex; align-items:center; gap:0;">

          ${chevDownSvg}
        </button>
        <div class="c-svg-dd-menu" id="customLeaveTypeMenu">${menuHtml}</div>
      `;
      nativeSel.parentNode.insertBefore(wrap, nativeSel.nextSibling);
    }

    evaluateLeavePolicyNotice();
  }

  function toggleCustomLeaveTypeMenu(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('customLeaveTypeMenu');
    const btn = document.getElementById('customLeaveTypeBtn');
    const subMenu = document.getElementById('customSubTeacherMenu');
    if (subMenu) subMenu.classList.remove('show');
    if (!menu) return;
    const isShow = menu.classList.toggle('show');
    if (btn) btn.classList.toggle('open', isShow);
  }

  function onSelectCustomLeaveType(val, e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('customLeaveTypeMenu');
    const btn = document.getElementById('customLeaveTypeBtn');

    if (val === 'ลาพักผ่อน') {
      triggerVacationLockClick();
      return;
    }
    if (menu) menu.classList.remove('show');
    if (btn) btn.classList.remove('open');
    setCustomLeaveTypeValue(val);
    toggleLeaveTimeFields();
    evaluateLeavePolicyNotice();
  }

  function setCustomLeaveTypeValue(val) {
    const nativeSel = document.getElementById('leaveType');
    if (nativeSel) nativeSel.value = val;

    let foundItem = null;
    LEAVE_TYPE_SVG_OPTIONS.forEach(g => {
      g.items.forEach(it => { if (it.value === val) foundItem = it; });
    });

    if (foundItem) {
      const disp = document.getElementById('customLeaveTypeSelectedContent');
      if (disp) {
        disp.innerHTML = `${foundItem.svg}<span style="margin-left: 8px;">${escapeHtml(foundItem.label)}</span>`;
      }
      document.querySelectorAll('#customLeaveTypeMenu .c-svg-dd-item').forEach(el => {
        el.classList.toggle('active', el.getAttribute('data-val') === val);
      });
    }
  }

  function evaluateLeavePolicyNotice() {
    const banner = document.getElementById('leavePolicyAlertBanner');
    if (!banner) return;

    const selEl = document.getElementById('leaveType');
    const type = selEl ? selEl.value : 'ลาป่วย';
    const startEl = document.getElementById('leaveStartDate');
    const endEl = document.getElementById('leaveEndDate');
    const startStr = startEl ? startEl.value : '';
    const endStr = (endEl && endEl.value) ? endEl.value : startStr;

    const regInfo = LEAVE_REGULATIONS_DETAIL[type] || {
      title: `ระเบียบการลา (${type})`,
      quota: 'ตามหลักเกณฑ์ที่ทางราชการกำหนด',
      rule: 'กรุณาระบุช่วงวันที่ลา สาเหตุ และสถานที่ติดต่อระหว่างลาให้ครบถ้วน',
      color: 'var(--steam-cyan)'
    };

    const typeIconSvg = _getLeaveTypeSvgByVal(type);
    const icoWarn = '<svg class="ui-ico-sm" style="color:var(--red);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>';
    const icoCheck = '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';

    let extraWarningHtml = '';
    let borderColor = regInfo.color || 'var(--steam-cyan)';
    let bgColor = 'rgba(102, 192, 244, 0.1)';
    if (type === 'ขออนุญาต (ไม่เกิน 3 ชม.)') {
      bgColor = 'rgba(164, 208, 7, 0.1)';
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    if (type === 'ลากิจ' && startStr) {
      const p = startStr.split('-');
      if (p.length === 3) {
        const yr = typeof normalizeYearToCEClient === 'function' ? normalizeYearToCEClient(p[0]) : parseInt(p[0], 10);
        const startDate = new Date(yr, parseInt(p[1], 10) - 1, parseInt(p[2], 10));
        const diffDays = Math.ceil((startDate - today) / (1000 * 60 * 60 * 24));
        if (diffDays < 3) {
          borderColor = 'var(--red)';
          bgColor = 'rgba(248, 81, 73, 0.14)';
          extraWarningHtml = `
            <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(248,81,73,0.45); color:#ff7b72; font-size:12px; display:flex; align-items:center; gap:0;">
              ${icoWarn}<span style="margin-left: 8px;"><b>แจ้งเตือนการลากิจกะทันหัน:</b> ท่านยื่นลากิจล่วงหน้าเพียง <b>${Math.max(0, diffDays)} วัน</b> (น้อยกว่าเกณฑ์ 3 วันทำการ) กรุณาระบุเหตุผลความจำเป็นเร่งด่วน</span>
            </div>
          `;
        }
      }
    } else if (type === 'ลาป่วย') {
      if (endStr) {
        const p = endStr.split('-');
        if (p.length === 3) {
          const yr = typeof normalizeYearToCEClient === 'function' ? normalizeYearToCEClient(p[0]) : parseInt(p[0], 10);
          const endDate = new Date(yr, parseInt(p[1], 10) - 1, parseInt(p[2], 10));
          const daysAfterReturn = Math.floor((today - endDate) / (1000 * 60 * 60 * 24));
          if (daysAfterReturn > 3) {
            borderColor = 'var(--orange)';
            bgColor = 'rgba(210, 153, 34, 0.14)';
            extraWarningHtml += `
              <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(210,153,34,0.45); color:var(--orange); font-size:12px; display:flex; align-items:center; gap:0;">
                ${icoWarn}<span style="margin-left: 8px;"><b>แจ้งเตือนการส่งใบลาป่วยย้อนหลัง:</b> วันสิ้นสุดการลาผ่านมาแล้ว <b>${daysAfterReturn} วัน</b> (ควรส่งภายใน 3 วันทำการหลังกลับมาทำงาน)</span>
              </div>
            `;
          }
        }
      }
      if (startStr) {
        const p1 = startStr.split('-');
        const p2 = (endStr || startStr).split('-');
        if (p1.length === 3 && p2.length === 3) {
          const y1 = typeof normalizeYearToCEClient === 'function' ? normalizeYearToCEClient(p1[0]) : parseInt(p1[0], 10);
          const y2 = typeof normalizeYearToCEClient === 'function' ? normalizeYearToCEClient(p2[0]) : parseInt(p2[0], 10);
          const d1 = new Date(y1, parseInt(p1[1], 10) - 1, parseInt(p1[2], 10));
          const d2 = new Date(y2, parseInt(p2[1], 10) - 1, parseInt(p2[2], 10));
          const spanDays = Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
          if (spanDays >= 30) {
            borderColor = 'var(--red)';
            bgColor = 'rgba(248, 81, 73, 0.16)';
            extraWarningHtml += `
              <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(248,81,73,0.45); color:#ff7b72; font-size:12px; display:flex; align-items:center; gap:0;">
                ${icoWarn}<span style="margin-left: 8px;"><b>ระเบียบบังคับแนบใบรับรองแพทย์:</b> การลาป่วยตั้งแต่ <b>30 วันขึ้นไป</b> (คำร้องนี้ ${spanDays} วัน) ต้องแนบใบรับรองของแพทย์แผนปัจจุบันชั้นหนึ่งของสถานพยาบาลทางราชการประกอบการลาอย่างเคร่งครัด</span>
              </div>
            `;
          } else if (spanDays > 3) {
            extraWarningHtml += `
              <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(210,153,34,0.45); color:var(--orange); font-size:12px; display:flex; align-items:center; gap:0;">
                ${icoWarn}<span style="margin-left: 8px;"><b>คำแนะนำตามระเบียบ:</b> การลาป่วยติดต่อกันเกิน <b>3 วันทำการ</b> ควรแนบใบรับรองแพทย์ประกอบการพิจารณาของผู้บังคับบัญชา</span>
              </div>
            `;
          }
        }
      }
    } else if (type === 'ลาพักผ่อน') {
      const uRole = (window.g_CurrentUser && (window.g_CurrentUser.role || window.g_CurrentUser.Position)) ? String(window.g_CurrentUser.role || window.g_CurrentUser.Position) : '';
      const isTeacher = (uRole.includes('ครู') || uRole.includes('อาจารย์')) && !uRole.includes('ผู้อำนวยการ');
      if (isTeacher) {
        borderColor = 'var(--red)';
        bgColor = 'rgba(248, 81, 73, 0.16)';
        extraWarningHtml += `
          <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(248,81,73,0.45); color:#ff7b72; font-size:12px; display:flex; align-items:center; gap:0;">
            ${icoWarn}<span style="margin-left: 8px;"><b>คำเตือนตามระเบียบสำนักนายกฯ และ ก.ค.ศ.:</b> ข้าราชการครูในสถานศึกษาที่มีวันหยุดภาคเรียน <b>ไม่มีสิทธิลาพักผ่อนประจำปี</b> (ยกเว้นผู้บริหารสถานศึกษาหรือผู้ได้รับมอบหมายให้ปฏิบัติหน้าที่ประจำตลอดปี และต้องบรรจุครบ 6 เดือน)</span>
          </div>
        `;
      }
    }

    if ((type === 'ลากิจ' || type === 'ลากิจส่วนตัว') && window.g_CurrentUser && window.g_CurrentUser.StartDate) {
      const sRaw = String(window.g_CurrentUser.StartDate).trim();
      const pS = sRaw.split('-');
      if (pS.length === 3) {
        const yS = typeof normalizeYearToCEClient === 'function' ? normalizeYearToCEClient(pS[0]) : parseInt(pS[0], 10);
        const sDate = new Date(yS, parseInt(pS[1], 10) - 1, parseInt(pS[2], 10));
        const diffY = (today - sDate) / (1000 * 60 * 60 * 24 * 365.25);
        if (diffY < 1) {
          extraWarningHtml += `
            <div style="margin-top:8px; padding-top:6px; border-top:1px dashed rgba(102,192,244,0.45); color:var(--steam-cyan); font-size:12px; display:flex; align-items:center; gap:0;">
              ${icoCheck}<span style="margin-left: 8px;"><b>สิทธิการลากิจปีแรกที่บรรจุ (ข้อ 22):</b> ผู้บรรจุเข้ารับราชการยังไม่ครบ 1 ปีในปีงบประมาณปัจจุบัน มีสิทธิลากิจส่วนตัวได้ไม่เกิน <b>15 วันทำการ</b></span>
            </div>
          `;
        }
      }
    }

    banner.style.display = 'block';
    banner.style.background = bgColor;
    banner.style.borderColor = borderColor;
    banner.style.borderLeft = `4px solid ${borderColor}`;
    banner.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; border-bottom:1px dashed rgba(255,255,255,0.14); padding-bottom:6px; margin-bottom:6px;">
        <div style="display:flex; align-items:center; gap:0; font-weight:bold; font-size:13.5px; color:#fff;">
          ${typeIconSvg}<span style="margin-left: 8px;">${escapeHtml(regInfo.title)}</span>
        </div>
        <span style="background:rgba(0,0,0,0.35); border:1px solid #2a475e; padding:2px 10px; border-radius:12px; font-size:11.5px; color:var(--steam-green); font-weight:bold; display:inline-flex; align-items:center; gap:0;">
          ${icoCheck}<span style="margin-left: 8px;">สิทธิ์การลา: ${escapeHtml(regInfo.quota)}</span>
        </span>
      </div>
      <div style="font-size:12.5px; color:#d0d7de; line-height:1.6;">
        • <b>หลักเกณฑ์การปฏิบัติ:</b> ${regInfo.rule}
      </div>
      ${extraWarningHtml}
    `;
  }

  function calcPermitHoursPreview() {
    const stEl = document.getElementById('leaveStartTime');
    const etEl = document.getElementById('leaveEndTime');
    const box = document.getElementById('permitHoursPreviewText');
    if (!stEl || !etEl || !box) return;
    const st = stEl.value;
    const et = etEl.value;
    if (!st || !et) return;
    const sParts = st.split(':');
    const eParts = et.split(':');
    const mins = (parseInt(eParts[0], 10) * 60 + parseInt(eParts[1], 10)) - (parseInt(sParts[0], 10) * 60 + parseInt(sParts[1], 10));
    const hrs = Number((mins / 60).toFixed(2));
    const icoCheck = '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>';
    if (hrs <= 0) {
      box.style.color = 'var(--red)';
      box.innerText = 'เวลาสิ้นสุดต้องมากกว่าเวลาเริ่มต้น';
    } else if (hrs > 3) {
      box.style.color = 'var(--red)';
      box.innerText = `รวมเวลา ${hrs} ชั่วโมง (เกินเกณฑ์ 3 ชั่วโมง)`;
    } else {
      box.style.color = 'var(--steam-green)';
      box.innerHTML = `<span style="display:inline-flex; align-items:center; gap:0;">${icoCheck}<span style="margin-left: 8px;">รวมเวลาขออนุญาต: ${hrs} ชั่วโมง</span></span>`;
    }
  }

  function populateSubstituteDropdown() {
    const startVal = document.getElementById('leaveStartDate') ? document.getElementById('leaveStartDate').value : '';
    const endVal = (document.getElementById('leaveEndDate') && document.getElementById('leaveEndDate').value) ? document.getElementById('leaveEndDate').value : startVal;

    const onLeaveIds = new Set();
    if (startVal && g_LeaveLogs) {
      g_LeaveLogs.forEach(l => {
        if (l.Status !== 'ไม่อนุมัติ') {
          let lStart = l.StartDate || '';
          let lEnd = l.EndDate || lStart;
          if (lStart <= endVal && lEnd >= startVal) onLeaveIds.add(l.EmpID);
        }
      });
    }

    const myId = g_CurrentUser ? (g_CurrentUser.EmpID || g_CurrentUser.id) : '';
    let teacherOptsOnly = '<option value="">-- เลือกผู้สอนแทน --</option>';
    let fullSubOpts = '<option value="ไม่มีคาบสอนในวันที่ลา">ไม่มีคาบสอนในวันที่ลา</option><optgroup label="รายชื่อบุคลากรในโรงเรียน">';

    if (g_UsersSummary) {
      g_UsersSummary.forEach(u => {
        const pStr = String(u.Position || u.role || '').toLowerCase();
        const dStr = String(u.department || u.Division || '').toLowerCase();
        if (u.EmpID === myId || u.status === 'ย้าย/เกษียณ' || pStr.includes('ผู้อำนวยการ') || pStr.includes('ภารโรง') || pStr.includes('นักการ') || pStr.includes('แม่บ้าน') || pStr.includes('คนสวน') || pStr.includes('รปภ') || pStr.includes('ยาม') || pStr.includes('คนขับ') || pStr.includes('ช่าง') || dStr.includes('ภารโรง') || dStr.includes('แม่บ้าน')) return;
        const isBusy = onLeaveIds.has(u.EmpID);
        const busyTag = isBusy ? ' (ติดลาวันนี้)' : '';
        fullSubOpts += `<option value="มอบหมายให้ ${escapeHtml(u.FullName)} สอนแทน">${escapeHtml(u.FullName)}${busyTag}</option>`;
        teacherOptsOnly += `<option value="${escapeHtml(u.FullName)}">${escapeHtml(u.FullName)}${busyTag}</option>`;
      });
    }
    fullSubOpts += '</optgroup>';

    const sel11 = document.getElementById('leaveSubTeacherSelect');
    if (sel11) {
      const cur = sel11.value;
      sel11.innerHTML = fullSubOpts;
      if (cur) sel11.value = cur;
    }

    renderCustomSubTeacherSvgDropdown(onLeaveIds);

    let clsOpts = '<option value="">-- เลือกชั้น --</option>' + (g_ActiveClasses || []).map(c => `<option value="${escapeHtml(shortClass(c))}">${escapeHtml(shortClass(c))}</option>`).join('');
    [1, 2, 3].forEach(i => {
      let cEl = document.getElementById('pw_cls_' + i);
      if (cEl && !cEl.innerHTML) cEl.innerHTML = clsOpts;
      let sEl = document.getElementById('pw_sub_' + i);
      if (sEl) {
        let curS = sEl.value;
        sEl.innerHTML = teacherOptsOnly;
        if (curS) sEl.value = curS;
      }
    });
  }

  function renderCustomSubTeacherSvgDropdown(onLeaveIds) {
    const nativeSubSel = document.getElementById('leaveSubTeacherSelect');
    if (!nativeSubSel) return;

    nativeSubSel.style.display = 'none';
    let wrap = document.getElementById('customSubTeacherDropdownWrap');
    if (!wrap) {
      wrap = document.createElement('div');
      wrap.id = 'customSubTeacherDropdownWrap';
      wrap.className = 'c-svg-dd-wrap';
      nativeSubSel.parentNode.insertBefore(wrap, nativeSubSel.nextSibling);
    }

    const myId = g_CurrentUser ? (g_CurrentUser.EmpID || g_CurrentUser.id) : '';
    const icoCheck = '<svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg>';
    const icoUserOk = '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>';
    const icoUserBusy = '<svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="17" x2="22" y1="8" y2="13"/><line x1="22" x2="17" y1="8" y2="13"/></svg>';

    let itemsHtml = `
      <div class="c-svg-dd-group">กรณีไม่มีคาบสอน</div>
      <div class="c-svg-dd-item" onclick="onSelectCustomSubTeacher('ไม่มีคาบสอนในวันที่ลา', 'ไม่มีคาบสอนในวันที่ลา', event)">
        ${icoCheck}<span style="margin-left: 8px;">ไม่มีคาบสอนในวันที่ลา</span>
      </div>
      <hr class="c-svg-dd-divider">
      <div class="c-svg-dd-group">รายชื่อบุคลากรในโรงเรียน (เลือกผู้สอนแทน)</div>
    `;

    if (g_UsersSummary) {
      g_UsersSummary.forEach(u => {
        if (u.EmpID === myId || u.status === 'ย้าย/เกษียณ' || String(u.Position || '').indexOf('ผู้อำนวยการสถานศึกษา') !== -1 || String(u.Position || '').indexOf('ภารโรง') !== -1 || String(u.Position || '').indexOf('แม่บ้าน') !== -1 || String(u.Position || '').indexOf('รปภ') !== -1) return;
        const isBusy = onLeaveIds && onLeaveIds.has(u.EmpID);
        const val = `มอบหมายให้ ${u.FullName} สอนแทน`;
        const label = `${u.FullName}` + (isBusy ? ' — ติดลาวันนี้' : '');
        itemsHtml += `
          <div class="c-svg-dd-item ${isBusy ? 'locked-opt' : ''}" onclick="onSelectCustomSubTeacher('${escapeHtml(val)}', '${escapeHtml(label)}', event)">
            ${isBusy ? icoUserBusy : icoUserOk}<span style="margin-left: 8px;">${escapeHtml(label)}</span>
          </div>
        `;
      });
    }

    const curVal = nativeSubSel.value || 'ไม่มีคาบสอนในวันที่ลา';
    nativeSubSel.value = curVal;
    const chevDownSvg = '<svg class="ui-ico-sm" style="color:var(--text-muted);" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';

    wrap.innerHTML = `
      <button type="button" class="c-svg-dd-btn" id="customSubTeacherBtn" onclick="toggleCustomSubTeacherMenu(event)">
        <span id="customSubTeacherSelectedContent" style="display:inline-flex; align-items:center; gap:0;">
          ${icoUserOk}<span style="margin-left: 8px;">${escapeHtml(curVal)}</span>
        </span>
        ${chevDownSvg}
      </button>
      <div class="c-svg-dd-menu" id="customSubTeacherMenu">${itemsHtml}</div>
    `;
  }

  function toggleCustomSubTeacherMenu(e) {
    if (e) e.stopPropagation();
    const menu = document.getElementById('customSubTeacherMenu');
    const btn = document.getElementById('customSubTeacherBtn');
    const typeMenu = document.getElementById('customLeaveTypeMenu');
    if (typeMenu) typeMenu.classList.remove('show');
    if (!menu) return;
    const isShow = menu.classList.toggle('show');
    if (btn) btn.classList.toggle('open', isShow);
  }

  function onSelectCustomSubTeacher(val, label, e) {
    if (e) e.stopPropagation();
    const nativeSubSel = document.getElementById('leaveSubTeacherSelect');
    if (nativeSubSel) nativeSubSel.value = val;
    const disp = document.getElementById('customSubTeacherSelectedContent');
    if (disp) {
      disp.innerHTML = `<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span style="margin-left: 8px;">${escapeHtml(label)}</span>`;
    }
    const menu = document.getElementById('customSubTeacherMenu');
    const btn = document.getElementById('customSubTeacherBtn');
    if (menu) menu.classList.remove('show');
    if (btn) btn.classList.remove('open');
  }

  document.addEventListener('click', (e) => {
    const subMenu = document.getElementById('customSubTeacherMenu');
    if (subMenu && subMenu.classList.contains('show')) {
      if (!e.target.closest('#customSubTeacherDropdownWrap')) {
        subMenu.classList.remove('show');
        const b = document.getElementById('customSubTeacherBtn');
        if (b) b.classList.remove('open');
      }
    }
  });

  async function handleLeaveSubmit(e) {
    e.preventDefault();
    try {
      const fileInput = document.getElementById('leaveAttachFile');
      let fileData = null, fileName = null;
      if (fileInput && fileInput.files.length > 0) {
        fileName = fileInput.files[0].name;
        fileData = await fileToBase64(fileInput.files[0]);
      }

      const leaveType = document.getElementById('leaveType').value;
      const isPermit = (leaveType === 'ขออนุญาต (ไม่เกิน 3 ชม.)');

      let combinedSubInfo = '';
      let formMetaObj = {};

      if (isPermit) {
        const place = document.getElementById('permitPlace').value.trim();
        const wlRadio = document.querySelector('input[name="permitWorkloadRadio"]:checked');
        const hasWorkload = wlRadio ? wlRadio.value : 'ไม่มี';
        const workloads = [];
        let subNamesSummary = [];

        if (hasWorkload === 'มี') {
          [1, 2, 3].forEach(i => {
            const cls = document.getElementById('pw_cls_' + i).value;
            const period = document.getElementById('pw_per_' + i).value.trim();
            const task = document.getElementById('pw_task_' + i).value.trim();
            const sub = document.getElementById('pw_sub_' + i).value;
            workloads.push({ cls, period, task, sub });
            if (sub) subNamesSummary.push(`${sub} (${cls || '-'})`);
          });
        }
        combinedSubInfo = hasWorkload === 'มี' && subNamesSummary.length > 0 ? `${subNamesSummary.join(', ')}` : `ไม่มีภาระงาน (ไป: ${place || '-'})`;
        formMetaObj = { place, hasWorkload, workloads };
      } else {
        const subTeacher = document.getElementById('leaveSubTeacherSelect').value || 'ไม่มีคาบสอนในวันที่ลา';
        const subNote = document.getElementById('leaveSubNote').value.trim();
        const contactAddress = document.getElementById('leaveContactAddr').value.trim();
        combinedSubInfo = subNote ? `${subTeacher} (${subNote})` : subTeacher;
        formMetaObj = { contactAddress };
      }

      const portionEl = document.querySelector('input[name="leaveDayPortion"]:checked');
      const dayPortion = (portionEl && (leaveType === 'ลาป่วย' || leaveType === 'ลากิจ')) ? portionEl.value : 'FULL';
      const totalDays = (dayPortion === 'MORNING' || dayPortion === 'AFTERNOON') ? 0.5 : null;

      const form = {
        empId: g_CurrentUser.EmpID || g_CurrentUser.id,
        fullName: g_CurrentUser.name,
        leaveType: leaveType,
        dayPortion: dayPortion,
        totalDays: totalDays,
        startDate: document.getElementById('leaveStartDate').value,
        endDate: (dayPortion === 'MORNING' || dayPortion === 'AFTERNOON') ? document.getElementById('leaveStartDate').value : (document.getElementById('leaveEndDate').value || document.getElementById('leaveStartDate').value),
        startTime: document.getElementById('leaveStartTime').value,
        endTime: document.getElementById('leaveEndTime').value,
        reason: document.getElementById('leaveReason').value.trim(),
        substituteInfo: combinedSubInfo,
        signerName: getActiveSignerName(),
        formMetaJson: JSON.stringify(Object.assign({}, formMetaObj, { dayPortion: dayPortion })),
        fileData: fileData,
        fileName: fileName
      };

      startLoadingBar('Submitting Leave Request...');
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert(res.message);
            if (res.status === 'success') {
              document.getElementById('leaveForm').reset();
              const lblAttach = document.getElementById('lblLeaveAttachFileName');
              if (lblAttach) lblAttach.innerText = 'ยังไม่ได้เลือกไฟล์ (.pdf, .jpg, .png)';
              setCustomLeaveTypeValue('ลาป่วย');
              toggleLeaveTimeFields();
              if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
                window.LeaveBus.emit('LEAVE_UPDATED', { type: 'SUBMIT', form });
              }
              refreshAllData();
              switchView('tracking');
            }
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
        .submitLeaveRequest(form);
    } catch (err) {
      steamAlert(err.message);
    }
  }

  // เชื่อมต่อ Event Bus เพื่ออัปเดตข้อมูลผู้สอนแทนเมื่อเกิดการเปลี่ยนแปลง
  if (window.LeaveBus && typeof window.LeaveBus.on === 'function') {
    window.LeaveBus.on('LEAVE_UPDATED', function() {
      populateSubstituteDropdown();
      const viewLeave = document.getElementById('view_leave');
      if (viewLeave && viewLeave.style.display !== 'none') {
        checkDirectorLeaveRestrictionOnView();
      }
    });
  }
</script>
