  // คำนวณอายุ (ปี-เดือน-วัน) และวันเกษียณอายุราชการฝั่ง Client
  // =========================================================
  function _clientDiffYMD(startDate, endDate) {
    if (!startDate || !endDate || isNaN(startDate.getTime()) || isNaN(endDate.getTime()) || endDate < startDate) {
      return { years: 0, months: 0, days: 0, text: '0 ปี 0 เดือน 0 วัน' };
    }
    var years = endDate.getFullYear() - startDate.getFullYear();
    var months = endDate.getMonth() - startDate.getMonth();
    var days = endDate.getDate() - startDate.getDate();

    if (days < 0) {
      months--;
      var prevMonthLastDay = new Date(endDate.getFullYear(), endDate.getMonth(), 0).getDate();
      days += prevMonthLastDay;
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    return {
      years: years,
      months: months,
      days: days,
      text: years + ' ปี ' + months + ' เดือน ' + days + ' วัน'
    };
  }

  function calculateRetirementClient(birthDateStr) {
    if (!birthDateStr) return null;
    var p = String(birthDateStr).trim().split('-');
    if (p.length !== 3) return null;
    var y = normalizeYearToCEClient(p[0]);
    var m = parseInt(p[1], 10);
    var d = parseInt(p[2], 10);
    var bDate = new Date(y, m - 1, d, 0, 0, 0);
    if (isNaN(bDate.getTime())) return null;

    var today = new Date();
    today.setHours(0, 0, 0, 0);

    var curAge = _clientDiffYMD(bDate, today);

    var isAfterOct1 = (m === 10 && d >= 2) || m === 11 || m === 12;
    var retireYearCE = y + 60 + (isAfterOct1 ? 1 : 0);
    var retireYearBE = retireYearCE + 543;
    var retireDateObj = new Date(retireYearCE, 8, 30, 0, 0, 0);

    var ageAtRetire = _clientDiffYMD(bDate, retireDateObj);
    var isRetired = (today > retireDateObj);
    var remainObj = isRetired
      ? { text: 'เกษียณอายุราชการแล้ว' }
      : _clientDiffYMD(today, retireDateObj);

    return {
      ageText: curAge.text,
      retireDateFormatted: '30 กันยายน ' + retireYearBE,
      ageAtRetirementText: ageAtRetire.text,
      remainingToRetireText: remainObj.text,
      isOctToDec: isAfterOct1,
      isRetired: isRetired
    };
  }

  function bootAdminApp() {
    if (typeof initThaiDatePickers === 'function') initThaiDatePickers();
    if (typeof populateWorkloadDeptFilters === 'function') populateWorkloadDeptFilters();
    if (typeof renderStaffWorkloadList === 'function') renderStaffWorkloadList();

    // Use SessionManager as Single Source of Truth
    // This ensures self-healing accessLevel, recursive unwrapping, and proper expiry check
    var currentAuthUser = null;
    try {
      if (typeof SessionManager !== 'undefined' && SessionManager.load) {
        currentAuthUser = SessionManager.load();
      } else if (typeof window.g_CurrentUser !== 'undefined' && window.g_CurrentUser) {
        currentAuthUser = window.g_CurrentUser;
      } else {
        // Fallback: raw parse with recursive unwrap (legacy safety net)
        var savedSess = sessionStorage.getItem(SESSION_USER_OBJ_KEY) || localStorage.getItem(SESSION_USER_OBJ_KEY);
        if (savedSess) {
          var parsed = JSON.parse(savedSess);
          var u = parsed.user || parsed;
          while (u && u.user) u = u.user;
          currentAuthUser = u;
        }
      }
    } catch (e) {}

    if (!currentAuthUser || !isSuperuserOrAdmin(currentAuthUser)) {
      steamAlert("You don't have permission to access this area.", 'Access Denied');
      setTimeout(function() {
        if (typeof goBackHome === 'function') {
          goBackHome();
        } else {
          window.location.href = '?page=index';
        }
      }, 1500);
      return;
    }

    try {
      const prefetched = sessionStorage.getItem('steam_prefetch_admin');
      if (prefetched) {
        sessionStorage.removeItem('steam_prefetch_admin');
        initAdminData(JSON.parse(prefetched));
        const jumpTab = sessionStorage.getItem('steam_admin_jump_tab');
        if (jumpTab) {
          sessionStorage.removeItem('steam_admin_jump_tab');
          let tabEl = document.querySelector(`.ribbon-tab[data-tab="${jumpTab}"]`);
          if (tabEl) switchAdminRibbonTab(jumpTab, tabEl);
        }
        return;
      }
    } catch (e) {}

    startLoadingBar('Opening Settings...');
    google.script.run
      .withSuccessHandler(data => stopLoadingBar(() => {
        initAdminData(data);
        const jumpTab = sessionStorage.getItem('steam_admin_jump_tab');
        if (jumpTab) {
          sessionStorage.removeItem('steam_admin_jump_tab');
          let tabEl = document.querySelector(`.ribbon-tab[data-tab="${jumpTab}"]`);
          if (tabEl) switchAdminRibbonTab(jumpTab, tabEl);
        }
      }))
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Unable to sync data.', 'Sync Failed')))
      .getAdminData(false);
  }

  function refreshLeaderPickerAvailability(currentEmpId) {
    const select = document.getElementById('edit_division_picker_leader');
    if (!select) return;

    const SINGLE_HOLDER_KEYWORDS = [
      'ผู้บริหารสถานศึกษา',
      'ผู้รักษาราชการแทนผู้อำนวยการสถานศึกษา (ลำดับที่ 1)',
      'ผู้รักษาราชการแทนผู้อำนวยการสถานศึกษา (ลำดับที่ 2)',
      'หัวหน้าฝ่ายบริหารวิชาการ',
      'หัวหน้าฝ่ายบริหารงบประมาณและแผนงาน',
      'หัวหน้าฝ่ายบริหารงานบุคคล',
      'หัวหน้าฝ่ายบริหารทั่วไปและกิจการนักเรียน',
      'หัวหน้ากลุ่มสาระการเรียนรู้',
      'หัวหน้าระดับ',
      'นายทะเบียนโรงเรียน'
    ];

    const heldMap = {};
    (g_AdminTeachers || []).forEach(tch => {
      const empId = tch.EmpID || tch.id;
      if (empId && String(empId) === String(currentEmpId)) return;
      const divStr = tch.Division || tch.division || '';
      if (!divStr) return;
      divStr.split(',').forEach(p => {
        const clean = p.trim().replace(/^\[(หลัก|รอง)\]\s*/, '');
        SINGLE_HOLDER_KEYWORDS.forEach(kw => {
          if (clean.includes(kw)) {
            heldMap[clean] = tch.name || tch.FullName || 'บุคลากรอื่น';
          }
        });
      });
    });

    Array.from(select.options).forEach(opt => {
      if (!opt.value) return;
      const baseVal = opt.getAttribute('data-base-val') || opt.value;
      opt.setAttribute('data-base-val', baseVal);

      let matchedHolder = null;
      SINGLE_HOLDER_KEYWORDS.forEach(kw => {
        if (baseVal.includes(kw) && heldMap[baseVal]) {
          matchedHolder = heldMap[baseVal];
        }
      });

      if (matchedHolder) {
        opt.disabled = true;
        opt.textContent = '[ล็อกแล้ว] ' + baseVal + ' (มีแล้ว: ' + matchedHolder + ')';
        opt.style.color = '#7f8c8d';
      } else {
        opt.disabled = false;
        opt.textContent = baseVal;
        opt.style.color = '#fff';
      }
    });
  }

  function checkOtherTeacherIsPrimary(taskName, currentEmpId) {
    const cleanTask = taskName.trim().replace(/^\[(หลัก|รอง)\]\s*/, '');
    for (let i = 0; i < (g_AdminTeachers || []).length; i++) {
      const tch = g_AdminTeachers[i];
      const empId = tch.EmpID || tch.id;
      if (empId && String(empId) === String(currentEmpId)) continue;
      const divStr = tch.Division || tch.division || '';
      if (!divStr) continue;
      const parts = divStr.split(',');
      for (let j = 0; j < parts.length; j++) {
        const p = parts[j].trim();
        const pClean = p.replace(/^\[(หลัก|รอง)\]\s*/, '');
        if (pClean === cleanTask && !p.startsWith('[รอง]')) {
          return tch.name || tch.FullName || 'บุคลากรอื่น';
        }
      }
    }
    return null;
  }

  function getDivisionCategoryType(item) {
    if (!item) return 'chip-custom';
    const s = String(item).replace(/^\[(หลัก|รอง)\]\s*/, '');
    if (
      s.includes('หัวหน้า') ||
      s.includes('รักษาราชการ') ||
      s.includes('ผู้บริหาร') ||
      s.includes('นายทะเบียน') ||
      s.includes('ผู้ช่วยหัวหน้าฝ่าย') ||
      s.includes('ผู้กำกับ') ||
      s.includes('ผู้บังคับบัญชา') ||
      s.includes('ที่ปรึกษาสภานักเรียน') ||
      s.includes('กรรมการและเลขานุการ') ||
      s.includes('กรรมการสมาคม') ||
      s.includes('ผู้ดูแลระบบเครือข่าย') ||
      s.includes('ผู้ฝึกสอน') ||
      s.includes('ผู้รับผิดชอบห้องสมุด') ||
      s.includes('ครูอนามัย')
    ) {
      return 'chip-leader';
    }
    if (
      s.includes(' — ') ||
      s.startsWith('DMC') ||
      s.startsWith('EMIS') ||
      s.startsWith('School MIS') ||
      s.startsWith('SGS') ||
      s.startsWith('CCT') ||
      s.startsWith('GPA') ||
      s.startsWith('HRMS') ||
      s.startsWith('DPA') ||
      s.startsWith('e-GP') ||
      s.startsWith('GFMIS') ||
      s.startsWith('e-Budget') ||
      s.startsWith('Smart OBEC') ||
      s.startsWith('e-Office') ||
      s.startsWith('e-MES') ||
      s.startsWith('Thai School Lunch')
    ) {
      return 'chip-system';
    }
    if (s.startsWith('งาน') || s.startsWith('ฝ่าย') || s.includes('บริหาร')) {
      return 'chip-duty';
    }
    return 'chip-custom';
  }

          toggleBtnHtml = `<button type="button" class="role-toggle-btn" title="คลิกเพื่อสลับเป็นผู้รับผิดชอบรอง" onclick="toggleEditDivisionRole(${idx})">สลับเป็น [รอง]</button>`;
        }
      }

      return `

  function onSelectEditDivisionPicker(source) {
    let pickerId = 'edit_division_picker_leader';
    if (source === 'leader') pickerId = 'edit_division_picker_leader';
    else if (source === 'group4') pickerId = 'edit_division_picker_group4';
    else if (source === 'obec60') pickerId = 'edit_division_picker_obec60';

    const picker = document.getElementById(pickerId);
    if (!picker) return;

    let val = picker.value;
    if (!val) return;

    const baseVal = picker.options[picker.selectedIndex] ? (picker.options[picker.selectedIndex].getAttribute('data-base-val') || val) : val;

    const catClass = getDivisionCategoryType(baseVal);
    let finalEntry = baseVal;

    if (catClass !== 'chip-leader') {
      const otherPrimary = checkOtherTeacherIsPrimary(baseVal, g_CurrentEditingEmpId);
      if (otherPrimary) {
        finalEntry = '[รอง] ' + baseVal;
      } else {
        finalEntry = '[หลัก] ' + baseVal;
      }
    }

    const cleanBase = finalEntry.replace(/^\[(หลัก|รอง)\]\s*/, '');
    const exists = g_SelectedEditDivisions.some(item => item.replace(/^\[(หลัก|รอง)\]\s*/, '') === cleanBase);

    if (!exists) {
      g_SelectedEditDivisions.push(finalEntry);
      renderEditDivisionTags();
    }
    picker.value = '';
  }

  function addCustomEditDivision() {
    const customInp = document.getElementById('edit_division_custom_input');
    const pickerLeader = document.getElementById('edit_division_picker_leader');
    const picker4 = document.getElementById('edit_division_picker_group4');
    const picker60 = document.getElementById('edit_division_picker_obec60');
    if (!customInp) return;

    const val = customInp.value.trim();
    if (!val) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }

    val.split(',').forEach(part => {
      let clean = part.trim();
      if (clean) {
        const cleanBase = clean.replace(/^\[(หลัก|รอง)\]\s*/, '');
        const exists = g_SelectedEditDivisions.some(item => item.replace(/^\[(หลัก|รอง)\]\s*/, '') === cleanBase);
        if (!exists) {
          const otherPrimary = checkOtherTeacherIsPrimary(cleanBase, g_CurrentEditingEmpId);
          const finalVal = otherPrimary ? ('[รอง] ' + cleanBase) : ('[หลัก] ' + cleanBase);
          g_SelectedEditDivisions.push(finalVal);
        }
      }
    });

    customInp.value = '';
    if (pickerLeader) pickerLeader.value = '';
    if (picker4) picker4.value = '';
    if (picker60) picker60.value = '';
    renderEditDivisionTags();
  }

      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Unable to sync data.', 'Sync Failed')))
      .getAdminData(false);
  }

</script>
