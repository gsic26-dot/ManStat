<!-- VIEW: แจ้งปรับปรุงระบบ -->
<div id="view_feedback" class="main-view" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:10px; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
    <div>
      <h3 style="color:var(--steam-cyan); margin:0; font-size:17.5px; display:flex; align-items:center; gap:8px;">
        <svg class="ui-ico-lg" viewBox="0 0 24 24"><path d="M22 17a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 21.286V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>แจ้งปรับปรุงระบบ</span>
      </h3>
      <div style="color:var(--text-muted); font-size:12.5px; margin-top:3px;">ส่งข้อเสนอแนะ แจ้งปัญหาการใช้งาน หรือข้อคิดเห็นเพื่อพัฒนาระบบ ManStat</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <div style="background: rgba(0,0,0,0.24); padding: 16px; border-radius: 6px; border: 1px solid #2a475e; margin-bottom: 18px;">
    <form id="feedbackForm" onsubmit="handleFeedbackSubmit(event)">
      <div class="grid-2">
        <div class="input-group">
          <label>ประเภทเรื่องที่แจ้ง <span class="req-star">*</span></label>
          <select id="fb_category" class="steam-input" required>
            <option value="เสนอฟีเจอร์ใหม่">เสนอแนะฟีเจอร์ใหม่</option>
            <option value="แจ้งปรับปรุง/แก้ไขบั๊ก">แจ้งปรับปรุงระบบ / แก้ไขข้อผิดพลาด</option>
            <option value="แสดงความคิดเห็นทั่วไป">แสดงความคิดเห็นทั่วไป</option>
          </select>
        </div>
        <div class="input-group">
          <label>หัวข้อเรื่อง <span class="req-star">*</span></label>
          <input type="text" id="fb_topic" class="steam-input" placeholder="ระบุหัวข้อเรื่อง..." required>
        </div>
      </div>
      <div class="input-group">
        <label>รายละเอียด <span class="req-star">*</span></label>
        <input type="text" id="fb_detail" class="steam-input" placeholder="อธิบายรายละเอียดเพิ่มเติม..." required>
      </div>
      <div style="text-align:right;">
        <button type="submit" class="btn-steam" style="width:auto; padding:8px 24px;">
          <svg class="ui-ico-sm" style="color:#000;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg><span>บันทึกส่งคำขอ</span>
        </button>
      </div>
    </form>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width:10%;">วันที่แจ้ง</th>
          <th style="width:16%; text-align:left; padding-left:10px;">ผู้เสนอแนะ</th>
          <th style="width:14%;">ประเภท</th>
          <th style="width:26%; text-align:left; padding-left:10px;">หัวข้อและรายละเอียด</th>
          <th style="width:12%;">สถานะ</th>
          <th style="width:22%;">การแจ้งผล / จัดการ</th>
        </tr>
      </thead>
      <tbody id="feedbackTableBody"></tbody>
    </table>
  </div>
</div>
