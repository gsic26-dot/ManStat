<script>
  // =========================================================================
  // MODULE: FEEDBACK & SYSTEM ISSUE TRACKER (JS_Mod_Feedback.html)
  // แยกอิสระ 100% | เชื่อมโยงผ่าน Google Apps Script API & LeaveBus
  // =========================================================================

  var FB_SVG = {
    clock: '<svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
    check: '<svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>'
  };

  function renderFeedbackSection() {
    if (!Array.isArray(g_Feedbacks)) return;
    const pendingFbCount = g_Feedbacks.filter(f => f.Status === 'รอดำเนินการ').length;
    const badgeFb = document.getElementById('badgeFeedbackCount');
    if (badgeFb) {
      badgeFb.style.display = pendingFbCount > 0 ? 'inline-block' : 'none';
      badgeFb.innerText = pendingFbCount;
    }

    const tbody = document.getElementById('feedbackTableBody');
    if (!tbody) return;
    if (g_Feedbacks.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="padding:20px; color:var(--text-muted);">ยังไม่มีรายการคำขอปรับปรุงระบบ</td></tr>';
      return;
    }

    const isAdmin = (typeof isSuperuserOrAdmin === 'function') && isSuperuserOrAdmin(g_CurrentUser);
    tbody.innerHTML = g_Feedbacks.map(f => {
      let stBadge = '<span style="color:var(--orange); font-weight:bold; display:inline-flex; align-items:center; gap:8px;">' + FB_SVG.clock + '<span>รอดำเนินการ</span></span>';
      if (f.Status === 'แก้ไขแล้ว') {
        stBadge = '<span class="exp-days-badge exp-days-ok">' + FB_SVG.check + '<span>แก้ไขแล้ว</span></span>';
      } else if (f.Status === 'เพิ่มฟีเจอร์แล้ว') {
        stBadge = '<span class="exp-days-badge exp-days-ok" style="border-color:var(--steam-cyan); color:var(--steam-cyan);">' + FB_SVG.check + '<span>เพิ่มฟีเจอร์แล้ว</span></span>';
      }

      let actionZone = '<div style="font-size:12px; color:var(--steam-green);">' + escapeHtml(f.AdminReply || '-') + '</div>';
      if (isAdmin && f.Status === 'รอดำเนินการ') {
        actionZone = 
          '<div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">' +
            '<button type="button" class="btn-save-sm" style="background:var(--steam-green); color:#000; border:none;" onclick="markFeedbackResolved(\'' + escapeHtml(f.FeedbackID) + '\', \'แก้ไขแล้ว\')">แก้ไขแล้ว</button>' +
            '<button type="button" class="btn-save-sm" style="background:var(--steam-cyan); color:#000; border:none;" onclick="markFeedbackResolved(\'' + escapeHtml(f.FeedbackID) + '\', \'เพิ่มฟีเจอร์แล้ว\')">เพิ่มฟีเจอร์แล้ว</button>' +
          '</div>';
      } else if (f.UpdatedBy && f.UpdatedBy !== '-') {
        actionZone += '<div style="font-size:11px; color:var(--text-muted);">โดย: ' + escapeHtml(f.UpdatedBy) + '</div>';
      }

      return '<tr>' +
        '<td style="font-size:11.5px; color:var(--text-muted);">' + escapeHtml(f.Timestamp) + '</td>' +
        '<td style="text-align:left; padding-left:10px; font-weight:bold;">' + escapeHtml(f.FullName) + '</td>' +
        '<td><span style="color:var(--steam-cyan); font-size:12.5px;">' + escapeHtml(f.Category) + '</span></td>' +
        '<td style="text-align:left; padding-left:10px;">' +
          '<div style="font-weight:bold; color:#fff;">' + escapeHtml(f.Topic) + '</div>' +
          '<div style="font-size:12px; color:var(--text-muted);">' + escapeHtml(f.Detail) + '</div>' +
        '</td>' +
        '<td>' + stBadge + '</td>' +
        '<td>' + actionZone + '</td>' +
      '</tr>';
    }).join('');
  }

  function handleFeedbackSubmit(e) {
    if (e && e.preventDefault) e.preventDefault();
    const payload = {
      empId: g_CurrentUser ? (g_CurrentUser.EmpID || g_CurrentUser.id) : '-',
      fullName: g_CurrentUser ? g_CurrentUser.name : 'ผู้ใช้งานทั่วไป',
      category: document.getElementById('fb_category').value,
      topic: document.getElementById('fb_topic').value.trim(),
      detail: document.getElementById('fb_detail').value.trim()
    };

    startLoadingBar('Submitting Request...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          steamAlert('Your request has been submitted.', 'Request Submitted');
          const form = document.getElementById('feedbackForm');
          if (form) form.reset();
          if (typeof refreshAllData === 'function') refreshAllData();
          if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
            window.LeaveBus.emit('LEAVE_UPDATED', { type: 'FEEDBACK_SUBMITTED' });
          }
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .submitSystemFeedback(payload);
  }

  function markFeedbackResolved(fbId, statusLabel) {
    steamPrompt('Enter resolution notes (' + statusLabel + ') for the user:', replyMsg => {
      if (replyMsg === null) return;
      startLoadingBar('Saving Settings...');
      const adminName = g_CurrentUser ? g_CurrentUser.name : 'Superuser';
      google.script.run
        .withSuccessHandler(res => {
          stopLoadingBar(() => {
            steamAlert('Changes saved successfully.', 'Success');
            if (typeof refreshAllData === 'function') refreshAllData();
            if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
              window.LeaveBus.emit('LEAVE_UPDATED', { type: 'FEEDBACK_RESOLVED' });
            }
          });
        })
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
        .resolveSystemFeedback(fbId, statusLabel, replyMsg, adminName);
    }, 'ยืนยันสถานะ: ' + statusLabel);
  }

  // Subscribe to LeaveBus for seamless reactive updates
  if (window.LeaveBus && typeof window.LeaveBus.on === 'function') {
    window.LeaveBus.on('LEAVE_UPDATED', function() {
      if (typeof renderFeedbackSection === 'function') {
        renderFeedbackSection();
      }
    });
  }
</script>
