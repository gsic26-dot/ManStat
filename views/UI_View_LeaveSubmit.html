<!-- VIEW: ยื่นคำร้อง -->
<div id="view_leave" class="main-view" style="display:none;">
  <div style="border-bottom:1px solid #2a475e; padding-bottom:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <div>
      <h3 style="color:var(--steam-green); margin:0; font-size:17.5px; display:flex; align-items:center; gap:8px;">
        <svg class="ui-ico-lg" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M9 15h6"/><path d="M12 18v-6"/></svg><span>ยื่นคำร้องขอลา / ขออนุญาตออกนอกบริเวณสถานศึกษา</span>
      </h3>
      <div style="color:var(--text-muted); font-size:12.5px; margin-top:3px;">กรอกข้อมูลคำร้องและระบุผู้สอนแทน</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" class="btn-circle-glow glow-red" id="btnDirectorLeaveRuleIco" onclick="showDirectorLeaveRuleModal()" title="ระเบียบการลาของผู้บริหารสถานศึกษา" aria-label="ระเบียบการลาของผู้บริหารสถานศึกษา" style="display:none;">
        <svg class="ui-ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      </button>
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <div class="leave-form-card">
    <form id="leaveForm" onsubmit="handleLeaveSubmit(event)">
      <div class="input-group">
        <label class="ico-lbl" style="color:var(--steam-cyan); font-size:13.5px;">
          <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/></svg><span>เลือกประเภทคำร้อง <span class="req-star">*</span></span>
        </label>
        <select id="leaveType" class="steam-input" onchange="toggleLeaveTimeFields()" required>
          <optgroup label="ประเภทการลาของข้าราชการครูและบุคลากรทางการศึกษา">
            <option value="ลาป่วย">ลาป่วย</option>
            <option value="ลากิจ">ลากิจส่วนตัว</option>
            <option value="ลาคลอดบุตร">ลาคลอดบุตร</option>
            <option value="ลาไปช่วยเหลือภริยาที่คลอดบุตร">ลาไปช่วยเหลือภริยาที่คลอดบุตร</option>
            <option value="ลาพักผ่อน">ลาพักผ่อน ตามระเบียบ</option>
            <option value="ลาอุปสมบทหรือการลาไปประกอบพิธีฮัจย์">ลาอุปสมบท หรือลาไปประกอบพิธีฮัจย์</option>
            <option value="ลาเข้ารับการตรวจเลือกหรือเข้ารับการเตรียมพล">ลาเข้ารับการตรวจเลือก หรือเข้ารับการเตรียมพล</option>
            <option value="ลาไปศึกษา ฝึกอบรม ปฏิบัติการวิจัย หรือดูงาน">ลาไปศึกษา ฝึกอบรม ปฏิบัติการวิจัย หรือดูงาน</option>
            <option value="ลาไปปฏิบัติงานในองค์การระหว่างประเทศ">ลาไปปฏิบัติงานในองค์การระหว่างประเทศ</option>
            <option value="ลาติดตามคู่สมรส">ลาติดตามคู่สมรส</option>
            <option value="ลาไปฟื้นฟูสมรรถภาพด้านอาชีพ">ลาไปฟื้นฟูสมรรถภาพด้านอาชีพ</option>
          </optgroup>
          <option disabled>──────────────────────────────────────────</option>
          <optgroup label="การขออนุญาตออกนอกบริเวณสถานศึกษา">
            <option value="ขออนุญาต (ไม่เกิน 3 ชม.)">ขออนุญาตออกนอกบริเวณโรงเรียน ไม่เกิน 3 ชั่วโมง</option>
          </optgroup>
        </select>
      </div>

      <div id="leavePolicyAlertBanner" style="background:rgba(102,192,244,0.12); border:1px solid var(--steam-cyan); border-left:4px solid var(--steam-cyan); padding:10px 14px; border-radius:5px; margin-bottom:14px; font-size:12.5px; color:#fff; line-height:1.6;"></div>

      <div class="leave-sec-box">
        <div class="grid-2">
          <div class="input-group" style="margin-bottom:8px;">
            <label class="ico-lbl" id="lblStartDateTitle">
              <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>ตั้งแต่วันที่ <span class="req-star">*</span></span>
            </label>
            <input type="date" id="leaveStartDate" class="steam-input" onchange="onLeaveDatesChange()" required>
          </div>
          <div class="input-group" id="endDateGroup" style="margin-bottom:8px;">
            <label class="ico-lbl">
              <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg><span>ถึงวันที่ <span class="req-star">*</span></span>
            </label>
            <input type="date" id="leaveEndDate" class="steam-input" onchange="onLeaveDatesChange()">
          </div>
        </div>

        <div id="leaveDayPortionWrap" style="margin-bottom:10px;">
          <label class="ico-lbl" style="font-size:12.5px; color:#fff; font-weight:bold; margin-bottom:5px;">
            <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span>ช่วงเวลาการลา (ระเบียบสำนักนายกฯ พ.ศ. 2555 ข้อ 10 วรรคหก)</span>
          </label>
          <div style="display:flex; gap:16px; align-items:center; flex-wrap:wrap; background:rgba(0,0,0,0.22); border:1px solid #2a475e; border-radius:5px; padding:7px 12px;">
            <label style="cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:#fff; font-size:12.5px; margin:0;">
              <input type="radio" name="leaveDayPortion" value="FULL" checked onchange="onLeavePortionChange()"> เต็มวัน (1.0 วันทำการ)
            </label>
            <label style="cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--steam-cyan); font-size:12.5px; margin:0;">
              <input type="radio" name="leaveDayPortion" value="MORNING" onchange="onLeavePortionChange()"> ครึ่งวันเช้า (0.5 วัน)
            </label>
            <label style="cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--orange); font-size:12.5px; margin:0;">
              <input type="radio" name="leaveDayPortion" value="AFTERNOON" onchange="onLeavePortionChange()"> ครึ่งวันบ่าย (0.5 วัน)
            </label>
          </div>
        </div>

        <div class="input-group" style="margin-bottom:0;">
          <label class="ico-lbl" id="lblLeaveReasonTitle">
            <svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg><span>เนื่องจาก ระบุสาเหตุการลา <span class="req-star">*</span></span>
          </label>
          <input type="text" id="leaveReason" class="steam-input" style="margin-bottom:0;" placeholder="ระบุสาเหตุความจำเป็น..." required>
        </div>
      </div>

      <div id="form1_1_zone" class="leave-sec-box" style="border-left-color:var(--steam-green);">
        <div class="grid-2">
          <div class="input-group">
            <label class="ico-lbl">
              <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span>ในระหว่างลาจะติดต่อข้าพเจ้าได้ที่ <span class="req-star">*</span></span>
            </label>
            <input type="text" id="leaveContactAddr" class="steam-input" placeholder="ระบุเบอร์โทรศัพท์ หรือที่อยู่ที่ติดต่อได้">
          </div>
          <div class="input-group">
            <label class="ico-lbl" style="color:var(--steam-green);">
              <svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg><span>ผู้สอนแทนระหว่างลา <span class="req-star">*</span></span>
            </label>
            <select id="leaveSubTeacherSelect" class="steam-input">
              <option value="">-- คลิกเลือกผู้สอนแทน --</option>
            </select>
          </div>
        </div>
        <div class="input-group" style="margin-bottom:0;">
          <label class="ico-lbl">
            <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg><span>รายละเอียดวิชาและชั้นเรียนที่ฝากสอน</span>
          </label>
          <input type="text" id="leaveSubNote" class="steam-input" style="margin-bottom:0;" placeholder="เช่น คาบที่ 2-3 ชั้น ป.4 วิชาคณิตศาสตร์">
        </div>
      </div>

      <div id="form1_2_zone" style="display:none; background:rgba(210,153,34,0.08); border:1px solid var(--orange); border-left:3px solid var(--orange); padding:14px 16px; border-radius:6px; margin-bottom:14px;">
        <div class="grid-3">
          <div class="input-group">
            <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>ระหว่างเวลา (น.) <span class="req-star">*</span></span></label>
            <input type="time" id="leaveStartTime" class="steam-input" onchange="calcPermitHoursPreview()">
          </div>
          <div class="input-group">
            <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><span>ถึงเวลา (น.) <span class="req-star">*</span></span></label>
            <input type="time" id="leaveEndTime" class="steam-input" onchange="calcPermitHoursPreview()">
          </div>
          <div class="input-group">
            <label class="ico-lbl"><svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>สถานที่ไป <span class="req-star">*</span></span></label>
            <input type="text" id="permitPlace" class="steam-input" placeholder="ระบุสถานที่ไป...">
          </div>
        </div>
        <div id="permitHoursPreviewText" style="font-size:12px; color:var(--steam-green); font-weight:bold; margin-bottom:10px;"></div>

        <div style="margin-bottom:10px;">
          <label style="font-size:13px; color:#fff; font-weight:bold; margin-right:15px;">ภาระงาน:</label>
          <label style="cursor:pointer; margin-right:18px; color:var(--steam-cyan); font-weight:bold;">
            <input type="radio" name="permitWorkloadRadio" value="ไม่มี" checked onchange="togglePermitWorkloadTable()"> ไม่มีภาระงานสอน
          </label>
          <label style="cursor:pointer; color:var(--steam-green); font-weight:bold;">
            <input type="radio" name="permitWorkloadRadio" value="มี" onchange="togglePermitWorkloadTable()"> มีภาระงานสอน
          </label>
        </div>

        <div id="permitWorkloadTableWrap" style="display:none; background:rgba(0,0,0,0.3); padding:10px; border-radius:6px; border:1px solid #2a475e;">
          <div style="display:grid; grid-template-columns: 1.1fr 0.8fr 1.5fr 1.6fr; gap:5px; margin-bottom:6px; align-items:center;">
            <select id="pw_cls_1" class="steam-input" style="margin:0;"></select>
            <input type="text" id="pw_per_1" class="steam-input" style="margin:0;" placeholder="1. คาบที่...">
            <input type="text" id="pw_task_1" class="steam-input" style="margin:0;" placeholder="งานที่มอบหมาย...">
            <select id="pw_sub_1" class="steam-input" style="margin:0;"></select>
          </div>
          <div style="display:grid; grid-template-columns: 1.1fr 0.8fr 1.5fr 1.6fr; gap:5px; margin-bottom:6px; align-items:center;">
            <select id="pw_cls_2" class="steam-input" style="margin:0;"></select>
            <input type="text" id="pw_per_2" class="steam-input" style="margin:0;" placeholder="2. คาบที่...">
            <input type="text" id="pw_task_2" class="steam-input" style="margin:0;" placeholder="งานที่มอบหมาย...">
            <select id="pw_sub_2" class="steam-input" style="margin:0;"></select>
          </div>
          <div style="display:grid; grid-template-columns: 1.1fr 0.8fr 1.5fr 1.6fr; gap:5px; align-items:center;">
            <select id="pw_cls_3" class="steam-input" style="margin:0;"></select>
            <input type="text" id="pw_per_3" class="steam-input" style="margin:0;" placeholder="3. คาบที่...">
            <input type="text" id="pw_task_3" class="steam-input" style="margin:0;" placeholder="งานที่มอบหมาย...">
            <select id="pw_sub_3" class="steam-input" style="margin:0;"></select>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label class="ico-lbl">
          <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><span>แนบไฟล์ใบรับรองแพทย์ หรือเอกสารอ้างอิง</span>
        </label>
        <div style="display:flex; align-items:center; gap:8px;">
          <input type="file" id="leaveAttachFile" accept=".pdf,.jpg,.jpeg,.png" style="display:none;" onchange="var lbl=document.getElementById('lblLeaveAttachFileName'); if(lbl) lbl.innerText = this.files[0] ? this.files[0].name : 'ยังไม่ได้เลือกไฟล์ (.pdf, .jpg, .png)';">
          <button type="button" class="btn-save-sm" onclick="document.getElementById('leaveAttachFile').click()" style="height:36px; padding:0 14px; display:inline-flex; align-items:center; gap:6px; flex-shrink:0; background:rgba(102,192,244,0.12); border:1px solid var(--steam-cyan); color:var(--steam-cyan); font-weight:600; border-radius:4px; cursor:pointer;">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>เลือกไฟล์</span>
          </button>
          <div id="lblLeaveAttachFileName" style="flex:1; height:36px; line-height:36px; padding:0 10px; background:rgba(0,0,0,0.25); border:1px solid #2a475e; border-radius:4px; font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; box-sizing:border-box;">
            ยังไม่ได้เลือกไฟล์ (.pdf, .jpg, .png)
          </div>
        </div>
      </div>

      <div style="text-align:right; margin-top:12px;">
        <button type="submit" id="btnSubmitLeave" class="btn-steam" style="width:auto; padding:10px 28px;">
          <svg class="ui-ico" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg><span>บันทึกและยื่นคำร้อง</span>
        </button>
      </div>
    </form>
  </div>
</div>
