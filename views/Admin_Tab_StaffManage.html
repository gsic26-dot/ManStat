    <!-- =========================================================================
         TAB 2: จัดการผู้ใช้ (ตั้งค่าชั้นเรียนแถวเดียว + แถบเครื่องมือแถวเดียว + RIBBON CARD)
    ========================================================================== -->
    <div id="tab2" class="tab-content">
      <!-- ตั้งค่าชั้นเรียนที่เปิดสอนในโรงเรียน: ไอคอนสถานะ กับปุ่ม เปิด-ปิด แถวเดียวกัน -->
      <div style="background: rgba(0,0,0,0.25); border: 1px solid #2a475e; border-left: 4px solid var(--steam-cyan); border-radius: 6px; padding: 10px 15px; margin-bottom: 12px;">
        <div class="cls-header-single-row">
          <div class="cls-header-left">
            <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>ตั้งค่าชั้นเรียนที่เปิดสอนในโรงเรียน</span>
          </div>

          <div class="cls-header-right">
            <span id="activeClassCountBadge" class="cls-status-pill">
              <svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><span>เปิดสอน 12 ชั้นเรียน</span>
            </span>
            <button type="button" class="btn-save-sm" id="btnToggleClassConfigBox" style="display:inline-flex; align-items:center; gap: 8px; padding:5px 12px;" onclick="toggleClassConfigPanel()">
              <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><span>เลือกเปิด-ปิดชั้นเรียน</span>
            </button>
            <button type="button" class="btn-steam" id="btnSaveActiveClasses" style="display:none; width:auto; padding:5px 14px; font-size:12px;" onclick="saveActiveClassesConfig()">
              <svg class="ui-ico-sm" style="color:#000;" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg><span>บันทึกชั้นเรียน</span>
            </button>
          </div>
        </div>

        <div id="activeClassConfigBody" style="display:none; margin-top:12px; padding-top:12px; border-top:1px dashed #2a475e;">
          <div id="activeClassPillsContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>
      </div>

      <!-- แถบปุ่มเครื่องมือสั้นกระชับ แถวเดียวกัน -->
      <div class="adm-single-row-toolbar">
        <div class="adm-toolbar-btns">
          <button type="button" class="adm-toolbar-btn btn-tb-excel" onclick="openExcelUploadWizard()" title="นำเข้าข้อมูลบุคลากรจาก Excel">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m17 8-5-5-5 5"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg><span>นำเข้า Excel</span>
          </button>
          <button type="button" class="adm-toolbar-btn btn-tb-template" onclick="downloadMultiSheetTemplate()" title="ดาวน์โหลดไฟล์ Excel ต้นแบบ">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg><span>โหลดไฟล์ต้นแบบ</span>
          </button>
          <button type="button" class="adm-toolbar-btn btn-tb-audit" onclick="triggerSystemDataAudit()" title="ตรวจสอบความถูกต้องของฐานข้อมูล">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>ตรวจฐานข้อมูล</span>
          </button>
          <button type="button" class="adm-toolbar-btn btn-tb-crypto" onclick="triggerSHA256Migration()" title="เข้ารหัสผ่าน SHA-256">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span>เข้ารหัสผ่าน</span>
          </button>
          <button type="button" class="adm-toolbar-btn btn-tb-guide" onclick="document.getElementById('modalPermissionGuide').style.display='flex'" title="คู่มือสิทธิ์และระดับการเข้าถึง">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span>คู่มือสิทธิ์</span>
          </button>
          <input type="file" id="excelTeacherInput" accept=".xlsx, .xls" style="display:none;" onchange="handleTeacherExcelUpload(event)">
        </div>
        <div id="roleSummaryContainer" style="white-space:nowrap;"></div>
      </div>

      <div class="deputy-card-modern">
        <div>
          <div style="color:var(--orange); font-weight:bold; font-size:14.5px; display:flex; align-items:center; gap: 8px;">
            <svg class="ui-ico" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg><span>กำหนดผู้รักษาราชการแทน</span>
          </div>
          <div style="color:var(--text-muted); font-size:12px; margin-top:3px;">ผู้มีอำนาจลงนามอนุมัติคำร้องแทน ผอ.รร.</div>
        </div>

        <div class="deputy-selectors-grid">
          <div class="deputy-box-item">
            <span class="deputy-num-badge">คนที่ 1</span>
            <select id="adminSettingDep1" class="steam-input" style="margin:0; flex:1; padding:6px 10px;"></select>
          </div>
          <div class="deputy-box-item">
            <span class="deputy-num-badge">คนที่ 2</span>
            <select id="adminSettingDep2" class="steam-input" style="margin:0; flex:1; padding:6px 10px;"></select>
          </div>
        </div>

        <div>
          <button type="button" class="btn-steam" style="width:auto; padding:9px 20px;" onclick="saveAdminDelegation()">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg><span>บันทึก</span>
          </button>
        </div>
      </div>

      <!-- แถบค้นหาและตัวกรองของหน้าจัดการผู้ใช้ -->
      <div class="adm-filter-bar">
        <input type="text" id="admSearchUserInput" class="steam-input" placeholder="ค้นหาชื่อ-สกุล, รหัสบุคลากร, เลขที่ตำแหน่ง, สมาชิกสามัญ, หรือ Email..." oninput="filterAdminUsersList()">
        
        <select id="admFilterUserCategory" class="steam-input" onchange="filterAdminUsersList()">
          <option value="ALL">ประเภทบุคลากร: ทั้งหมด</option>
          <option value="EXE">ผู้บริหารสถานศึกษา</option>
          <option value="TCH">ข้าราชการครู / บุคลากรทางการศึกษา</option>
          <option value="STF">บุคลากรสายสนับสนุน</option>
        </select>

        <select id="admFilterUserAccess" class="steam-input" onchange="filterAdminUsersList()">
          <option value="ALL">ระดับสิทธิ์: ทั้งหมด</option>
          <option value="Superuser">Superuser</option>
          <option value="Admin">Admin</option>
          <option value="User">User</option>
        </select>

        <select id="admFilterUserStatus" class="steam-input" onchange="filterAdminUsersList()">
          <option value="ALL">สถานะปฏิบัติงาน: ทั้งหมด</option>
          <option value="ACTIVE">ปฏิบัติงานปกติ</option>
          <option value="INACTIVE">ย้าย / เกษียณ</option>
        </select>

        <button type="button" class="btn-steam-secondary" style="height:34px;" onclick="resetAdminUserFilters()"><svg class="ui-ico-xs" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span>ล้างตัวกรอง</span></button>
      </div>

      <!-- RIBBON CARD CONTAINER -->
      <div id="adminUserRibbonContainer" class="adm-user-ribbon-list"></div>
    </div>
