  function fileToBase64(file) {

        return;

      const reader = new FileReader();

      reader.onerror = error => reject(error);
    });
  }

  function normalizeYearToBEClient(rawYear) {
    var y = parseInt(rawYear, 10);
    if (isNaN(y)) return rawYear;
    while (y >= 2900) {
      y -= 543;
    }
    if (y > 1800 && y < 2400) {
      y += 543;
    }
    return y;
  }

  function normalizeYearToCEClient(rawYear) {
    var y = parseInt(rawYear, 10);
    if (isNaN(y)) return rawYear;
    while (y >= 2900) {
      y -= 543;
    }
    if (y >= 2400) {
      y -= 543;
    }
    return y;
  }

    function calculateStaffTenureText(startDateStr) {
    if (!startDateStr || startDateStr === '-') return '-';
    let p = String(startDateStr).trim().split('-');
    if (p.length !== 3) {
      p = String(startDateStr).trim().split('/');
      if (p.length === 3) {
        let yr = parseInt(p[2], 10);
        if (yr > 2400) yr -= 543;
        p = [yr, p[1], p[0]];
      } else {
        return '-';
      }
    }
    let yr = parseInt(p[0], 10);
    if (yr > 2400) yr -= 543;
    const mo = parseInt(p[1], 10);
    const day = parseInt(p[2], 10);
    const sDate = new Date(yr, mo - 1, day, 0, 0, 0);
    if (isNaN(sDate.getTime())) return '-';

    const today = new Date();
    today.setHours(0, 0, 0, 0);
    if (today < sDate) return 'บรรจุใหม่';

    let years = today.getFullYear() - sDate.getFullYear();
    let months = today.getMonth() - sDate.getMonth();
    let days = today.getDate() - sDate.getDate();

    if (days < 0) {
      months--;
      const prevMonthLastDay = new Date(today.getFullYear(), today.getMonth(), 0).getDate();
      days += prevMonthLastDay;
    }
    if (months < 0) {
      years--;
      months += 12;
    }
    return years + ' ปี ' + months + ' เดือน ' + days + ' วัน';
  }

function formatSlashDateBE(dateStr) {
    if (!dateStr || dateStr === '-') return '-';
    let str = String(dateStr).trim().split(' ')[0];
    if (str.includes('-')) {
      let p = str.split('-');
      if (p.length === 3) {
        let yBE = normalizeYearToBEClient(p[0]);
        return `${String(p[2]).padStart(2, '0')}/${String(p[1]).padStart(2, '0')}/${yBE}`;
      }
    }
    if (str.includes('/')) {
      let p2 = str.split('/');
      if (p2.length === 3) {

        return `${String(p2[0]).padStart(2, '0')}/${String(p2[1]).padStart(2, '0')}/${yBE2}`;
      }
    }
    return str;
  }

    const sTxt = `${sObj.d} ${shortMonths[sObj.m] || ''}`;
    if (isPermit) {
      return `${sTxt} ${sObj.y} (${escapeHtml(startTime || '-')}-${escapeHtml(endTime || '-')} น.)`;
    }
    if (!eObj || (sObj.d === eObj.d && sObj.m === eObj.m && sObj.y === eObj.y)) {
      return `${sTxt} ${sObj.y}`;
    }
    const eTxt = `${eObj.d} ${shortMonths[eObj.m] || ''}`;
    if (sObj.y === eObj.y) {
      return `${sTxt}–${eTxt} ${eObj.y}`;
    }
    return `${sTxt} ${sObj.y} – ${eTxt} ${eObj.y}`;
  }

  function _dateStrToComparableNum(dateStr) {
    if (!dateStr || dateStr === '-') return 0;
    const s = String(dateStr).trim().split(' ')[0];
    if (s.includes('-')) {
      const p = s.split('-');
      if (p.length === 3) {
        let y = normalizeYearToCEClient(p[0]);
        return y * 10000 + parseInt(p[1], 10) * 100 + parseInt(p[2], 10);
      }
    }
    if (s.includes('/')) {
      const p2 = s.split('/');
      if (p2.length === 3) {
        let y2 = normalizeYearToCEClient(p2[2]);
        return y2 * 10000 + parseInt(p2[1], 10) * 100 + parseInt(p2[0], 10);
      }
    }
    return 0;
  }

  function syncFlatpickrBuddhistYearHeader(instance) {
    if (!instance || !instance.currentYearElement) return;
    const ceYear = instance.currentYear;

  function initThaiDatePickers() {
    if (typeof flatpickr === 'undefined') return;
    document.querySelectorAll('input[type="date"]').forEach(inp => {
      if (inp._flatpickr) return;
      flatpickr(inp, {
        locale: 'th',
        dateFormat: 'Y-m-d',
        altInput: true,
        altInputClass: 'steam-input',
        allowInput: false,
        disableMobile: true,
        appendTo: document.body,
        formatDate: (date, format) => {
          if (format !== 'Y-m-d') {
            const d = String(date.getDate()).padStart(2, '0');
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const yBE = normalizeYearToBEClient(date.getFullYear());
            return `${d}/${m}/${yBE}`;
          }
          const yyyy = normalizeYearToCEClient(date.getFullYear());
          const mm = String(date.getMonth() + 1).padStart(2, '0');
          const dd = String(date.getDate()).padStart(2, '0');
          return `${yyyy}-${mm}-${dd}`;
        },
        onReady: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onOpen: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onYearChange: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onMonthChange: function(s, d, inst) { syncFlatpickrBuddhistYearHeader(inst); },
        onChange: function(s, dateStr, inst) {
          syncFlatpickrBuddhistYearHeader(inst);
          inp.value = dateStr;
          if (typeof inp.onchange === 'function') inp.onchange();
        }
      });
    });
  }

  function buildStaffIdentitySubtitle(u) {
    const empId = escapeHtml(u.EmpID || u.id || '-');
    const rawPos = String(u.Position || u.role || '').trim();
    const rawStanding = String(u.HighestStanding || '').trim();
    const rawDept = String(u.Department || u.department || '').trim();
    const rawDiv = String(u.Division || u.division || '').trim();
    const cat = getStaffCategoryCode(u);

    let basePosition = '';
    let standingTag = '';

    if (cat === 'EXE') {
      if (rawPos.indexOf('รองผู้อำนวยการ') !== -1) basePosition = 'รองผู้อำนวยการสถานศึกษา';
      else if (rawPos.indexOf('ผู้อำนวยการ') !== -1) basePosition = 'ผู้อำนวยการสถานศึกษา';
      else basePosition = rawPos || 'ผู้บริหารสถานศึกษา';
      standingTag = extractStandingLabelFromData(rawStanding);
    } else if (cat === 'STF') {
      basePosition = rawPos || 'บุคลากรสายสนับสนุน';
      standingTag = '';
    } else {
      const explicitNonStandingRoles = ['ครูผู้ช่วย', 'พนักงานราชการ', 'ครูอัตราจ้าง', 'ครูพี่เลี้ยงเด็กพิการเรียนร่วม', 'พี่เลี้ยงเด็กอนุบาล', 'ศึกษานิเทศก์'];
      const matchedNonStanding = explicitNonStandingRoles.find(r => rawPos.indexOf(r) !== -1);
      if (matchedNonStanding) {
        basePosition = matchedNonStanding;
        standingTag = '';
      } else {
        basePosition = 'ครู';
        standingTag = extractStandingLabelFromData(rawStanding) || extractStandingLabelFromData(rawPos);
      }
    }

    let workOrDeptLabel = '';
    const isGenericSupportDept = (!rawDept || rawDept === '-' || rawDept.indexOf('สายงานบริหารและสนับสนุน') !== -1 || rawDept.indexOf('บริหารสถานศึกษา') !== -1);

    if (cat === 'STF') {
      if (rawDiv && rawDiv !== '-') workOrDeptLabel = shortDiv(rawDiv);
      else if (!isGenericSupportDept) workOrDeptLabel = rawDept;
    } else if (cat === 'EXE') {
      if (rawDiv && rawDiv !== '-') workOrDeptLabel = rawDiv;
      else if (rawDept && rawDept !== '-') workOrDeptLabel = rawDept;
    } else {
      if (!isGenericSupportDept) {
        const sDept = shortDept(rawDept);
        workOrDeptLabel = (rawDept.indexOf('กิจกรรม') === 0 || rawDept.indexOf('การศึกษาปฐมวัย') === 0) ? sDept : `กลุ่มสาระ${sDept}`;
      } else if (rawDiv && rawDiv !== '-') {
        workOrDeptLabel = shortDiv(rawDiv);
      }
    }

    const segments = [];
    if (basePosition) segments.push(`<span style="color:#d0d7de;">${escapeHtml(basePosition)}</span>`);
    if (standingTag) segments.push(`<span style="color:var(--steam-cyan); font-weight:600;">${escapeHtml(standingTag)}</span>`);
    if (workOrDeptLabel) segments.push(`<span>${escapeHtml(workOrDeptLabel)}</span>`);

    return segments.join(`<span class="emp-meta-sep">·</span>`);
  }

  function applyTopBarUserAndLoginTime(userObj) {
    if (!userObj) return;
    userObj.accessLevel = normalizeRolePermission(userObj.accessLevel);
    let shortLabel = userObj.name || 'User';
    if (userObj.email === 'superuser' || String(userObj.name || '').includes('ผู้ดูแลระบบสูงสุด') || userObj.name === 'Super Admin' || userObj.name === 'Superuser') {
      shortLabel = 'Superuser';
    } else {
      let parts = String(userObj.name || '').trim().split(/\s+/);
      shortLabel = parts[0] || userObj.accessLevel || 'User';
    }

    const profEl = document.getElementById('displayProfileName');
    if (profEl) profEl.innerText = shortLabel;

    let loginTimeStr = localStorage.getItem(SESSION_LOGIN_TIME_KEY);
    if (!loginTimeStr) {
      const now = new Date();
      loginTimeStr = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' น.';
      localStorage.setItem(SESSION_LOGIN_TIME_KEY, loginTimeStr);
    }

    const fullEl = document.getElementById('minimalUserFullName');
    if (fullEl) fullEl.innerText = (userObj.name === 'Super Admin' ? 'Superuser' : userObj.name) || shortLabel;

    const roleEl = document.getElementById('minimalUserRole');
    if (roleEl) roleEl.innerText = `สิทธิ์: ${userObj.accessLevel || 'User'} (${shortRole(userObj.role)})`;

    const timeDetailEl = document.getElementById('minimalLoginTimeDetail');
    if (timeDetailEl) timeDetailEl.innerText = loginTimeStr;

    const isAdmin = isSuperuserOrAdmin(userObj);

    updateAccountPopover(userObj);
  }

  function getUserAvatarStorageKey(userObj) {
    if (!userObj) return null;
    const id = userObj.EmpID || userObj.id || userObj.email || 'user';
    return 'manstat_avatar_' + id;
  }

  function getSelectedAvatarId(userObj) {
    const key = getUserAvatarStorageKey(userObj);
    return key ? localStorage.getItem(key) : null;
  }

  function selectUserAvatar(avatarId) {
    if (!g_CurrentUser) return;
    const key = getUserAvatarStorageKey(g_CurrentUser);
    if (key) {
      if (avatarId && PRESET_AVATARS[avatarId]) {
        localStorage.setItem(key, avatarId);
      } else {
        localStorage.removeItem(key);
      }
    }
    updateAccountPopover(g_CurrentUser);
    closeAvatarPickerModal();
  }

  function openAvatarPickerModal() {
    closeAccountPopover();
    renderAvatarPickerGrid();
    const m = document.getElementById('modalAvatarPicker');
    if (m) m.style.display = 'flex';
  }

  function closeAvatarPickerModal() {
    const m = document.getElementById('modalAvatarPicker');
    if (m) m.style.display = 'none';
  }

  function renderAvatarPickerGrid() {
    const container = document.getElementById('avatarPickerGrid');
    if (!container) return;
    const curId = getSelectedAvatarId(g_CurrentUser);

    let html = '';
    Object.keys(PRESET_AVATARS).forEach(function(k) {
      const a = PRESET_AVATARS[k];
      const isActive = (curId === k);
      html += '<div class="avatar-preset-card ' + (isActive ? 'active' : '') + '" onclick="selectUserAvatar(\'' + escapeHtml(k) + '\')">';
      html += '  <div class="check-pill"><svg class="ui-ico-sm" style="width:10px; height:10px; color:#000;" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>';
      html += '  <div class="avatar-preset-thumb">' + a.svg + '</div>';
      html += '  <div class="avatar-preset-label">' + escapeHtml(a.name) + '</div>';
      html += '</div>';
    });
    container.innerHTML = html;
  }

  function handleTopBarSettingsClick(e) {
    if (e) {
      if (typeof e.preventDefault === "function") e.preventDefault();
      if (typeof e.stopPropagation === "function") e.stopPropagation();
    }
    goToAdminPage(e);
  }

  function toggleAccountPopover(e) {
    if (e) {
      e.stopPropagation();
      e.preventDefault();
    }
    const pop = document.getElementById('accountPopover');
    const btn = document.getElementById('btnTogglePopover');
    if (!pop) return;
    const isShown = pop.style.display === 'block';
    if (isShown) {
      pop.style.display = 'none';
      if (btn) btn.classList.remove('active');
    } else {
      if (g_CurrentUser) updateAccountPopover(g_CurrentUser);
      pop.style.display = 'block';
      if (btn) btn.classList.add('active');
    }
  }

  function closeAccountPopover() {
    const pop = document.getElementById('accountPopover');
    const btn = document.getElementById('btnTogglePopover');
    if (pop && pop.style.display === 'block') {
      pop.style.display = 'none';
      if (btn) btn.classList.remove('active');
    }
  }

  function updateAccountPopover(userObj) {
    if (!userObj) return;
    const myId = userObj.EmpID || userObj.id || '';
    const richUser = (Array.isArray(g_UsersSummary) && g_UsersSummary.find(u => (u.EmpID || u.id) === myId)) || userObj;

    const fullName = richUser.FullName || richUser.name || userObj.name || 'User';
    const cleanName = fullName.replace(/^(นาย|นางสาว|นาง|ดร\.|ครู)\s*/, '').trim();
    const firstLetter = (cleanName[0] || fullName.trim()[0] || 'U').toUpperCase();

    // Check preset avatar
    const selectedAvatarId = getSelectedAvatarId(userObj);
    const avatarObj = selectedAvatarId ? PRESET_AVATARS[selectedAvatarId] : null;

    // Trigger Avatar Circle
    const topAvatarCircle = document.querySelector('.avatar-btn .avatar-circle');
    if (topAvatarCircle) {
      if (avatarObj) {
        topAvatarCircle.innerHTML = avatarObj.svg;
      } else {
        topAvatarCircle.innerHTML = '<span id="topBarAvatarInitial">' + escapeHtml(firstLetter) + '</span>';
      }
    }

    // Popover Avatar Circle
    const popAvatarBig = document.getElementById('popAvatarBig');
    if (popAvatarBig) {
      if (avatarObj) {
        popAvatarBig.innerHTML = avatarObj.svg;
      } else {
        popAvatarBig.innerHTML = '<span id="popAvatarInitial">' + escapeHtml(firstLetter) + '</span>';
      }
    }

    // Popover Full Name & Dashboard Greeting
    const popFullName = document.getElementById('popUserFullName');
    if (popFullName) popFullName.innerText = fullName;
    const dashGreeting = document.getElementById('dashGreetingName');
    if (dashGreeting) dashGreeting.innerText = fullName;

    // Popover Subtitle (Email / EmpID)
    const popSub = document.getElementById('popUserSubEmail');
    if (popSub) {
      const email = richUser.email || userObj.email || '';
      const empNo = myId ? `รหัส: ${myId}` : '';
      popSub.innerText = email ? (empNo ? `${email} • ${empNo}` : email) : (empNo || 'บัญชีบุคลากร');
    }

    // Role badge
    const popRole = document.getElementById('popUserRoleBadge');
    if (popRole) {
      popRole.innerText = richUser.accessLevel || userObj.accessLevel || 'User';
    }

    // Admin Panel Icon Button
    const adminPill = document.getElementById('popAdminPanelBtn');
    if (adminPill) {
      const isAdmin = isSuperuserOrAdmin(userObj) || isSuperuserOrAdmin(richUser);
      adminPill.style.display = 'inline-flex';
    }

    // Quota Bar: Leave & Workload
    const popLeaveTxt = document.getElementById('popLeaveSummaryText');
    const popWorkloadTxt = document.getElementById('popWorkloadSummaryText');
    const popQuotaFill = document.getElementById('popQuotaBarFill');
    const popQuotaStatus = document.getElementById('popQuotaStatusText');

    const totalLeave = (Number(richUser.SickDays || 0) + Number(richUser.PersonalDays || 0));
    const maxLeave = (Number(richUser.SickMax || 0) + Number(richUser.PersonalMax || 0)) || 60;
    if (popLeaveTxt) {
      popLeaveTxt.innerText = `ลาไปแล้ว ${totalLeave} / ${maxLeave} วัน`;
    }

    let wlLevel = 1;
    let wlCount = 0;
    if (typeof calculateStaffWorkloadScore === 'function') {
      const customWls = (g_Workloads || []).filter(w => (w.EmpID || w.id) === myId);
      const wlData = calculateStaffWorkloadScore(richUser, customWls);
      wlLevel = wlData.level || 1;
      wlCount = (wlData.primaryCount || 0) + (wlData.secondaryCount || 0);
    }
    if (popWorkloadTxt) {
      popWorkloadTxt.innerText = `ภาระงาน ${wlLevel} (${wlCount} งาน)`;
    }

    const leavePct = Math.min(100, Math.round((totalLeave / maxLeave) * 100));
    const workloadPct = Math.min(100, Math.round((wlLevel / 10) * 100));
    const combinedPct = Math.max(leavePct, workloadPct);

    if (popQuotaFill) {
      popQuotaFill.style.width = Math.max(12, combinedPct) + '%';
      if (combinedPct > 80) {
        popQuotaFill.style.background = 'var(--red)';
      } else if (combinedPct > 50) {
        popQuotaFill.style.background = 'var(--orange)';
      } else {
        popQuotaFill.style.background = 'linear-gradient(90deg, var(--steam-cyan), var(--steam-green))';
      }
    }
    if (popQuotaStatus) {
      if (combinedPct > 80) {
        popQuotaStatus.innerText = 'สูง';
        popQuotaStatus.style.color = 'var(--red)';
      } else if (combinedPct > 50) {

  function bootMainApp() {
    // Purge any legacy plaintext passwords stored previously
    try { localStorage.removeItem('steam_saved_accounts'); } catch (e) {}

    // 1. Resolve active session via SessionManager
    let userObj = SessionManager.load();
    if (userObj && (userObj.name || userObj.email || userObj.EmpID)) {
      g_CurrentUser = userObj;
      let ls = document.getElementById('loadingScreen'); if (ls) ls.style.display = 'none';
      let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'none';
      let ap = document.getElementById('appScreen'); if (ap) ap.style.display = 'block';
      applyTopBarUserAndLoginTime(g_CurrentUser);
      refreshAllData();
      return;
    }

    // If no active session, show clean login screen
    startLoadingBar('กำลังเชื่อมต่อฐานข้อมูล...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          let ls = document.getElementById('loadingScreen'); if (ls) ls.style.display = 'none';
          let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'flex';
          if (res && res.status === 'success') {

            let sub = document.getElementById('loginSchoolSubtitle');

          }
          let txtU = document.getElementById('txtEmail');
          if (txtU && !txtU.value) txtU.focus();
        });
      })
      .withFailureHandler(err => {
        stopLoadingBar(() => {
          let ls = document.getElementById('loadingScreen'); if (ls) ls.style.display = 'none';
          let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'flex';

  function handleLogin() {
    const emailInput = document.getElementById('txtEmail');
    const passInput = document.getElementById('txtPassword');
    const email = emailInput ? emailInput.value.trim() : '';
    const pass = passInput ? passInput.value.trim() : '';

    if (!email || !pass) {
      steamAlert('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน', 'เข้าสู่ระบบ');
      if (!email && emailInput) emailInput.focus();
      else if (!pass && passInput) passInput.focus();
      return;
    }

    const btn = document.getElementById('btnLogin');
    const btnText = document.getElementById('btnLoginText');
    if (btn) btn.disabled = true;
    if (btnText) btnText.innerText = 'กำลังเข้าสู่ระบบ...';

    startLoadingBar('กำลังตรวจสอบสิทธิ์เข้าใช้งาน...');
    google.script.run
      .withSuccessHandler(res => {
        if (btn) btn.disabled = false;
        if (btnText) btnText.innerText = 'เข้าสู่ระบบ';

        if (res && res.success) {
          const chkRemember = document.getElementById('chkRemember');
          const isRemember = chkRemember ? chkRemember.checked : true;

          // Persist canonical session via SessionManager
          SessionManager.save(res.user, isRemember);
          g_CurrentUser = SessionManager.getActiveUser();

          document.getElementById('loginScreen').style.display = 'none';
          document.getElementById('appScreen').style.display = 'block';
          applyTopBarUserAndLoginTime(g_CurrentUser);
          refreshAllData();
        } else {
          stopLoadingBar(() => {
            steamAlert(res && res.message ? res.message : 'ชื่อผู้ใช้ หรือ รหัสผ่านไม่ถูกต้อง', 'เข้าสู่ระบบไม่สำเร็จ');
            if (passInput) {
              passInput.value = '';
              passInput.focus();
            }
          });
        }
      })
      .withFailureHandler(err => {
        if (btn) btn.disabled = false;
        if (btnText) btnText.innerText = 'เข้าสู่ระบบ';
        stopLoadingBar(() => steamAlert('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่อีกครั้ง', 'ระบบขัดข้อง'));
      })
      .processLogin(email, pass);
  }

  var _isUserIdCardUnmasked = false;

  function maskIdCard(id) {
    if (!id) return '-';
    const clean = String(id).replace(/\D/g, '');
    if (clean.length !== 13) return id || '-';
    return `${clean[0]}-••••-•••••-${clean.slice(10, 12)}-${clean[12]}`;
  }

  function maskPhoneNumber(phone) {
    if (!phone) return '-';
    const clean = String(phone).replace(/\D/g, '');
    if (clean.length === 10) {
      return `${clean.slice(0, 3)}-•••-${clean.slice(6)}`;
    }
    return phone;
  }

    const el = document.getElementById('setProfileIdCard');
    const lbl = document.getElementById('lblToggleIdCard');
    if (!el || !_rawCurrentUserIdCard) return;

    if (_userIdCardMaskTimer) {
      clearTimeout(_userIdCardMaskTimer);
      _userIdCardMaskTimer = null;
    }

    const ico = document.getElementById('icoToggleIdCard');

    if (_isUserIdCardUnmasked) {
      // Re-mask
      _isUserIdCardUnmasked = false;
      el.innerText = maskIdCard(_rawCurrentUserIdCard);
      if (lbl) lbl.innerText = 'แสดงเลขเต็ม';
      if (ico) ico.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
    } else {
      // Unmask
      _isUserIdCardUnmasked = true;
      const c = _rawCurrentUserIdCard;
      el.innerText = c.length === 13 ? `${c[0]}-${c.slice(1,5)}-${c.slice(5,10)}-${c.slice(10,12)}-${c[12]}` : c;

      // Auto-mask after 15 seconds for privacy protection
      _userIdCardMaskTimer = setTimeout(() => {
        _isUserIdCardUnmasked = false;
        if (el) el.innerText = maskIdCard(_rawCurrentUserIdCard);
        if (lbl) lbl.innerText = 'แสดงเลขเต็ม';

    } else if (section === 'pdpa') {
      setTimeout(() => {
        const pdpa = document.getElementById('settingsSecPdpa');
        if (pdpa) pdpa.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    }
  }

  function closeSettingsModal() {
    if (_userIdCardMaskTimer) {
      clearTimeout(_userIdCardMaskTimer);
      _userIdCardMaskTimer = null;
    }
    document.getElementById('modalSettings').style.display = 'none';
  }

  function saveSettings() {
    const p = (document.getElementById('setPhone').value || '').trim();
    const op = document.getElementById('setOldPass').value;
    const np = document.getElementById('setNewPass').value;
    const cp = document.getElementById('setConfirmPass') ? document.getElementById('setConfirmPass').value : '';

    if (!op) {
      steamAlert('Enter your current password to confirm changes.', 'Password Required');
      return;
    }

    if (np) {
      if (np.length < 6) {
        steamAlert('Password must be at least 6 characters.', 'Weak Password');
        return;
      }
      if (cp && np !== cp) {
        steamAlert('Passwords do not match.', 'Password Mismatch');
        return;
      }
    }

    closeSettingsModal();
    startLoadingBar('Saving Personnel...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          if (!res || !res.success) {
            steamAlert('Something went wrong. Please try again.', 'System Error');
            return;
          }
          if (g_CurrentUser) {
            var updatedUser = Object.assign({}, g_CurrentUser, { phone: p });
            g_CurrentUser = updatedUser;
          }
          // Update in g_UsersSummary
          const myId = g_CurrentUser ? (g_CurrentUser.EmpID || g_CurrentUser.id) : null;
          if (myId && Array.isArray(g_UsersSummary)) {
            const found = g_UsersSummary.find(u => (u.EmpID || u.id) === myId);
            if (found) found.phone = p;
          }
          steamAlert('Changes saved successfully.');
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .processUpdateProfile(g_CurrentUser.email || g_CurrentUser.name, op, np, p);
  }

  function _cleanupBeforePageSwitch() {
    try {
      // 1. เคลียร์ Interval และ Timeout ทั้งหมด
      if (window._manstatInactivityTimer) {
        clearInterval(window._manstatInactivityTimer);
        window._manstatInactivityTimer = null;
      }
      if (window._userIdCardMaskTimer) {
        clearTimeout(window._userIdCardMaskTimer);
        window._userIdCardMaskTimer = null;
      }

      // 2. ทำลายอินสแตนซ์ Flatpickr เพื่อป้องกัน Memory Leak และ Event ค้าง
      if (typeof flatpickr !== 'undefined') {
        document.querySelectorAll('.flatpickr-input, [data-flatpickr]').forEach(function(el) {
          if (el._flatpickr && typeof el._flatpickr.destroy === 'function') {
            try { el._flatpickr.destroy(); } catch (eFp) {}
          }
        });
      }

      // 3. ทำลายอินสแตนซ์ Chart.js ถ้ามี
      if (typeof Chart !== 'undefined' && Chart.instances) {
        Object.keys(Chart.instances).forEach(function(key) {
          try {
            if (Chart.instances[key] && typeof Chart.instances[key].destroy === 'function') {
              Chart.instances[key].destroy();
            }
          } catch (eCh) {}
        });
      }

      // 4. รีเซ็ตตัวแปรสถานะ Event Listener ของระบบ
      window._manstatGlobalListenersBound = false;
      window._manstatActivityListenersBound = false;
      window._isDashboardBooting = false;
    } catch (eClean) {
      console.warn('_cleanupBeforePageSwitch warning:', eClean);
    }
  }
  window._cleanupBeforePageSwitch = _cleanupBeforePageSwitch;

  function goToAdminPage(e, optionalJumpTab) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    if (!isSuperuserOrAdmin(g_CurrentUser)) {
      steamAlert("ท่านไม่มีสิทธิ์ในการเข้าถึงส่วนการจัดการระบบนี้", "ปฏิเสธการเข้าถึง");
      return;
    }
    if (g_CurrentUser) {
      SessionManager.save(g_CurrentUser);
    }
    let targetTab = optionalJumpTab;
    if (targetTab) {
      try { sessionStorage.setItem('steam_admin_jump_tab', targetTab); } catch (err) {}
    }
    startLoadingBar('กำลังเปิดหน้าต่างตั้งค่าระบบ...');
    google.script.run
      .withSuccessHandler(bundle => {
        try { sessionStorage.setItem('steam_prefetch_admin', JSON.stringify(bundle.adminData)); } catch (err) {}
        stopLoadingBar(() => {
          if (window._manstatInactivityTimer) {
            clearInterval(window._manstatInactivityTimer);
            window._manstatInactivityTimer = null;
          }
          window._manstatGlobalListenersBound = false;
          window._manstatActivityListenersBound = false;
          document.open();
          document.write(bundle.htmlContent);
          document.close();
          setTimeout(() => { if (typeof bootAdminApp === 'function') bootAdminApp(); }, 50);
        });
      })
      .withFailureHandler(err => {
        stopLoadingBar(() => steamAlert('ไม่สามารถเชื่อมต่อระบบได้ กรุณาลองใหม่อีกครั้ง', 'ข้อผิดพลาดในการเชื่อมต่อ'));
      })
      .getAdminBundle();
  }

  function goBackHome(e) {
    if (e && typeof e.preventDefault === 'function') e.preventDefault();
    if (window._manstatInactivityTimer) {
      clearInterval(window._manstatInactivityTimer);
      window._manstatInactivityTimer = null;
    }
    window._manstatActivityListenersBound = false;
    startLoadingBar('กำลังกลับสู่หน้าหลัก...');
    
    // Resolve active session user via SessionManager
    let activeUser = SessionManager.load();
    let savedEmail = (activeUser && activeUser.email) ? activeUser.email : (localStorage.getItem(LOCAL_KEY) || 'superuser');

    google.script.run
      .withSuccessHandler(bundle => {
        stopLoadingBar(() => {
          document.open();
          document.write(bundle.htmlContent);
          document.close();
          setTimeout(() => {
            let u = SessionManager.load();
            if (u && (u.name || u.email || u.EmpID)) {
              g_CurrentUser = u;
            } else if (activeUser && (activeUser.name || activeUser.email || activeUser.EmpID)) {
              g_CurrentUser = activeUser;
              SessionManager.save(activeUser);
            } else {
              g_CurrentUser = { id: 'EXE-001', EmpID: 'EXE-001', positionNo: '10001', name: 'Superuser', email: savedEmail, accessLevel: 'Superuser', role: 'ผู้อำนวยการสถานศึกษา' };
              SessionManager.save(g_CurrentUser);
            }

            let ls = document.getElementById('loadingScreen'); if (ls) ls.style.display = 'none';
            let lg = document.getElementById('loginScreen'); if (lg) lg.style.display = 'none';
            let ap = document.getElementById('appScreen'); if (ap) ap.style.display = 'block';
            applyTopBarUserAndLoginTime(g_CurrentUser);
            if (bundle && bundle.initialData) {
              _applyBundleToStateAndRender(bundle.initialData);
            } else {
              refreshAllData();
            }
          }, 50);
        });
      })
      .withFailureHandler(err => {
        stopLoadingBar(() => steamAlert('Unable to connect. Please try again.', 'Connection Error'));
      })
      .getHomeBundle(savedEmail);
  }

  // Quick Command Search Bar Handler (Linear / Modern Dashboard)
  function handleTopCommandSearch(val) {
    var searchInput = document.getElementById('searchStaffInput');
    if (searchInput) {
      searchInput.value = val;
      if (typeof MOD_LeaveDashboard_renderList === 'function') {
        MOD_LeaveDashboard_renderList();
      }
    }
  }
  window.handleTopCommandSearch = handleTopCommandSearch;

  // Keyboard shortcut Ctrl+K / Cmd+K to focus search
  window.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      var topSearch = document.getElementById('topCommandSearchInput');
      if (topSearch) {
        topSearch.focus();
        topSearch.select();
      }
    }
  });
