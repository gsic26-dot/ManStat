  <style>

    .tab-content { display: none; padding: 18px 20px; background: var(--bg-main); flex-grow: 1; box-sizing: border-box; width: 100%;}
    .tab-content.active { display: block; }
    
    .modal-sub-ribbon { display: flex; background: #101822; border: 1px solid #2a475e; border-radius: 6px; overflow: hidden; margin-bottom: 14px; }

    /* Perm circles & circle status buttons loaded from CSS_Steam.html */

    }
    .ico-staff-stf {
      color: var(--steam-green) !important;

    /* ตั้งค่าชั้นเรียนที่เปิดสอนในโรงเรียน แถวเดียวกัน (Single Row) */
    .cls-header-single-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: nowrap; width: 100%; }
    .cls-header-left { display: inline-flex; align-items: center; gap:10px; white-space: nowrap; color: var(--steam-cyan); font-weight: bold; font-size: 14px; }
    .cls-header-right { display: inline-flex; align-items: center; gap:10px; white-space: nowrap; flex-shrink: 0; }
    .cls-status-pill { background: rgba(164,208,7,0.16); color: var(--steam-green); border: 1px solid var(--steam-green); padding: 4px 10px; border-radius: 14px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 10px; white-space: nowrap; }

    .cls-config-row { display: grid; grid-template-columns: 155px 1fr 120px; align-items: center; gap: 12px; background: rgba(0,0,0,0.25); padding: 10px 14px; border-radius: 6px; border: 1px solid #2a475e; }
    .cls-pills-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap:5px; }
    .cls-toggle-pill { display: flex; align-items: center; gap:10px; padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; user-select: none; transition: 0.18s; border: 1px solid #2a475e; background: #101822; color: var(--text-muted); }
    .cls-toggle-pill:hover { border-color: var(--steam-cyan); color: #fff; }
    .cls-toggle-pill.active { background: rgba(164, 208, 7, 0.16); border-color: var(--steam-green); color: #fff; }

    .deputy-card-modern { background: linear-gradient(135deg, rgba(16,24,34,0.92), rgba(23,26,33,0.95)); border: 1px solid #2a475e; border-left: 4px solid var(--orange); border-radius: 6px; padding: 14px 18px; margin-bottom: 14px; display: grid; grid-template-columns: 260px 1fr auto; gap: 16px; align-items: center; box-shadow: 0 4px 14px rgba(0,0,0,0.35); }
    .deputy-selectors-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .deputy-box-item { background: rgba(0,0,0,0.28); border: 1px solid #2a475e; border-radius: 5px; padding: 8px 12px; display: flex; align-items: center; gap: 10px; }
    .deputy-num-badge { background: rgba(210,153,34,0.2); color: var(--orange); border: 1px solid var(--orange); font-size: 11.5px; font-weight: bold; padding: 3px 8px; border-radius: 4px; white-space: nowrap; }

    .div-tags-box { display: flex; flex-wrap: wrap; gap:6px; min-height: 42px; padding: 6px 8px; background: #101822; border: 1px solid #2a475e; border-radius: 6px; margin-bottom: 6px; align-items: center; }
    .div-tag-chip { display: inline-flex; align-items: center; gap:8px; background: rgba(102,192,244,0.16); border: 1px solid var(--steam-cyan); color: #fff; padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 500; transition: all 0.2s; }
    .div-tag-chip.chip-leader { background: rgba(210,153,34,0.18); border-color: var(--orange); color: #ffe6b0; }
    .div-tag-chip.chip-duty { background: rgba(164,208,7,0.14); border-color: var(--steam-green); color: #e6ffb8; }
    .div-tag-chip.chip-system { background: rgba(102,192,244,0.14); border-color: var(--steam-cyan); color: #d0f0fd; }
    .div-tag-chip.chip-custom { background: rgba(163,113,247,0.14); border-color: #a371f7; color: #e0d0fd; }
    .div-tag-chip.is-primary { background: rgba(243,156,18,0.18); border-color: var(--orange); color: #ffe6b0; }
    .div-tag-chip.is-secondary { background: rgba(102,192,244,0.14); border-color: var(--steam-cyan); color: #d0f0fd; }
    .role-toggle-btn { background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.22); border-radius: 10px; padding: 1px 7px; font-size: 10.5px; cursor: pointer; color: #fff; margin-left: 4px; transition: all 0.15s; }
    .role-toggle-btn:hover { background: rgba(255,255,255,0.25); border-color: #fff; color: #fff; }
    .div-tag-chip .chip-type-icon { font-size: 11px; opacity: 0.95; }
    .div-tag-chip .del-tag { color: var(--red); cursor: pointer; display: inline-flex; align-items: center; margin-left: 2px; }
    .div-tag-chip .del-tag:hover { color: #ff7b72; transform: scale(1.15); }

    .switch { position: relative; display: inline-block; width: 36px; height: 18px; margin: 0;}
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.2); transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--steam-green); }
    input:checked + .slider:before { transform: translateX(18px); }
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.78); backdrop-filter: blur(4px); z-index: 9998; display: none; justify-content: center; align-items: center; }

    .sch-top-grid { display: grid; grid-template-columns: 260px 1fr; gap: 16px; margin-bottom: 16px; align-items: stretch; }
    .sch-card { background: rgba(0,0,0,0.24); border: 1px solid #2a475e; border-radius: 6px; padding: 16px; display: flex; flex-direction: column; justify-content: space-between; }
    .sch-card-head { font-size: 14px; font-weight: bold; color: var(--steam-cyan); border-bottom: 1px dashed #2a475e; padding-bottom: 8px; margin-bottom: 12px; display: flex; align-items: center; gap:10px; }
    .flatpickr-calendar { font-family: 'Sarabun', sans-serif !important; background: #171a21 !important; border: 1px solid #2a475e !important; box-shadow: 0 10px 25px rgba(0,0,0,0.85) !important; z-index: 99999 !important; }
    .flatpickr-day.selected { background: var(--steam-cyan) !important; border-color: var(--steam-cyan) !important; color: #000 !important; font-weight: bold; }
    .flatpickr-months .flatpickr-month, .flatpickr-current-month .flatpickr-monthDropdown-months, .flatpickr-weekdays, span.flatpickr-weekday { background: #101822 !important; color: var(--steam-cyan) !important; font-weight: bold !important; }
    
    .id-unverified-badge { background: rgba(210, 153, 34, 0.2); border: 1px solid var(--orange); color: var(--orange); font-size: 10.5px; padding: 1px 6px; border-radius: 3px; font-weight: bold; margin-left: 4px; display: inline-block; }

    .ico-lbl { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; color: #d0d7de; margin-bottom: 5px; font-size: 13px; }
    .adm-sec-card { background: rgba(0, 0, 0, 0.26); border: 1px solid #2a475e; border-left: 3px solid var(--steam-cyan); border-radius: 6px; padding: 14px 16px; margin-bottom: 14px; }
    .adm-sec-title { font-size: 13.5px; font-weight: bold; color: var(--steam-cyan); border-bottom: 1px dashed #2a475e; padding-bottom: 6px; margin-bottom: 12px; display: flex; align-items: center; gap:10px; }

    .adm-single-row-toolbar { background: rgba(0,0,0,0.22); padding: 9px 12px; border-radius: 6px; border: 1px dashed var(--steam-cyan); margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap:5px; flex-wrap: nowrap; overflow-x: auto; }

    .adm-toolbar-btn {

      padding: 0 14px !important;
      font-size: 12.5px !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 8px !important;
      white-space: nowrap !important;
      border-radius: 18px !important;
      cursor: pointer !important;
      font-family: 'Sarabun', sans-serif !important;
      font-weight: 600 !important;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
      outline: none !important;
      border: 1.5px solid transparent;

    .adm-toolbar-btn:hover {
      transform: translateY(-1px);
    }
    .adm-toolbar-btn.btn-tb-excel {
      background: rgba(164, 208, 7, 0.16) !important;
      border-color: var(--steam-green) !important;
      color: var(--steam-green) !important;
      box-shadow: 0 0 10px rgba(164, 208, 7, 0.25) !important;
    }
    .adm-toolbar-btn.btn-tb-excel:hover {
      background: rgba(164, 208, 7, 0.26) !important;
      box-shadow: 0 0 16px rgba(164, 208, 7, 0.6) !important;
    }
    .adm-toolbar-btn.btn-tb-template {
      background: rgba(102, 192, 244, 0.14) !important;
      border-color: var(--steam-cyan) !important;
      color: var(--steam-cyan) !important;
      box-shadow: 0 0 10px rgba(102, 192, 244, 0.25) !important;
    }
    .adm-toolbar-btn.btn-tb-template:hover {
      background: rgba(102, 192, 244, 0.24) !important;
      box-shadow: 0 0 16px rgba(102, 192, 244, 0.6) !important;
    }
    .adm-toolbar-btn.btn-tb-audit {
      background: rgba(210, 153, 34, 0.14) !important;
      border-color: var(--orange) !important;
      color: var(--orange) !important;
      box-shadow: 0 0 10px rgba(210, 153, 34, 0.25) !important;
    }
    .adm-toolbar-btn.btn-tb-audit:hover {
      background: rgba(210, 153, 34, 0.24) !important;
      box-shadow: 0 0 16px rgba(210, 153, 34, 0.6) !important;
    }
    .adm-toolbar-btn.btn-tb-crypto {
      background: rgba(164, 208, 7, 0.12) !important;
      border-color: rgba(164, 208, 7, 0.65) !important;
      color: var(--steam-green) !important;
      box-shadow: 0 0 8px rgba(164, 208, 7, 0.15) !important;
    }
    .adm-toolbar-btn.btn-tb-crypto:hover {
      background: rgba(164, 208, 7, 0.22) !important;
      box-shadow: 0 0 14px rgba(164, 208, 7, 0.5) !important;
    }
    .adm-toolbar-btn.btn-tb-guide {
      background: rgba(255, 255, 255, 0.05) !important;
      border-color: #2a475e !important;
      color: #e6edf3 !important;
    }
    .adm-toolbar-btn.btn-tb-guide:hover {
      background: rgba(102, 192, 244, 0.12) !important;
      border-color: var(--steam-cyan) !important;
      color: #fff !important;
      box-shadow: 0 0 12px rgba(102, 192, 244, 0.4) !important;
    }

    .adm-filter-bar { background: rgba(0, 0, 0, 0.22); border: 1px solid #2a475e; border-radius: 4px; padding: 8px 10px; margin-bottom: 12px; display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr auto; gap:5px; align-items: center; }
    .adm-filter-bar .steam-input { margin: 0; padding: 6px 10px; font-size: 13px; height: 34px; box-sizing: border-box; }

    .adm-user-ribbon-list { display: flex; flex-direction: column; gap:5px; }
    .adm-user-ribbon-card { background: rgba(0, 0, 0, 0.24); border: 1px solid #2a475e; border-radius: 4px; transition: border-color 0.15s, background 0.15s; overflow: hidden; }
    .adm-user-ribbon-card:hover { border-color: #3d6482; background: rgba(102, 192, 244, 0.04); }
    .adm-user-ribbon-card.expanded { border-color: var(--steam-cyan); background: rgba(16, 24, 34, 0.92); }

    .adm-user-ribbon-main { display: grid; grid-template-columns: minmax(230px, 1.35fr) minmax(260px, 1.45fr) minmax(230px, 1.25fr) 34px; gap: 12px; align-items: center; padding: 10px 14px; cursor: pointer; }
    .adm-user-ident-zone { text-align: left; min-width: 0; }
    .adm-user-name-line { font-size: 15px; font-weight: 700; color: #ffffff; line-height: 1.35; word-break: break-word; display: flex; align-items: center; gap:10px; flex-wrap: wrap; }
    .adm-user-meta-line { font-size: 12px; color: var(--text-muted); margin-top: 2px; line-height: 1.4; word-break: break-word; }
    .emp-meta-code { font-family: monospace; font-weight: 700; color: var(--steam-cyan); font-size: 12px; }
    .emp-meta-sep { color: #4b6278; margin: 0 5px; }

    .adm-user-mid-zone { border-left: 1px solid rgba(42, 71, 94, 0.65); border-right: 1px solid rgba(42, 71, 94, 0.65); padding: 0 12px; text-align: left; font-size: 12.5px; color: #d0d7de; line-height: 1.55; }
    .adm-user-action-zone { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-left: 0; flex-wrap: nowrap; }

    /* Emp status pills, action icons & expand buttons loaded from CSS_Steam.html */

    .adm-user-detail-panel { display: none; border-top: 1px solid #2a475e; background: rgba(16, 24, 34, 0.68); padding: 14px 16px; text-align: left; }
    .adm-user-ribbon-card.expanded .adm-user-detail-panel { display: block; }
    .adm-detail-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; font-size: 12.5px; color: #d0d7de; line-height: 1.65; }
    .adm-detail-box { background: rgba(0, 0, 0, 0.28); border: 1px solid #23384c; border-radius: 4px; padding: 10px 12px; }
    .adm-detail-head { font-size: 12px; font-weight: bold; color: var(--steam-cyan); border-bottom: 1px dashed #2a475e; padding-bottom: 4px; margin-bottom: 6px; display:flex; align-items:center; gap:10px; }

    .retire-calc-card { background: rgba(102, 192, 244, 0.08); border: 1px solid #2a475e; border-left: 4px solid var(--steam-cyan); border-radius: 6px; padding: 10px 14px; margin-top: 4px; font-size: 12.5px; line-height: 1.6; color: #e6edf3; }
    .hist-item-card { background: #101822; border: 1px solid #2a475e; border-radius: 5px; padding: 8px 12px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; }
    .hist-item-card:hover { border-color: var(--steam-cyan); }
    .hist-edit-banner { background: rgba(210, 153, 34, 0.16); border: 1px dashed var(--orange); color: var(--orange); padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; font-size: 12px; font-weight: bold; display: none; justify-content: space-between; align-items: center; }

    .p2-timeline-wrap { border-left: 2px solid #2a475e; margin-left: 10px; padding-left: 16px; display: flex; flex-direction: column; gap: 10px; }
    .p2-tl-item { position: relative; background: rgba(0,0,0,0.28); border: 1px solid #23384c; border-radius: 5px; padding: 8px 12px; font-size: 12.5px; }
    .p2-tl-dot { position: absolute; left: -22px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--steam-cyan); border: 2px solid #101822; }

    .wiz-steps-bar { display: grid; grid-template-columns: repeat(5, 1fr); gap:5px; margin-bottom: 16px; }
    .wiz-step-pill { background: #101822; border: 1px solid #2a475e; border-radius: 5px; padding: 8px 6px; text-align: center; font-size: 12px; color: var(--text-muted); font-weight: bold; transition: 0.2s; }
    .wiz-step-pill.active { border-color: var(--steam-cyan); background: rgba(102, 192, 244, 0.16); color: #fff; }
    .wiz-step-pill.done { border-color: var(--steam-green); background: rgba(164, 208, 7, 0.14); color: var(--steam-green); }

    @media screen and (max-width: 960px) {
      .sch-top-grid, .cls-config-row, .deputy-card-modern, .deputy-selectors-grid { grid-template-columns: 1fr; }
      .cls-header-single-row { flex-wrap: wrap; }
      .cls-pills-grid { grid-template-columns: repeat(2, 1fr); }
      .adm-filter-bar { grid-template-columns: 1fr 1fr; }
      .adm-filter-bar #admSearchUserInput { grid-column: 1 / -1; }
      .adm-user-ribbon-main { grid-template-columns: 1fr auto; gap:5px; }
      .adm-user-mid-zone { grid-column: 1 / -1; border-left: none; border-right: none; border-top: 1px dashed rgba(42,71,94,0.55); border-bottom: 1px dashed rgba(42,71,94,0.55); padding: 6px 0; }
      .adm-user-action-zone { grid-column: 1 / -1; padding-left: 0; }
      .adm-detail-grid { grid-template-columns: 1fr; }
      .wiz-steps-bar { grid-template-columns: 1fr; }
    }
    @media screen and (max-width: 640px) {
      .adm-filter-bar { grid-template-columns: 1fr; }
    }

      display: inline-flex !important;

    }

    .ribbon-tab {
      display: inline-flex !important;
      align-items: center !important;

    }

      display: inline-flex !important;
