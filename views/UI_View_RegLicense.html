<!-- VIEW: ทะเบียนใบอนุญาต -->
<div id="view_dir_license" class="main-view" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:12px; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
    <div>
      <h3 style="color:var(--steam-green); margin:0; font-size:17px; display:flex; align-items:center; gap:0;">
        <svg class="ui-ico-lg" style="color:var(--steam-green);" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><line x1="15" y1="8" x2="17" y2="8"/><line x1="15" y1="12" x2="17" y2="12"/><line x1="7" y1="16" x2="17" y2="16"/></svg><span>ทะเบียนใบอนุญาตประกอบวิชาชีพและเอกสารรับรอง</span>
      </h3>
      <div style="font-size:12.5px; color:var(--text-muted); margin-top:3px;">
        ตรวจสอบข้อมูลและประวัติใบอนุญาตประกอบวิชาชีพครู ผู้บริหาร และเอกสารรับรอง แยกตามรหัสเฉพาะ
      </div>
    </div>
    <div style="display:flex; gap: 8px; align-items:center;">
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <!-- 1. STAT SUMMARY CARDS (แบบเดียวกับ Leave Dashboard, Scout, Standing) -->
  <div class="compact-stat-strip" style="grid-template-columns: repeat(4, 1fr); margin-bottom:12px;">
    <div class="compact-stat-pill" style="border-left: 3px solid var(--steam-cyan);">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg><span>บุคลากรทั้งหมด</span>
      </span>
      <span class="stat-val" style="color:#fff;" id="licStatTotal">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid var(--steam-green);">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--steam-green);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg><span>ปกติ (Active)</span>
      </span>
      <span class="stat-val" style="color:var(--steam-green);" id="licStatActive">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid var(--orange);">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:var(--orange);" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg><span>ใกล้หมดอายุ (90 วัน)</span>
      </span>
      <span class="stat-val" style="color:var(--orange);" id="licStatExpiring">0</span>
    </div>
    <div class="compact-stat-pill" style="border-left: 3px solid #6b7280;">
      <span style="color:var(--text-muted); display:inline-flex; align-items:center; gap:0;">
        <svg class="ui-ico-sm" style="color:#9ca3af;" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg><span>รอตรวจสอบ/หมดอายุ</span>
      </span>
      <span class="stat-val" style="color:#9ca3af;" id="licStatIssues">0</span>
    </div>
  </div>

  <div id="licenseAuditAlertBanner" class="lic-audit-banner" style="display:none;"></div>



  <div class="emp-filter-bar" style="margin-bottom:12px;">
    <input type="text" id="searchLicenseInput" class="steam-input" placeholder="พิมพ์คำค้นหา..." oninput="filterLicenseDirectoryTable()">
    
    <select id="filterLicenseField" class="steam-input" onchange="filterLicenseDirectoryTable()">
      <option value="ALL">ค้นหา: ทุกฟิลด์</option>
      <option value="EMPID">เฉพาะ: รหัสบุคลากร</option>
      <option value="NAME">เฉพาะ: ชื่อ-นามสกุล</option>
      <option value="POSNO">เฉพาะ: เลขที่ตำแหน่ง (PositionNo)</option>
      <option value="MEMBERID">เฉพาะ: สมาชิกประเภทสามัญ เลขที่ (MemberID)</option>
      <option value="LICNO">เฉพาะ: เลขที่ใบอนุญาต (LicenseNo)</option>
    </select>

    <select id="filterLicenseStatus" class="steam-input" onchange="filterLicenseDirectoryTable()">
      <option value="ALL">สถานะเอกสาร: ทั้งหมด</option>
      <option value="ACTIVE">ปกติ</option>
      <option value="EXPIRING">ใกล้หมดอายุ (ภายใน 90 วัน)</option>
      <option value="EXPIRED">หมดอายุแล้ว</option>
      <option value="NO_DOC">ยังไม่พบหลักฐานในระบบ</option>
      <option value="EXEMPT">ได้รับการยกเว้นตามตำแหน่ง</option>
    </select>

    <select id="filterLicenseCategory" class="steam-input" onchange="filterLicenseDirectoryTable()">
      <option value="ALL">กลุ่มบุคลากร: ทั้งหมด</option>
      <option value="EXE">ผู้บริหารสถานศึกษา</option>
      <option value="TCH">ข้าราชการครู</option>
      <option value="STF">บุคลากรสายสนับสนุน</option>
    </select>

    <button type="button" class="btn-save-sm" style="height:34px; padding:0 12px; display:inline-flex; align-items:center; gap:0;" onclick="resetLicenseFilters()">
      <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg><span>ล้างตัวกรอง</span>
    </button>
  </div>

  <!-- 1. PERSONNEL VIEW: Ribbon Cards -->
  <div id="employeeLicenseRibbonContainer" class="lic-ribbon-list"></div>


</div>
