<!-- =========================================================================
     VIEW: OFFICIAL GOVERNMENT REPORTS (แบบฟอร์มรายงานราชการ - แนวทาง B)
     ========================================================================= -->
<div id="view_official_reports" class="main-view" style="display:none;">
  <!-- Header Bar -->
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid #2a475e; padding-bottom:12px; margin-bottom:16px; flex-wrap:wrap; gap:10px;">
    <div>
      <div style="font-size:18px; color:#fff; font-weight:bold; display:flex; align-items:center; gap:8px;">
        <svg class="ui-ico-lg" style="color:var(--steam-cyan);" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        <span>สรุปวันลา</span>
      </div>
      <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
        รายงานสรุปวันลาประจำรอบการประเมินและประจำเดือนสำหรับสถานศึกษา
      </div>
    </div>

    <!-- Format Tabs -->
    <div class="g-segmented-btn-group">
      <button type="button" id="btnRptTab_round" class="g-seg-btn active" onclick="switchOfficialReportFormat('ROUND_EXCEL')">
        <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
        <span>รายงานรอบการประเมิน</span>
      </button>
      <button type="button" id="btnRptTab_month" class="g-seg-btn" onclick="switchOfficialReportFormat('MONTHLY_OFFICIAL')">
        <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        <span>สรุปประจำเดือน</span>
      </button>
    </div>
  </div>

  <!-- Filter & Action Controls Bar -->
  <div style="background:rgba(22, 32, 45, 0.7); border:1px solid #2a475e; border-radius:6px; padding:10px 14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
    <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
      <div style="display:inline-flex; align-items:center; gap:6px;">
        <span style="font-size:12.5px; color:var(--text-muted); font-weight:600;">ปีงบ:</span>
        <select id="rpt_fiscalYearSelect" class="steam-input" style="height:32px; width:auto; min-width:130px; padding:0 8px; font-size:12.5px; margin:0;" onchange="onOfficialReportFilterChange('year')">
          <option value="2570" selected>ปีงบประมาณ 2570</option>
        </select>
      </div>

      <div id="rpt_periodWrapper" style="display:inline-flex; align-items:center; gap:6px;">
        <span style="font-size:12.5px; color:var(--text-muted); font-weight:600;">รอบ:</span>
        <select id="rpt_periodSelect" class="steam-input" style="height:32px; width:auto; min-width:210px; padding:0 8px; font-size:12.5px; margin:0;" onchange="onOfficialReportFilterChange('period')">
          <option value="PERIOD_1" selected>รอบที่ 1 (1 ต.ค. – 31 มี.ค.)</option>
          <option value="PERIOD_2">รอบที่ 2 (1 เม.ย. – 30 ก.ย.)</option>
          <option value="FULL">ทั้งปีงบประมาณ (1 ต.ค. – 30 ก.ย.)</option>
        </select>
      </div>

      <div id="rpt_monthWrapper" style="display:none; align-items:center; gap:6px;">
        <span style="font-size:12.5px; color:var(--text-muted); font-weight:600;">เดือน:</span>
        <select id="rpt_monthSelect" class="steam-input" style="height:32px; width:auto; min-width:140px; padding:0 8px; font-size:12.5px; margin:0;" onchange="onOfficialReportFilterChange('month')">
          <!-- Populated dynamically based on period -->
        </select>
      </div>
    </div>

    <!-- Action Buttons -->
    <div style="display:flex; align-items:center; gap:10px;">
      <button type="button" class="btn-circle-glow glow-cyan" onclick="printOfficialReport()" title="พิมพ์รายงานขนาด A4 มาตรฐานราชการ" aria-label="พิมพ์รายงาน">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6"/><rect x="6" y="14" width="12" height="8" rx="1"/></svg>
      </button>

      <button type="button" class="btn-refresh-circle" onclick="onOfficialReportFilterChange()" title="รีเฟรชข้อมูล" aria-label="รีเฟรชข้อมูล">
        <svg class="ui-ico" style="margin:0 !important;" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <!-- Interactive Screen Table (Modern Steam UI) -->
  <div id="rpt_screenInteractiveContainer" style="background:var(--bg-card); border:1px solid #2a475e; border-radius:6px; padding:16px; margin-bottom:16px;">
    <!-- Rendered dynamically by JS_Mod_OfficialReports.html -->
  </div>

  <!-- Hidden Official Paper Container for Printing -->
  <div id="rpt_paperPrintPreview" style="display:none;"></div>
</div>
