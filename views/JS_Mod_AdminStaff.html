<script>
  // =========================================================
  // MODULE: ADMIN STAFF MANAGEMENT (User List, Filters, Add/Edit Modal, History Previews & CRUD)
  // =========================================================
  var g_ExpandedAdminUserEmpId = null;

  // =========================================================
  // จัดการผู้ใช้แบบ RIBBON CARD LAYOUT + ไอคอนมาตรฐานเดียวกัน เว้น 1 เคาะ
  // =========================================================
  function filterAdminUsersList() {
    renderTeacherEditTable();
  }

  function resetAdminUserFilters() {
    var s = document.getElementById('admSearchUserInput'); if (s) s.value = '';
    var c = document.getElementById('admFilterUserCategory'); if (c) c.value = 'ALL';
    var a = document.getElementById('admFilterUserAccess'); if (a) a.value = 'ALL';
    var st = document.getElementById('admFilterUserStatus'); if (st) st.value = 'ALL';
    renderTeacherEditTable();
  }

  function toggleAdminUserRibbonExpand(empId, event) {
    if (event) event.stopPropagation();
    g_ExpandedAdminUserEmpId = (g_ExpandedAdminUserEmpId === empId) ? null : empId;
    renderTeacherEditTable();
  }

  function renderTeacherEditTable() {
    let container = document.getElementById('adminUserRibbonContainer');
    if (!container) return;

    let totalActive = g_AdminTeachers.filter(t => t.status !== 'ย้าย/เกษียณ').length;
    let roleSum = document.getElementById('roleSummaryContainer');
    if (roleSum) {
      roleSum.innerHTML = `
        <span style="background:rgba(102,192,244,0.15); border:1px solid var(--steam-cyan); color:var(--steam-cyan); padding:5px 12px; border-radius:20px; font-weight:bold; font-size:12px; display:inline-flex; align-items:center; gap:10px;">
          ${ADM_SVG.users}<span>ผู้ใช้งาน: ${totalActive}/${g_AdminTeachers.length} คน</span>
        </span>
      `;
    }

    const q = (document.getElementById('admSearchUserInput') ? document.getElementById('admSearchUserInput').value : '').trim().toLowerCase();
    const catFilter = document.getElementById('admFilterUserCategory') ? document.getElementById('admFilterUserCategory').value : 'ALL';
    const accFilter = document.getElementById('admFilterUserAccess') ? document.getElementById('admFilterUserAccess').value : 'ALL';
    const stFilter = document.getElementById('admFilterUserStatus') ? document.getElementById('admFilterUserStatus').value : 'ALL';

    const filteredItems = [];
    g_AdminTeachers.forEach((t, origIndex) => {
      const empId = String(t.EmpID || t.id || '');
      const normAccess = normalizeRolePermission(t.accessLevel);
      const isActive = (t.status !== 'ย้าย/เกษียณ');

      if (catFilter !== 'ALL' && getStaffCategoryCode(t) !== catFilter) return;
      if (accFilter !== 'ALL' && normAccess !== accFilter) return;
      if (stFilter === 'ACTIVE' && !isActive) return;
      if (stFilter === 'INACTIVE' && isActive) return;

      if (q) {
        const hay = `${t.name || ''} ${empId} ${t.PositionNo || ''} ${t.MemberID || ''} ${t.email || ''} ${t.role || ''} ${t.department || ''} ${t.Division || ''}`.toLowerCase();
        if (!hay.includes(q)) return;
      }

      filteredItems.push({ t, origIndex });
    });

    if (filteredItems.length === 0) {
      container.innerHTML = `
        <div style="background:rgba(0,0,0,0.2); border:1px dashed #2a475e; border-radius:4px; padding:26px; text-align:center; color:var(--text-muted); font-size:13.5px;">
          ไม่พบบัญชีผู้ใช้ที่ตรงกับเงื่อนไขการค้นหา
        </div>
      `;
      return;
    }

    container.innerHTML = filteredItems.map(({ t, origIndex }) => {
      const empId = t.EmpID || t.id;
      const isExpanded = (g_ExpandedAdminUserEmpId === empId);
      const isActive = (t.status !== 'ย้าย/เกษียณ');
      const normAccess = normalizeRolePermission(t.accessLevel);
      const isSuperUser = (normAccess === 'Superuser' || String(t.email || '').toLowerCase() === 'superuser' || String(t.name || '').toLowerCase() === 'superuser');

      let permBadge = `<span class="perm-circle perm-user-cls" title="ระดับสิทธิ์: User (ผู้ใช้งานทั่วไป)">U</span>`;
      if (normAccess === 'Superuser') permBadge = `<span class="perm-circle perm-super" title="ระดับสิทธิ์: Superuser (ผู้ดูแลระบบสูงสุด)">S</span>`;
      else if (normAccess === 'Admin') permBadge = `<span class="perm-circle perm-admin" title="ระดับสิทธิ์: Admin (ผู้ดูแลระบบ)">A</span>`;

      const identitySubtitleHtml = buildStaffIdentitySubtitle(t);
      const emailDisplay = t.email ? escapeHtml(t.email) : `<span style="color:var(--orange);">ยังไม่ได้ระบุ Email</span>`;
      const deptDisplay = escapeHtml(t.department || '-');
      const statusPill = isActive
        ? `<span class="emp-status-pill enabled"><span class="emp-status-dot"></span>Enable</span>`
        : `<span class="emp-status-pill disabled"><span class="emp-status-dot"></span>Disable</span>`;

      const arrowIcon = isExpanded ? ADM_SVG.chevUp : ADM_SVG.chevDown;

      return `
        <div class="adm-user-ribbon-card ${isExpanded ? 'expanded' : ''}" style="${isActive ? '' : 'opacity:0.65;'}" id="admUserCard_${escapeHtml(empId)}">
          <div class="adm-user-ribbon-main" onclick="toggleAdminUserRibbonExpand('${escapeHtml(empId)}', event)">
            
            <div class="adm-user-ident-zone">
              <div class="adm-user-name-line">
                <span>${escapeHtml(t.name)}</span>
                ${t.IsPositionUnverified ? `<span class="id-unverified-badge">รอตรวจสอบเลขที่ตำแหน่ง</span>` : ''}
              </div>
              <div class="adm-user-meta-line">${identitySubtitleHtml}</div>
            </div>

            <div class="adm-user-mid-zone">
              <div>กลุ่มสาระ: <b style="color:#fff;">${deptDisplay}</b></div>
              <div>Email: <span style="color:var(--steam-cyan); font-family:monospace;">${emailDisplay}</span></div>
            </div>

            <!-- ระดับสิทธิ์ สถานะ และปุ่มคำสั่ง แถวเดียวกัน แบบสมมาตร | สิทธิ์ | สถานะ | คำสั่ง -->
            <div class="adm-user-action-zone" onclick="event.stopPropagation();">
              <div style="display:flex; align-items:center; flex-wrap:nowrap;">
                <!-- กล่องป้ายสิทธิ์ คั่นด้วยเส้นปิดขวา สูง 38px เท่ากันพอดีเป๊ะ -->
                <div style="display:flex; align-items:center; justify-content:center; width:56px; height:38px; border-right:1px solid rgba(42, 71, 94, 0.65); margin-right:12px; flex-shrink:0;">
                  ${permBadge}
                </div>

                <!-- ปุ่มสวิตช์เปิด-ปิด และ ป้ายสถานะ Enable / Disable คั่นด้วยเส้นปิดขวา สูง 38px เท่ากับของเดิมเป๊ะ -->
                <div style="display:flex; align-items:center; gap:8px; height:38px; border-right:1px solid rgba(42, 71, 94, 0.65); padding-right:12px; margin-right:12px; flex-shrink:0;">
                  <label class="switch" title="สลับสถานะ Enable / Disable">
                    <input type="checkbox" ${isActive ? 'checked' : ''} onchange="toggleTeacherStatus(${origIndex}, this)">
                    <span class="slider"></span>
                  </label>
                  ${statusPill}
                </div>
              </div>

              <!-- ไอคอนตั้งค่า และ ถังขยะ (แบบที่ 1 เพียว ไร้ทรงกลม ไร้กรอบ 100%) -->
              <div style="display:flex; gap: 8px; align-items:center; flex-shrink:0;">
                <button type="button" class="bare-icon-btn btn-edit" title="ตั้งค่าข้อมูลบุคลากร" onclick="openEditTeacherModal(${origIndex})">${ADM_SVG.gear}</button>
                <button type="button" class="bare-icon-btn btn-del" title="ลบบัญชีผู้ใช้" onclick="confirmDeleteTeacher(${origIndex})">${ADM_SVG.trash}</button>
              </div>
            </div>

            <button type="button" class="emp-expand-btn" title="${isExpanded ? 'ซ่อนรายละเอียด' : 'ดูรายละเอียด'}" onclick="toggleAdminUserRibbonExpand('${escapeHtml(empId)}', event)">
              ${arrowIcon}
            </button>
          </div>

          <div class="adm-user-detail-panel" id="admUserDetail_${escapeHtml(empId)}">
            ${isExpanded ? buildAdminUserExpandedDetailHtml(t, origIndex) : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  function buildAdminUserExpandedDetailHtml(t, origIndex) {
    const empId = t.EmpID || t.id;
    const posNoTxt = t.PositionNo ? escapeHtml(t.PositionNo) : (t.IsPositionUnverified ? `รอตรวจสอบ (${escapeHtml(t.RawPositionNo || '')})` : 'ไม่มีข้อมูล');
    const memIdTxt = t.MemberID ? escapeHtml(t.MemberID) : 'ไม่มีข้อมูล';
    const sStart = t.StartDate || (t.startDate && t.startDate !== '-' ? formatSlashDateBE(t.startDate) : '-');
    const lics = t.ActiveLicenses || [];
    const ret = t.RetirementInfo || {};

    let retireSummaryHtml = `<div style="color:var(--text-muted);">• วันเกิด/เกษียณ: ยังไม่ได้ระบุวันเกิด</div>`;
    if (ret.hasBirthDate) {
      retireSummaryHtml = `
        <div>• วันเกิด: <b>${escapeHtml(ret.birthDateFormatted)}</b> (อายุ <b style="color:var(--steam-cyan);">${escapeHtml(ret.ageText)}</b>)</div>
        <div>• วันเกษียณ: <b style="color:var(--orange);">${escapeHtml(ret.retireDateFormatted)}</b> (เหลือ <b style="color:var(--steam-green);">${escapeHtml(ret.remainingToRetireText)}</b>)</div>
      `;
    }

    return `
      <div class="adm-detail-grid">
        <div class="adm-detail-box">
          <div class="adm-detail-head">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/></svg> <span>ข้อมูลระบุตัวตน & วันเกษียณอายุราชการ</span>
          </div>
          <div>• รหัสบุคลากร: <b style="color:var(--steam-cyan); font-family:monospace;">${escapeHtml(empId)}</b></div>
          <div>• เลขที่ตำแหน่ง: <b style="color:#fff;">${posNoTxt}</b></div>
          <div>• สมาชิกประเภทสามัญ เลขที่: <b style="color:var(--steam-green); font-family:monospace;">${memIdTxt}</b></div>
          <div>• วันที่บรรจุ: ${escapeHtml(sStart)}</div>
          ${retireSummaryHtml}
        </div>

        <div class="adm-detail-box">
          <div class="adm-detail-head">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg> <span>ตำแหน่งและภาระงานหลัก</span>
          </div>
          <div>• ตำแหน่ง: <b style="color:#fff;">${escapeHtml(t.role || '-')}</b></div>
          <div>• ประวัติการดำรงตำแหน่ง/วิทยฐานะ: <b style="color:var(--steam-cyan);">${(t.StandingsHistory || []).length} รายการ</b> (ล่าสุด: ${escapeHtml(t.HighestStanding || '-')})</div>
          <div>• วุฒิการศึกษาสูงสุด: ${escapeHtml(t.HighestEducation || '-')}</div>
          <div>• กลุ่มสาระ: ${escapeHtml(t.department || '-')}</div>
          <div>• ชั้นที่ปรึกษา: ${escapeHtml(t.classLevel || 'ไม่มีชั้นที่ปรึกษา')}</div>
        </div>

        <div class="adm-detail-box">
          <div class="adm-detail-head">
            <svg class="ui-ico-sm" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg> <span>การติดต่อและทะเบียนประวัติ</span>
          </div>
          <div>• Email: <b style="color:var(--steam-cyan);">${escapeHtml(t.email || '-')}</b></div>
          <div>• เบอร์โทรศัพท์: ${escapeHtml(t.phone || '-')}</div>
          <div>• ใบอนุญาตประกอบวิชาชีพ: <b style="color:var(--steam-green);">${lics.length} ฉบับ</b> (${escapeHtml(t.LicenseDocStatus || '-')})</div>
          <div>• เหตุการณ์ในไทม์ไลน์: <b>${(t.TimelineEvents || []).length} รายการ</b></div>
        </div>
      </div>
    `;
  }

  function switchEditModalSubTab(subTabName) {
    document.getElementById('editSubPane_profile').style.display = (subTabName === 'profile') ? 'block' : 'none';
    document.getElementById('editSubPane_registry').style.display = (subTabName === 'registry') ? 'block' : 'none';
    document.getElementById('editSubPane_timeline').style.display = (subTabName === 'timeline') ? 'block' : 'none';
    document.getElementById('subTabBtn_profile').classList.toggle('active', subTabName === 'profile');
    document.getElementById('subTabBtn_registry').classList.toggle('active', subTabName === 'registry');
    document.getElementById('subTabBtn_timeline').classList.toggle('active', subTabName === 'timeline');
  }

  function openEditTeacherModal(index) {
    let t = g_AdminTeachers[index];
    if (!t) return;

    const empId = t.EmpID || t.id;
    document.getElementById('modalEditHeaderName').innerText = `[${empId}] ${t.name}`;
    document.getElementById('edit_empId').value = empId;
    document.getElementById('edit_empId_display').value = empId;
    document.getElementById('edit_oldName').value = t.name;

    const posInp = document.getElementById('edit_positionNo');
    const badgeEl = document.getElementById('posNoAuditBadge');
    if (t.IsPositionUnverified) {
      if (posInp) posInp.value = t.RawPositionNo || '';
      if (badgeEl) badgeEl.innerHTML = `<span class="id-unverified-badge">รอตรวจสอบ (คล้ายรหัสบุคลากร)</span>`;
    } else {
      if (posInp) posInp.value = t.PositionNo || t.positionNo || '';
      if (badgeEl) badgeEl.innerHTML = '';
    }

    const memInp = document.getElementById('edit_memberId');
    if (memInp) memInp.value = t.MemberID || t.memberId || '';

    document.getElementById('edit_name').value = t.name;
    document.getElementById('edit_idCard').value = t.idCard || '';
    setDatePickerVal('edit_startDate', t.RawStartDate || t.startDate || '');

    setDatePickerVal('edit_birthDate', t.RawBirthDate || '');
    onBirthDateChangeCalc('edit');

    let cleanRole = String(t.role || 'ครู').replace(/\s*\(คศ\.\s*\d+\)/g, '').replace(/\s*\(รปภ\.\)/g, '').trim();
    setRoleComboValue('edit', cleanRole);
    setDeptComboValue('edit', t.department || 'ภาษาไทย');

    initEditDivisionTags(t.Division || t.division || 'เจ้าหน้าที่ฝ่ายบริหารวิชาการ', t.EmpID || t.id);

    document.getElementById('edit_email').value = t.email || '';
    document.getElementById('edit_phone').value = t.phone || '';
    document.getElementById('edit_pass').value = '';

    document.getElementById('edit_access').value = normalizeRolePermission(t.accessLevel || 'User');

    let clsSel = document.getElementById('edit_class');
    clsSel.innerHTML = buildClassOptionsHtml();
    if (t.classLevel && !g_ActiveClasses.includes(t.classLevel)) {
      clsSel.innerHTML += `<option value="${escapeHtml(t.classLevel)}">${escapeHtml(t.classLevel)}</option>`;
    }
    clsSel.value = t.classLevel || '';

    document.getElementById('edit_sickMax').value = t.SickMax || 60;
    document.getElementById('edit_personalMax').value = t.PersonalMax || 45;

    cancelEditHistoryItem('LICENSE');
    cancelEditHistoryItem('STANDING');
    cancelEditHistoryItem('SCOUT');
    cancelEditHistoryItem('EDUCATION');

    renderModalHistoryPreviews(empId);
    switchEditModalSubTab('profile');
    document.getElementById('modalEditTeacher').style.display = 'flex';
  }

  function closeEditTeacherModal() {
    document.getElementById('modalEditTeacher').style.display = 'none';
  }

  // =========================================================
  // แสดงรายการประวัติ 4 หมวด + ปุ่ม [แก้ไข] / [ลบ] พร้อมไอคอนมาตรฐาน
  // =========================================================
  function renderModalHistoryPreviews(empId) {
    const user = g_AdminTeachers.find(u => (u.EmpID || u.id) === empId);
    if (!user) return;

    const licBox = document.getElementById('selectedUserCurrentLicenses');
    if (licBox) {
      const lics = user.ActiveLicenses || [];
      if (lics.length === 0) {
        licBox.innerHTML = '<div style="color:var(--text-muted); padding:4px 0;">ยังไม่มีประวัติใบอนุญาตประกอบวิชาชีพ</div>';
      } else {
        licBox.innerHTML = lics.map((l, i) => `
          <div class="hist-item-card">
            <div>
              <b style="color:var(--steam-green);">รายการที่ ${i + 1}: ${escapeHtml(l.type)}</b>
              <div style="font-size:11.5px; color:var(--text-muted);">
                เลขที่: <b style="color:#fff; font-family:monospace;">${escapeHtml(l.number)}</b> • ออก: ${escapeHtml(l.issueDate)} • หมดอายุ: <b>${escapeHtml(l.expiryDate)}</b> (${escapeHtml(l.status)})
              </div>
            </div>
            <div style="display:flex; gap:10px;">
              <button type="button" class="btn-save-sm" style="padding:2px 8px; font-size:11px; color:var(--steam-cyan); border-color:var(--steam-cyan); display:inline-flex; align-items:center; gap:10px;" onclick="startEditHistoryItem('LICENSE', '${escapeHtml(empId)}', '${escapeHtml(l.recordId)}')">${ADM_SVG.edit}<span>แก้ไข</span></button>
              <button type="button" class="btn-save-sm btn-del-sm" style="padding:2px 8px; font-size:11px; display:inline-flex; align-items:center; gap:10px;" onclick="removeHistoryItem('LICENSE', '${escapeHtml(l.recordId)}', '${escapeHtml(empId)}')">${ADM_SVG.trash}<span>ลบ</span></button>
            </div>
          </div>
        `).join('');
      }
    }

    const stdBox = document.getElementById('selectedUserCurrentStandings');
    if (stdBox) {
      const rawArr = (user.StandingsHistory || []).slice();
      rawArr.sort((a, b) => {
        const dA = _dateStrToComparableNum(a.RawEffectiveDate || a.EffectiveDate);
        const dB = _dateStrToComparableNum(b.RawEffectiveDate || b.EffectiveDate);
        return dA - dB;
      });

      if (rawArr.length === 0) {
        stdBox.innerHTML = '<div style="color:var(--text-muted); padding:4px 0;">ยังไม่มีประวัติการดำรงตำแหน่งและวิทยฐานะ (สามารถเพิ่มรายการบรรจุและเลื่อนตำแหน่งได้ด้านล่าง)</div>';
      } else {
        stdBox.innerHTML = rawArr.map((s, i) => `
          <div class="hist-item-card">
            <div>
              <b style="color:var(--steam-cyan);">รายการที่ ${i + 1}: ${escapeHtml(s.StandingLevel)}</b>
              <div style="font-size:11.5px; color:var(--text-muted);">
                ตั้งแต่วันที่: <b style="color:#fff;">${escapeHtml(s.FormattedDate || formatSlashDateBE(s.EffectiveDate))}</b> • เลขที่คำสั่ง/อ้างอิง: <b style="color:var(--orange);">${escapeHtml(s.OrderNumber || '-')}</b>
              </div>
            </div>
            <div style="display:flex; gap:10px;">
              <button type="button" class="btn-save-sm" style="padding:2px 8px; font-size:11px; color:var(--steam-cyan); border-color:var(--steam-cyan); display:inline-flex; align-items:center; gap:10px;" onclick="startEditHistoryItem('STANDING', '${escapeHtml(empId)}', '${escapeHtml(s.RecordID)}')">${ADM_SVG.edit}<span>แก้ไข</span></button>
              <button type="button" class="btn-save-sm btn-del-sm" style="padding:2px 8px; font-size:11px; display:inline-flex; align-items:center; gap:10px;" onclick="removeHistoryItem('STANDING', '${escapeHtml(s.RecordID)}', '${escapeHtml(empId)}')">${ADM_SVG.trash}<span>ลบ</span></button>
            </div>
          </div>
        `).join('');
      }
    }

    const sctBox = document.getElementById('selectedUserCurrentScouts');
    if (sctBox) {
      const arr = user.ScoutsHistory || [];
      if (arr.length === 0) {
        sctBox.innerHTML = '<div style="color:var(--text-muted); padding:4px 0;">ยังไม่มีประวัติวุฒิลูกเสือ</div>';
      } else {
        sctBox.innerHTML = arr.map((s, i) => `
          <div class="hist-item-card">
            <div>
              <b style="color:var(--orange);">รายการที่ ${i + 1}: ${escapeHtml(s.ScoutQualification)}</b> (${escapeHtml(s.ScoutType || '-')})
              <div style="font-size:11.5px; color:var(--text-muted);">
                เลขที่วุฒิบัตร: <b>${escapeHtml(s.CertNumber || '-')}</b> • วันที่: ${escapeHtml(s.FormattedDate || formatSlashDateBE(s.ApprovedDate))}
              </div>
            </div>
            <div style="display:flex; gap:10px;">
              <button type="button" class="btn-save-sm" style="padding:2px 8px; font-size:11px; color:var(--steam-cyan); border-color:var(--steam-cyan); display:inline-flex; align-items:center; gap:10px;" onclick="startEditHistoryItem('SCOUT', '${escapeHtml(empId)}', '${escapeHtml(s.RecordID)}')">${ADM_SVG.edit}<span>แก้ไข</span></button>
              <button type="button" class="btn-save-sm btn-del-sm" style="padding:2px 8px; font-size:11px; display:inline-flex; align-items:center; gap:10px;" onclick="removeHistoryItem('SCOUT', '${escapeHtml(s.RecordID)}', '${escapeHtml(empId)}')">${ADM_SVG.trash}<span>ลบ</span></button>
            </div>
          </div>
        `).join('');
      }
    }

    const eduBox = document.getElementById('selectedUserCurrentEducations');
    if (eduBox) {
      const arr = user.EducationsHistory || [];
      if (arr.length === 0) {
        eduBox.innerHTML = '<div style="color:var(--text-muted); padding:4px 0;">ยังไม่มีประวัติวุฒิการศึกษา</div>';
      } else {

  function startEditHistoryItem(type, empId, recordId) {
    const user = g_AdminTeachers.find(u => (u.EmpID || u.id) === empId);
    if (!user) return;

    if (type === 'LICENSE') {
      const item = (user.ActiveLicenses || []).find(x => x.recordId === recordId);
      if (!item) return;
      document.getElementById('lic_recordId').value = item.recordId;
      var rawType = String(item.type || '').trim();
      var mappedType = rawType;
      if (rawType.startsWith('B License') || rawType.includes('B-License')) mappedType = 'ใบอนุญาตประกอบวิชาชีพครู ชั้นต้น (B-License)';
      else if (rawType.startsWith('A License') || rawType.includes('A-License')) mappedType = 'ใบอนุญาตประกอบวิชาชีพครู ชั้นสูง (A-License)';
      else if (rawType.startsWith('P License') || rawType.includes('P-License')) mappedType = 'ใบอนุญาตปฏิบัติหน้าที่ครู (P-License)';
      else if (rawType.includes('รูปแบบเดิม') || rawType === 'ใบอนุญาตประกอบวิชาชีพครู') mappedType = 'ใบอนุญาตประกอบวิชาชีพครู (รูปแบบเดิม)';
      document.getElementById('lic_type').value = mappedType;
      document.getElementById('lic_num').value = item.number;
      setDatePickerVal('lic_issue', item.rawIssueDate || '');
      setDatePickerVal('lic_exp', item.rawExpiryDate || '');
      document.getElementById('lic_editModeBanner').style.display = 'flex';
      document.getElementById('lic_editModeText').innerText = `โหมดแก้ไขใบอนุญาต: ${item.number}`;
      document.getElementById('btnSubmit_LICENSE').innerHTML = `${ADM_SVG.save}<span>บันทึกการแก้ไขใบอนุญาต</span>`;
    } else if (type === 'STANDING') {
      const item = (user.StandingsHistory || []).find(x => x.RecordID === recordId);
      if (!item) return;
      document.getElementById('std_recordId').value = item.RecordID;
      setStandingComboValue(item.StandingLevel);
      setDatePickerVal('std_date', item.RawEffectiveDate || item.EffectiveDate || '');
      document.getElementById('std_order').value = item.OrderNumber || '';
      document.getElementById('std_editModeBanner').style.display = 'flex';
      document.getElementById('std_editModeText').innerText = `โหมดแก้ไขรายการ: ${item.StandingLevel}`;
      document.getElementById('btnSubmit_STANDING').innerHTML = `${ADM_SVG.saveDark}<span>บันทึกการแก้ไขรายการนี้</span>`;
    } else if (type === 'SCOUT') {
      const item = (user.ScoutsHistory || []).find(x => x.RecordID === recordId);
      if (!item) return;
      document.getElementById('sct_recordId').value = item.RecordID;
      document.getElementById('sct_qual').value = item.ScoutQualification;
      document.getElementById('sct_type').value = item.ScoutType || '-';
      document.getElementById('sct_cert').value = item.CertNumber || '';
      setDatePickerVal('sct_date', item.RawApprovedDate || item.ApprovedDate || '');
      document.getElementById('sct_editModeBanner').style.display = 'flex';
      document.getElementById('sct_editModeText').innerText = `โหมดแก้ไขวุฒิลูกเสือ: ${item.ScoutQualification}`;
      document.getElementById('btnSubmit_SCOUT').innerHTML = `${ADM_SVG.saveDark}<span>บันทึกการแก้ไขวุฒิลูกเสือ</span>`;
    } else if (type === 'EDUCATION') {
      const item = (user.EducationsHistory || []).find(x => x.RecordID === recordId);
      if (!item) return;
      document.getElementById('edu_recordId').value = item.RecordID;
      document.getElementById('edu_level').value = item.DegreeLevel || 'ปริญญาตรี';
      document.getElementById('edu_short').value = item.DegreeShort || 'ค.บ.';
      document.getElementById('edu_major').value = item.Major || '';
      document.getElementById('edu_inst').value = item.Institute || '';
      document.getElementById('edu_year').value = item.GradYear || '2567';
      document.getElementById('edu_editModeBanner').style.display = 'flex';
      document.getElementById('edu_editModeText').innerText = `โหมดแก้ไขวุฒิการศึกษา: ${item.DegreeShort}`;
      document.getElementById('btnSubmit_EDUCATION').innerHTML = `${ADM_SVG.save}<span>บันทึกการแก้ไขวุฒิการศึกษา</span>`;
    }
  }

  function cancelEditHistoryItem(type) {
    if (type === 'LICENSE') {
      var f = document.getElementById('formHistory_LICENSE'); if (f) f.reset();
      var r = document.getElementById('lic_recordId'); if (r) r.value = '';
      var b = document.getElementById('lic_editModeBanner'); if (b) b.style.display = 'none';
      var btn = document.getElementById('btnSubmit_LICENSE'); if (btn) btn.innerHTML = `${ADM_SVG.plus}<span>เพิ่มใบอนุญาต</span>`;
      setDatePickerVal('lic_issue', '');
      setDatePickerVal('lic_exp', '');
    } else if (type === 'STANDING') {
      var f2 = document.getElementById('formHistory_STANDING'); if (f2) f2.reset();
      var r2 = document.getElementById('std_recordId'); if (r2) r2.value = '';
      var b2 = document.getElementById('std_editModeBanner'); if (b2) b2.style.display = 'none';
      var btn2 = document.getElementById('btnSubmit_STANDING'); if (btn2) btn2.innerHTML = `${ADM_SVG.plusDark}<span>เพิ่มรายการดำรงตำแหน่ง / วิทยฐานะ</span>`;
      setStandingComboValue('บรรจุครูผู้ช่วย');
      setDatePickerVal('std_date', '');
    } else if (type === 'SCOUT') {
      var f3 = document.getElementById('formHistory_SCOUT'); if (f3) f3.reset();
      var r3 = document.getElementById('sct_recordId'); if (r3) r3.value = '';
      var b3 = document.getElementById('sct_editModeBanner'); if (b3) b3.style.display = 'none';
      var btn3 = document.getElementById('btnSubmit_SCOUT'); if (btn3) btn3.innerHTML = `${ADM_SVG.plusDark}<span>เพิ่มวุฒิลูกเสือ</span>`;
      setDatePickerVal('sct_date', '');
    } else if (type === 'EDUCATION') {
      var f4 = document.getElementById('formHistory_EDUCATION'); if (f4) f4.reset();
      var r4 = document.getElementById('edu_recordId'); if (r4) r4.value = '';
      var b4 = document.getElementById('edu_editModeBanner'); if (b4) b4.style.display = 'none';
      var btn4 = document.getElementById('btnSubmit_EDUCATION'); if (btn4) btn4.innerHTML = `${ADM_SVG.plus}<span>เพิ่มวุฒิการศึกษา</span>`;
    }
  }

  function removeHistoryItem(type, recordId, empId) {
    steamConfirm('Are you sure you want to delete this record?', () => {
      startLoadingBar('Deleting Request...');
      google.script.run
        .withSuccessHandler(res => stopLoadingBar(() => refreshAdminData(empId)))
        .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
        .deleteHistoryRecordById(type, recordId);
    });
  }

  function onScoutQualChange() {
    const q = document.getElementById('sct_qual').value;
    const t = document.getElementById('sct_type');
    const c = document.getElementById('sct_cert');
    if (q === 'ไม่มีวุฒิลูกเสือ') {
      if (t) t.value = '-';
      if (c) c.value = '-';
    } else if (c && c.value === '-') {
      c.value = '';
    }
  }

  function onLicenseTypeChange() {
    const type = document.getElementById('lic_type').value;
    const spec = LICENSE_SPECS_CLIENT[type];
    const infoBox = document.getElementById('lic_specInfoBox');
    if (spec && infoBox) infoBox.innerHTML = spec.text;
    autoCalcLicenseExpiry();
  }

  function autoCalcLicenseExpiry() {
    const type = document.getElementById('lic_type').value;
    const issueVal = document.getElementById('lic_issue').value;
    if (!issueVal) return;
    const specsMap = (typeof LICENSE_SPECS_CLIENT !== 'undefined') ? LICENSE_SPECS_CLIENT : ((window.CONFIG && window.CONFIG.LICENSE_SPECS) ? window.CONFIG.LICENSE_SPECS : {});
    const spec = specsMap[type] || { years: 5 };
    const p = issueVal.split('-');
    if (p.length === 3) {
      const expYear = normalizeYearToCEClient(p[0]) + (spec.years || 5);
      const dObj = new Date(expYear, parseInt(p[1], 10) - 1, parseInt(p[2], 10) - 1);
      const yyyy = dObj.getFullYear();
      const mm = String(dObj.getMonth() + 1).padStart(2, '0');
      const dd = String(dObj.getDate()).padStart(2, '0');
      setDatePickerVal('lic_exp', `${yyyy}-${mm}-${dd}`);
    }
  }

  function handleAdminSaveHistory(e, type) {
    e.preventDefault();
    const empId = document.getElementById('edit_empId').value;
    if (!empId) return;
    let payload = { empId: empId };

    if (type === 'LICENSE') {
      payload.recordId = document.getElementById('lic_recordId').value;
      payload.licenseType = document.getElementById('lic_type').value;
      payload.licenseNum = document.getElementById('lic_num').value.trim();
      payload.issueDate = document.getElementById('lic_issue').value;
      payload.expiryDate = document.getElementById('lic_exp').value;
      if (payload.issueDate && payload.expiryDate && payload.issueDate >= payload.expiryDate) {
        steamAlert('Issue date must be before expiry date.', 'Invalid Dates');
        return;
      }
    } else if (type === 'STANDING') {
      const stdVal = getStandingComboValue();
      if (!stdVal) {
        steamAlert('Please complete all required fields.', 'Missing Information');
        return;
      }
      payload.recordId = document.getElementById('std_recordId').value;
      payload.standingLevel = stdVal;
      payload.effectiveDate = document.getElementById('std_date').value;
      payload.orderNumber = document.getElementById('std_order').value.trim();
    } else if (type === 'SCOUT') {
      payload.recordId = document.getElementById('sct_recordId').value;
      payload.scoutQual = document.getElementById('sct_qual').value;
      payload.scoutType = document.getElementById('sct_type').value;
      payload.certNum = document.getElementById('sct_cert').value.trim();
      payload.approvedDate = document.getElementById('sct_date') ? document.getElementById('sct_date').value : '-';
    } else if (type === 'EDUCATION') {
      payload.recordId = document.getElementById('edu_recordId').value;
      payload.degreeLevel = document.getElementById('edu_level').value;
      payload.degreeShort = document.getElementById('edu_short').value;
      payload.major = document.getElementById('edu_major').value.trim();
      payload.institute = document.getElementById('edu_inst').value.trim();
      payload.gradYear = document.getElementById('edu_year').value;
    }

    startLoadingBar('Saving Personnel Record...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          cancelEditHistoryItem(type);
          refreshAdminData(empId, () => {
            showSaveSuccessUXModal(res.message, empId, 'EDIT');
          });
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .saveHistoryRecord(type, payload);
  }

  function addNewTeacher() {
    const deptVal = getDeptComboValue('new');
    const roleVal = getRoleComboValue('new');
    const emailVal = document.getElementById('new_email').value.trim();
    const nameVal = document.getElementById('new_name').value.trim();
    const birthVal = document.getElementById('new_birthDate') ? document.getElementById('new_birthDate').value : '';

    if (!nameVal) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }
    if (!roleVal) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }
    if (!deptVal) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }
    if (!isValidEmailFormat(emailVal)) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }

    const payload = {
      positionNo: document.getElementById('new_positionNo') ? document.getElementById('new_positionNo').value.trim() : '',
      memberId: document.getElementById('new_memberId') ? document.getElementById('new_memberId').value.trim() : '',
      birthDate: birthVal,
      name: nameVal,
      idCard: document.getElementById('new_idCard').value.trim(),
      startDate: document.getElementById('new_startDate').value,
      department: deptVal,
      division: 'เจ้าหน้าที่ฝ่ายบริหารวิชาการ',
      role: roleVal,
      accessLevel: document.getElementById('new_access').value,
      email: emailVal,
      phone: document.getElementById('new_phone').value.trim(),
      password: document.getElementById('new_pass').value,
      classLevel: '',
      status: 'ปกติ'
    };

    startLoadingBar('Creating Account...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          if (!res || !res.success) {
            steamAlert('Something went wrong. Please try again.', 'System Error');
            return;
          }
          if (document.getElementById('new_positionNo')) document.getElementById('new_positionNo').value = '';
          if (document.getElementById('new_memberId')) document.getElementById('new_memberId').value = '';
          setDatePickerVal('new_birthDate', '');
          onBirthDateChangeCalc('new');
          document.getElementById('new_name').value = '';
          document.getElementById('new_idCard').value = '';
          document.getElementById('new_email').value = '';
          setDeptComboValue('new', 'ภาษาไทย');
          setRoleComboValue('new', 'ครู');

          refreshAdminData(null, () => {
            showSaveSuccessUXModal(res.message, res.empId, 'NEW');
          });
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .saveAdminTeacher(payload);
  }

  function saveEditTeacherFromModal() {
    const pendingCustom = document.getElementById('edit_division_custom_input');
    if (pendingCustom && pendingCustom.value.trim() !== '') {
      pendingCustom.value.split(',').forEach(part => {
        let clean = part.trim();
        if (clean && !g_SelectedEditDivisions.includes(clean)) g_SelectedEditDivisions.push(clean);
      });
      pendingCustom.value = '';
    }

    const finalDivisionStr = g_SelectedEditDivisions.length > 0 ? g_SelectedEditDivisions.join(', ') : 'เจ้าหน้าที่ฝ่ายบริหารวิชาการ';
    const targetEmpId = document.getElementById('edit_empId').value;
    const deptVal = getDeptComboValue('edit');
    const roleVal = getRoleComboValue('edit');
    const emailVal = document.getElementById('edit_email').value.trim();
    const nameVal = document.getElementById('edit_name').value.trim();
    const birthVal = document.getElementById('edit_birthDate') ? document.getElementById('edit_birthDate').value : '';

    if (!nameVal) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }
    if (!roleVal) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }
    if (!deptVal) {
      steamAlert('Please complete all required fields.', 'Missing Information');
      return;
    }
    if (!isValidEmailFormat(emailVal)) {
      steamAlert('Please enter a valid email address (e.g. name@school.ac.th).', 'Invalid Email');
      return;
    }

    const payload = {
      empId: targetEmpId,
      oldName: document.getElementById('edit_oldName').value,
      positionNo: document.getElementById('edit_positionNo') ? document.getElementById('edit_positionNo').value.trim() : '',
      memberId: document.getElementById('edit_memberId') ? document.getElementById('edit_memberId').value.trim() : '',
      birthDate: birthVal,
      name: nameVal,
      idCard: document.getElementById('edit_idCard').value.trim(),
      startDate: document.getElementById('edit_startDate').value,
      department: deptVal,
      division: finalDivisionStr,
      email: emailVal,
      phone: document.getElementById('edit_phone').value.trim(),
      password: document.getElementById('edit_pass').value,
      role: roleVal,
      accessLevel: document.getElementById('edit_access').value,
      classLevel: document.getElementById('edit_class').value,
      sickMax: document.getElementById('edit_sickMax').value,
      personalMax: document.getElementById('edit_personalMax').value
    };

    startLoadingBar('Saving Settings...');
    google.script.run
      .withSuccessHandler(res => {
        stopLoadingBar(() => {
          if (!res || !res.success) {
            steamAlert('Something went wrong. Please try again.', 'System Error');
            return;
          }
          refreshAdminData(targetEmpId, () => {
            if (typeof renderStaffWorkloadList === 'function') renderStaffWorkloadList();
            showSaveSuccessUXModal(res.message, targetEmpId, 'EDIT');
            if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
              window.LeaveBus.emit('LEAVE_UPDATED', { type: 'STAFF_SAVED', empId: targetEmpId });
            }
          });
        });
      })
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Save failed: ' + (err.message || err), 'Save Error')))
      .saveAdminTeacher(payload);
  }

  function toggleTeacherStatus(index, el) {
    let t = g_AdminTeachers[index];
    let newStatus = el.checked ? "ปกติ" : "ย้าย/เกษียณ";
    startLoadingBar('Saving Personnel...');
    google.script.run
      .withSuccessHandler(res => stopLoadingBar(() => {
        refreshAdminData();
        if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
          window.LeaveBus.emit('LEAVE_UPDATED', { type: 'STAFF_STATUS_TOGGLED' });
        }
      }))
      .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
      .updateAdminTeacherStatus(t.email, t.name, newStatus);
  }

  function confirmDeleteTeacher(index) {
    let t = g_AdminTeachers[index];
    steamPrompt(`Type CONFIRM to delete "${t.name}" (${t.id}):`, val => {
      if (val && val.toUpperCase() === 'CONFIRM') {
        startLoadingBar('Deleting Personnel...');
        google.script.run
          .withSuccessHandler(res => stopLoadingBar(() => {
            refreshAdminData();
            if (window.LeaveBus && typeof window.LeaveBus.emit === 'function') {
              window.LeaveBus.emit('LEAVE_UPDATED', { type: 'STAFF_DELETED' });
            }
          }))
          .withFailureHandler(err => stopLoadingBar(() => steamAlert('Something went wrong. Please try again.', 'System Error')))
          .deleteAdminTeacher(t.email || "", t.name || "");
      }
    });
  }
