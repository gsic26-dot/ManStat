<!-- VIEW: ติดตามคำร้อง -->
<div id="view_tracking" class="main-view" style="display:none;">
  <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a475e; padding-bottom:10px; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
    <div>
      <h3 style="color:var(--steam-cyan); margin:0; font-size:17.5px; display:flex; align-items:center; gap:8px;">
        <svg class="ui-ico-lg" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m16 9-5.5 5.5L8 12"/></svg><span>ติดตามคำร้อง</span>
      </h3>
      <div style="color:var(--text-muted); font-size:12.5px; margin-top:3px;">ติดตามสถานะการพิจารณาคำร้องและพิมพ์ใบลาทางการ</div>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <button type="button" class="btn-refresh-circle" onclick="refreshAllData()" title="รีเฟรชสถานะ" aria-label="รีเฟรชสถานะ">
        <svg class="ui-ico" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
      </button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width:11%;">รหัสคำร้อง</th>
          <th style="width:18%; text-align:left; padding-left:10px;">ผู้ยื่นคำร้อง</th>
          <th style="width:14%;">ประเภท</th>
          <th style="width:18%;">ช่วงเวลา</th>
          <th style="width:26%;">การอนุมัติ</th>
          <th style="width:13%;">พิมพ์เอกสาร</th>
        </tr>
      </thead>
      <tbody id="trackingLogsBody"></tbody>
    </table>
  </div>
</div>
